function getSpeed(){return 1600-(parseInt(document.getElementById('speedSlider').value)-1)*300;}
const ALGO_NAMES=['轮询 Round Robin','轮询 Round Robin','轮询 Round Robin','轮询 Round Robin','一致性哈希','一致性哈希（添加虚拟节点）','一致性哈希（查找）','一致性哈希（扩容稳定）','最少连接','IP Hash','健康检查 — 故障检测','健康检查 — 摘除节点','熔断器 — Open','熔断器 — Half-Open'];
const COLORS=[['#38bdf8','#c084fc','#fbbf24'],['#38bdf8','#334155','#334155'],['#334155','#c084fc','#334155'],['#334155','#334155','#fbbf24'],['#38bdf8','#c084fc','#fbbf24'],['#38bdf8','#c084fc','#fbbf24'],['#38bdf8','#c084fc','#fbbf24'],['#38bdf8','#c084fc','#fbbf24'],['#334155','#c084fc','#38bdf8'],['#38bdf8','#334155','#334155'],['#38bdf8','#f87171','#fbbf24'],['#38bdf8','#64748b','#fbbf24'],['#38bdf8','#c084fc','#f87171'],['#38bdf8','#c084fc','#fb923c']];

function renderViz(){
  const loads=LOADS[Math.min(step,LOADS.length-1)];
  const colors=COLORS[Math.min(step,COLORS.length-1)];
  const phase=step<STEPS.length?(STEPS[step].phase||''):'';
  ['S1','S2','S3'].forEach((s,i)=>{
    const loadEl=document.getElementById(`tS${i+1}load`);
    const barEl=document.getElementById(`rS${i+1}bar`);
    const boxEl=document.getElementById(`rS${i+1}`);
    // Server 2 down in failure scenarios
    if(i===1 && (phase==='failure'||phase==='failure_removed')){
      loadEl.textContent=phase==='failure'?'✗ 健康检查失败':'✗ 已摘除';
      barEl.setAttribute('width','0');
      boxEl.style.stroke=colors[i];
      boxEl.style.opacity=phase==='failure_removed'?'0.3':'0.7';
    }
    // Circuit breaker on Server 3
    else if(i===2 && (phase==='breaker_open'||phase==='breaker_half')){
      loadEl.textContent=phase==='breaker_open'?'⚡ 熔断 OPEN':'⚡ Half-Open 探测';
      barEl.setAttribute('width','0');
      boxEl.style.stroke=colors[i];
      boxEl.style.opacity=phase==='breaker_open'?'0.6':'0.8';
    } else {
      loadEl.textContent=`连接数: ${loads[i]}`;
      const w=Math.min(loads[i]*18,100);
      barEl.setAttribute('width',w);
      boxEl.style.stroke=colors[i];
      boxEl.style.opacity='1';
    }
  });
  // Arrow for LB→S2 dashed/hidden when server is down
  const aLB2=document.getElementById('aLB2');
  if(phase==='failure_removed'){aLB2.style.opacity='0.2';}else{aLB2.style.opacity='1';}
  const showRing=step>=4&&step<=7;
  ['cRing','cS1pos','cS2pos','cS3pos','tRingLabel'].forEach(id=>{
    document.getElementById(id).setAttribute('opacity',showRing?'1':'0');
  });
  document.getElementById('tAlgo').textContent=`算法: ${ALGO_NAMES[Math.min(step,ALGO_NAMES.length-1)]}`;
  // Status text for failure scenarios
  const statusEl=document.getElementById('tStatus');
  if(phase==='failure') statusEl.textContent='⚠ Server 2 健康检查连续失败 (3/3)';
  else if(phase==='failure_removed') statusEl.textContent='Server 2 已从池中移除，流量重分配';
  else if(phase==='breaker_open') statusEl.textContent='⚡ Circuit Breaker OPEN — 快速失败，不转发到 Server 3';
  else if(phase==='breaker_half') statusEl.textContent='🔍 Half-Open: 放行1个探针检测恢复...';
  else statusEl.textContent='';
}

function renderCode(){
  const lines=CODE_LINES;
  const hl=step<STEPS.length?(STEPS[step].highlightLines||[]):[];
  document.getElementById('codeBody').innerHTML=lines.map((l,i)=>
    `<div class="code-line${hl.includes(i+1)?' active':''}" onclick="jumpToLine(${i+1})">
      <span class="ln">${i+1}</span><span class="lc">${l.html||'&nbsp;'}</span></div>`
  ).join('');
  const a=document.querySelector('.code-line.active');if(a)a.scrollIntoView({block:'nearest'});
}

function render(){
  renderViz();renderCode();
  document.getElementById('descText').textContent=step<STEPS.length?STEPS[step].description:'演示完成';
  document.getElementById('stepCounter').textContent=`${Math.min(step+1,STEPS.length)} / ${STEPS.length}`;
  document.getElementById('btnPrev').disabled=step===0;
  document.getElementById('btnNext').disabled=step>=STEPS.length-1;
}

function jumpToLine(ln){for(let i=STEPS.length-1;i>=0;i--){if((STEPS[i].highlightLines||[]).includes(ln)){step=i;render();return;}}}
function next(){if(step<STEPS.length-1){step++;render();}}
function prev(){if(step>0){step--;render();}}
function reset(){step=0;render();if(playing){playing=false;clearInterval(timer);document.getElementById('btnPlay').textContent='▶ 播放';}}
function togglePlay(){
  if(!playing && step>=STEPS.length-1){step=0;render();}
  playing=!playing;
  document.getElementById('btnPlay').textContent=playing?'⏸ 暂停':'▶ 播放';
  if(playing){timer=setInterval(()=>{if(step>=STEPS.length-1){playing=false;clearInterval(timer);document.getElementById('btnPlay').textContent='▶ 播放';return;}step++;render();},getSpeed());}
  else clearInterval(timer);
}

render();
if(window.NavTracker)NavTracker.track('负载均衡算法','network/load-balancing.html','🌐','网络');
</script>
</body>
</html>
