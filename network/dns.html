// DNS nodes: browser, os_cache, hosts, resolver, root, tld, auth
const DNS_NODES = [

const STEPS = [
  {highlightLines:[47,48],hlJs:[22,23],hlPy:[26,27],description:'浏览器访问 www.example.com，开始 DNS 解析',activeNode:'browser',arrow:null,hitCache:false},
  {highlightLines:[13,14],hlJs:[4,5],hlPy:[7,8],description:'检查浏览器 DNS 缓存（Chrome: chrome://net-internals/#dns）',activeNode:'browser',arrow:{from:'browser',to:'browser'},hitCache:false},

// Active arrows accumulate
let resolvedArrows = [];
let cur = 0, playing = false, timer = null;
const SPEED = [2000,1200,700,350,120];
const SPEED_LABELS = ['极慢','慢','中速','快','极快'];

const canvas = document.getElementById('dnsCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.scale(dpr, dpr);
  drawViz();
}

function getNodePos(id, W, H) {
  const n = DNS_NODES.find(n => n.id === id);
  if(!n) return {x:0,y:0};
  return {x: n.x * W, y: n.y * H};
}

function drawViz() {
  const s = STEPS[cur];
  const rect = canvas.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  // Draw all nodes
  DNS_NODES.forEach(n => {
    const x = n.x * W, y = n.y * H;
    const isActive = n.id === s.activeNode;
    const r = 34;
    ctx.fillStyle = isActive ? n.color + '33' : '#1e293b';
    ctx.strokeStyle = isActive ? n.color : '#334155';
    ctx.lineWidth = isActive ? 2.5 : 1.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();

    ctx.fillStyle = isActive ? n.color : '#94a3b8';
    ctx.font = `bold ${W < 500 ? 9 : 11}px system-ui`;
    ctx.textAlign = 'center';
    ctx.fillText(n.label, x, y - 4);
    ctx.fillStyle = '#64748b';
    ctx.font = `${W < 500 ? 8 : 9}px monospace`;
    ctx.fillText(n.sublabel, x, y + 10);

    // Glow on active
    if(isActive) {
      ctx.strokeStyle = n.color + '55';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(x, y, r + 6, 0, Math.PI*2); ctx.stroke();
    }
  });

  // Draw accumulated arrows
  resolvedArrows.forEach((arr, idx) => {
    if(arr.from === arr.to) {
      // Self-loop (cache hit check)
      const pos = getNodePos(arr.from, W, H);
      ctx.strokeStyle = arr.color + '88';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4,3]);
      ctx.beginPath();
      ctx.arc(pos.x + 45, pos.y - 20, 18, 0, Math.PI*2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = arr.color; ctx.font='9px system-ui'; ctx.textAlign='center';
      ctx.fillText('缓存?', pos.x + 45, pos.y - 18);
      return;
    }
    const p1 = getNodePos(arr.from, W, H);
    const p2 = getNodePos(arr.to, W, H);
    const isLast = idx === resolvedArrows.length - 1;
    ctx.strokeStyle = isLast ? arr.color : arr.color + '44';
    ctx.lineWidth = isLast ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();

    // Arrow head
    const angle = Math.atan2(p2.y-p1.y, p2.x-p1.x);
    const ax = p2.x - 38 * Math.cos(angle);
    const ay = p2.y - 38 * Math.sin(angle);
    ctx.fillStyle = isLast ? arr.color : arr.color + '44';
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - 10*Math.cos(angle-0.4), ay - 10*Math.sin(angle-0.4));
    ctx.lineTo(ax - 10*Math.cos(angle+0.4), ay - 10*Math.sin(angle+0.4));
    ctx.closePath(); ctx.fill();

    // Label
    if(isLast && arr.label) {
      const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
      ctx.fillStyle = arr.color;
      ctx.font = '9px monospace'; ctx.textAlign = 'center';
      const lines = arr.label.split(':');
      lines.forEach((line, li) => ctx.fillText(line.trim(), mx, my - 4 + li * 12));
    }
  });

  // Step count label
  if(s.hitCache) {
    ctx.fillStyle = '#4ade80'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('✓ DNS 解析完成！返回 IP 地址', W/2, H - 14);
  }

  // TTL explanation
  ctx.fillStyle = '#64748b'; ctx.font = '9px monospace'; ctx.textAlign = 'right';
  ctx.fillText('TTL = 缓存存活时间 (Time To Live)', W - 10, H - 10);
}

function addArrow(step) {
  const activeN = DNS_NODES.find(n => n.id === step.activeNode);
  const color = activeN ? activeN.color : '#94a3b8';
  if(step.arrow && step.arrow.from !== step.arrow.to) {
    resolvedArrows.push({...step.arrow, color});
  } else if(step.arrow) {
    resolvedArrows.push({...step.arrow, color});
  }
  if(resolvedArrows.length > 8) resolvedArrows = resolvedArrows.slice(-8);
}

function renderCode() {
  const lines = CODE_LINES;
  const hl = ((STEPS[cur]||{}).highlightLines||[]);
  document.getElementById('codeBody').innerHTML = lines.map((l,i) =>
    `<div class="code-line${hl.includes(i+1)?' active':''}" onclick="jumpToLine(${i+1})">
      <span class="ln">${i+1}</span><span class="lc">${l.html||'&nbsp;'}</span></div>`
  ).join('');
  const el = document.querySelector('.code-line.active');
  if(el) el.scrollIntoView({block:'nearest'});
}

function jumpToLine(ln) {
  let best=cur,bestDist=Infinity;
  STEPS.forEach((s,i) => {
    if((s.highlightLines||[]).includes(ln)){const d=Math.abs(i-cur);if(d<bestDist){bestDist=d;best=i;}}
  });
  cur=best; rebuildArrows(); render();
}

function rebuildArrows() {
  resolvedArrows = [];
  for(let i=0;i<=cur;i++) { addArrow(STEPS[i]); }
}

function render() {
  drawViz();
  renderCode();
  document.getElementById('descText').textContent = STEPS[cur].description;
  document.getElementById('stepCounter').textContent = `${cur+1} / ${STEPS.length}`;
  document.getElementById('btnPrev').disabled = cur===0;
  document.getElementById('btnNext').disabled = cur===STEPS.length-1;
}

function play(){if(cur>=STEPS.length-1)cur=0;playing=true;document.getElementById('btnPlay').innerHTML='⏸ 暂停';tick();}
function pause(){playing=false;clearTimeout(timer);document.getElementById('btnPlay').innerHTML='▶ 播放';}
function tick(){
  if(!playing)return;
  if(cur<STEPS.length-1){
    cur++;
    addArrow(STEPS[cur]);
    render();
    timer=setTimeout(tick,SPEED[parseInt(document.getElementById('speedRange').value)-1]);
  }else pause();
}

document.getElementById('btnPlay').addEventListener('click',()=>playing?pause():play());
document.getElementById('btnPrev').addEventListener('click',()=>{
  pause();
  if(cur>0){cur--;rebuildArrows();render();}
});
document.getElementById('btnNext').addEventListener('click',()=>{
  pause();
  if(cur<STEPS.length-1){cur++;addArrow(STEPS[cur]);render();}
});
document.getElementById('btnReset').addEventListener('click',()=>{
  pause();cur=0;resolvedArrows=[];render();
});

window.addEventListener('resize', resizeCanvas);
window.addEventListener('load', resizeCanvas);
setTimeout(resizeCanvas,50);
render();
</script>
</body>
