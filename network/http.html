const STEPS = [
  {highlightLines:[4,5],hlJs:[3,4],hlPy:[3,4],description:'HTTP 请求结构: Method + URL + Headers + Body',mode:'http11',phase:0},

let cur = 0, playing = false, timer = null;

const canvas = document.getElementById('httpCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.scale(dpr, dpr);
  drawViz();
}

function drawViz() {
  const s = STEPS[cur];
  const rect = canvas.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  const mode = s.mode, phase = s.phase;

  // Title
  const titles = {
    http10:'HTTP/1.0 — 短连接', http11:'HTTP/1.1 — 持久连接 Keep-Alive',
    http11_hol:'HTTP/1.1 — 队头阻塞 (Head-of-Line Blocking)',
    http2:'HTTP/2 — 多路复用 (Multiplexing)',
    tls:'HTTPS — TLS 1.3 握手过程',
    http3:'HTTP/3 — QUIC over UDP'
  };
  const titleColors = {
    http10:'#94a3b8', http11:'#38bdf8', http11_hol:'#f87171',
    http2:'#4ade80', tls:'#c084fc', http3:'#10b981'
  };
  ctx.fillStyle = titleColors[mode] || '#94a3b8';
  ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(titles[mode] || '', W/2, 22);

  const cX = W*0.12, sX = W*0.88, midX = W*0.5;
  const topY = 50, botY = H - 30;

  // Client & Server boxes
  function drawNode(x, label, color) {
    ctx.fillStyle = color + '22'; ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(x-45, topY-10, 90, 34, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = color; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(label, x, topY+10);
    // Timeline
    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(x, topY+24); ctx.lineTo(x, botY); ctx.stroke();
    ctx.setLineDash([]);
  }
  drawNode(cX, 'Client', '#38bdf8');
  drawNode(sX, 'Server', '#4ade80');

  if (mode === 'http10') {
    // Show 2 separate connections
    const yList = [topY+60, topY+130];
    const labels = ['GET /index.html → 新TCP连接', 'GET /style.css → 又一个新TCP连接'];
    const colors = ['#f87171','#fb923c'];
    yList.forEach((y,i) => {
      ctx.strokeStyle = colors[i]; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cX,y); ctx.lineTo(sX,y); ctx.stroke();
      ctx.fillStyle = colors[i]; ctx.font = '10px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(labels[i], midX, y-6);
      // Response
      ctx.strokeStyle = colors[i]; ctx.setLineDash([3,2]);
      ctx.beginPath(); ctx.moveTo(sX,y+20); ctx.lineTo(cX,y+20); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillText('200 OK (断开)', midX, y+34);
    });
  } else if (mode === 'http11' || mode === 'http11_hol') {
    const reqs = [
      {y:topY+50,label:'GET /index.html',color:'#38bdf8'},
      {y:topY+100,label:'GET /style.css',color:mode==='http11_hol'?'#f87171':'#38bdf8'},
      {y:topY+150,label:'GET /script.js',color:mode==='http11_hol'?'#f87171':'#38bdf8'},
    ];
    reqs.forEach((r,i) => {
      ctx.strokeStyle = r.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cX,r.y); ctx.lineTo(sX,r.y); ctx.stroke();
      ctx.fillStyle = r.color; ctx.font = '10px monospace'; ctx.textAlign = 'center';
      ctx.fillText(r.label, midX, r.y-6);
      if(mode === 'http11_hol' && i > 0) {
        ctx.fillStyle = '#f87171'; ctx.font = 'bold 10px system-ui';
        ctx.fillText('⏳ 等待 Response 1...', midX, r.y+14);
      }
    });
    if(mode === 'http11') {
      ctx.strokeStyle='#4ade80'; ctx.lineWidth=1.5; ctx.setLineDash([6,3]);
      ctx.beginPath(); ctx.moveTo(cX,topY+45); ctx.lineTo(cX,topY+180); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#4ade80'; ctx.font='9px system-ui'; ctx.textAlign='center';
      ctx.fillText('Keep-Alive', cX-50, topY+115);
    }
  } else if (mode === 'http2') {
    // Multiplexed streams
    const streams = [
      {id:1,label:'Stream 1: GET /index',color:'#38bdf8',yOff:0},
      {id:3,label:'Stream 3: GET /style',color:'#4ade80',yOff:30},
      {id:5,label:'Stream 5: GET /image',color:'#fbbf24',yOff:60},
    ];
    streams.forEach((st) => {
      const y = topY + 60 + st.yOff;
      ctx.strokeStyle = st.color; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(cX,y); ctx.lineTo(sX,y); ctx.stroke();
      ctx.fillStyle = st.color; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
      ctx.fillText(`[${st.id}] ${st.label}`, midX, y-6);
    });
    streams.forEach((st) => {
      const y = topY + 180 + st.yOff;
      ctx.strokeStyle = st.color; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(sX,y); ctx.lineTo(cX,y); ctx.stroke();
      ctx.fillStyle = st.color; ctx.font = '10px monospace'; ctx.textAlign = 'center';
      ctx.fillText(`[${st.id}] 200 OK`, midX, y-6);
    });
    ctx.fillStyle = '#4ade80'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('▲ 同时并行，互不阻塞', W/2, H-50);
  } else if (mode === 'tls') {
    const tlsSteps = [
      {from:'c',label:'Client Hello (TLS1.3, cipher_suites, random)',color:'#c084fc',y:topY+55},
      {from:'s',label:'Server Hello + 证书 + ECDHE key_share',color:'#38bdf8',y:topY+105},
      {from:'s',label:'(Encrypted Handshake Data)',color:'#4ade80',y:topY+130},
      {from:'c',label:'Finished (验证证书)',color:'#c084fc',y:topY+165},
      {from:'both',label:'← AES-256-GCM 加密通信 →',color:'#fbbf24',y:topY+215},
    ];
    const visibleCount = Math.min(phase - 7, tlsSteps.length);
    for(let i=0;i<visibleCount;i++) {
      const ts = tlsSteps[i];
      const fromX = ts.from === 'c' ? cX : sX;
      const toX = ts.from === 'c' ? sX : cX;
      if(ts.from === 'both') {
        ctx.strokeStyle = ts.color; ctx.lineWidth = 2; ctx.setLineDash([6,3]);
        ctx.beginPath(); ctx.moveTo(cX+50, ts.y); ctx.lineTo(sX-50, ts.y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = ts.color; ctx.font='bold 10px system-ui'; ctx.textAlign='center';
        ctx.fillText(ts.label, midX, ts.y-6);
      } else {
        ctx.strokeStyle = ts.color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(fromX,ts.y); ctx.lineTo(toX,ts.y); ctx.stroke();
        const arrowDir = toX > fromX ? 1 : -1;
        ctx.fillStyle = ts.color;
        ctx.beginPath(); ctx.moveTo(toX, ts.y); ctx.lineTo(toX-arrowDir*10, ts.y-5); ctx.lineTo(toX-arrowDir*10, ts.y+5); ctx.closePath(); ctx.fill();
        ctx.fillStyle = ts.color; ctx.font='10px monospace'; ctx.textAlign='center';
        ctx.fillText(ts.label, midX, ts.y-7);
      }
    }
    if(visibleCount >= 4) {
      ctx.fillStyle='#4ade80'; ctx.font='bold 11px system-ui'; ctx.textAlign='center';
      ctx.fillText('✓ TLS 1.3 完整握手通常 1-RTT', W/2, H-50);
    }
  } else if (mode === 'http3') {
    // Show QUIC streams
    ctx.fillStyle = '#10b981'; ctx.font='11px system-ui'; ctx.textAlign='center';
    ctx.fillText('QUIC over UDP — 每个 Stream 独立，丢包不影响其他 Stream', W/2, topY+45);
    const quicStreams = [
      {id:0,label:'QUIC Stream 0: GET /index',color:'#10b981',y:topY+80},
      {id:4,label:'QUIC Stream 4: GET /api',color:'#38bdf8',y:topY+110},
      {id:8,label:'QUIC Stream 8: GET /img (丢包!)',color:'#f87171',y:topY+140},
      {id:12,label:'QUIC Stream 12: GET /font',color:'#4ade80',y:topY+170},
    ];
    quicStreams.forEach(st => {
      ctx.strokeStyle = st.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cX,st.y); ctx.lineTo(sX,st.y); ctx.stroke();
      ctx.fillStyle = st.color; ctx.font='10px monospace'; ctx.textAlign='center';
      ctx.fillText(st.label, midX, st.y-6);
    });
    ctx.fillStyle='#4ade80'; ctx.font='bold 11px system-ui'; ctx.textAlign='center';
    ctx.fillText('Stream 8 丢包只影响自己，其他 Stream 正常响应', W/2, H-50);
    ctx.fillStyle='#10b981'; ctx.font='10px monospace';
    ctx.fillText('0-RTT: 使用之前会话密钥，直接发请求，不需要握手', W/2, H-30);
  }
}

function renderCode() {
  const lines = CODE_LINES;
  const hl = ((STEPS[cur]||{}).highlightLines||[]);
  document.getElementById('codeBody').innerHTML = lines.map((l,i) =>
    `<div class="code-line${hl.includes(i+1)?' active':''}" onclick="jumpToLine(${i+1})">
      <span class="ln">${i+1}</span><span class="lc">${l.html||'&nbsp;'}</span></div>`
  ).join('');
  const el = document.querySelector('.code-line.active');
  if(el) el.scrollIntoView({block:'nearest'});
}

function jumpToLine(ln) {
  let best=cur,bestDist=Infinity;
  STEPS.forEach((s,i) => {
    if((s.highlightLines||[]).includes(ln)){const d=Math.abs(i-cur);if(d<bestDist){bestDist=d;best=i;}}
  });
  cur=best; render();
}

function render() {
  drawViz();
  renderCode();
  document.getElementById('descText').textContent = STEPS[cur].description;
  document.getElementById('stepCounter').textContent = `${cur+1} / ${STEPS.length}`;
  document.getElementById('btnPrev').disabled = cur===0;
  document.getElementById('btnNext').disabled = cur===STEPS.length-1;
}

function play(){if(cur>=STEPS.length-1)cur=0;playing=true;document.getElementById('btnPlay').innerHTML='⏸ 暂停';tick();}
function pause(){playing=false;clearTimeout(timer);document.getElementById('btnPlay').innerHTML='▶ 播放';}
function tick(){if(!playing)return;if(cur<STEPS.length-1){cur++;render();timer=setTimeout(tick,SPEED[parseInt(document.getElementById('speedRange').value)-1]);}else pause();}

document.getElementById('btnPlay').addEventListener('click',()=>playing?pause():play());
document.getElementById('btnPrev').addEventListener('click',()=>{pause();if(cur>0){cur--;render();}});
document.getElementById('btnNext').addEventListener('click',()=>{pause();if(cur<STEPS.length-1){cur++;render();}});
document.getElementById('btnReset').addEventListener('click',()=>{pause();cur=0;render();});

window.addEventListener('resize', resizeCanvas);
window.addEventListener('load', resizeCanvas);
setTimeout(resizeCanvas,50);
render();
</script>
</body>
</html>
