window.PAGE_CONCEPTS = [
  { title: '慢启动 (Slow Start)', body: `cwnd 从 1 MSS 开始，每收到一个 ACK 增加 1 MSS（指数增长）。直到 cwnd ≥ ssthresh 切换为拥塞避免，或发生丢包。`, tag: 'cwnd × 2' },
  { title: '拥塞避免 (CA)', body: `cwnd 超过 ssthresh 后，每经过一个 RTT 增加 1 MSS（线性增长），探测网络可用带宽上限，避免突然拥塞。`, tag: '线性增长' },
  { title: '快重传 & 快恢复', body: `收到 3 个重复 ACK：立即重传丢失段（不等 RTO），ssthresh = cwnd/2，cwnd = ssthresh（New Reno）/ cwnd = ssthresh + 3（Reno）。网络未完全拥塞，快速恢复到拥塞避免阶段。` },
  { title: '超时重传 (RTO)', body: `定时器超时仍未收到 ACK：ssthresh = cwnd/2，cwnd 重置为 1 MSS，重新慢启动。代价高昂，是最严重的拥塞信号。`, tag: '最严重' },
  { title: 'CUBIC & BBR', body: `CUBIC（Linux 默认）：基于丢包，cwnd 以三次函数增长，在高 BDP 网络效果好。BBR（Google）：基于带宽-延迟模型，测量 BtlBw 和 RTprop，不依赖丢包，在有轻微丢包的网络（卫星、无线）表现更优。`, tag: '现代算法' }
];

const CODE_LINES = [
  {html:`<span class="kw">package</span> <span class="pkg">main</span>`},
  {html:``},
  {html:`<span class="kw">import</span> (<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="st">"fmt"</span><br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="st">"net"</span><br>)`},
  {html:``},
  {html:`<span class="cm">// TCP 拥塞控制由内核自动处理，Go 应用层可以配置参数</span>`},
  {html:`<span class="kw">func</span> <span class="fn">configureTCPConn</span>() {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;conn, _ := <span class="pkg">net</span>.<span class="fn">Dial</span>(<span class="st">"tcp"</span>, <span class="st">"example.com:80"</span>)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;tcpConn := conn.(*<span class="pkg">net</span>.<span class="fn">TCPConn</span>)`},
  {html:``},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// 设置发送/接收缓冲区大小 (影响吞吐量)</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;tcpConn.<span class="fn">SetWriteBuffer</span>(<span class="num">262144</span>) <span class="cm">// 256KB 发送缓冲</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;tcpConn.<span class="fn">SetReadBuffer</span>(<span class="num">262144</span>)  <span class="cm">// 256KB 接收缓冲</span>`},
  {html:``},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// 禁用 Nagle 算法 (减少延迟，适合实时应用)</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;tcpConn.<span class="fn">SetNoDelay</span>(<span class="kw">true</span>)`},
  {html:``},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="pkg">fmt</span>.<span class="fn">Println</span>(<span class="st">"TCP 连接已配置"</span>)`},
  {html:`}`},
  {html:``},
  {html:`<span class="cm">// 实际拥塞控制在内核: /proc/sys/net/ipv4/tcp_congestion_control</span>`},
  {html:`<span class="cm">// cat /proc/.../tcp_congestion_control → "cubic" or "bbr"</span>`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">showTCPInfo</span>() {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// 通过 /proc/net/tcp 获取 TCP 状态</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;conn, _ := <span class="pkg">net</span>.<span class="fn">Dial</span>(<span class="st">"tcp"</span>, <span class="st">"google.com:80"</span>)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">defer</span> conn.<span class="fn">Close</span>()`},
  {html:``},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;local := conn.<span class="fn">LocalAddr</span>().(*<span class="pkg">net</span>.<span class="fn">TCPAddr</span>)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;remote := conn.<span class="fn">RemoteAddr</span>().(*<span class="pkg">net</span>.<span class="fn">TCPAddr</span>)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="pkg">fmt</span>.<span class="fn">Printf</span>(<span class="st">"本地: %s → 远端: %s\n"</span>, local, remote)`},
  {html:`}`},
];


// cwnd data points per step: {t, cwnd, ssthresh, phase, event}
const CWN_DATA = [
  // Slow start
  {t:0,cwnd:1,ssthresh:16,phase:'slow_start'},
  {t:1,cwnd:2,ssthresh:16,phase:'slow_start'},
  {t:2,cwnd:4,ssthresh:16,phase:'slow_start'},
  {t:3,cwnd:8,ssthresh:16,phase:'slow_start'},
  {t:4,cwnd:16,ssthresh:16,phase:'ca'},         // hit ssthresh -> congestion avoidance
  // Congestion avoidance
  {t:5,cwnd:17,ssthresh:16,phase:'ca'},
  {t:6,cwnd:18,ssthresh:16,phase:'ca'},
  {t:7,cwnd:19,ssthresh:16,phase:'ca'},
  // Timeout loss
  {t:8,cwnd:1,ssthresh:9,phase:'slow_start',event:'timeout'},
  {t:9,cwnd:2,ssthresh:9,phase:'slow_start'},
  {t:10,cwnd:4,ssthresh:9,phase:'slow_start'},
  {t:11,cwnd:8,ssthresh:9,phase:'slow_start'},
  // CA after recovery
  {t:12,cwnd:9,ssthresh:9,phase:'ca'},
  {t:13,cwnd:10,ssthresh:9,phase:'ca'},
  // 3-dup ACK -> fast recovery
  {t:14,cwnd:5,ssthresh:5,phase:'fast_recovery',event:'3dupack'},
  {t:15,cwnd:6,ssthresh:5,phase:'ca'},
  {t:16,cwnd:7,ssthresh:5,phase:'ca'},
  {t:17,cwnd:8,ssthresh:5,phase:'ca'},
];

const STEPS = [
  {highlightLines:[5,6],hlJs:[4,5],hlPy:[4,5],description:'拥塞窗口 cwnd: 控制发送速率的核心变量（单位: MSS）',dataIdx:0},
  {highlightLines:[10,11],hlJs:[8,9],hlPy:[8,9],description:'慢启动: cwnd = 1 MSS，每个 RTT 翻倍（指数增长）',dataIdx:1},
  {highlightLines:[10,11],hlJs:[8,9],hlPy:[8,9],description:'慢启动继续: cwnd = 4，每收到 ACK 就 +1 MSS',dataIdx:2},
  {highlightLines:[10,11],hlJs:[8,9],hlPy:[8,9],description:'慢启动: cwnd = 8，ssthresh = 16（初始慢启动阈值）',dataIdx:3},
  {highlightLines:[13,14,15],hlJs:[10,11],hlPy:[10,11],description:'cwnd 达到 ssthresh=16 → 进入拥塞避免阶段（线性增）',dataIdx:4},
  {highlightLines:[13,14,15],hlJs:[10,11],hlPy:[10,11],description:'拥塞避免: 每个 RTT 仅 cwnd += 1 MSS（加法增）',dataIdx:5},
  {highlightLines:[13,14,15],hlJs:[10,11],hlPy:[10,11],description:'拥塞避免: cwnd = 18，线性增长，谨慎探测带宽上限',dataIdx:6},
  {highlightLines:[13,14,15],hlJs:[10,11],hlPy:[10,11],description:'拥塞避免: cwnd = 19，继续线性增长',dataIdx:7},
  {highlightLines:[19,20],hlJs:[20,21],hlPy:[22,23],description:'超时检测到丢包! ssthresh = cwnd/2 = 9，cwnd 重置为 1',dataIdx:8},
  {highlightLines:[10,11],hlJs:[8,9],hlPy:[8,9],description:'重新从慢启动开始，cwnd = 2（倍增）',dataIdx:9},
  {highlightLines:[10,11],hlJs:[8,9],hlPy:[8,9],description:'慢启动恢复: cwnd = 4，快速爬升至新的 ssthresh',dataIdx:10},
  {highlightLines:[10,11],hlJs:[8,9],hlPy:[8,9],description:'慢启动: cwnd = 8，接近 ssthresh=9',dataIdx:11},
  {highlightLines:[13,14,15],hlJs:[10,11],hlPy:[10,11],description:'再次进入拥塞避免: cwnd = 9 = ssthresh',dataIdx:12},
  {highlightLines:[13,14,15],hlJs:[10,11],hlPy:[10,11],description:'拥塞避免: cwnd = 10，线性增长',dataIdx:13},
  {highlightLines:[13,14,15],hlJs:[20,21],hlPy:[22,23],description:'快速重传: 收到 3 个重复 ACK → ssthresh=cwnd/2=5，cwnd=ssthresh（不回到慢启动）',dataIdx:14},
  {highlightLines:[13,14,15],hlJs:[10,11],hlPy:[10,11],description:'快速恢复后进入拥塞避免: cwnd = 6',dataIdx:15},
  {highlightLines:[13,14,15],hlJs:[10,11],hlPy:[10,11],description:'CUBIC 算法（Linux 默认）: 更激进的增长曲线，比 Reno 吞吐量更高',dataIdx:16},
  {highlightLines:[19,20,21],hlJs:[20,21],hlPy:[22,23],description:'BBR: 基于带宽和延迟模型，而非丢包信号，减少缓冲膨胀',dataIdx:17},
];

let cur = 0, playing = false, timer = null;
const SPEED = [1200,800,500,300,150];

const canvas = document.getElementById('congCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.scale(dpr, dpr);
  drawChart();
}

function drawChart() {
  const rect = canvas.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  ctx.clearRect(0, 0, W, H);

  const PAD = {top:32,right:20,bottom:40,left:52};
  const cW = W - PAD.left - PAD.right;
  const cH = H - PAD.top - PAD.bottom;
  const maxT = 17, maxCwnd = 22;

  const tx = (t) => PAD.left + (t / maxT) * cW;
  const ty = (c) => PAD.top + cH - (c / maxCwnd) * cH;

  // Background
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
  for(let i=0;i<=4;i++) {
    const y = PAD.top + (i/4)*cH;
    ctx.beginPath(); ctx.moveTo(PAD.left,y); ctx.lineTo(W-PAD.right,y); ctx.stroke();
    ctx.fillStyle='#4b5563'; ctx.font='10px monospace'; ctx.textAlign='right';
    ctx.fillText(Math.round(maxCwnd*(1-i/4)), PAD.left-4, y+3);
  }
  for(let i=0;i<=maxT;i++) {
    const x = tx(i);
    ctx.beginPath(); ctx.moveTo(x,PAD.top); ctx.lineTo(x,H-PAD.bottom); ctx.stroke();
    if(i%2===0) {
      ctx.fillStyle='#4b5563'; ctx.font='10px monospace'; ctx.textAlign='center';
      ctx.fillText('RTT'+i, x, H-PAD.bottom+14);
    }
  }

  // Axis labels
  ctx.fillStyle='#64748b'; ctx.font='11px system-ui'; ctx.textAlign='center';
  ctx.fillText('时间 (RTT)', W/2, H-2);
  ctx.save(); ctx.translate(12, H/2); ctx.rotate(-Math.PI/2);
  ctx.fillText('cwnd (MSS)', 0, 0); ctx.restore();

  // Axes
  ctx.strokeStyle='#334155'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(PAD.left,PAD.top); ctx.lineTo(PAD.left,H-PAD.bottom); ctx.lineTo(W-PAD.right,H-PAD.bottom); ctx.stroke();

  // ssthresh line (dashed, up to current step)
  const dataUpTo = STEPS[cur].dataIdx;
  ctx.strokeStyle='#f87171'; ctx.lineWidth=1.5; ctx.setLineDash([5,3]);
  let prevSS = null;
  for(let i=0;i<=dataUpTo;i++) {
    const pt = CWN_DATA[i];
    const x = tx(pt.t), y = ty(pt.ssthresh);
    if(prevSS===null) { ctx.beginPath(); ctx.moveTo(x,y); }
    else ctx.lineTo(x,y);
    prevSS = y;
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // cwnd line
  const phaseColors = {slow_start:'#10b981',ca:'#38bdf8',fast_recovery:'#fbbf24'};
  let prevX = null, prevY = null, prevPhase = null;
  for(let i=0;i<=dataUpTo;i++) {
    const pt = CWN_DATA[i];
    const x = tx(pt.t), y = ty(pt.cwnd);
    const color = phaseColors[pt.phase] || '#e2e8f0';
    if(prevX !== null) {
      ctx.strokeStyle = phaseColors[prevPhase] || '#e2e8f0';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(prevX,prevY); ctx.lineTo(x,y); ctx.stroke();
    }
    // Dot
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
    // Event markers
    if(pt.event === 'timeout') {
      ctx.fillStyle = '#f87171';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('超时!', x, y - 10);
    }
    if(pt.event === '3dupack') {
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('3×DupACK', x, y - 10);
    }
    prevX = x; prevY = y; prevPhase = pt.phase;
  }

  // Current point highlight
  const cur_pt = CWN_DATA[dataUpTo];
  const cx2 = tx(cur_pt.t), cy2 = ty(cur_pt.cwnd);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(cx2, cy2, 6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = phaseColors[cur_pt.phase] || '#38bdf8';
  ctx.beginPath(); ctx.arc(cx2, cy2, 4, 0, Math.PI*2); ctx.fill();

  // Labels
  ctx.fillStyle = '#e2e8f0'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'left';
  ctx.fillText(`cwnd = ${cur_pt.cwnd} MSS`, cx2+8, cy2+4);
  ctx.fillStyle = '#f87171';
  ctx.fillText(`ssthresh = ${cur_pt.ssthresh}`, cx2+8, cy2+18);

  // Phase label box
  const phaseNames = {slow_start:'慢启动 Slow Start',ca:'拥塞避免 Congestion Avoidance',fast_recovery:'快速恢复 Fast Recovery'};
  const phaseName = phaseNames[cur_pt.phase] || '';
  const pColor = phaseColors[cur_pt.phase] || '#94a3b8';
  ctx.fillStyle = pColor + '33';
  ctx.strokeStyle = pColor;
  ctx.lineWidth = 1;
  const lw = ctx.measureText(phaseName).width + 20;
  ctx.beginPath(); ctx.roundRect(W/2 - lw/2, 8, lw, 20, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = pColor; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(phaseName, W/2, 22);

  // Legend
  const legend = [{color:'#10b981',label:'慢启动'},{color:'#38bdf8',label:'拥塞避免'},{color:'#fbbf24',label:'快速恢复'},{color:'#f87171',label:'ssthresh'}];
  legend.forEach((item,i) => {
    const lx = PAD.left + 8 + i * 90;
    const ly = H - PAD.bottom + 26;
    ctx.fillStyle = item.color;
    ctx.fillRect(lx, ly-6, 14, 3);
    ctx.font='9px system-ui'; ctx.textAlign='left';
    ctx.fillText(item.label, lx+18, ly);
  });
}

function renderCode() {
  const lines = CODE_LINES;
  const hl = ((STEPS[cur]||{}).highlightLines||[]);
  document.getElementById('codeBody').innerHTML = lines.map((l,i) =>
    `<div class="code-line${hl.includes(i+1)?' active':''}" onclick="jumpToLine(${i+1})">
      <span class="ln">${i+1}</span><span class="lc">${l.html||'&nbsp;'}</span></div>`
  ).join('');
  const el = document.querySelector('.code-line.active');
  if(el) el.scrollIntoView({block:'nearest'});
}

function jumpToLine(ln) {
  let best=cur,bestDist=Infinity;
  STEPS.forEach((s,i) => {
    if((s.highlightLines||[]).includes(ln)){const d=Math.abs(i-cur);if(d<bestDist){bestDist=d;best=i;}}
  });
  cur=best; render();
}

function render() {
  drawChart();
  renderCode();
  document.getElementById('descText').textContent = STEPS[cur].description;
  document.getElementById('stepCounter').textContent = `${cur+1} / ${STEPS.length}`;
  document.getElementById('btnPrev').disabled = cur===0;
  document.getElementById('btnNext').disabled = cur===STEPS.length-1;
}

function play(){if(cur>=STEPS.length-1)cur=0;playing=true;document.getElementById('btnPlay').innerHTML='⏸ 暂停';tick();}
function pause(){playing=false;clearTimeout(timer);document.getElementById('btnPlay').innerHTML='▶ 播放';}
function tick(){if(!playing)return;if(cur<STEPS.length-1){cur++;render();timer=setTimeout(tick,SPEED[parseInt(document.getElementById('speedRange').value)-1]);}else pause();}

document.getElementById('btnPlay').addEventListener('click',()=>playing?pause():play());
document.getElementById('btnPrev').addEventListener('click',()=>{pause();if(cur>0){cur--;render();}});
document.getElementById('btnNext').addEventListener('click',()=>{pause();if(cur<STEPS.length-1){cur++;render();}});
document.getElementById('btnReset').addEventListener('click',()=>{pause();cur=0;render();});

window.addEventListener('resize', resizeCanvas);
window.addEventListener('load', resizeCanvas);
setTimeout(resizeCanvas,50);
render();
</script>
</body>
</html>
