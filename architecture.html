<head>

  <title>知识架构图 — 码海拾贝</title>

  <script src="knowledge-data.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #111827;
      --surface2: #1e293b;
      --border: rgba(255,255,255,.08);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --dim: #475569;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(circle at 18% 0%, rgba(192,132,252,.12), transparent 34%),
        radial-gradient(circle at 88% 8%, rgba(56,189,248,.09), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .layout { display: flex; height: calc(100vh - 44px); }
    .sidebar {
      width: 300px; flex-shrink: 0; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
      background: rgba(15,23,42,.76); backdrop-filter: blur(12px);
    }
    .sidebar-top { padding: 22px 18px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .back-link { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; color: #38bdf8; text-decoration: none; margin-bottom: 14px; }
    .back-link:hover { text-decoration: underline; }
    .page-kicker { font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; color: #c084fc; font-weight: 800; margin-bottom: 7px; }
    .page-title { font-size: 1.18rem; font-weight: 750; color: #f1f5f9; margin-bottom: 7px; }
    .page-desc { font-size: .79rem; color: var(--muted); line-height: 1.6; }
    .detail-wrap { flex: 1; overflow-y: auto; padding: 14px 16px; }
    .detail-empty { font-size: .8rem; color: var(--dim); font-style: italic; padding: 8px 0; line-height: 1.7; }
    .detail-header { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .detail-mod { font-size: .9rem; font-weight: 700; }
    .detail-arrow { color: var(--dim); font-size: .85rem; }
    .detail-count { font-size: .72rem; color: var(--dim); margin-left: auto; font-weight: 400; }
    .bridge-list { display: flex; flex-direction: column; gap: 3px; }
    .bridge-item { display: flex; align-items: center; gap: 7px; font-size: .78rem; color: var(--muted); text-decoration: none; padding: 5px 6px; border-radius: 6px; transition: background .12s, color .12s; }
    .bridge-item:hover { background: var(--surface2); color: var(--text); }
    .bridge-item.no-link { cursor: default; }
    .b-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .b-arrow { color: var(--dim); font-size: .7rem; margin: 0 2px; }
    .bridge-more { font-size: .73rem; color: var(--dim); padding: 4px 6px; }
    .sidebar-legend { padding: 10px 16px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .legend-title { font-size: .65rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
    .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 5px; transition: background .12s; }
    .legend-item:hover { background: var(--surface2); color: var(--text); }
    .l-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }
    #arch { width: 100%; height: 100%; max-width: 980px; max-height: 760px; }
    .mod-box { cursor: pointer; }
    .mod-box rect { transition: filter .15s, transform .15s; }
    .mod-box:hover rect { filter: brightness(1.25) drop-shadow(0 0 14px rgba(255,255,255,.1)) !important; }
    .conn-hit { cursor: pointer; }
    .conn-vis { transition: opacity .15s, stroke-width .15s; pointer-events: none; }
    .conn-badge { cursor: pointer; }
    .conn-badge circle { transition: fill .15s; }
    .tier-label { pointer-events: none; }
    @media(max-width: 900px) {
      body { overflow: auto; }
      .layout { height: auto; min-height: calc(100vh - 44px); flex-direction: column; }
      .sidebar { width: 100%; max-height: 360px; border-right: 0; border-bottom: 1px solid var(--border); }
      .main { height: 760px; padding: 14px; }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-top">
      <a href="graph.html" class="back-link">← 知识星图</a>
      <div class="page-kicker">Layered Architecture</div>
      <div class="page-title">知识架构图</div>
      <p class="page-desc">上下分层展示 12 个模块的宏观关联。线条粗细反映跨模块连接数，点击连线查看桥接知识点。</p>
    </div>
    <div class="detail-wrap" id="detailWrap">
      <div class="detail-empty">点击两个模块之间的连线，查看它们共享的知识点。</div>
    </div>
    <div class="sidebar-legend">
      <div class="legend-title">模块图例</div>
      <div class="legend-grid" id="legendGrid"></div>
    </div>
  </aside>
  <main class="main">
    <svg id="arch" viewBox="0 0 980 870" preserveAspectRatio="xMidYMid meet"></svg>
  </main>
</div>
<script>
(function () {
  const MODULES = window.GRAPH_MODULES;
  const NODES = window.GRAPH_NODES;
  const EDGES = window.GRAPH_EDGES;
  const nodeMap = {};
  NODES.forEach(n => { nodeMap[n.id] = n; });

  const pairEdges = {};
  const pairSeen = new Set();
  EDGES.forEach(([aId, bId]) => {
    const na = nodeMap[aId], nb = nodeMap[bId];
    if (!na || !nb || na.module === nb.module) return;
    if (na.type === 'module' || nb.type === 'module') return;
    const edgeKey = [na.id, nb.id].sort().join('::');
    if (pairSeen.has(edgeKey)) return;
    pairSeen.add(edgeKey);
    const key = [na.module, nb.module].sort().join('::');
    (pairEdges[key] = pairEdges[key] || []).push({ a: na, b: nb });
  });

  // Vertical learning architecture:
  // 1. Algorithm foundations: algo
  // 2. Hardware and systems: cs, linux, network
  // 3. Distributed systems and language runtime: distributed, golang
  // 4. Application design: system-design
  // 5. Data and middleware: db, redis, kafka
  // 6. AI systems: ai
  const POS = {
    algo:            { x: 490, y:  90 },
    cs:              { x: 180, y: 250 },
    linux:           { x: 490, y: 250 },
    network:         { x: 800, y: 250 },
    distributed:     { x: 310, y: 430 },
    golang:          { x: 670, y: 430 },
    'system-design': { x: 310, y: 560 },
    testing:         { x: 670, y: 560 },
    db:              { x: 220, y: 710 },
    redis:           { x: 490, y: 710 },
    kafka:           { x: 760, y: 710 },
    ai:              { x: 490, y: 820 },
  };
  const BW = 136, BH = 50;
  const svg = document.getElementById('arch');
  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  }
  function txt(s, attrs, parent) { const e = el('text', attrs, parent); e.textContent = s; return e; }
  const defs = el('defs', {}, svg);
  const tierL = el('g', { id: 'tierLayer' }, svg);
  const connL = el('g', { id: 'connLayer' }, svg);
  const modL = el('g', { id: 'modLayer' }, svg);

  const tiers = [
    { y: 90,  label: '1 算法抽象层',    note: 'algorithm and data structures' },
    { y: 250, label: '2 硬件与系统层',  note: 'computer / linux / network' },
    { y: 430, label: '3 分布式与运行时层', note: 'distributed systems / golang runtime' },
    { y: 560, label: '4 应用设计与工程质量层', note: 'system design patterns / testing engineering' },
    { y: 710, label: '5 数据与中间件层', note: 'database / redis / kafka' },
    { y: 820, label: '6 智能应用层',    note: 'llm / rag / agent / ai engineering' },
  ];
  [170, 340, 495, 635, 775].forEach(y => {
    el('line', { x1: 36, y1: y, x2: 944, y2: y, stroke: 'rgba(255,255,255,.055)', 'stroke-width': 1, 'stroke-dasharray': '5 7' }, tierL);
  });
  tiers.forEach(({ y, label, note }) => {
    txt(label, { x: 48, y: y - 44, 'font-size': '12', fill: 'rgba(226,232,240,.34)', 'font-weight': '700', class: 'tier-label' }, tierL);
    txt(note, { x: 48, y: y - 27, 'font-size': '10', fill: 'rgba(148,163,184,.24)', class: 'tier-label' }, tierL);
  });

  let activeConn = null;
  function drawConn(mA, mB, edges) {
    const pa = POS[mA], pb = POS[mB];
    if (!pa || !pb) return;
    const count = edges.length;
    const baseW = count >= 10 ? 4 : count >= 6 ? 2.6 : 1.35;
    const opacity = count >= 10 ? '0.78' : count >= 6 ? '0.58' : '0.36';
    const showBadge = count >= 4;
    const colorA = MODULES[mA]?.color || '#888';
    const colorB = MODULES[mB]?.color || '#888';
    const gId = `g-${mA}-${mB}`;
    const grad = el('linearGradient', { id: gId, gradientUnits: 'userSpaceOnUse', x1: pa.x, y1: pa.y, x2: pb.x, y2: pb.y }, defs);
    el('stop', { offset: '0%', 'stop-color': colorA, 'stop-opacity': '.78' }, grad);
    el('stop', { offset: '100%', 'stop-color': colorB, 'stop-opacity': '.78' }, grad);
    const dx = pb.x - pa.x, dy = pb.y - pa.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const perpX = -dy / dist, perpY = dx / dist;
    const dir = (mA.charCodeAt(0) + mB.charCodeAt(0)) % 2 === 0 ? 1 : -1;
    const off = Math.min(86, Math.max(28, dist * 0.16)) * dir;
    const cx = (pa.x + pb.x) / 2 + perpX * off;
    const cy = (pa.y + pb.y) / 2 + perpY * off;
    const d = `M${pa.x},${pa.y} Q${cx},${cy} ${pb.x},${pb.y}`;
    const hit = el('path', { d, fill: 'none', stroke: 'transparent', 'stroke-width': 20, class: 'conn-hit' }, connL);
    const vis = el('path', { d, fill: 'none', stroke: `url(#${gId})`, 'stroke-width': baseW, 'stroke-linecap': 'round', opacity, class: 'conn-vis' }, connL);
    const badge = el('g', { transform: `translate(${cx},${cy})`, class: 'conn-badge' }, connL);
    if (showBadge) {
      el('circle', { r: 11, fill: '#1a2540', stroke: '#2d3f5e', 'stroke-width': 1 }, badge);
      txt(String(count), { 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': '10', fill: '#cbd5e1', 'font-weight': '800' }, badge);
    } else {
      el('circle', { r: 8, fill: 'transparent' }, badge);
    }
    function activate() {
      if (activeConn) activeConn();
      vis.setAttribute('opacity', '1');
      vis.setAttribute('stroke-width', baseW + 1.6);
      const c = badge.querySelector('circle');
      if (c && showBadge) c.setAttribute('fill', '#2d3f5e');
      activeConn = deactivate;
      showDetail(mA, mB, edges);
    }
    function deactivate() {
      vis.setAttribute('opacity', opacity);
      vis.setAttribute('stroke-width', baseW);
      const c = badge.querySelector('circle');
      if (c && showBadge) c.setAttribute('fill', '#1a2540');
    }
    [hit, badge].forEach(e => {
      e.addEventListener('click', activate);
      e.addEventListener('mouseenter', () => vis.setAttribute('opacity', '0.9'));
      e.addEventListener('mouseleave', () => { if (activeConn !== deactivate) vis.setAttribute('opacity', opacity); });
    });
  }

  Object.entries(pairEdges).forEach(([key, edges]) => {
    const [mA, mB] = key.split('::');
    if (edges.length < 2) return;
    drawConn(mA, mB, edges);
  });

  Object.entries(POS).forEach(([mod, pos]) => {
    const m = MODULES[mod];
    if (!m) return;
    const color = m.color;
    const topicCount = NODES.filter(n => n.module === mod && n.type !== 'module').length;
    const g = el('g', { class: 'mod-box', transform: `translate(${pos.x - BW / 2},${pos.y - BH / 2})` }, modL);
    el('rect', { x: 0, y: 0, width: BW, height: BH, rx: 12, fill: '#172033', stroke: color, 'stroke-width': '1.5', filter: `drop-shadow(0 0 12px ${color}33)` }, g);
    txt(m.label, { x: BW / 2, y: BH / 2 - 7, 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'font-size': '13', 'font-weight': '800', fill: color }, g);
    txt(`${topicCount} 个节点`, { x: BW / 2, y: BH / 2 + 10, 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'font-size': '10', fill: '#64748b' }, g);
    g.addEventListener('click', () => { window.location.href = `graph.html?q=${encodeURIComponent(m.label)}`; });
  });

  function showDetail(mA, mB, edges) {
    const ma = MODULES[mA], mb = MODULES[mB];
    const wrap = document.getElementById('detailWrap');
    const items = edges.slice(0, 24).map(({ a, b }) => {
      const primary = a.href ? a : b;
      const href = primary.href;
      const tag = href ? 'a' : 'span';
      const attrs = href ? `href="${href}" class="bridge-item"` : `class="bridge-item no-link"`;
      return `<${tag} ${attrs}>
        <span class="b-dot" style="background:${MODULES[a.module]?.color}"></span>
        <span>${a.label}</span>
        <span class="b-arrow">↔</span>
        <span>${b.label}</span>
        <span class="b-dot" style="background:${MODULES[b.module]?.color}"></span>
      </${tag}>`;
    }).join('');
    const more = edges.length > 24 ? `<div class="bridge-more">还有 ${edges.length - 24} 条...</div>` : '';
    wrap.innerHTML = `
      <div class="detail-header">
        <span class="detail-mod" style="color:${ma?.color}">${ma?.label}</span>
        <span class="detail-arrow">↔</span>
        <span class="detail-mod" style="color:${mb?.color}">${mb?.label}</span>
        <span class="detail-count">${edges.length} 条连接</span>
      </div>
      <div class="bridge-list">${items}${more}</div>`;
  }

  const grid = document.getElementById('legendGrid');
  Object.entries(MODULES).forEach(([key, m]) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.title = '在星图中查看';
    item.innerHTML = `<span class="l-dot" style="background:${m.color}"></span><span>${m.label}</span>`;
    item.addEventListener('click', () => { window.location.href = `graph.html?q=${encodeURIComponent(m.label)}`; });
    grid.appendChild(item);
  });
})();
</script>
</body>
</html>
