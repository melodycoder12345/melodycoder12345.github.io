<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#0d1117;--border:#334155;--text:#e2e8f0;--dim:#94a3b8;--blue:#38bdf8;--yellow:#fbbf24;--orange:#fb923c;--green:#4ade80;--purple:#c084fc;--red:#f87171;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
nav{display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.back-btn{color:var(--dim);text-decoration:none;font-size:0.9rem;}.back-btn:hover{color:var(--text);}
nav h1{font-size:1.2rem;font-weight:600;}.tags{margin-left:auto;display:flex;gap:8px;}
.badge{font-size:0.75rem;padding:3px 10px;border-radius:100px;font-family:monospace;}
.main{display:flex;flex:1;overflow:hidden;}
.viz-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;}
.viz-area{flex:1;overflow:hidden;position:relative;background:var(--panel2);}
.desc-box{padding:12px 24px;background:rgba(255,255,255,0.03);border-top:1px solid var(--border);font-size:0.88rem;color:var(--dim);min-height:44px;display:flex;align-items:center;}
.step-counter{margin-left:auto;font-size:0.8rem;color:var(--dim);font-family:monospace;white-space:nowrap;}
.code-panel{width:45%;min-width:380px;display:flex;flex-direction:column;overflow:hidden;}
.code-panel-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:0.85rem;color:var(--dim);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.code-dot{width:10px;height:10px;border-radius:50%;}
.code-body{flex:1;overflow-y:auto;padding:16px 0;background:#0d1117;}
.code-body::-webkit-scrollbar{width:6px;}.code-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.code-line{display:flex;align-items:stretch;padding:1px 0;cursor:pointer;transition:background 0.15s;font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.6;}
.code-line:hover{background:rgba(255,255,255,0.04);}.code-line.active{background:rgba(251,191,36,0.12);}.code-line.active .ln{color:var(--yellow);}
.ln{min-width:48px;padding:0 12px 0 16px;color:#4b5563;text-align:right;user-select:none;flex-shrink:0;font-size:0.78rem;}
.lc{padding:0 16px 0 4px;flex:1;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.num{color:#79c0ff;}.pkg{color:#ffa657;}.cm{color:#8b949e;font-style:italic;}
.controls{display:flex;align-items:center;gap:10px;padding:12px 24px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.btn{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:7px;cursor:pointer;font-size:0.85rem;transition:all 0.15s;}
.btn:hover{background:rgba(255,255,255,0.12);}.btn.primary{background:rgba(56,189,248,0.15);border-color:rgba(56,189,248,0.3);color:var(--blue);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.speed-wrap{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:0.8rem;color:var(--dim);}
input[type=range]{-webkit-appearance:none;width:90px;height:4px;background:var(--border);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--blue);cursor:pointer;}
@media(max-width:768px){
  body{height:auto!important;min-height:100vh;overflow-y:auto!important;}
  nav{flex-wrap:wrap;padding:10px 16px;gap:6px;height:auto!important;}
  nav h1{font-size:1rem;flex:1;}.tags{margin-left:0!important;width:100%;order:3;margin-top:4px;}
  .main{flex-direction:column!important;overflow:visible!important;height:auto!important;flex:none!important;}
  .viz-panel{border-right:none!important;border-bottom:1px solid var(--border);height:320px!important;flex:none!important;overflow:hidden;}
  .code-panel{width:100%!important;min-width:unset!important;height:340px!important;flex:none!important;}
  .code-line{font-size:0.76rem!important;}.ln{min-width:36px!important;padding:0 8px!important;}
  .controls{flex-wrap:wrap!important;padding:10px 14px!important;gap:6px!important;height:auto!important;}
  .btn{padding:6px 10px!important;font-size:0.8rem!important;}.speed-wrap{margin-left:0!important;width:100%;}
  .desc-box{padding:8px 14px!important;font-size:0.8rem!important;}
}
</style>
<script src="../nav.js"></script>
<script src="../concept.js"></script>

window.PAGE_CONCEPTS = [
  { title: 'Group Coordinator', body: `每个 Consumer Group 有一个对应的 Broker 担任 Group Coordinator，负责管理成员列表、触发和协调 Rebalance。` },
  { title: 'Rebalance 触发条件', body: `1) 成员加入/离开 Group；2) Topic Partition 数量变化；3) 订阅的 Topic 发生变化；4) 超过 session.timeout.ms 未收到心跳。` },
  { title: 'JoinGroup / SyncGroup', body: `JoinGroup：所有成员向 Coordinator 发送加入请求，选出 Group Leader（第一个加入者）。SyncGroup：Leader 计算分配方案并通过 Coordinator 下发给所有成员。`, tag: '两阶段协议' },
  { title: '分区分配策略', body: `RangeAssignor（默认）按范围分配。RoundRobinAssignor 轮询分配更均匀。StickyAssignor 尽量保持原分配，减少迁移。CooperativeStickyAssignor 增量 Rebalance，减少停顿。` },
  { title: '静态成员', body: `group.instance.id 标识静态成员。静态成员重启不触发 Rebalance，直到 session.timeout.ms 超时，适合有状态的 Consumer（如本地聚合）。`, tag: '减少抖动' }
];

let step=0,playing=false,timer=null;
function getSpeed(){return 1600-(parseInt(document.getElementById('speedSlider').value)-1)*300;}

function setOpacity(id,v){const e=document.getElementById(id);if(e)e.setAttribute('opacity',v);}
function setStroke(id,c){const e=document.getElementById(id);if(e)e.style.stroke=c;}
function setTextFill(id,c){const e=document.getElementById(id);if(e)e.style.fill=c;}

function renderViz(){
  // Reset
  ['aJ1','aJ2','aJ3','aS1','aS2','aS3','oP0C1','oP1C1','oP2C2','oP0C1b','oP1C2b','oP2C3b','rRebAlert','tRebAlert'].forEach(id=>setOpacity(id,'0'));
  setOpacity('rC3','0.2');
  setStroke('rC1','#334155'); setStroke('rC2','#334155'); setStroke('rC3','#334155');
  document.getElementById('tC1Assign').textContent='分区: -';
  document.getElementById('tC2Assign').textContent='分区: -';
  document.getElementById('tC3Assign').textContent='分区: -';
  document.getElementById('tCoordStatus').textContent='等待 JoinGroup...';
  document.getElementById('tTP0Owner').textContent='-'; document.getElementById('rTP0').style.stroke='#334155';
  document.getElementById('tTP1Owner').textContent='-'; document.getElementById('rTP1').style.stroke='#334155';
  document.getElementById('tTP2Owner').textContent='-'; document.getElementById('rTP2').style.stroke='#334155';

  if(step>=0){
    setOpacity('aJ1','1'); setStroke('rC1','#c084fc');
    document.getElementById('tC1Status').textContent='→ JoinGroup';
    document.getElementById('tCoordStatus').textContent='收到 C1 JoinGroup';
  }
  if(step>=1){
    setOpacity('aJ2','1'); setStroke('rC2','#c084fc');
    document.getElementById('tC2Status').textContent='→ JoinGroup';
    document.getElementById('tCoordStatus').textContent='所有成员已加入，选举 Leader';
  }
  if(step>=2){
    document.getElementById('tCoordStatus').textContent='C1 = Group Leader';
    setStroke('rC1','#fbbf24');
    document.getElementById('tC1Status').textContent='Group Leader ★';
  }
  if(step>=3){
    document.getElementById('tCoordStatus').textContent='制定分配方案中...';
    document.getElementById('tC1Status').textContent='计算 Range 分配';
  }
  if(step>=4){
    setOpacity('aS1','1'); setOpacity('aS2','1');
    setOpacity('oP0C1','1'); setOpacity('oP1C1','1'); setOpacity('oP2C2','1');
    document.getElementById('tC1Assign').textContent='分区: P0, P1';
    document.getElementById('tC2Assign').textContent='分区: P2';
    document.getElementById('tCoordStatus').textContent='SyncGroup 完成';
    document.getElementById('tTP0Owner').textContent='→C1'; document.getElementById('rTP0').style.stroke='#4ade80';
    document.getElementById('tTP1Owner').textContent='→C1'; document.getElementById('rTP1').style.stroke='#4ade80';
    document.getElementById('tTP2Owner').textContent='→C2'; document.getElementById('rTP2').style.stroke='#38bdf8';
  }
  if(step>=5){
    setStroke('rC1','#4ade80'); setStroke('rC2','#4ade80');
    document.getElementById('tC1Status').textContent='消费中 ✓';
    document.getElementById('tC2Status').textContent='消费中 ✓';
  }
  if(step>=6){
    setOpacity('rC3','1'); setOpacity('aJ3','1');
    setStroke('rC3','#c084fc');
    document.getElementById('tC3Status').textContent='→ JoinGroup';
    document.getElementById('tCoordStatus').textContent='C3 加入！触发 Rebalance';
    setStroke('rCoord','#fbbf24');
  }
  if(step>=7){
    setOpacity('rRebAlert','1'); setOpacity('tRebAlert','1');
    setStroke('rC1','#fbbf24'); setStroke('rC2','#fbbf24'); setStroke('rC3','#fbbf24');
    document.getElementById('tC1Status').textContent='暂停消费 ⚠';
    document.getElementById('tC2Status').textContent='暂停消费 ⚠';
    document.getElementById('tC3Status').textContent='暂停消费 ⚠';
    setOpacity('oP0C1','0'); setOpacity('oP1C1','0'); setOpacity('oP2C2','0');
  }
  if(step>=8){
    setOpacity('rRebAlert','0'); setOpacity('tRebAlert','0');
    setOpacity('aS1','1'); setOpacity('aS2','1'); setOpacity('aS3','1');
    setOpacity('oP0C1b','1'); setOpacity('oP1C2b','1'); setOpacity('oP2C3b','1');
    document.getElementById('tC1Assign').textContent='分区: P0';
    document.getElementById('tC2Assign').textContent='分区: P1';
    document.getElementById('tC3Assign').textContent='分区: P2';
    document.getElementById('tTP0Owner').textContent='→C1'; document.getElementById('rTP0').style.stroke='#4ade80';
    document.getElementById('tTP1Owner').textContent='→C2'; document.getElementById('rTP1').style.stroke='#38bdf8';
    document.getElementById('tTP2Owner').textContent='→C3'; document.getElementById('rTP2').style.stroke='#c084fc';
  }
  if(step>=9){
    setStroke('rC1','#4ade80'); setStroke('rC2','#4ade80'); setStroke('rC3','#4ade80');
    document.getElementById('tC1Status').textContent='消费中 ✓';
    document.getElementById('tC2Status').textContent='消费中 ✓';
    document.getElementById('tC3Status').textContent='消费中 ✓';
    document.getElementById('tCoordStatus').textContent='Rebalance 完成';
    setStroke('rCoord','#c084fc');
  }
}

function renderCode(){
  const lines=CODE_LINES;
  const hl=step<STEPS.length?(STEPS[step].highlightLines||[]):[];
  document.getElementById('codeBody').innerHTML=lines.map((l,i)=>
    `<div class="code-line${hl.includes(i+1)?' active':''}" onclick="jumpToLine(${i+1})">
      <span class="ln">${i+1}</span><span class="lc">${l.html||'&nbsp;'}</span></div>`
  ).join('');
  const a=document.querySelector('.code-line.active');if(a)a.scrollIntoView({block:'nearest'});
}

function render(){
  renderViz();renderCode();
  document.getElementById('descText').textContent=step<STEPS.length?STEPS[step].description:'演示完成';
  document.getElementById('stepCounter').textContent=`${Math.min(step+1,STEPS.length)} / ${STEPS.length}`;
  document.getElementById('btnPrev').disabled=step===0;
  document.getElementById('btnNext').disabled=step>=STEPS.length-1;
}

function jumpToLine(ln){for(let i=STEPS.length-1;i>=0;i--){if((STEPS[i].highlightLines||[]).includes(ln)){step=i;render();return;}}}
function next(){if(step<STEPS.length-1){step++;render();}}
function prev(){if(step>0){step--;render();}}
function reset(){step=0;render();if(playing){playing=false;clearInterval(timer);document.getElementById('btnPlay').textContent='▶ 播放';}}
function togglePlay(){
  playing=!playing;
  document.getElementById('btnPlay').textContent=playing?'⏸ 暂停':'▶ 播放';
  if(playing){timer=setInterval(()=>{if(step>=STEPS.length-1){playing=false;clearInterval(timer);document.getElementById('btnPlay').textContent='▶ 播放';return;}step++;render();},getSpeed());}
  else clearInterval(timer);
}

render();
if(window.NavTracker)NavTracker.track('消费者组Rebalance','kafka/consumer-group.html','📦','Kafka');
</script>
