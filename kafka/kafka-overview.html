  { title: '什么是 Kafka', body: `Apache Kafka 是一个分布式流处理平台，基于发布-订阅模型，以高吞吐、低延迟和持久化著称，广泛用于日志收集、事件流和数据管道。` },

  { title: 'Producer & Consumer', body: `Producer 将消息追加写入分区末尾（顺序写磁盘）。Consumer 以 Pull 方式拉取消息，通过 Offset 记录消费位置。` },
  { title: 'Consumer Group', body: `同一 Group 内多个 Consumer 共同消费 Topic，每个 Partition 同时只由组内一个 Consumer 消费，实现负载均衡与水平扩展。` }
];

  { highlightLines:[11,12,13,14], hlJs:[11,12,13,14], hlPy:[12,13,14,15,16], description:"Step 2: 消息发往 Topic 'orders'，Kafka 根据 key hash 路由到对应 Partition" },
  { highlightLines:[20,21,22], hlJs:[15,16,17,18,19], hlPy:[13,14,15,16], description:"Step 3: 消息按 key 'order-1' 路由到 Partition 0，追加写入日志文件" },
  { highlightLines:[25,26], hlJs:[19,20,21], hlPy:[16,17,18,19], description:"Step 4: Follower 副本从 Leader 拉取数据，同步到 ISR 列表中的副本" },
  { highlightLines:[28,29,30,31,32,33,34], hlJs:[22,23,24,25,26,27,28], hlPy:[21,22,23,24,25,26,27,28,29], description:"Step 5: Consumer 创建 Reader，指定 GroupID 加入消费者组 'order-service'" },
  { highlightLines:[36,37,38,39,40,41,42], hlJs:[29,30,31,32,33,34,35], hlPy:[30,31,32,33,34,35,36,37], description:"Step 6: Consumer 从上次提交的 Offset 开始读取，调用 ReadMessage 获取消息" },
  { highlightLines:[39,40,41], hlJs:[32,33,34,35], hlPy:[34,35,36,37], description:"Step 7: Offset 自动提交，记录 Consumer 在该 Partition 的消费进度" },
  { highlightLines:[38,39,40,41,42], hlJs:[30,31,32,33,34,35], hlPy:[31,32,33,34,35,36,37], description:"Step 8: 消费循环继续，Consumer Group 协调各成员消费不同 Partition，实现负载均衡" },
];

let cur = 0, playing = false, timer = null;
const SPEED = [1200,800,500,300,150];

function highlightSVG(step) {
  const all = ['gProducer','gBroker','gConsumer','gP0','gP1','gP2'];
  all.forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.style.opacity = '0.35'; el.style.transition = 'opacity 0.4s'; }
  });
  const arrs = ['arrowP2B','arrowB2C'];
  arrs.forEach(id => { const el = document.getElementById(id); if(el){ el.setAttribute('stroke','#334155'); el.setAttribute('stroke-dasharray','5,3'); el.removeAttribute('marker-end'); el.setAttribute('marker-end','url(#arrowhead)'); }});

  if (step === 0) {
    all.forEach(id => { const el = document.getElementById(id); if(el) el.style.opacity='1'; });
    document.getElementById('arrowP2B').setAttribute('stroke','#94a3b8');
    document.getElementById('arrowB2C').setAttribute('stroke','#94a3b8');
  } else if (step === 1 || step === 2) {
    document.getElementById('gProducer').style.opacity='1';
    document.getElementById('gBroker').style.opacity='1';
    document.getElementById('arrowP2B').setAttribute('stroke','#ff6b35');
    document.getElementById('arrowP2B').setAttribute('stroke-dasharray','0');
    document.getElementById('arrowP2B').setAttribute('marker-end','url(#arrowOrange)');
    animateBall(130, 230, '#ff6b35');
  } else if (step === 3) {
    document.getElementById('gBroker').style.opacity='1';
    document.getElementById('gP0').style.opacity='1';
  } else if (step === 4) {
    document.getElementById('gBroker').style.opacity='1';
    document.getElementById('gP0').style.opacity='1';
    document.getElementById('gP1').style.opacity='0.8';
    document.getElementById('gP2').style.opacity='0.8';
  } else if (step === 5) {
    document.getElementById('gBroker').style.opacity='1';
    document.getElementById('gConsumer').style.opacity='1';
    document.getElementById('arrowB2C').setAttribute('stroke','#4ade80');
    document.getElementById('arrowB2C').setAttribute('stroke-dasharray','0');
    document.getElementById('arrowB2C').setAttribute('marker-end','url(#arrowGreen)');
  } else if (step === 6 || step === 7) {
    document.getElementById('gBroker').style.opacity='1';
    document.getElementById('gConsumer').style.opacity='1';
    document.getElementById('arrowB2C').setAttribute('stroke','#4ade80');
    document.getElementById('arrowB2C').setAttribute('stroke-dasharray','0');
    document.getElementById('arrowB2C').setAttribute('marker-end','url(#arrowGreen)');
    animateBall(530, 620, '#4ade80');
  } else if (step === 8) {
    all.forEach(id => { const el = document.getElementById(id); if(el) el.style.opacity='1'; });
    document.getElementById('arrowP2B').setAttribute('stroke','#ff6b35');
    document.getElementById('arrowP2B').setAttribute('stroke-dasharray','0');
    document.getElementById('arrowP2B').setAttribute('marker-end','url(#arrowOrange)');
    document.getElementById('arrowB2C').setAttribute('stroke','#4ade80');
    document.getElementById('arrowB2C').setAttribute('stroke-dasharray','0');
    document.getElementById('arrowB2C').setAttribute('marker-end','url(#arrowGreen)');
  }
}

let ballTimer = null;
function animateBall(x1, x2, color) {
  const ball = document.getElementById('msgBall');
  ball.setAttribute('cx', x1); ball.setAttribute('cy', 190);
  ball.setAttribute('fill', color); ball.setAttribute('opacity','1');
  let prog = 0;
  if(ballTimer) clearInterval(ballTimer);
  ballTimer = setInterval(() => {
    prog += 0.05;
    if(prog >= 1) { clearInterval(ballTimer); ball.setAttribute('opacity','0'); return; }
    ball.setAttribute('cx', x1 + (x2-x1)*prog);
  }, 30);
}

function renderCode() {
  const step = STEPS[cur];
  const lines = CODE_LINES;
  const hl = ((step||{}).highlightLines||[]);
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i) ? ' active' : '';
    return `<div class="code-line${active}"><span class="ln">${i+1}</span><span class="lc">${line.html||'&nbsp;'}</span></div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if(el) el.scrollIntoView({block:'nearest'});
}

function render() {
  const s = STEPS[cur];
  highlightSVG(cur);
  renderCode();
  document.getElementById('descText').textContent = s.description;
  document.getElementById('stepCounter').textContent = `${cur+1} / ${STEPS.length}`;
  document.getElementById('btnPrev').disabled = cur === 0;
  document.getElementById('btnNext').disabled = cur === STEPS.length - 1;
}

function play(){if(cur>=STEPS.length-1)cur=0;playing=true;document.getElementById('btnPlay').innerHTML='⏸ 暂停';tick();}
function pause(){playing=false;clearTimeout(timer);document.getElementById('btnPlay').innerHTML='▶ 播放';}
function tick(){if(!playing)return;if(cur<STEPS.length-1){cur++;render();timer=setTimeout(tick,SPEED[parseInt(document.getElementById('speedRange').value)-1]);}else pause();}
document.getElementById('btnPlay').addEventListener('click',()=>playing?pause():play());
document.getElementById('btnPrev').addEventListener('click',()=>{pause();if(cur>0){cur--;render();}});
document.getElementById('btnNext').addEventListener('click',()=>{pause();if(cur<STEPS.length-1){cur++;render();}});
document.getElementById('btnReset').addEventListener('click',()=>{pause();cur=0;render();});
render();
</script>
</body>
</html>
