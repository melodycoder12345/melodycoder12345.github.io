window.PAGE_CONCEPTS = [
  { title: '副本机制', body: `每个 Partition 有一个 Leader 和若干 Follower 副本。所有读写流经 Leader，Follower 异步从 Leader 拉取同步。副本数通常设置为 3。` },
  { title: 'ISR (In-Sync Replicas)', body: `ISR 是当前与 Leader 保持同步的副本集合（包含 Leader）。Follower 若在 replica.lag.time.max.ms 内没有取得 fetch 进展，会被移出 ISR；现代 Kafka 不再同时使用固定的消息数落后阈值。`, tag: '高可靠' },
  { title: 'HW & LEO', body: `LEO（Log End Offset）是日志下一条记录的位移。HW（High Watermark）表示已复制到当前 ISR、可向普通消费者暴露的边界；使用 read_committed 时还受 Last Stable Offset 限制。` },
  { title: 'Leader 选举', body: `Leader 宕机时，Controller 通常从 ISR 中选择可用副本成为新 Leader；不要依赖具体成员顺序。若没有合格副本且禁用不洁选举，分区会保持不可用；启用不洁选举则可能丢数据。` },
  { title: 'min.insync.replicas', body: `仅在生产者使用 acks=all（-1）时生效：若 ISR 数量低于该阈值，Broker 拒绝写入。它约束可用性与已确认写入的副本下限，但仍需正确配置副本数、选举和重试。`, tag: '数据安全' }
];

    document.getElementById('rP0F2').style.stroke='#4ade80';
    document.getElementById('rP0F3').style.stroke='#4ade80';
  }
  if(step>=6){
    // Broker1 failure
    document.getElementById('rB1').style.stroke='#f87171';
    document.getElementById('rB1').style.fill='rgba(248,113,113,0.06)';
    document.getElementById('tB1').style.fill='#f87171';
    document.getElementById('tB1').textContent='Broker 1 ✗';
    document.getElementById('rP0L').style.stroke='#f87171';
  }
  if(step>=7){
    // B2 P0 becomes new leader
    document.getElementById('rP0F2').style.stroke='#ff6b35';
    document.getElementById('rP0F2').style.fill='rgba(255,107,53,0.08)';
    const t = document.getElementById('tP0F2');
    if(t) t.textContent='ISR ready';
    // change text
    const nodes = document.querySelectorAll('#rP0F2 + text, #rP0F2 ~ text');
  }
  if(step>=8){
    document.getElementById('tB2').textContent='Broker 2 (P0 新 Leader)';
    document.getElementById('tB2').style.fill='#ff6b35';
  }
  if(step>=9){
    document.getElementById('rB1').style.stroke='#334155';
    document.getElementById('rB1').style.fill='rgba(56,189,248,0.04)';
    document.getElementById('tB1').textContent='Broker 1 (重新加入)';
    document.getElementById('tB1').style.fill='#94a3b8';
  }
}

function renderCode(){
  const lines=CODE_LINES;
  const hl=step<STEPS.length?(STEPS[step].highlightLines||[]):[];
  document.getElementById('codeBody').innerHTML=lines.map((l,i)=>
    `<div class="code-line${hl.includes(i+1)?' active':''}" onclick="jumpToLine(${i+1})">
      <span class="ln">${i+1}</span><span class="lc">${l.html||'&nbsp;'}</span></div>`
  ).join('');
  const a=document.querySelector('.code-line.active');if(a)a.scrollIntoView({block:'nearest'});
}

function render(){
  renderViz();renderCode();
  document.getElementById('descText').textContent=step<STEPS.length?STEPS[step].description:'演示完成';
  document.getElementById('stepCounter').textContent=`${Math.min(step+1,STEPS.length)} / ${STEPS.length}`;
  document.getElementById('btnPrev').disabled=step===0;
  document.getElementById('btnNext').disabled=step>=STEPS.length-1;
}

function jumpToLine(ln){for(let i=STEPS.length-1;i>=0;i--){if((STEPS[i].highlightLines||[]).includes(ln)){step=i;render();return;}}}
function next(){if(step<STEPS.length-1){step++;render();}}
function prev(){if(step>0){step--;render();}}
function reset(){step=0;render();if(playing){playing=false;clearInterval(timer);document.getElementById('btnPlay').textContent='▶ 播放';}}
function togglePlay(){
  if(!playing && step>=STEPS.length-1){step=0;render();}
  playing=!playing;
  document.getElementById('btnPlay').textContent=playing?'⏸ 暂停':'▶ 播放';
  if(playing){timer=setInterval(()=>{if(step>=STEPS.length-1){playing=false;clearInterval(timer);document.getElementById('btnPlay').textContent='▶ 播放';return;}step++;render();},getSpeed());}
  else clearInterval(timer);
}

render();
if(window.NavTracker)NavTracker.track('Kafka分区与副本','kafka/partition-replication.html','📦','Kafka');
</script>
