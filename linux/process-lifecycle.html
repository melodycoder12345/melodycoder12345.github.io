.badge{font-size:0.72rem;padding:2px 8px;border-radius:100px;font-family:monospace;font-weight:500;}
.complexity{margin-left:auto;display:flex;gap:8px;align-items:center;}
.main{display:flex;flex:1;overflow:hidden;}
.viz-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;}

.code-line{display:flex;align-items:stretch;padding:1px 0;cursor:pointer;transition:background 0.15s;font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.6;}

.ln{min-width:48px;padding:0 12px 0 16px;color:#4b5563;text-align:right;user-select:none;flex-shrink:0;font-size:0.78rem;}
.lc{padding:0 16px 0 4px;flex:1;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.num{color:#79c0ff;}.pkg{color:#ffa657;}.cm{color:#8b949e;font-style:italic;}
.controls{display:flex;align-items:center;gap:10px;padding:12px 24px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.btn{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:7px;cursor:pointer;font-size:0.85rem;transition:all 0.15s;font-family:inherit;}

.btn:disabled{opacity:0.4;cursor:not-allowed;}
.speed-wrap{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:0.8rem;color:var(--dim);}
input[type=range]{-webkit-appearance:none;width:90px;height:4px;background:var(--border);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--linux);cursor:pointer;}

/* State machine styles */
.sm-container{width:100%;max-width:680px;}
.sm-svg{width:100%;height:340px;}
.state-node{cursor:pointer;transition:all 0.3s;}
.state-circle{fill:#1e293b;stroke:#334155;stroke-width:2;transition:all 0.3s;}
.state-circle.active{fill:rgba(247,201,72,0.2);stroke:var(--linux);stroke-width:3;filter:drop-shadow(0 0 8px rgba(247,201,72,0.4));}
.state-circle.visited{fill:rgba(74,222,128,0.1);stroke:var(--green);stroke-width:2;}
.state-circle.zombie{fill:rgba(248,113,113,0.1);stroke:var(--red);stroke-width:2;}
.state-label{fill:var(--text);font-family:'Segoe UI',sans-serif;font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:middle;pointer-events:none;}
.state-sublabel{fill:var(--dim);font-family:'Segoe UI',sans-serif;font-size:9px;text-anchor:middle;dominant-baseline:middle;pointer-events:none;}
.edge-line{stroke:#334155;stroke-width:1.5;fill:none;transition:all 0.3s;}
.edge-line.active{stroke:var(--linux);stroke-width:2.5;filter:drop-shadow(0 0 4px rgba(247,201,72,0.4));}
.edge-label{fill:var(--dim2);font-family:'Segoe UI',sans-serif;font-size:9px;text-anchor:middle;}
.edge-label.active{fill:var(--linux);}
.arrowhead{fill:#334155;transition:all 0.3s;}
.arrowhead.active{fill:var(--linux);}

.info-panel{margin-top:16px;padding:14px 18px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;font-size:0.83rem;line-height:1.7;}
.info-panel h4{font-size:0.9rem;color:var(--linux);margin-bottom:8px;}

@media(max-width:768px){
  body{height:auto!important;min-height:100vh;overflow-y:auto!important;}

  .btn{padding:6px 10px!important;font-size:0.8rem!important;}
  .speed-wrap{margin-left:0!important;width:100%;}
  .desc-box{padding:8px 14px!important;font-size:0.8rem!important;}
}
</style>

  },
];

window.PAGE_CONCEPTS = [
  { title: '进程状态机', body: `Linux 进程有 6 种核心状态：New（新建）→ Ready（就绪）→ Running（运行）→ Blocked（阻塞）→ Zombie（僵尸）→ Terminated（终止）。状态由内核调度器驱动转换。` },
  { title: 'fork() 与 COW', body: `fork() 创建子进程，父子进程共享物理内存页（写时复制）。子进程写入时才真正复制页面，避免大量内存拷贝。父进程返回子 PID，子进程返回 0。`, tag: '写时复制' },
  { title: 'exec() 替换映像', body: `exec 系列调用不创建新进程，而是将当前进程的代码段、数据段、堆栈替换为新程序。PID 不变，但进程映像完全刷新。` },
  { title: 'Zombie 与 wait()', body: `子进程调用 exit() 后进入 Zombie 状态：大部分资源释放，但 PCB（task_struct）保留退出码等待父进程读取。父进程需调用 wait()/waitpid() 收割，否则 Zombie 进程堆积泄漏 PID。`, tag: '防内存泄漏' },
  { title: '守护进程', body: `double fork + setsid()：第一次 fork 后父进程退出，子进程调用 setsid() 创建新 session 成为 session leader，再 fork 一次确保非 session leader，彻底脱离终端控制。` }
];

// ── SVG rendering ──
const svg = document.getElementById('smSvg');

function buildSVG() {
  // Arrow marker
  svg.innerHTML = `
    <defs>
      <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" class="arrowhead" id="arrFill"/>
      </marker>
      <marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" style="fill:var(--linux)"/>
      </marker>
    </defs>`;

  // Edges
  EDGES.forEach(e => {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.id = 'edge-' + e.id;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', e.path);
    path.setAttribute('class', 'edge-line');
    path.setAttribute('marker-end', 'url(#arr)');
    path.id = 'epath-' + e.id;
    g.appendChild(path);
    const lbls = e.label.split('\n');
    lbls.forEach((txt, i) => {
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x', e.lx); t.setAttribute('y', e.ly + i*11);
      t.setAttribute('class','edge-label'); t.id = 'elbl-' + e.id + '-' + i;
      t.textContent = txt;
      g.appendChild(t);
    });
    svg.appendChild(g);
  });

  // States
  STATES.forEach(s => {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','state-node'); g.id = 'state-' + s.id;
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', s.x); c.setAttribute('cy', s.y); c.setAttribute('r', s.r);
    c.setAttribute('class','state-circle'); c.id = 'scircle-' + s.id;
    g.appendChild(c);
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x', s.x); t.setAttribute('y', s.y - 6);
    t.setAttribute('class','state-label'); t.textContent = s.label;
    g.appendChild(t);
    const t2 = document.createElementNS('http://www.w3.org/2000/svg','text');
    t2.setAttribute('x', s.x); t2.setAttribute('y', s.y + 9);
    t2.setAttribute('class','state-sublabel'); t2.textContent = s.sub;
    g.appendChild(t2);
    svg.appendChild(g);
  });
}

function updateViz(step) {
  const s = STEPS[step];
  // Reset all
  document.querySelectorAll('.state-circle').forEach(el => {
    el.className.baseVal = 'state-circle';
  });
  document.querySelectorAll('.edge-line').forEach(el => {
    el.className.baseVal = 'edge-line';
    el.setAttribute('marker-end', 'url(#arr)');
    el.style.stroke = '';
  });
  document.querySelectorAll('.edge-label').forEach(el => {
    el.className.baseVal = 'edge-label';
  });
  // Active states
  (s.activeStates || []).forEach(sid => {
    const el = document.getElementById('scircle-' + sid);
    if (el) {
      el.style.fill = STATES.find(st=>st.id===sid)?.color + '33';
      el.style.stroke = STATES.find(st=>st.id===sid)?.color;
      el.style.strokeWidth = '3';
      el.style.filter = 'drop-shadow(0 0 6px ' + STATES.find(st=>st.id===sid)?.color + '66)';
    }
  });
  // Active edges
  (s.activeEdges || []).forEach(eid => {
    const el = document.getElementById('epath-' + eid);
    if (el) {
      el.style.stroke = 'var(--linux)';
      el.style.strokeWidth = '2.5';
      el.setAttribute('marker-end', 'url(#arrA)');
    }
    for (let i=0; i<3; i++) {
      const lbl = document.getElementById('elbl-' + eid + '-' + i);
      if (lbl) lbl.style.fill = 'var(--linux)';
    }
  });
  // Info panel
  document.getElementById('infoPanel').innerHTML = s.info;
}

function renderCode() {
  const lines = CODE_LINES;
  const hl = ((STEPS[cur]||{}).highlightLines||[]);
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i+1) ? ' active' : '';
    return `<div class="code-line${active}" onclick="jumpToLine(${i+1})"><span class="ln">${i+1}</span><span class="lc">${line.html||'&nbsp;'}</span></div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}

function jumpToLine(ln) {
  let t = cur, b = Infinity;
  STEPS.forEach((s,i) => {
    if ((s.highlightLines||[]).includes(ln)) {
      const d = Math.abs(i-cur); if (d<b){b=d;t=i;}
    }
  });
  cur = t; render();
}

let cur = 0, playing = false, timer = null;
const SPEED = [1800,1200,700,400,180];

function render() {
  updateViz(cur);
  renderCode();
  document.getElementById('descText').textContent = STEPS[cur].description;
  document.getElementById('stepCounter').textContent = `${cur+1} / ${STEPS.length}`;
  document.getElementById('btnPrev').disabled = cur === 0;
  document.getElementById('btnNext').disabled = cur === STEPS.length-1;
}
function play(){if(cur>=STEPS.length-1)cur=0;playing=true;document.getElementById('btnPlay').innerHTML='⏸ 暂停';tick();}
function pause(){playing=false;clearTimeout(timer);document.getElementById('btnPlay').innerHTML='▶ 播放';}
function tick(){if(!playing)return;if(cur<STEPS.length-1){cur++;render();timer=setTimeout(tick,SPEED[parseInt(document.getElementById('speedRange').value)-1]);}else pause();}
document.getElementById('btnPlay').addEventListener('click',()=>playing?pause():play());
document.getElementById('btnPrev').addEventListener('click',()=>{pause();if(cur>0){cur--;render();}});
document.getElementById('btnNext').addEventListener('click',()=>{pause();if(cur<STEPS.length-1){cur++;render();}});
document.getElementById('btnReset').addEventListener('click',()=>{pause();cur=0;render();});

buildSVG();
render();

if (window.NavTracker) NavTracker.track('进程生命周期', window.location.href, '🔄', 'Linux');
</script>
