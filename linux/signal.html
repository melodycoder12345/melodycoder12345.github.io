<span class="kw">package</span> <span class="pkg">main</span>

<span class="kw">import</span> (
  <span class="st">"context"</span>
  <span class="st">"log"</span>
  <span class="st">"os"</span>
  <span class="st">"os/signal"</span>
  <span class="st">"sync"</span>
  <span class="st">"syscall"</span>
)

<span class="kw">func</span> <span class="fn">main</span>() {
  ctx, cancel := context.<span class="fn">WithCancel</span>(
    context.<span class="fn">Background</span>())
  <span class="kw">var</span> wg sync.WaitGroup

  <span class="cm">// 注册信号监听通道</span>
  sigs := <span class="fn">make</span>(<span class="kw">chan</span> os.Signal, <span class="num">1</span>)
  signal.<span class="fn">Notify</span>(sigs,
    syscall.SIGTERM,
    syscall.SIGINT)

  <span class="kw">go func</span>() {
    sig := <-sigs
    log.<span class="fn">Printf</span>(<span class="st">"received %v"</span>, sig)
    <span class="fn">cancel</span>()  <span class="cm">// 广播取消给所有 goroutine</span>
    wg.<span class="fn">Wait</span>() <span class="cm">// 等待清理完成</span>
    os.<span class="fn">Exit</span>(<span class="num">0</span>)
  }()

  wg.<span class="fn">Add</span>(<span class="num">1</span>)
  <span class="kw">go</span> <span class="fn">worker</span>(ctx, &wg)

  <span class="kw">select</span> {} <span class="cm">// block forever</span>
}

<span class="cm">// async-signal-safe 限制：</span>
<span class="cm">// signal handler 中只能调用可重入函数</span>
<span class="cm">// malloc/printf/lock 均不安全</span>
<span class="cm">// Go runtime 会自动处理信号栈切换</span>`,

<span class="kw">func</span> <span class="fn">main</span>() {

  sigs := <span class="fn">make</span>(<span class="kw">chan</span> os.Signal, <span class="num">1</span>)

  <span class="kw">var</span> p *<span class="id">int</span> = <span class="num">nil</span>

<span class="cm">// Go runtime 实际处理路径：</span>

)

<span class="kw">func</span> <span class="fn">main</span>() {
  <span class="cm">// 创建子进程</span>
  cmd := exec.<span class="fn">Command</span>(<span class="st">"sleep"</span>, <span class="st">"2"</span>)
  cmd.<span class="fn">Start</span>()
  childPid := cmd.Process.Pid

  <span class="cm">// 监听 SIGCHLD</span>
  sigs := <span class="fn">make</span>(<span class="kw">chan</span> os.Signal, <span class="num">1</span>)
  signal.<span class="fn">Notify</span>(sigs, syscall.SIGCHLD)

  <span class="kw">go func</span>() {
    <-sigs
    <span class="cm">// waitpid 回收子进程，释放 task_struct</span>
    <span class="kw">var</span> ws syscall.WaitStatus
    pid, _ := syscall.<span class="fn">Wait4</span>(
      childPid, &ws, <span class="num">0</span>, <span class="num">nil</span>)
    log.<span class="fn">Printf</span>(
      <span class="st">"child %d exited: %v"</span>, pid, ws)
  }()

  <span class="cm">// 不调用 waitpid：子进程变为僵尸进程</span>
  <span class="cm">// ps 输出显示为 Z 状态（zombie）</span>
  <span class="cm">// 僵尸占用 PID 和 task_struct，不释放</span>
  os.<span class="fn">Exit</span>(<span class="num">0</span>)
}`,
  steps:[
    {title:"父进程 fork() 创建子进程",desc:"父进程调用 fork()，内核创建子进程副本，两者并发运行。父进程注册 SIGCHLD handler 等待子进程退出。",kind:"normal",src:"父进程",srcState:"running",proc:"Parent Running",procState:"Running",handler:"SIGCHLD Handler",handlerState:"waiting",kernel:"idle",kernelState2:"pending: none",arrows:[]},
    {title:"子进程完成工作并调用 exit()",desc:"子进程完成任务，调用 exit()，内核保留其 task_struct（zombie 状态），等待父进程用 waitpid() 回收。",kind:"normal",src:"子进程",srcState:"exit(0)",proc:"Parent Running",procState:"Running",handler:"SIGCHLD Handler",handlerState:"waiting",kernel:"child→zombie",kernelState2:"zombie: child PID",arrows:[0,1]},
    {title:"内核向父进程发送 SIGCHLD",desc:"子进程进入 zombie 状态时，内核向父进程发送 SIGCHLD，通知子进程状态发生变化（退出或停止）。",kind:"normal",src:"子进程",srcState:"zombie",proc:"Recv SIGCHLD",procState:"In Handler",handler:"SIGCHLD Handler",handlerState:"running",kernel:"send SIGCHLD",kernelState2:"pending: SIGCHLD",arrows:[1,2]},
    {title:"waitpid() 回收资源：僵尸消除",desc:"父进程在 handler 中调用 wait4(childPid)，内核释放子进程的 task_struct，PID 可复用，僵尸彻底清除。",kind:"recovery",src:"子进程",srcState:"reaped",proc:"Parent Running",procState:"Running",handler:"wait4() done",handlerState:"completed",kernel:"idle",kernelState2:"zombie cleared",arrows:[3]}
  ]
}];

let sc=0,idx=0,timer=null;
const stepList=document.getElementById('stepList'),descEl=document.getElementById('stepDesc'),badgeEl=document.getElementById('stepBadge');

function applyState(s){
  const set=(id,txt)=>{const el=document.getElementById(id);if(el)el.textContent=txt||'';};
  const cls=(id,add,rem)=>{const el=document.getElementById(id);if(el){rem.forEach(c=>el.classList.remove(c));add.forEach(c=>el.classList.add(c));}};
  set('srcTitle',s.src||'');set('srcState',s.srcState||'');
  set('procState',s.procState||'');set('procPid','PID: 1234');
  set('handlerTitle',s.handler||'');set('handlerState',s.handlerState||'');
  set('kernelState',s.kernelState||'');set('kernelState2',s.kernelState2||'');
  // proc box state
  const bProc=document.getElementById('bProc');
  if(bProc){bProc.classList.remove('active','fail');if(s.procState&&s.procState!=='idle'){if(s.kind==='failure'||s.procState==='Terminated'||s.procState==='Faulting'||s.procState==='signal 11')bProc.classList.add('fail');else bProc.classList.add('active');}}
  const bKernel=document.getElementById('bKernel');
  if(bKernel){bKernel.classList.remove('active');if(s.kernelState&&s.kernelState!=='idle')bKernel.classList.add('active');}
  const bHandler=document.getElementById('bHandler');
  if(bHandler){bHandler.classList.remove('active');if(s.handlerState&&s.handlerState!=='not invoked'&&s.handlerState!=='SIG_DFL'&&s.handlerState!=='waiting')bHandler.classList.add('active');}
  // arrows
  ['a0','a1','a2','a3'].forEach((id,i)=>{
    const el=document.getElementById(id),ll=document.getElementById('l'+i);
    const on=(s.arrows||[]).includes(i);
    if(el)el.style.opacity=on?'1':'0';
    if(ll)ll.style.opacity=on?'1':'0';
  });
}

function loadScenario(s){
  sc=s;idx=0;pause();
  document.querySelectorAll('.sc-tab').forEach((t,i)=>t.classList.toggle('active',i===s));
  document.getElementById('codeContent').innerHTML=SCENARIOS[s].code;
  document.getElementById('codeTitle').textContent=SCENARIOS[s].codeTitle;
  drawSteps();render();
}

function drawSteps(){
  const steps=SCENARIOS[sc].steps;
  stepList.innerHTML=steps.map((s,i)=>`<button class="step-item" data-i="${i}"><b>Step ${i+1}</b>${s.title}</button>`).join('');
  stepList.querySelectorAll('button').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;pause();render();});
}

function render(){
  const s=SCENARIOS[sc].steps[idx];
  descEl.textContent=s.desc;badgeEl.textContent=s.kind;badgeEl.className='step-badge '+s.kind;
  stepList.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===idx));
  applyState(s);
  document.getElementById('btnPrev').disabled=idx===0;
  document.getElementById('btnNext').disabled=idx===SCENARIOS[sc].steps.length-1;
}

function next(){const len=SCENARIOS[sc].steps.length;idx=Math.min(len-1,idx+1);render();if(idx===len-1)pause();}
function prev(){idx=Math.max(0,idx-1);render();}
function reset(){idx=0;pause();render();}
function pause(){if(timer)clearInterval(timer);timer=null;document.getElementById('btnPlay').textContent='播放';}
const SPEED = [2000,1200,700,350,120];
const SPEED_LABELS = ['极慢','慢','中速','快','极快'];
const speedRange = document.getElementById('speedRange');
const speedVal = document.getElementById('speedVal');
function updateSpeedLabel(){speedVal.textContent=SPEED_LABELS[parseInt(speedRange.value)-1];}
speedRange.addEventListener('input',updateSpeedLabel);
updateSpeedLabel();
function toggle(){if(timer){pause();return;}document.getElementById('btnPlay').textContent='暂停';timer=setInterval(next,SPEED[parseInt(speedRange.value)-1]);}

document.querySelectorAll('.sc-tab').forEach((t,i)=>t.onclick=()=>loadScenario(i));
document.getElementById('btnNext').onclick=next;document.getElementById('btnPrev').onclick=prev;
document.getElementById('btnReset').onclick=reset;document.getElementById('btnPlay').onclick=toggle;
loadScenario(0);
if(window.NavTracker)NavTracker.track('信号（Signal）',window.location.href,'⚡','Linux');
</script>
</body>
