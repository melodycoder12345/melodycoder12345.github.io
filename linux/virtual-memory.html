.ln{min-width:48px;padding:0 12px 0 16px;color:#4b5563;text-align:right;user-select:none;flex-shrink:0;font-size:0.78rem;}

.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.num{color:#79c0ff;}.pkg{color:#ffa657;}.cm{color:#8b949e;font-style:italic;}
.controls{display:flex;align-items:center;gap:10px;padding:12px 24px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;}

.btn:hover{background:rgba(255,255,255,0.12);}.btn.primary{background:rgba(110,231,183,0.15);border-color:rgba(110,231,183,0.3);color:var(--linux);}

.addr-block.kernel{background:rgba(251,146,60,0.08);border-color:rgba(251,146,60,0.2);color:var(--orange);}
.addr-block.stack{background:rgba(192,132,252,0.08);border-color:rgba(192,132,252,0.2);color:var(--purple);}

.addr-block.heap{background:rgba(74,222,128,0.08);border-color:rgba(74,222,128,0.2);color:var(--green);}
.addr-block.bss{background:rgba(251,191,36,0.08);border-color:rgba(251,191,36,0.2);color:var(--yellow);}
.addr-block.data{background:rgba(110,231,183,0.08);border-color:rgba(110,231,183,0.25);color:var(--linux);}
.addr-block.text{background:rgba(45,212,191,0.08);border-color:rgba(45,212,191,0.2);color:var(--teal);}

.addr-block.active{box-shadow:0 0 12px currentColor;border-width:2px;}

.ptable{margin-top:4px;}
.pt-row{display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:5px;border:1px solid var(--border);margin-bottom:3px;font-size:0.75rem;font-family:monospace;transition:all 0.3s;}
.pt-row.active{background:rgba(110,231,183,0.1);border-color:var(--linux);}
.pt-vaddr{color:var(--blue);flex:1;}
.pt-arrow{color:var(--dim2);}
.pt-paddr{color:var(--green);flex:1;}
.pt-flags{color:var(--dim2);font-size:0.7rem;}

.tlb-box{padding:12px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.02);margin-top:8px;}
.tlb-title{font-size:0.72rem;font-weight:600;color:var(--dim2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
.tlb-entry{display:flex;gap:6px;padding:4px 8px;border-radius:4px;border:1px solid var(--border);margin-bottom:3px;font-size:0.74rem;font-family:monospace;transition:all 0.3s;}
.tlb-entry.hit{background:rgba(74,222,128,0.1);border-color:var(--green);}
.tlb-entry.miss{background:rgba(248,113,113,0.1);border-color:var(--red);}

.addr-parse{display:flex;align-items:center;gap:4px;margin-top:8px;font-family:monospace;font-size:0.8rem;justify-content:center;flex-wrap:wrap;}
.ap-seg{padding:4px 10px;border-radius:4px;border:1px solid;transition:all 0.3s;}
.ap-seg.pdi{background:rgba(110,231,183,0.1);border-color:var(--linux);color:var(--linux);}
.ap-seg.pti{background:rgba(56,189,248,0.1);border-color:var(--blue);color:var(--blue);}
.ap-seg.off{background:rgba(74,222,128,0.1);border-color:var(--green);color:var(--green);}
.ap-seg.active{box-shadow:0 0 8px currentColor;}
.ap-label{font-size:0.68rem;color:var(--dim2);text-align:center;}

@media(max-width:768px){

  .viz-area{padding:12px!important;}

  .controls{flex-wrap:wrap!important;padding:10px 14px!important;gap:6px!important;height:auto!important;}
  .btn{padding:6px 10px!important;font-size:0.8rem!important;}
  .speed-wrap{margin-left:0!important;width:100%;}
  .vm-layout{flex-direction:column;gap:10px;}
}

const VS_SEGMENTS = [

  {

  { title: '虚拟地址空间', body: `每个进程拥有独立的虚拟地址空间（32 位 4GB，64 位理论 128TB），内核空间和用户空间隔离。进程之间互不干扰，提高系统安全性与稳定性。` },
  { title: '页表与分页', body: `虚拟地址通过多级页表（x86-64 为 4 级）翻译为物理地址。每页 4KB，按需分配（缺页中断时才真正分配物理页），减少内存浪费。`, tag: '4KB/页' },
  { title: 'TLB 加速', body: `TLB（Translation Lookaside Buffer）是页表的硬件缓存。命中时地址翻译只需 1 个周期；未命中则需 Page Table Walk（数十周期）。进程切换时 TLB 刷新。`, tag: '硬件缓存' },

function buildViz(step) {
  const s = STEPS[step];
  // Address space layout
  let vsHtml = VS_SEGMENTS.map(seg => {
    const active = s.highlight.includes(seg.cls) ? ' active' : '';
    return `<div class="addr-block ${seg.cls}${active}">
      <strong>${seg.label}</strong>${seg.addr ? `<br><span style="font-size:0.7rem;opacity:0.7">${seg.addr}</span>` : ''}
    </div>`;
  }).join('');
  document.getElementById('vsLayout').innerHTML = vsHtml;

  // Page table entries
  let ptHtml = '<div class="ptable">';
  if (s.ptEntries.length === 0) {
    ptHtml += `<div style="font-size:0.78rem;color:var(--dim2);text-align:center;padding:12px">页表项将在演示中显示</div>`;
  } else {
    s.ptEntries.forEach(e => {
      const stc = e.status === 'present' ? 'color:var(--green)' :
                  e.status === 'miss' ? 'color:var(--red)' :
                  e.status === 'fault' ? 'color:var(--red)' :
                  e.status === 'cow' ? 'color:var(--yellow)' :
                  e.status === 'mmap' ? 'color:var(--blue)' : 'color:var(--dim)';
      const tlbMark = e.tlb === 'hit' ? ' 🟢TLB' : e.tlb === 'miss' ? ' 🔴Miss' : '';
      ptHtml += `<div class="pt-row${e.status === 'present' || e.status === 'cow' || e.status === 'mmap' ? ' active' : ''}">
        <span class="pt-vaddr">${e.va}</span>
        <span class="pt-arrow">→</span>
        <span class="pt-paddr">${e.pa}</span>
        <span class="pt-flags" style="${stc}">${e.flags}${tlbMark}</span>
      </div>`;
    });
  }
  ptHtml += '</div>';
  document.getElementById('ptLayout').innerHTML = ptHtml;

  // TLB box
  let tlbHtml = '';
  if (s.tlbState !== 'none') {
    tlbHtml = `<div class="tlb-box">
      <div class="tlb-title">TLB (Translation Lookaside Buffer)</div>
      ${s.ptEntries.map(e => `<div class="tlb-entry ${e.tlb || ''}">
        <span style="color:var(--dim2)">VPN</span>
        <span style="color:var(--blue)">${e.va.substring(0,12)}...</span>
        <span style="color:var(--dim2)">→</span>
        <span style="color:var(--green)">${e.pa}</span>
        <span style="color:${s.tlbState==='hit'?'var(--green)':'var(--red)'}">${s.tlbState==='hit'?'HIT':'MISS'}</span>
      </div>`).join('')}
    </div>`;
  }
  document.getElementById('tlbBox').innerHTML = tlbHtml;

  // Address bit parse
  const parseEl = document.getElementById('addrParse');
  if (s.showAddrParse) {
    parseEl.style.display = 'block';
    document.getElementById('addrBits').innerHTML = `
      <span class="ap-seg pdi active">PGD<br>9 bits</span>
      <span style="color:var(--dim2)">|</span>
      <span class="ap-seg pti active">PUD+PMD+PT<br>27 bits</span>
      <span style="color:var(--dim2)">|</span>
      <span class="ap-seg off active">Page Offset<br>12 bits</span>`;
    document.getElementById('addrLabels').innerHTML = `
      <span style="font-size:0.68rem;color:var(--linux)">顶级目录索引</span>
      <span>&nbsp;&nbsp;&nbsp;</span>
      <span style="font-size:0.68rem;color:var(--blue)">页表多级索引</span>
      <span>&nbsp;&nbsp;</span>
      <span style="font-size:0.68rem;color:var(--green)">4KB 页内偏移</span>`;
  } else {
    parseEl.style.display = 'none';
  }
}

function renderCode() {
  const lines = CODE_LINES;
  const hl = ((STEPS[cur]||{}).highlightLines||[]);
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i+1) ? ' active' : '';
    return `<div class="code-line${active}" onclick="jumpToLine(${i+1})"><span class="ln">${i+1}</span><span class="lc">${line.html||'&nbsp;'}</span></div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}

function jumpToLine(ln) {
  let t = cur, b = Infinity;
  STEPS.forEach((s,i) => {
    if ((s.highlightLines||[]).includes(ln)) { const d = Math.abs(i-cur); if(d<b){b=d;t=i;} }
  });
  cur = t; render();
}

let cur = 0, playing = false, timer = null;
const SPEED = [2000,1200,700,350,120];
const SPEED_LABELS = ['极慢','慢','中速','快','极快'];

function render() {
  buildViz(cur);
  renderCode();
  document.getElementById('descText').textContent = STEPS[cur].description;
  document.getElementById('stepCounter').textContent = `${cur+1} / ${STEPS.length}`;
  document.getElementById('btnPrev').disabled = cur === 0;
  document.getElementById('btnNext').disabled = cur === STEPS.length-1;
}
function play(){if(cur>=STEPS.length-1)cur=0;playing=true;document.getElementById('btnPlay').innerHTML='⏸ 暂停';tick();}
function pause(){playing=false;clearTimeout(timer);document.getElementById('btnPlay').innerHTML='▶ 播放';}
function tick(){if(!playing)return;if(cur<STEPS.length-1){cur++;render();timer=setTimeout(tick,SPEED[parseInt(document.getElementById('speedRange').value)-1]);}else pause();}
document.getElementById('btnPlay').addEventListener('click',()=>playing?pause():play());
document.getElementById('btnPrev').addEventListener('click',()=>{pause();if(cur>0){cur--;render();}});
document.getElementById('btnNext').addEventListener('click',()=>{pause();if(cur<STEPS.length-1){cur++;render();}});
document.getElementById('btnReset').addEventListener('click',()=>{pause();cur=0;render();});

render();
if (window.NavTracker) NavTracker.track('虚拟内存', window.location.href, '🗺️', 'Linux');
</script>
