<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux IO 模型 - Linux</title>
<style>
:root{
  --bg:#0f172a;--panel:#1e293b;--panel2:#0d1117;
  --border:#334155;--text:#e2e8f0;--dim:#94a3b8;--dim2:#64748b;
  --blue:#38bdf8;--yellow:#fbbf24;--orange:#fb923c;
  --green:#4ade80;--purple:#c084fc;--red:#f87171;--teal:#2dd4bf;
  --linux:#6ee7b7;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
nav{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;flex-wrap:wrap;}
.back-btn{color:var(--dim);text-decoration:none;font-size:0.9rem;}.back-btn:hover{color:var(--text);}
nav h1{font-size:1.1rem;font-weight:600;}
.badge{font-size:0.72rem;padding:2px 8px;border-radius:100px;font-family:monospace;font-weight:500;}
.complexity{margin-left:auto;display:flex;gap:8px;align-items:center;}
.main{display:flex;flex:1;overflow:hidden;}
.viz-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;}
.viz-area{flex:1;overflow:auto;padding:16px 20px;}
.desc-box{padding:10px 24px;background:rgba(255,255,255,0.03);border-top:1px solid var(--border);font-size:0.88rem;color:var(--dim);min-height:44px;display:flex;align-items:center;gap:12px;}
.step-counter{margin-left:auto;font-size:0.8rem;color:var(--dim);font-family:monospace;white-space:nowrap;}
.code-panel{width:45%;min-width:380px;display:flex;flex-direction:column;overflow:hidden;}
.code-panel-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:0.85rem;color:var(--dim);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.code-dot{width:10px;height:10px;border-radius:50%;}
.code-body{flex:1;overflow-y:auto;padding:16px 0;background:#0d1117;}
.code-body::-webkit-scrollbar{width:6px;}.code-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.code-line{display:flex;align-items:stretch;padding:1px 0;cursor:pointer;transition:background 0.15s;font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.6;}
.code-line:hover{background:rgba(255,255,255,0.04);}.code-line.active{background:rgba(110,231,183,0.12);}.code-line.active .ln{color:var(--linux);}
.ln{min-width:48px;padding:0 12px 0 16px;color:#4b5563;text-align:right;user-select:none;flex-shrink:0;font-size:0.78rem;}
.lc{padding:0 16px 0 4px;flex:1;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.num{color:#79c0ff;}.pkg{color:#ffa657;}.cm{color:#8b949e;font-style:italic;}
.controls{display:flex;align-items:center;gap:10px;padding:12px 24px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.btn{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:7px;cursor:pointer;font-size:0.85rem;transition:all 0.15s;font-family:inherit;}
.btn:hover{background:rgba(255,255,255,0.12);}.btn.primary{background:rgba(110,231,183,0.15);border-color:rgba(110,231,183,0.3);color:var(--linux);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.speed-wrap{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:0.8rem;color:var(--dim);}
input[type=range]{-webkit-appearance:none;width:90px;height:4px;background:var(--border);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--linux);cursor:pointer;}

/* IO timeline styles */
.io-diagram{width:100%;}
.io-title-row{display:flex;align-items:center;margin-bottom:12px;}
.io-title{font-size:0.85rem;font-weight:600;color:var(--text);}
.io-legend{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap;}
.io-leg{display:flex;align-items:center;gap:5px;font-size:0.72rem;color:var(--dim);}
.io-leg-dot{width:10px;height:10px;border-radius:3px;}

.io-model{margin-bottom:10px;border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:all 0.3s;}
.io-model.active{border-color:var(--linux);box-shadow:0 0 12px rgba(110,231,183,0.2);}
.io-model.faded{opacity:0.35;}
.io-model-header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(255,255,255,0.03);border-bottom:1px solid var(--border);}
.io-model-name{font-size:0.85rem;font-weight:600;}
.io-model-tag{font-size:0.68rem;padding:1px 7px;border-radius:3px;font-family:monospace;}
.io-timeline{padding:10px 14px;display:flex;align-items:center;gap:0;position:relative;height:44px;}
.io-phase{height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:500;transition:all 0.3s;white-space:nowrap;overflow:hidden;padding:0 4px;flex-shrink:0;}
.phase-wait{background:rgba(248,113,113,0.2);border:1px solid rgba(248,113,113,0.35);color:var(--red);}
.phase-blocked{background:rgba(192,132,252,0.2);border:1px solid rgba(192,132,252,0.35);color:var(--purple);}
.phase-poll{background:rgba(251,191,36,0.2);border:1px solid rgba(251,191,36,0.35);color:var(--yellow);}
.phase-select{background:rgba(56,189,248,0.2);border:1px solid rgba(56,189,248,0.35);color:var(--blue);}
.phase-epoll{background:rgba(110,231,183,0.2);border:1px solid rgba(110,231,183,0.35);color:var(--linux);}
.phase-kernel{background:rgba(251,146,60,0.2);border:1px solid rgba(251,146,60,0.35);color:var(--orange);}
.phase-copy{background:rgba(74,222,128,0.2);border:1px solid rgba(74,222,128,0.35);color:var(--green);}
.phase-done{background:rgba(45,212,191,0.2);border:1px solid rgba(45,212,191,0.35);color:var(--teal);}
.phase-free{background:rgba(255,255,255,0.03);border:1px dashed rgba(255,255,255,0.1);color:var(--dim2);}
.phase-signal{background:rgba(192,132,252,0.15);border:1px solid rgba(192,132,252,0.3);color:var(--purple);}
.timeline-arrow{font-size:0.8rem;color:var(--dim2);margin:0 2px;flex-shrink:0;}

/* comparison table */
.cmp-table{width:100%;border-collapse:collapse;font-size:0.78rem;margin-top:10px;}
.cmp-table th{padding:6px 10px;text-align:left;color:var(--dim2);font-size:0.7rem;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:0.04em;}
.cmp-table td{padding:7px 10px;border-bottom:1px solid rgba(51,65,85,0.3);}
.cmp-table tr:last-child td{border-bottom:none;}
.cmp-table tr:hover td{background:rgba(255,255,255,0.02);}

@media(max-width:768px){
  body{height:auto!important;min-height:100vh;overflow-y:auto!important;}
  nav{flex-wrap:wrap;padding:10px 16px;gap:6px;}
  nav h1{font-size:1rem;flex:1;}
  .complexity{margin-left:0!important;width:100%;}
  .main{flex-direction:column!important;overflow:visible!important;height:auto!important;flex:none!important;}
  .viz-panel{border-right:none!important;border-bottom:1px solid var(--border);height:400px!important;min-height:400px!important;flex:none!important;overflow:hidden;}
  .code-panel{width:100%!important;min-width:unset!important;height:320px!important;flex:none!important;}
  .controls{flex-wrap:wrap!important;padding:10px 14px!important;gap:6px!important;height:auto!important;}
  .btn{padding:6px 10px!important;font-size:0.8rem!important;}
  .speed-wrap{margin-left:0!important;width:100%;}
}
</style>

<script src="../concept.js"></script>

function buildModels(activeId, highlightIds) {
  const container = document.getElementById('ioModels');
  container.innerHTML = IO_MODELS.map(m => {
    const isActive = m.id === activeId;
    const isHighlighted = highlightIds.includes(m.id);
    const isFaded = highlightIds.length > 0 && !isHighlighted;
    const cls = isActive ? 'io-model active' : isFaded ? 'io-model faded' : 'io-model';
    const phases = m.timeline.map(p =>
      p.hidden ? '' :
      `<div class="io-phase ${p.cls}" style="width:${p.w}%">${p.label}</div>`
    ).join('<span class="timeline-arrow">→</span>');
    return `<div class="${cls}">
      <div class="io-model-header">
        <span class="io-model-name">${m.name}</span>
        <span class="io-model-tag" style="background:rgba(255,255,255,0.05);color:${m.tagColor}">${m.tag}</span>
      </div>
      <div class="io-timeline">${phases}</div>
    </div>`;
  }).join('');
}

function renderCode() {
  const lines = CODE_LINES;
  const hl = ((STEPS[cur]||{}).highlightLines||[]);
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i+1) ? ' active' : '';
    return `<div class="code-line${active}" onclick="jumpToLine(${i+1})"><span class="ln">${i+1}</span><span class="lc">${line.html||'&nbsp;'}</span></div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}

function jumpToLine(ln) {
  let t = cur, b = Infinity;
  STEPS.forEach((s,i) => {
    if ((s.highlightLines||[]).includes(ln)) { const d = Math.abs(i-cur); if(d<b){b=d;t=i;} }
  });
  cur = t; render();
}

let cur = 0, playing = false, timer = null;
const SPEED = [1800,1200,700,400,180];

function render() {
  const s = STEPS[cur];
  buildModels(s.active, s.highlight);
  renderCode();
  document.getElementById('descText').textContent = s.description;
  document.getElementById('stepCounter').textContent = `${cur+1} / ${STEPS.length}`;
  document.getElementById('btnPrev').disabled = cur === 0;
  document.getElementById('btnNext').disabled = cur === STEPS.length-1;
}
function play(){if(cur>=STEPS.length-1)cur=0;playing=true;document.getElementById('btnPlay').innerHTML='⏸ 暂停';tick();}
function pause(){playing=false;clearTimeout(timer);document.getElementById('btnPlay').innerHTML='▶ 播放';}
function tick(){if(!playing)return;if(cur<STEPS.length-1){cur++;render();timer=setTimeout(tick,SPEED[parseInt(document.getElementById('speedRange').value)-1]);}else pause();}
document.getElementById('btnPlay').addEventListener('click',()=>playing?pause():play());
document.getElementById('btnPrev').addEventListener('click',()=>{pause();if(cur>0){cur--;render();}});
document.getElementById('btnNext').addEventListener('click',()=>{pause();if(cur<STEPS.length-1){cur++;render();}});
document.getElementById('btnReset').addEventListener('click',()=>{pause();cur=0;render();});

render();
if (window.NavTracker) NavTracker.track('IO 模型', window.location.href, '⚡', 'Linux');
</script>
