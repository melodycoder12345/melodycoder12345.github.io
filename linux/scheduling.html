<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#0d1117;--border:#334155;--text:#e2e8f0;--dim:#94a3b8;--blue:#38bdf8;--yellow:#fbbf24;--orange:#fb923c;--green:#4ade80;--purple:#c084fc;--red:#f87171;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
nav{display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.back-btn{color:var(--dim);text-decoration:none;font-size:0.9rem;}.back-btn:hover{color:var(--text);}
nav h1{font-size:1.2rem;font-weight:600;}.tags{margin-left:auto;display:flex;gap:8px;}
.badge{font-size:0.75rem;padding:3px 10px;border-radius:100px;font-family:monospace;}
.main{display:flex;flex:1;overflow:hidden;}
.viz-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;}
.viz-area{flex:1;overflow:hidden;background:var(--panel2);}
.desc-box{padding:12px 24px;background:rgba(255,255,255,0.03);border-top:1px solid var(--border);font-size:0.88rem;color:var(--dim);min-height:44px;display:flex;align-items:center;}
.step-counter{margin-left:auto;font-size:0.8rem;color:var(--dim);font-family:monospace;white-space:nowrap;}
.code-panel{width:45%;min-width:380px;display:flex;flex-direction:column;overflow:hidden;}
.code-panel-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:0.85rem;color:var(--dim);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.code-dot{width:10px;height:10px;border-radius:50%;}
.code-body{flex:1;overflow-y:auto;padding:16px 0;background:#0d1117;}
.code-body::-webkit-scrollbar{width:6px;}.code-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.code-line{display:flex;align-items:stretch;padding:1px 0;cursor:pointer;transition:background .15s;font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.6;}
.code-line:hover{background:rgba(255,255,255,.04);}.code-line.active{background:rgba(251,191,36,.12);}.code-line.active .ln{color:var(--yellow);}
.ln{min-width:48px;padding:0 12px 0 16px;color:#4b5563;text-align:right;user-select:none;flex-shrink:0;font-size:0.78rem;}
.lc{padding:0 16px 0 4px;flex:1;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.num{color:#79c0ff;}.pkg{color:#ffa657;}.cm{color:#8b949e;font-style:italic;}
.controls{display:flex;align-items:center;gap:10px;padding:12px 24px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.btn{background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:7px;cursor:pointer;font-size:.85rem;transition:all .15s;}
.btn:hover{background:rgba(255,255,255,.12);}.btn.primary{background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.3);color:var(--blue);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.speed-wrap{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:.8rem;color:var(--dim);}
input[type=range]{-webkit-appearance:none;width:90px;height:4px;background:var(--border);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--blue);cursor:pointer;}
@media(max-width:768px){
  body{height:auto!important;min-height:100vh;overflow-y:auto!important;}
  nav{flex-wrap:wrap;padding:10px 16px;gap:6px;height:auto!important;}
  nav h1{font-size:1rem;flex:1;}.tags{margin-left:0!important;width:100%;order:3;margin-top:4px;}
  .main{flex-direction:column!important;overflow:visible!important;height:auto!important;flex:none!important;}
  .viz-panel{border-right:none!important;border-bottom:1px solid var(--border);height:320px!important;flex:none!important;}
  .code-panel{width:100%!important;min-width:unset!important;height:340px!important;flex:none!important;}
  .code-line{font-size:.76rem!important;}.ln{min-width:36px!important;padding:0 8px!important;}
  .controls{flex-wrap:wrap!important;padding:10px 14px!important;gap:6px!important;height:auto!important;}
  .btn{padding:6px 10px!important;font-size:.8rem!important;}.speed-wrap{margin-left:0!important;width:100%;}
  .desc-box{padding:8px 14px!important;font-size:.8rem!important;}
}

<body>
<nav>
  <a href="index.html" class="back-btn">← 返回</a>
  <h1>Linux 进程调度 CFS</h1>
  <div class="tags">
    <span class="badge" style="background:rgba(110,231,183,.15);color:#6ee7b7">CFS</span>
    <span class="badge" style="background:rgba(192,132,252,.15);color:#c084fc">红黑树</span>
    <span class="badge" style="background:rgba(56,189,248,.15);color:#38bdf8">vruntime</span>
  </div>
</nav>
<div class="main">
  <div class="viz-panel">
    <div class="viz-area">
      <svg width="100%" height="100%" viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet">
        <!-- Red-black tree visualization -->
        <!-- Root node -->
        <circle id="n0" cx="380" cy="70" r="26" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
        <text x="380" y="66" text-anchor="middle" font-size="9" fill="#c084fc" font-family="monospace" id="t0n">P2</text>
        <text x="380" y="80" text-anchor="middle" font-size="8" fill="#fbbf24" font-family="monospace" id="t0v">vr=10</text>

        <!-- Left child -->
        <line x1="358" y1="92" x2="268" y2="148" stroke="#334155" stroke-width="1.5" id="lL"/>
        <circle id="n1" cx="250" cy="163" r="26" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
        <text x="250" y="159" text-anchor="middle" font-size="9" fill="#4ade80" font-family="monospace" id="t1n">P1</text>
        <text x="250" y="173" text-anchor="middle" font-size="8" fill="#fbbf24" font-family="monospace" id="t1v">vr=5</text>

        <!-- Right child -->
        <line x1="402" y1="92" x2="492" y2="148" stroke="#334155" stroke-width="1.5" id="lR"/>
        <circle id="n2" cx="510" cy="163" r="26" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
        <text x="510" y="159" text-anchor="middle" font-size="9" fill="#f87171" font-family="monospace" id="t2n">P3</text>
        <text x="510" y="173" text-anchor="middle" font-size="8" fill="#fbbf24" font-family="monospace" id="t2v">vr=18</text>

        <!-- Leftmost pointer -->
        <rect id="rLeftmost" x="180" y="185" width="140" height="22" rx="6" fill="rgba(56,189,248,.1)" stroke="rgba(56,189,248,.4)" stroke-width="1.5" opacity="0"/>
        <text id="tLeftmost" x="250" y="200" text-anchor="middle" font-size="10" fill="#38bdf8" font-family="monospace" opacity="0">← 最左节点 (最小 vruntime)</text>

        <!-- CPU execution bar -->
        <rect x="50" y="240" width="660" height="50" rx="8" fill="rgba(255,255,255,.02)" stroke="#334155" stroke-width="1"/>
        <text x="70" y="261" font-size="10" fill="#64748b" font-family="monospace">CPU 时间线:</text>
        <rect id="rP1bar" x="130" y="247" width="0" height="36" rx="4" fill="rgba(74,222,128,.4)"/>
        <rect id="rP2bar" x="130" y="247" width="0" height="36" rx="4" fill="rgba(192,132,252,.4)"/>
        <rect id="rP3bar" x="130" y="247" width="0" height="36" rx="4" fill="rgba(248,113,113,.4)"/>
        <text id="tCPUBar" x="380" y="268" text-anchor="middle" font-size="9" fill="#64748b" font-family="monospace">等待调度...</text>

        <!-- vruntime labels -->
        <text x="380" y="315" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="monospace" id="tVrInfo">min_vruntime: 0 | 当前运行: -</text>
        <text id="tStatus" x="380" y="335" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="'Segoe UI',sans-serif">点击播放，了解 CFS 调度算法</text>
      </svg>
    </div>
    <div class="desc-box">
      <span id="descText">CFS 完全公平调度器：维护按 virtual_runtime 排序的红黑树，每次选最左节点（vruntime 最小）运行</span>
      <span class="step-counter" id="stepCounter">0 / 0</span>
    </div>
  </div>
  <div class="code-panel">
    <div class="code-panel-header">
      <div class="code-dot" style="background:#6ee7b7"></div>
      <span data-base="cfs_sched">cfs_sched.go</span>
    </div>
    <div class="code-body" id="codeBody"></div>
  </div>
</div>
<div class="controls">
  <button class="btn" onclick="reset()">⏮ 重置</button>
  <button class="btn" id="btnPrev" onclick="prev()">◀ 上一步</button>
  <button class="btn primary" id="btnPlay" onclick="togglePlay()">▶ 播放</button>
  <button class="btn" id="btnNext" onclick="next()">下一步 ▶</button>
  <div class="speed-wrap"><span>🐢</span><input type="range" id="speedSlider" min="1" max="5" value="3"><span>🐇</span></div>
</div>
<script>
window.PAGE_CONCEPTS = [
  { title: 'CFS 完全公平调度器', body: `Linux 默认调度算法（2.6.23+）。核心思想：让所有可运行进程"公平"地使用 CPU。通过 virtual runtime（vruntime）衡量进程已使用的加权 CPU 时间。` },
  { title: 'EEVDF 更新', body: `Linux 6.6 起主线调度器逐步引入 EEVDF（Earliest Eligible Virtual Deadline First）。CFS 的 vruntime 仍是理解公平调度的基础，但现代内核还会结合虚拟截止时间改善延迟。`, tag: 'Linux 6.6+' },
  { title: 'virtual runtime', body: `vruntime = 实际运行时间 × (NICE_0_LOAD / 进程权重)。优先级（nice）越低权重越大，vruntime 增长越慢，获得更多 CPU 时间。CFS 始终调度 vruntime 最小的进程。` },
  { title: '红黑树调度队列', body: `就绪进程按 vruntime 存入红黑树，最左节点（vruntime 最小）就是下一个被调度的进程。插入/删除/查找均为 O(log N)。`, tag: 'O(log N)' },
  { title: '调度延迟 & 时间片', body: `sched_latency_ns（默认 6ms）：所有就绪进程轮流执行一遍的时间窗口。进程数多时每个进程时间片 = latency/N（有最小保证 min_granularity_ns=0.75ms）。` },
  { title: '组调度 & 多队列', body: `cgroups 可按组（容器、用户）限制 CPU 份额。SMP 系统每个 CPU 有独立运行队列，内核定期做负载均衡（load balance），避免 CPU 空闲而其他 CPU 过载。`, tag: 'cgroups' }
];

const CODE_LINES=[
  {html:'<span class="kw">package</span> main'},
  {html:'<span class="kw">import</span> (<span class="st">"fmt"</span>; <span class="st">"os"</span>; <span class="st">"runtime"</span>; <span class="st">"syscall"</span>)'},
  {html:''},
  {html:'<span class="cm">// CFS 核心: virtual_runtime = real_time × (NICE_0_LOAD / weight)</span>'},
  {html:'<span class="cm">// weight 由 nice 值决定: nice=-20 → weight=88761, nice=19 → weight=15</span>'},
  {html:''},
  {html:'<span class="kw">func</span> <span class="fn">setNice</span>(pid, nice <span class="kw">int</span>) <span class="kw">error</span> {'},
  {html:'&nbsp;&nbsp;<span class="cm">// nice: -20 (最高优先级) ~ +19 (最低优先级)</span>'},
  {html:'&nbsp;&nbsp;<span class="kw">return</span> syscall.<span class="fn">Setpriority</span>(syscall.PRIO_PROCESS, pid, nice)'},
  {html:'}'},
  {html:''},
  {html:'<span class="kw">func</span> <span class="fn">cpuBoundTask</span>() {'},
  {html:'&nbsp;&nbsp;runtime.<span class="fn">LockOSThread</span>() <span class="cm">// 绑定到 OS 线程</span>'},
  {html:'&nbsp;&nbsp;<span class="kw">defer</span> runtime.<span class="fn">UnlockOSThread</span>()'},
  {html:'&nbsp;&nbsp;<span class="cm">// 设置为低优先级后台任务 (nice=10)</span>'},
  {html:'&nbsp;&nbsp;syscall.<span class="fn">Setpriority</span>(syscall.PRIO_PROCESS, <span class="num">0</span>, <span class="num">10</span>)'},
  {html:'&nbsp;&nbsp;<span class="kw">for</span> { <span class="cm">/* CPU 密集型计算 */</span> }'},
  {html:'}'},
  {html:''},
  {html:'<span class="kw">func</span> <span class="fn">main</span>() {'},
  {html:'&nbsp;&nbsp;<span class="pkg">fmt</span>.<span class="fn">Println</span>(<span class="st">"CPU核数:"</span>, runtime.<span class="fn">NumCPU</span>())'},
  {html:'&nbsp;&nbsp;<span class="pkg">fmt</span>.<span class="fn">Println</span>(<span class="st">"GOMAXPROCS:"</span>, runtime.<span class="fn">GOMAXPROCS</span>(<span class="num">0</span>))'},
  {html:'&nbsp;&nbsp;pid := os.<span class="fn">Getpid</span>()'},
  {html:'&nbsp;&nbsp;nice, _ := syscall.<span class="fn">Getpriority</span>(syscall.PRIO_PROCESS, pid)'},
  {html:'&nbsp;&nbsp;<span class="pkg">fmt</span>.<span class="fn">Printf</span>(<span class="st">"PID=%d nice=%d\\n"</span>, pid, nice)'},
  {html:'}'},
];


const STEPS=[
  {highlightLines:[4,5],hlJs:[7,8],hlPy:[7,8],description:'CFS 核心公式: vruntime = 实际运行时间 × (1024 / weight)。nice=-20 权重大，vruntime 增速慢'},
  {highlightLines:[4,5],hlJs:[7,8],hlPy:[7,8],description:'红黑树运行队列: P1(vr=5) < P2(vr=10) < P3(vr=18)。最左节点 P1 的 vruntime 最小'},
  {highlightLines:[7,8,9],hlJs:[9,10],hlPy:[11,12],description:'调度器选择最左节点 P1 运行 — O(log n) 时间复杂度，红黑树保持平衡'},
  {highlightLines:[12,13,14,15,16],hlJs:[12,13],hlPy:[13,14],description:'P1 运行 5ms — vruntime 从 5 增加到 20（nice=0，权重=1024，增速 = 1）'},
  {highlightLines:[12,13,14,15,16],hlJs:[12,13],hlPy:[13,14],description:'P1 的 vruntime=20 > P2 的 vruntime=10 — P1 重新插入红黑树，P2 成为最左节点'},
  {highlightLines:[7,8,9],hlJs:[9,10],hlPy:[11,12],description:'调度 P2 运行 — vruntime 从 10 增到 20（nice=5，权重=335，增速更慢→运行时间更长）'},
  {highlightLines:[7,8,9],hlJs:[9,10],hlPy:[11,12],description:'IO 密集型进程 P4 从 blocked 状态恢复 — vruntime 重置为 min_vruntime + 小补偿'},
  {highlightLines:[7,8,9],hlJs:[9,10],hlPy:[11,12],description:'P4 重新加入红黑树（vruntime 很小）— 立即成为最左节点，被优先调度'},
  {highlightLines:[19,20,21,22,23,24],hlJs:[14,15],hlPy:[18,19],description:'GOMAXPROCS 控制 Go 运行时使用的 CPU 核数 — 影响并发 goroutine 的并行度'},
  {highlightLines:[19,20,21,22,23,24],hlJs:[14,15],hlPy:[18,19],description:'nice 值调整: nice=10 的进程获得更少 CPU 时间，CFS 会自动"补偿"低权重进程'},
];

let step=0,playing=false,timer=null;
// vruntime values per step: [P1, P2, P3]
const VR=[[5,10,18],[5,10,18],[5,10,18],[20,10,18],[20,10,18],[20,20,18],[20,20,18],[20,20,18],[20,20,18],[20,20,18]];
const RUNNING=[null,null,'P1','P1','P2','P2','P2','P4','P4','P4'];
function getSpeed(){return 1600-(parseInt(document.getElementById('speedSlider').value)-1)*300;}

function renderViz(){
  document.getElementById('tStatus').style.display = step > 0 ? 'none' : '';
  const vr=VR[Math.min(step,VR.length-1)];
  document.getElementById('t0v').textContent=`vr=${vr[0]}`;
  document.getElementById('t1v').textContent=`vr=${vr[1]}`;
  document.getElementById('t2v').textContent=`vr=${vr[2]}`;
  document.getElementById('tVrInfo').textContent=`min_vruntime: ${Math.min(...vr)} | 当前运行: ${RUNNING[Math.min(step,RUNNING.length-1)]||'-'}`;

  const showLeft=step>=1;
  document.getElementById('rLeftmost').setAttribute('opacity',showLeft?'1':'0');
  document.getElementById('tLeftmost').setAttribute('opacity',showLeft?'1':'0');

  // Highlight running node
  const run=RUNNING[Math.min(step,RUNNING.length-1)];
  ['n0','n1','n2'].forEach((nid,i)=>{
    const pid=['P2','P1','P3'][i];
    const active=pid===run;
    document.getElementById(nid).style.strokeWidth=active?'3':'2';
    document.getElementById(nid).style.fill=active?'rgba(56,189,248,0.15)':'#1e293b';
  });

  // CPU bar visualization
  const p1w=step>=3?Math.min((step-2)*80,160):0;
  const p2w=step>=5?Math.min((step-4)*60,120):0;
  document.getElementById('rP1bar').setAttribute('width',p1w);
  document.getElementById('rP2bar').setAttribute('x', 130+p1w);
  document.getElementById('rP2bar').setAttribute('width',p2w);
  document.getElementById('tCPUBar').textContent=run?`运行中: ${run}`:step>0?'等待调度...':'';
}

function renderCode(){
  const lines=CODE_LINES;
  const hl=step<STEPS.length?(STEPS[step].highlightLines||[]):[];
  document.getElementById('codeBody').innerHTML=lines.map((l,i)=>
    `<div class="code-line${hl.includes(i+1)?' active':''}" onclick="jumpToLine(${i+1})">
      <span class="ln">${i+1}</span><span class="lc">${l.html||'&nbsp;'}</span></div>`
  ).join('');
  const a=document.querySelector('.code-line.active');if(a)a.scrollIntoView({block:'nearest'});
}

function render(){
  renderViz();renderCode();
  document.getElementById('descText').textContent=step<STEPS.length?STEPS[step].description:'演示完成';
  document.getElementById('stepCounter').textContent=`${Math.min(step+1,STEPS.length)} / ${STEPS.length}`;
  document.getElementById('btnPrev').disabled=step===0;
  document.getElementById('btnNext').disabled=step>=STEPS.length-1;
}

function jumpToLine(ln){for(let i=STEPS.length-1;i>=0;i--){if((STEPS[i].highlightLines||[]).includes(ln)){step=i;render();return;}}}
function next(){if(step<STEPS.length-1){step++;render();}}
function prev(){if(step>0){step--;render();}}
function reset(){step=0;render();if(playing){playing=false;clearInterval(timer);document.getElementById('btnPlay').textContent='▶ 播放';}}
function togglePlay(){
  if(!playing && step>=STEPS.length-1){step=0;render();}
  playing=!playing;
  document.getElementById('btnPlay').textContent=playing?'⏸ 暂停':'▶ 播放';
  if(playing){timer=setInterval(()=>{if(step>=STEPS.length-1){playing=false;clearInterval(timer);document.getElementById('btnPlay').textContent='▶ 播放';return;}step++;render();},getSpeed());}
  else clearInterval(timer);
}

render();
if(window.NavTracker)NavTracker.track('CFS进程调度','linux/scheduling.html','🐧','Linux');
</script>
</body>
</html>
