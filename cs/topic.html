.diagram{width:100%;height:100%;overflow:hidden}.diagram-title{display:none}.diagram-stage{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;gap:14px;position:relative;color:var(--text)}.stage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-shrink:0}.stage-kicker{font-size:.7rem;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font-weight:800}.stage-title{font-size:1.28rem;font-weight:800;margin-top:4px}.stage-note{max-width:380px;color:var(--dim);font-size:.82rem;line-height:1.65;text-align:right}.stage-body{flex:1;min-height:0;display:grid;gap:14px}.stage-grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.stage-grid-2{grid-template-columns:1fr 1fr}.stage-panel{border:1px solid rgba(255,255,255,.08);background:rgba(15,23,42,.45);border-radius:18px;padding:16px;min-width:0;position:relative;overflow:hidden}.stage-panel.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(167,139,250,.28),0 18px 50px rgba(167,139,250,.08)}.stage-label{font-size:.72rem;color:var(--dim2);text-transform:uppercase;letter-spacing:.12em;font-weight:800;margin-bottom:10px}.chip-row,.pipe-row,.memory-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.chip{min-width:40px;min-height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--dim);padding:0 8px}.chip.hot{background:rgba(167,139,250,.18);border-color:var(--accent);color:var(--text);box-shadow:0 0 20px rgba(167,139,250,.18)}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);padding:7px 10px;font-size:.78rem;color:var(--dim)}.pill.hot{color:var(--text);border-color:var(--accent);background:rgba(167,139,250,.15)}.connector{height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.8;margin:12px 0}.phase-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.phase{border-radius:12px;padding:12px 10px;border:1px solid rgba(255,255,255,.1);color:var(--dim);font-size:.78rem}.phase.active{border-color:var(--accent);background:rgba(167,139,250,.14);color:var(--text)}.cache-line{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.word{height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--dim)}.word.hot{border-color:var(--accent);background:rgba(167,139,250,.16);color:var(--text)}.addr{display:grid;grid-template-columns:2fr 1fr;gap:8px}.addr-part{border-radius:12px;border:1px solid rgba(255,255,255,.1);padding:12px;background:rgba(255,255,255,.05)}.addr-part.hot{border-color:var(--accent);background:rgba(167,139,250,.16)}.bit-row{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.bit{height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;color:var(--dim)}.bit.hot{border-color:var(--accent);background:rgba(167,139,250,.16);color:var(--text)}.big-metric{font-size:1.5rem;font-weight:800;color:var(--accent);font-family:'JetBrains Mono',monospace}.mini-copy{font-size:.76rem;color:var(--dim);line-height:1.55}.step-card{border:1px solid rgba(255,255,255,.07);border-radius:10px;background:rgba(255,255,255,.03);padding:10px}.step-card.active{border-color:var(--accent);background:rgba(167,139,250,.1)}.step-card strong{display:block;margin-bottom:4px;font-size:.72rem;color:var(--accent)}.step-card span{color:var(--dim);font-size:.76rem;line-height:1.55}.steps-list{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden}
.flow{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:14px;background:rgba(13,17,23,.7);padding:16px;overflow-x:auto}.flow-node{min-width:118px;border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:10px;text-align:center;color:var(--dim);background:rgba(255,255,255,.035);font-size:.8rem}.flow-node.active{border-color:var(--accent);background:rgba(167,139,250,.14);color:var(--text)}.flow-arrow{color:var(--dim2);font-family:monospace}

.code-panel{width:44%;min-width:380px;display:flex;flex-direction:column;overflow:hidden;background:var(--panel2)}.code-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:.84rem;color:var(--dim);display:flex;gap:8px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}.code-body{flex:1;overflow:auto;padding:16px 0;background:#0d1117}.code-line{display:flex;font-family:'JetBrains Mono','Fira Code',monospace;font-size:.8rem;line-height:1.65;border-left:2px solid transparent}.code-line.active{background:rgba(167,139,250,.12);border-left-color:var(--accent)}.ln{min-width:44px;padding:0 12px 0 14px;color:#4b5563;text-align:right;user-select:none}.lc{padding:0 16px 0 4px;white-space:pre-wrap;word-break:break-word}.kw{color:#ff7b72}.fn{color:#d2a8ff}.st{color:#a5d6ff}.num{color:#79c0ff}.cm{color:#8b949e}.id{color:#e6edf3}
.controls{display:flex;align-items:center;gap:10px;padding:12px 24px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0}.btn{background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;font-family:inherit}.btn.primary{background:rgba(167,139,250,.16);border-color:rgba(167,139,250,.34);color:var(--accent)}.btn:disabled{opacity:.4;cursor:not-allowed}.speed-wrap{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:.8rem;color:var(--dim)}input[type=range]{width:90px}
@media(max-width:768px){body{height:auto;min-height:100vh;overflow-y:auto;overflow-x:hidden}nav{padding:10px 16px}.tags{width:100%;margin-left:0}.main{flex-direction:column;overflow:visible;height:auto;flex:none}.steps-panel{width:100%;border-right:none;border-bottom:1px solid var(--border);overflow:visible}.diagram-panel{border-right:none;border-bottom:1px solid var(--border);min-width:0}.code-panel{width:100%;min-width:0;height:360px;flex:none}.controls{flex-wrap:wrap;padding:10px 14px}.speed-wrap{margin-left:0;width:100%;justify-content:flex-end}}

.decision-map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.decision{border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:11px;background:rgba(255,255,255,.04);font-size:.76rem;color:var(--dim);line-height:1.45}.decision.active{border-color:var(--accent);background:rgba(167,139,250,.14);color:var(--text)}.swimlanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.lane-box{border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px;background:rgba(255,255,255,.04)}.lane-title{font-size:.7rem;color:var(--dim2);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:800}.edge-list{display:flex;flex-direction:column;gap:7px}.edge{border-left:2px solid rgba(255,255,255,.14);padding:6px 8px;color:var(--dim);font-size:.75rem;line-height:1.45}.edge.hot{border-left-color:var(--accent);background:rgba(167,139,250,.1);color:var(--text)}.set-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.set-cell{border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px;background:rgba(255,255,255,.04);font-family:'JetBrains Mono',monospace;font-size:.73rem;color:var(--dim)}.set-cell.hot{border-color:var(--accent);background:rgba(167,139,250,.15);color:var(--text)}.stack-table{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stack-cell{border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px;background:rgba(255,255,255,.04);font-size:.74rem;color:var(--dim);line-height:1.45}.stack-cell.hot{border-color:var(--accent);background:rgba(167,139,250,.15);color:var(--text)}.float-layout{display:grid;grid-template-columns:1fr 3fr 5fr;gap:8px}.float-part{border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;background:rgba(255,255,255,.04);font-family:'JetBrains Mono',monospace;color:var(--dim)}.float-part.hot{border-color:var(--accent);background:rgba(167,139,250,.15);color:var(--text)}

<script>
const TOPICS={
  cpu:{title:'CPU 指令与流水线',tags:['ISA','Pipeline','Branch'],summary:'CPU 通过取指、译码、执行把机器指令转成电路动作。流水线让多条指令重叠执行以提升吞吐，但分支预测失败和数据相关会引发停顿，代价是清空已执行到一半的指令。',concepts:[['指令周期','取指（IF）→ 译码（ID）→ 执行（EX）→ 访存（MEM）→ 写回（WB）是经典五级流水线。每个阶段只做一件事，多条指令交叠推进。'],['流水线','流水线提升的是吞吐率而非单条指令延迟。15 级深度流水线遇到分支预测失败时，需要清空最多 15 条指令的中间结果。'],['分支预测','CPU 通过历史统计猜测 if/loop 走向。现代 CPU 预测准确率 >97%，但一旦猜错，清流水线的代价可达 15–30 个周期。']]  ,flow:['Fetch','Decode','Execute','Memory','Write Back'],steps:['CPU 从 L1 指令缓存（I-Cache）中取出 PC 指向的机器指令，PC 自增。指令缓存未命中时需等待几十纳秒从 L2/L3 填充。','译码器解析操作码（opcode）、源寄存器和目标寄存器，识别是算术、访存还是分支指令。现代 CPU 在此阶段已完成寄存器重命名（RAT）。','ALU 执行算术/逻辑运算，分支单元计算目标地址并决定是否跳转；若分支预测失败，后续已进入流水线的指令会被 flush，浪费约 15–30 个周期。','Load/Store 单元向 L1 数据缓存（D-Cache）发出请求。L1 命中约 4 周期，L3 约 40 周期，主存约 200 周期。访存是性能瓶颈的高频来源。','结果写回目标寄存器，提交（retire）该指令。乱序执行（OoOE）CPU 会在此保证程序可见的顺序正确，同时把多条指令的结果一并提交。'],code:['const (','    ADD  OpCode = iota // reg[dst] += reg[src]','    LOAD               // reg[dst] = mem[src]','    JUMP               // pc = imm if cond',')',''  ,'type Instruction struct {','    OpCode OpCode','    Src, Dst Register','    Imm    int32','}','','func execute(i Instruction, cpu *Core) {','    switch i.OpCode {','    case ADD:','        cpu.Reg[i.Dst] += cpu.Reg[i.Src]','    case LOAD:','        cpu.Reg[i.Dst] = cpu.Memory.Load(i.Src)','    case JUMP:','        if cpu.Cond { cpu.PC = uint64(i.Imm) }','    }','}']},
  cache:{title:'Cache 层次与缓存行',tags:['L1/L2/L3','Locality','False Sharing'],summary:'CPU 访问寄存器不到 1ns，访问主存约 100ns，差距 100 倍。Cache 通过 64 字节缓存行和局部性原理把"大概率要用的数据"提前搬近 CPU，是性能优化的核心杠杆。',concepts:[['缓存行','CPU 以 64 字节为单位在 Cache 和内存之间传输数据。访问数组中一个元素时，相邻 7 个元素也被装入同一缓存行，这是顺序遍历比随机跳转快的根本原因。'],['局部性','时间局部性：刚访问过的数据很快会再次访问；空间局部性：访问某地址时，相邻地址也可能被访问。数组遍历完美利用空间局部性，而链表节点散布堆中会频繁触发 cache miss。'],['False Sharing','多个 CPU 核心写入同一 64 字节缓存行中的不同变量，会触发 MESI 缓存一致性协议，让每次写入都需要先夺取缓存行所有权，实际串行化了本可并行的写操作。']]  ,flow:['Register','L1','L2','L3','Memory'],steps:['CPU 发出 Load 请求，先检查 L1 D-Cache（32KB，~4 周期）。L1 命中率通常 >95%，这是高性能程序的目标。','L1 miss 后在 L2 Cache（256KB，~12 周期）中查找。L2 仍未命中则继续向 L3 共享缓存（几 MB，~40 周期）查询。','L3 miss 后访问主存（DDR5，~200 周期），整条缓存行（64 字节）从内存加载进 L3→L2→L1，后续访问同行数据无需再等主存。','连续遍历数组时，每次 cache miss 后 7 个相邻元素随缓存行一起加载，均摊访存延迟极低；而链表每次都可能 cache miss，是缓存不友好的经典案例。','多核并发写同一 struct 中相邻字段，若它们落在同一 64 字节缓存行，写 A 字段会让其他核心的 B 字段缓存行失效，引发反复同步。用 padding 对齐到缓存行边界可消除这个问题。'],code:['// padding 使 A、B 各占独立缓存行，避免 false sharing','type Counter struct {','    A int64','    _ [7]uint64 // 7*8 = 56 bytes，凑满 64 字节缓存行','    B int64','}','','// 顺序遍历利用 cache line 预取，性能优于随机访问','func sum(xs []int) int {','    total := 0','    for _, x := range xs {','        total += x // 每 8 个元素共享一条 cache line','    }','    return total','}']},
  memory:{title:'内存寻址与 TLB',tags:['MMU','Page Table','TLB'],summary:'程序使用虚拟地址，CPU 通过 MMU + TLB + 页表把它翻译成物理地址。TLB 只有 64–1024 项，一旦 miss 需要走多级页表，代价约 100 周期；缺页异常则需陷入内核，代价约 1µs。',concepts:[['虚拟地址','每个进程拥有独立的虚拟地址空间（64 位系统通常 48 位有效位），进程间互不干扰，由 MMU 负责隔离和保护。'],['页表','多级页表（x86-64 用 4 级）将虚拟页号映射到物理帧号。每个映射条目还记录权限位（读/写/执行）和存在位（是否在内存中）。'],['TLB','TLB（Translation Lookaside Buffer）缓存最近的地址翻译结果，是 CPU 内部的小型全相联 Cache。L1 TLB 通常 64 项，L2 TLB 1024 项。TLB miss 时需做完整页表遍历（page table walk）。']]  ,flow:['Virtual Addr','TLB','Page Table','Physical Addr','RAM'],steps:['程序执行 Load/Store 指令，生成 48 位虚拟地址（VPN + 页内偏移）。VPN 是虚拟页号，用于查找映射；页内偏移直接使用，通常 12 位对应 4KB 页。','MMU 先在 L1 TLB（~1 周期）中查找 VPN。TLB hit 时直接得到物理帧号，与偏移拼接成物理地址，整个翻译几乎零代价。','TLB miss 时 MMU 触发 page table walk：从 CR3 寄存器指向的 PGD 开始，经 4 级页表查找（~100 周期）。每次 walk 都消耗多次内存访问，因此 TLB 命中率对性能至关重要。','若页表项的"存在位"为 0，说明该页未映射到物理内存，CPU 触发缺页异常，陷入内核。内核负责分配物理页、填充映射，然后返回用户态重试（约 1–10µs）。','地址翻译成功后，最终访问对应的物理内存或从 Cache 中命中。Huge Pages（2MB/1GB）可大幅减少 TLB 条目数，对遍历大内存的场景（如数据库 buffer pool）效果显著。'],code:['// ~4KB 页：低 12 位是页内偏移，高位是 VPN','func translate(va VirtualAddress) (PhysicalAddress, error) {','    // 先查 TLB（约 1 周期）','    if pa, ok := tlb.Lookup(va.VPN()); ok {','        return pa.WithOffset(va.Offset()), nil','    }','    // TLB miss：走多级页表（约 100 周期）','    entry, err := pageTable.Walk(va.VPN())','    if err != nil {','        return 0, ErrPageFault // 缺页，陷入内核','    }','    tlb.Insert(va.VPN(), entry.Frame) // 填充 TLB','    return entry.Frame.WithOffset(va.Offset()), nil','}']},
  io:{title:'总线、中断与 DMA',tags:['Bus','Interrupt','DMA'],summary:'I/O 设备通过总线连接 CPU 和内存。中断让 CPU 不必持续轮询，DMA 让设备绕开 CPU 直接搬运数据——CPU 只负责提交命令和处理完成事件，大部分传输工作由 DMA 控制器完成。',concepts:[['中断','设备完成 I/O 后向中断控制器（APIC）发送信号，CPU 在当前指令完成后保存现场、跳转到中断服务程序（ISR），处理完成后恢复上下文。相比轮询，中断把 CPU 从等待中解放出来。'],['DMA','DMA（Direct Memory Access）控制器可以独立在设备和内存之间搬运数据，无需 CPU 参与每个字节的拷贝。磁盘读取 4KB 数据只需 CPU 提交一次命令和处理一次中断，其余由 DMA 完成。'],['总线','PCIe 总线决定 NVMe SSD 和 GPU 的带宽上限（PCIe 5.0 ×16 约 64 GB/s），内存总线决定 CPU 和 DRAM 的带宽（DDR5 约 50–100 GB/s），这些带宽边界是系统吞吐的物理约束。']]  ,flow:['Device','Interrupt','Driver','DMA','Memory'],steps:['应用调用 read("disk0", buf)，触发 syscall 陷入内核，当前 goroutine/进程被挂起，控制权交给设备驱动。','驱动向 DMA 控制器提交命令：源地址（磁盘 LBA）、目标地址（buf 的物理内存地址）、传输长度。CPU 不再参与数据搬运，继续调度执行其他任务。','DMA 控制器通过总线把数据从设备直接写入主存（无需经过 CPU 寄存器），读取 4KB 数据只需触发一次总线传输，效率远高于 CPU 逐字节搬运的 PIO 模式。','传输完成后，DMA 向中断控制器（APIC）发信号，CPU 在当前指令完成后响应中断，跳转到驱动的 ISR（中断服务例程）中标记完成。','内核收到完成通知后唤醒等待的进程/goroutine，将数据所在页映射到用户空间（或直接 copy），应用拿到结果后继续执行。'],code:['// DMA 路径：CPU 只提交命令和处理完成，不搬运每个字节','func readDisk(buf []byte) error {','    // 1. 把 buf 物理内存地址注册给 DMA','    dmaHandle := dma.Map(buf)','    defer dma.Unmap(dmaHandle)','','    // 2. 向驱动提交命令（返回即可，不等待）','    driver.Submit(ReadCmd{','        LBA:    0x1000,','        Size:   len(buf),','        Buffer: dmaHandle,','    })','','    // 3. 等待中断通知完成（goroutine 挂起，不占 CPU）','    return <-interrupt.Done','}']},
  number:{title:'数字表示 / 补码 / IEEE 754',tags:["Two's Complement",'Float','Overflow'],summary:'整数用补码（Two\'s Complement）表示，浮点数用 IEEE 754 标准表示。溢出、精度丢失和 NaN 都直接来自这两套编码规则，理解它们是写出正确数值代码的基础。',concepts:[['补码','用最高位作为符号位，正数不变，负数取反加一。最大优势：加法电路对有符号数和无符号数完全相同，无需专门的减法电路。int32 范围是 -2^31 到 2^31-1，溢出时回绕（wraparound）。'],['IEEE 754','64 位浮点数由 1 位符号、11 位指数（偏移 1023）、52 位尾数组成。可以表示从 5×10⁻³²⁴ 到 1.8×10³⁰⁸ 的范围，但精度只有约 15–17 位十进制有效数字。'],['特殊值','IEEE 754 定义了 +Inf、-Inf、NaN（Not a Number）和 -0 四种特殊值。NaN 不等于任何值（包括自身），是浮点代码中"隐形 bug"的高频来源，需用 math.IsNaN 判断。']]  ,flow:['Integer','Binary','Two\'s Complement','Bit Op','ALU'],steps:['整数在硬件中以补码存储：正数直接用二进制，负数先按位取反再加 1。例如 int8(-1) = 0xFF，-128 = 0x80。补码的妙处是加减法可以用同一套电路完成，溢出时结果自动回绕。','整数溢出是静默的（不像某些语言会 panic）：int32(2147483647) + 1 变成 -2147483648。这是因为高位进位被丢弃。在累加、乘法、位偏移等场景中需要主动检查溢出边界。','IEEE 754 float64 把 64 位拆成 1+11+52：符号位决定正负，指数位（存储值 = 真实指数 + 1023）决定量级，尾数位（隐含最高位 1）决定精度。例如 0.1 在 IEEE 754 中是无限循环二进制小数，只能近似存储。','浮点精度陷阱：0.1 + 0.2 ≠ 0.3（实际是 0.30000000000000004）。需要比较浮点数时应用误差范围（epsilon）判等，而不是 ==。金融计算应使用整数或 decimal 库，不应直接用 float64。'],code:['import "math"','','// 补码溢出：回绕不报错','var n int32 = math.MaxInt32 // 2147483647','n++                         // 变成 -2147483648','','// IEEE 754：0.1 无法精确表示','fmt.Println(0.1 + 0.2)       // 0.30000000000000004','fmt.Println(0.1 + 0.2 == 0.3) // false','','// 正确的浮点比较','const eps = 1e-9','func floatEq(a, b float64) bool {','    return math.Abs(a-b) < eps','}','','// NaN 不等于任何值（包括自身）','nan := math.NaN()','fmt.Println(nan == nan)      // false','fmt.Println(math.IsNaN(nan)) // true']}
};

const DETAIL_STEPS={
  cpu:['取指阶段根据 PC 从 I-Cache 拉取指令；如果 I-Cache miss，前端取指队列断供，后端可能很快饿住。','译码阶段解析 opcode 和寄存器，同时做寄存器重命名，消除 WAW/WAR 这类假依赖。','执行阶段由 ALU/分支单元计算结果；分支预测失败会 flush 错误路径，重新从正确 PC 取指。','访存阶段进入 load/store queue；D-Cache hit 很快返回，miss 会等待 L2/L3/内存。','写回和提交分开：乱序执行可以先算完，但 ROB 必须按程序顺序 retire，保证精确异常。','数据相关可以通过 forwarding/bypass 把上一条指令结果直接喂给下一条，避免等待写回寄存器。','如果是 load-use hazard，数据还没从内存回来，无法 forwarding，就要插入 bubble/stall。'],
  cache:['CPU 地址被拆成 tag / set index / line offset，index 决定查哪个 set，offset 决定取 line 中哪个字节。','Cache 在目标 set 内并行比较多个 way 的 tag，任意一路匹配且 valid 就是 hit。','Hit 时直接返回目标 word，同时更新 LRU/PLRU 等替换状态。','Miss 时必须选择 victim line；如果 victim 是 dirty，就先写回下一级缓存或内存。','从下一级缓存或内存取回整条 64B cache line，并填入当前 set。','写入策略决定成本：write-through 每次下写，write-back 先标 dirty，替换时再写回。','多核下 MESI 维护缓存一致性：写入前必须拿到 cache line 的独占所有权。','false sharing 发生在不同核心写同一 cache line 的不同变量，逻辑不共享但硬件会反复失效。'],
  memory:['CPU 产生虚拟地址，MMU 把它拆成 VPN 和页内 offset；offset 不需要翻译。','TLB 命中时直接得到 PFN，与 offset 拼接成物理地址，这是最快路径。','TLB miss 时硬件或内核执行 page table walk，逐级读取 PGD/PUD/PMD/PTE。','如果 PTE 的 present 位为 0，就触发 page fault，内核负责分配页、调页或杀掉进程。','如果权限位不允许当前访问，比如用户态写只读页，会触发 protection fault。','页表遍历成功后把 VPN→PFN 填入 TLB，然后重试原指令。','Huge Page 用更大的页覆盖范围，减少 TLB 条目压力，常用于数据库和大内存扫描。'],
  io:['应用发起 read/write/io_uring_enter，CPU 从用户态陷入内核态，参数被校验并转换成内核请求。','驱动构造设备命令或提交队列项，写入 MMIO 寄存器或 ring buffer 通知设备。','DMA 之前要把用户 buffer 映射到稳定物理页，必要时 pin 页，并通过 IOMMU 做隔离。','设备通过 PCIe/总线直接把数据搬进内存，CPU 不逐字节参与数据复制。','设备完成后触发中断或 MSI-X，CPU 进入 ISR 快速确认完成。','耗时工作放到 softirq/tasklet/workqueue 等下半部处理，避免中断上下文占用过久。','内核标记请求完成，唤醒等待进程或触发回调，应用重新获得数据继续执行。'],
  number:['补码表示负数：按位取反加一，最高位既是符号位也是数值编码的一部分。','整数加法硬件只做二进制加法，最高进位被丢弃，所以溢出会回绕。','有符号溢出可以通过“同号相加结果变异号”判断，很多语言默认不会替你报错。','float64 拆成符号位、指数和尾数，表达的是二进制科学计数法。','无法精确表示的小数会经过舍入，guard/round/sticky 位决定最终落到哪个近似值。','Inf、NaN、-0 都是特殊编码；NaN 会在计算中传播，并且 NaN != NaN。','业务比较浮点数应使用 epsilon 或 decimal；金融金额应使用整数分或定点数。']
};

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function codeHtml(s){
  let r=esc(s);
  r=r.replace(/"(?:[^"\\]|\\.)*"/g,m=>'<span class="st">'+m+'</span>');
  r=r.replace(/\/\/.*/g,m=>'<span class="cm">'+m+'</span>');
  r=r.replace(/\b(type|struct|func|switch|case|return|if|else|for|range|const|var|import|package)\b/g,'<span class="kw">$1</span>');
  r=r.replace(/\b(fmt|math|sync|bits|unsafe)\b/g,'<span class="pkg">$1</span>');
  r=r.replace(/\b(\d+(?:\.\d+)?(?:e[+-]?\d+)?)\b/g,'<span class="num">$1</span>');
  r=r.replace(/\b([A-Z][A-Za-z0-9]*)\b/g,'<span class="id">$1</span>');
  r=r.replace(/\b([a-z][a-zA-Z0-9_]*)(?=\s*\()/g,'<span class="fn">$1</span>');
  return r;
}
function hot(i){return cur>=i?' hot':'';}
function active(i){return cur===i?' active':'';}
function stage(kicker,title,note,body){return `<div class="diagram-stage"><div class="stage-head"><div><div class="stage-kicker">${kicker}</div><div class="stage-title">${title}</div></div><div class="stage-note">${note}</div></div><div class="stage-body">${body}</div></div>`;}
function cpuDiagram(){
  return stage('CPU PIPELINE','流水线真正难点是 hazard：数据相关、控制相关、结构相关如何处理','图中每个节点都是一个概念或分支：命中继续推进，冲突就 stall/forward/flush，乱序 CPU 最后仍按顺序 retire。',
`<div class="stage-body" style="grid-template-rows:auto 1fr auto">
  <div class="decision-map"><div class="decision${active(0)}">IF：PC 取指，I-Cache miss 则前端停顿</div><div class="decision${active(1)}">ID：译码、寄存器重命名、依赖检查</div><div class="decision${active(2)}">EX：ALU/分支，预测失败 flush</div><div class="decision${active(3)}">MEM：Load/Store，D-Cache miss 等待</div><div class="decision${active(4)}">WB/Retire：乱序执行，顺序提交</div><div class="decision${active(5)}">Forwarding：上一条结果旁路给下一条</div><div class="decision${active(6)}">Stall：load-use 等不到就插 bubble</div><div class="decision">ROB 保证异常和提交顺序精确</div></div>
  <div class="swimlanes">
    <div class="lane-box"><div class="lane-title">Frontend</div><div class="edge-list"><div class="edge${active(0)}">BTB/分支预测给出下一条 PC</div><div class="edge${active(0)}">I-Cache miss 会导致取指队列断供</div><div class="edge${active(2)}">预测失败：清空错误路径指令</div></div></div>
    <div class="lane-box"><div class="lane-title">Execute</div><div class="edge-list"><div class="edge${active(1)}">rename 消除 WAW/WAR 假依赖</div><div class="edge${active(5)}">EX/MEM 结果 forward 到后续 ALU</div><div class="edge${active(6)}">load-use hazard 无法 forward 时 stall</div></div></div>
    <div class="lane-box"><div class="lane-title">Memory + Commit</div><div class="edge-list"><div class="edge${active(3)}">Load miss 进入 load/store queue 等数据</div><div class="edge${active(4)}">ROB 按程序顺序 retire</div><div class="edge${active(4)}">异常只在提交点对外可见</div></div></div>
  </div>
  <div class="stage-panel${cur>=4?' active':''}"><div class="stage-label">核心结论</div><div class="chip-row"><span class="pill hot">吞吐提升</span><span class="pill hot">单条延迟不一定变短</span><span class="pill hot">miss/branch/hazard 决定真实性能</span></div></div>
</div>`);
}
function cacheDiagram(){
  return stage('CACHE HIERARCHY','一次内存访问先拆地址：tag / index / offset，再决定 hit、miss、替换和回写','Cache 不只是快慢表：还涉及组相联、dirty line、写策略、MESI 一致性和 false sharing。',
`<div class="stage-body" style="grid-template-rows:auto 1fr auto">
  <div class="decision-map"><div class="decision${active(0)}">地址拆分：tag / set index / line offset</div><div class="decision${active(1)}">Set lookup：并行比较多路 tag</div><div class="decision${active(2)}">Hit：返回 word，更新 LRU/PLRU</div><div class="decision${active(3)}">Miss：选 victim，dirty 则 writeback</div><div class="decision${active(4)}">Fill：下层取 64B line 填回</div><div class="decision${active(5)}">Write：write-through / write-back</div><div class="decision${active(6)}">MESI：多核读写同步状态</div><div class="decision${active(7)}">False sharing：不同变量同一 line</div></div>
  <div class="stage-grid-2 stage-body">
    <div class="stage-panel${cur<=4?' active':''}"><div class="stage-label">Set associative lookup</div><div class="set-grid"><div class="set-cell hot">set index</div><div class="set-cell${cur>=1?' hot':''}">way0 tag?</div><div class="set-cell${cur>=1?' hot':''}">way1 tag?</div><div class="set-cell${cur>=1?' hot':''}">way2 tag?</div><div class="set-cell${cur>=3?' hot':''}">victim</div><div class="set-cell${cur>=3?' hot':''}">dirty?</div><div class="set-cell${cur>=4?' hot':''}">fill 64B</div><div class="set-cell${cur>=2?' hot':''}">return word</div></div></div>
    <div class="stage-panel${active(7)}"><div class="stage-label">Cache line 64B</div><div class="cache-line">${[0,1,2,3,4,5,6,7].map(i=>`<div class="word${i<=cur?' hot':''}">word${i}</div>`).join('')}</div><p class="mini-copy">连续遍历利用 spatial locality；多核写不同 word 仍会争同一 line。</p></div>
  </div>
  <div class="stage-panel${cur>=5?' active':''}"><div class="stage-label">多核一致性</div><div class="chip-row"><span class="pill hot">M Modified</span><span class="pill hot">E Exclusive</span><span class="pill hot">S Shared</span><span class="pill hot">I Invalid</span><span class="pill hot">写入先拿所有权</span></div></div>
</div>`);
}
function memoryDiagram(){
  return stage('VIRTUAL MEMORY','虚拟地址翻译有三条路径：TLB hit、page walk、page fault','TLB hit 很快；TLB miss 走多级页表；PTE 不存在或权限不对就陷入内核处理异常。',
`<div class="stage-body" style="grid-template-rows:auto 1fr">
  <div class="decision-map"><div class="decision${active(0)}">VA 拆分：VPN + offset</div><div class="decision${active(1)}">TLB hit：PFN + offset</div><div class="decision${active(2)}">TLB miss：page table walk</div><div class="decision${active(3)}">PTE present=0：page fault</div><div class="decision${active(4)}">权限检查：R/W/X、user/supervisor</div><div class="decision${active(5)}">填充 TLB，重试指令</div><div class="decision${active(6)}">Huge Page：减少 TLB 压力</div><div class="decision">TLB shootdown：多核修改页表需失效远端 TLB</div></div>
  <div class="swimlanes">
    <div class="lane-box"><div class="lane-title">Fast path</div><div class="edge-list"><div class="edge${active(0)}">offset 直接保留，不参与页表查找</div><div class="edge${active(1)}">TLB 命中拿 PFN，拼成物理地址</div><div class="edge${active(5)}">walk 成功后回填 TLB，下次走快路径</div></div></div>
    <div class="lane-box"><div class="lane-title">Page walk</div><div class="stack-table"><div class="stack-cell${cur>=2?' hot':''}">PGD</div><div class="stack-cell${cur>=2?' hot':''}">PUD</div><div class="stack-cell${cur>=2?' hot':''}">PMD</div><div class="stack-cell${cur>=2?' hot':''}">PTE</div></div><p class="mini-copy">每一级页表项都可能带来一次内存访问。</p></div>
    <div class="lane-box"><div class="lane-title">Fault path</div><div class="edge-list"><div class="edge${active(3)}">缺页：内核分配物理页或从磁盘调入</div><div class="edge${active(4)}">权限错误：segfault / protection fault</div><div class="edge${active(6)}">2MB/1GB huge page 覆盖更大范围</div></div></div>
  </div>
</div>`);
}
function ioDiagram(){
  return stage('I/O PATH','I/O 有同步等待、异步提交、DMA 搬运、中断完成四类关键动作','CPU 主要做控制面：提交命令、设置 DMA buffer、处理中断；数据面由设备和内存总线完成。',
`<div class="stage-body" style="grid-template-rows:auto 1fr auto">
  <div class="decision-map"><div class="decision${active(0)}">syscall：用户态切内核态</div><div class="decision${active(1)}">driver：构造 descriptor / ring entry</div><div class="decision${active(2)}">DMA map：虚拟地址转物理页并 pin 住</div><div class="decision${active(3)}">device：通过 PCIe/总线写内存</div><div class="decision${active(4)}">interrupt/MSI-X：完成通知</div><div class="decision${active(5)}">bottom half：延后处理重活</div><div class="decision${active(6)}">wake：唤醒等待进程/回调</div><div class="decision">polling 模式：高吞吐下减少中断风暴</div></div>
  <div class="swimlanes">
    <div class="lane-box"><div class="lane-title">Control plane</div><div class="edge-list"><div class="edge${active(0)}">read/write/io_uring_enter 陷入内核</div><div class="edge${active(1)}">驱动写设备寄存器或提交队列项</div><div class="edge${active(6)}">完成后把任务放回可运行队列</div></div></div>
    <div class="lane-box"><div class="lane-title">Data plane</div><div class="edge-list"><div class="edge${active(2)}">DMA buffer 必须对应稳定物理页</div><div class="edge${active(3)}">设备直接把数据搬到内存，不经过 CPU 寄存器</div><div class="edge${active(3)}">Cache coherency / IOMMU 负责一致性与隔离</div></div></div>
    <div class="lane-box"><div class="lane-title">Completion</div><div class="edge-list"><div class="edge${active(4)}">中断只做快速确认，避免长时间关中断</div><div class="edge${active(5)}">softirq/tasklet/workqueue 处理后续工作</div><div class="edge">高性能网络常用 NAPI：中断切 polling</div></div></div>
  </div>
  <div class="stage-panel${cur>=4?' active':''}"><div class="stage-label">核心取舍</div><div class="chip-row"><span class="pill hot">中断：低延迟</span><span class="pill hot">轮询：高吞吐</span><span class="pill hot">DMA：低 CPU 拷贝成本</span><span class="pill hot">IOMMU：安全隔离</span></div></div>
</div>`);
}
function numberDiagram(){
  return stage('NUMBER REPRESENTATION','数值系统要同时理解编码、运算、溢出、舍入和特殊值','整数补码让硬件简单；浮点数用科学计数法近似表示，真正的坑在舍入、比较和 NaN 传播。',
`<div class="stage-body" style="grid-template-rows:auto 1fr">
  <div class="decision-map"><div class="decision${active(0)}">补码：负数取反加一</div><div class="decision${active(1)}">加法：同一套加法器，丢弃最高进位</div><div class="decision${active(2)}">溢出检测：同号相加变异号</div><div class="decision${active(3)}">float 编码：S/E/M</div><div class="decision${active(4)}">舍入：guard/round/sticky</div><div class="decision${active(5)}">特殊值：Inf / NaN / -0</div><div class="decision${active(6)}">比较：epsilon 或 decimal</div><div class="decision">金融：用整数分或定点数</div></div>
  <div class="stage-grid-2 stage-body">
    <div class="stage-panel${cur<=2?' active':''}"><div class="stage-label">Integer ALU</div><div class="bit-row">${[0,1,1,1,1,1,1,1].map((b,i)=>`<div class="bit${i===0||cur>=1?' hot':''}">${b}</div>`).join('')}</div><div class="edge-list"><div class="edge${active(0)}">-1 = 11111111，-128 = 10000000</div><div class="edge${active(1)}">硬件不区分有符号/无符号，加法结果相同</div><div class="edge${active(2)}">signed overflow 要单独判断</div></div></div>
    <div class="stage-panel${cur>=3?' active':''}"><div class="stage-label">IEEE 754 pipeline</div><div class="float-layout"><div class="float-part hot">S<br>1</div><div class="float-part hot">Exponent<br>11</div><div class="float-part hot">Mantissa<br>52</div></div><div class="edge-list"><div class="edge${active(3)}">规格化：(-1)^S × 1.M × 2^(E-bias)</div><div class="edge${active(4)}">无法精确表示时按舍入模式取最近值</div><div class="edge${active(5)}">NaN 不等于任何值，包括自身</div><div class="edge${active(6)}">业务比较用误差范围，不直接 ==</div></div></div>
  </div>
</div>`);
}
function diagram(){return id==='cache'?cacheDiagram():id==='memory'?memoryDiagram():id==='io'?ioDiagram():id==='number'?numberDiagram():cpuDiagram();}
function render(){const currentLines=(HL[id]&&HL[id][cur])||[cur,cur+1,cur+2];stepCards.innerHTML=`<div class="steps-list">${data.steps.map((s,i)=>`<div class="step-card${i===cur?' active':''}" data-concept="${i}"><strong>${i===cur?'当前知识点':'知识点 '+(i+1)}</strong><span>${s}</span></div>`).join('')}</div>`;diagramTitle.textContent=data.title+' · 架构图';diagramArea.innerHTML=diagram();flow.innerHTML=data.flow.map((f,i)=>`<div class="flow-node${i===cur?' active':''}" data-concept="${i}">${f}</div>`).join('');stepCards.querySelectorAll('.step-card').forEach(el=>el.onclick=()=>{cur=Number(el.dataset.concept);render();});flow.querySelectorAll('.flow-node').forEach(el=>el.onclick=()=>{cur=Math.min(Number(el.dataset.concept),data.steps.length-1);render();});codeBody.innerHTML=data.code.map((l,i)=>`<div class="code-line${currentLines.includes(i)?' active':''}"><span class="ln">${i+1}</span><span class="lc">${codeHtml(l)||'&nbsp;'}</span></div>`).join('');descText.textContent=data.steps[cur];stepCounter.textContent=`知识点 ${cur+1} / ${data.steps.length}`;btnPrev.disabled=cur===0;btnNext.disabled=cur===data.steps.length-1;}
function pause(){playing=false;clearTimeout(timer);}
function play(){}
function tick(){}
btnReset.onclick=()=>{pause();cur=0;render();};btnPrev.onclick=()=>{pause();if(cur>0){cur--;render();}};btnNext.onclick=()=>{pause();if(cur<data.steps.length-1){cur++;render();}};
render();if(window.NavTracker)NavTracker.track(data.title,location.href,'🧠','组成原理');
</script>
<script src="../footer.js"></script>
</body>
</html>
