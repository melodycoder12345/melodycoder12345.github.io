<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>现代专题 - 码海拾贝</title>
<style>
:root{
  --bg:#0f172a;--panel:#1e293b;--panel2:#0d1117;--border:#334155;
  --text:#e2e8f0;--dim:#94a3b8;--dim2:#64748b;
  --blue:#38bdf8;--yellow:#fbbf24;--orange:#fb923c;--green:#4ade80;
  --purple:#c084fc;--red:#f87171;--teal:#2dd4bf;--accent:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
nav{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;flex-wrap:wrap;}
.back-btn{color:var(--dim);text-decoration:none;font-size:.9rem;}.back-btn:hover{color:var(--text);}
nav h1{font-size:1.12rem;font-weight:700;}
.tags{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
.tag{font-size:.72rem;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--dim);font-family:monospace;}
.main{display:flex;flex:1;overflow:hidden;}
.viz-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;}
.viz-area{flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px;}
.step-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px;}
.step-card{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:rgba(255,255,255,.03);transition:all .2s;}
.step-card.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--accent) 18%,transparent);}
.step-num{font-family:monospace;font-size:.7rem;color:var(--dim2);margin-bottom:6px;}
.step-title{font-weight:700;font-size:.93rem;margin-bottom:6px;color:var(--text);}
.step-body{font-size:.82rem;color:var(--dim);line-height:1.65;}
.flow{border:1px solid var(--border);border-radius:14px;background:rgba(13,17,23,.7);padding:18px;display:flex;gap:10px;align-items:center;overflow-x:auto;}
.flow-node{min-width:120px;border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.04);font-size:.8rem;color:var(--dim);text-align:center;transition:all .2s;}
.flow-node.active{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 14%,transparent);}
.flow-arrow{color:var(--dim2);font-family:monospace;}
.viz-demo{border:1px solid var(--border);border-radius:14px;background:rgba(13,17,23,.74);padding:22px;min-height:260px;overflow:auto;display:flex;flex-direction:column;justify-content:center;}
.demo-title{font-size:.76rem;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;font-weight:700;}
.window-row,.stack-row,.log-row,.lane-row,.layer-row,.protocol-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cell{min-width:40px;height:38px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:.86rem;background:rgba(255,255,255,.04);color:var(--dim);position:relative;}
.cell.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--text);}
.cell.dim{opacity:.35;}
.cell .ptr{position:absolute;top:-18px;font-size:.62rem;color:var(--accent);}
.stack-col{display:flex;flex-direction:column-reverse;gap:6px;min-width:96px;align-items:center;}
.log-entry{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);border-radius:10px;padding:9px 12px;font-family:monospace;font-size:.78rem;color:var(--dim);}
.log-entry.active{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 12%,transparent);}
.lane{flex:1;min-width:130px;border:1px solid var(--border);border-radius:12px;padding:12px;background:rgba(255,255,255,.035);}
.lane h4{font-size:.78rem;color:var(--accent);margin-bottom:8px;}
.lane p{font-size:.78rem;color:var(--dim);line-height:1.6;}
.layer{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.04);font-size:.82rem;color:var(--dim);}
.layer.active{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 12%,transparent);}
.packet{min-width:110px;border:1px solid var(--border);border-radius:999px;padding:8px 12px;text-align:center;font-family:monospace;font-size:.78rem;color:var(--dim);background:rgba(255,255,255,.04);}
.packet.active{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 14%,transparent);}
.desc-box{padding:12px 24px;background:rgba(255,255,255,.03);border-top:1px solid var(--border);font-size:.88rem;color:var(--dim);min-height:48px;display:flex;align-items:center;gap:12px;}
.step-counter{margin-left:auto;font-size:.8rem;color:var(--dim);font-family:monospace;white-space:nowrap;}
.code-panel{width:44%;min-width:380px;display:flex;flex-direction:column;overflow:hidden;background:var(--panel2);}
.code-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:.84rem;color:var(--dim);display:flex;align-items:center;gap:8px;flex-shrink:0;background:rgba(255,255,255,.03);}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);}
.code-body{flex:1;overflow:auto;padding:16px 0;background:#0d1117;}
.code-line{display:flex;align-items:stretch;padding:1px 0;font-family:'JetBrains Mono','Fira Code',monospace;font-size:.8rem;line-height:1.65;border-left:2px solid transparent;}
.code-line.active{background:color-mix(in srgb,var(--accent) 13%,transparent);border-left-color:var(--accent);}
.ln{min-width:44px;padding:0 12px 0 14px;color:#4b5563;text-align:right;user-select:none;flex-shrink:0;font-size:.76rem;}
.lc{padding:0 16px 0 4px;white-space:pre-wrap;word-break:break-word;}
.kw{color:#ff7b72}.fn{color:#d2a8ff}.st{color:#a5d6ff}.num{color:#79c0ff}.cm{color:#8b949e;font-style:italic}.id{color:#e6edf3}.pkg{color:#ffa657}
.controls{display:flex;align-items:center;gap:10px;padding:12px 24px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.btn{background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all .15s;font-family:inherit;}
.btn:hover{background:rgba(255,255,255,.12);}.btn.primary{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.speed-wrap{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:.8rem;color:var(--dim);}
input[type=range]{-webkit-appearance:none;width:90px;height:4px;background:var(--border);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;}
@media(max-width:768px){
  body{height:auto;min-height:100vh;overflow-y:auto;overflow-x:hidden;}
  nav{padding:10px 16px;gap:8px;}
  .tags{width:100%;margin-left:0;}
  .main{flex-direction:column;overflow:visible;height:auto;flex:none;}
  .viz-panel{border-right:none;border-bottom:1px solid var(--border);overflow:visible;}
  .step-grid{grid-template-columns:1fr;}
  .code-panel{width:100%;min-width:unset;height:360px;flex:none;}
  .controls{flex-wrap:wrap;padding:10px 14px;gap:6px;}
  .speed-wrap{margin-left:0;width:100%;justify-content:flex-end;}
}
</style>
<script src="nav.js"></script>
<script src="concept.js"></script>
</head>
<body>
<nav>
  <a href="index.html" class="back-btn" id="backLink">← 返回</a>
  <h1 id="pageTitle">现代专题</h1>
  <div class="tags" id="tags"></div>
</nav>

<div class="main">
  <div class="viz-panel">
    <div class="viz-area">
      <div class="viz-demo" id="vizDemo"></div>
      <div class="step-grid" id="stepGrid"></div>
      <div class="flow" id="flow"></div>
    </div>
    <div class="desc-box">
      <span id="descText">准备开始</span>
      <span class="step-counter" id="stepCounter">0 / 0</span>
    </div>
  </div>

  <div class="code-panel">
    <div class="code-header">
      <span class="dot"></span>
      <span id="codeName">topic.go</span>
    </div>
    <div class="code-body" id="codeBody"></div>
  </div>
</div>

<div class="controls">
  <button class="btn" id="btnReset">⏮ 重置</button>
  <button class="btn" id="btnPrev">← 上一步</button>
  <button class="btn primary" id="btnPlay">▶ 播放</button>
  <button class="btn" id="btnNext">下一步 →</button>
  <div class="speed-wrap"><span>速度</span><input type="range" id="speedRange" min="1" max="5" value="3"></div>
</div>

<script>
const MODULE_META = {
  algo: { label:'现代算法模式', color:'#38bdf8', back:'algo/index.html' },
  db: { label:'现代数据库方向', color:'#fbbf24', back:'db/index.html' },
  kafka: { label:'现代 Kafka 方向', color:'#ff6b35', back:'kafka/index.html' },
  redis: { label:'Redis 7/8 现代特性', color:'#dc382c', back:'redis/index.html' },
  linux: { label:'现代 Linux 工程方向', color:'#f7c948', back:'linux/index.html' },
  network: { label:'现代网络协议方向', color:'#2dd4bf', back:'network/index.html' }
};

const TOPICS = {
  'redis-stream': {
    module:'redis',
    title:'Redis Stream',
    tags:['XADD','Consumer Group','ACK','Pending List'],
    summary:'Redis Stream 是 Redis 内置的消息流结构，提供追加日志、消费者组、消息确认和未确认消息追踪，适合作为轻量事件流系统。',
    concepts:[
      ['追加日志', 'Stream 用递增 ID 追加消息，保留消息历史，不像 Pub/Sub 那样只投递在线订阅者。'],
      ['消费者组', 'Consumer Group 让多个消费者分摊同一个 Stream，类似 Kafka Consumer Group，但更轻量。'],
      ['Pending List', '已投递但未 ACK 的消息会进入 PEL，可被重新认领，避免消费者宕机导致消息丢失。'],
      ['边界', 'Stream 适合轻量消息流，不等价于 Kafka 的长保留、大吞吐、分区副本体系。']
    ],
    steps:[
      ['写入消息','生产者通过 XADD 追加事件，Redis 生成全局递增 ID。'],
      ['创建消费组','XGROUP CREATE 建立消费组，记录每个组的消费进度。'],
      ['读取与 ACK','消费者 XREADGROUP 读取消息，业务成功后 XACK 确认。'],
      ['故障恢复','未 ACK 消息留在 Pending List，可由其他消费者 XCLAIM。']
    ],
    flow:['XADD','Stream Log','Consumer Group','XREADGROUP','XACK / PEL'],
    demo:'redis-log',
    code:[
      'type Event struct {',
      '    ID string',
      '    Fields map[string]string',
      '}',
      '',
      '// XADD order-events * order_id 42 status paid',
      'func appendEvent(stream string, fields map[string]string) string {',
      '    return redis.XAdd(stream, fields)',
      '}',
      '',
      '// XREADGROUP GROUP workers c1 STREAMS order-events >',
      'func consume(group, consumer string) {',
      '    events := redis.XReadGroup(group, consumer)',
      '    for _, e := range events {',
      '        handle(e)',
      '        redis.XAck(group, e.ID)',
      '    }',
      '}'
    ]
  },
  'cache-problems': {
    module:'redis', title:'缓存三大问题', tags:['穿透','击穿','雪崩','Bloom Filter'],
    summary:'缓存穿透、击穿、雪崩是缓存系统最常见的稳定性问题，本质是大量请求绕过缓存打到数据库。',
    concepts:[['缓存穿透','查询不存在的数据，缓存永远不命中。'],['缓存击穿','热点 key 过期瞬间，大量请求同时打到数据库。'],['缓存雪崩','大量 key 同时失效，数据库压力瞬间暴涨。'],['布隆过滤器','用概率结构在访问缓存前过滤不存在 key。']],
    steps:[['穿透识别','请求 key 不存在，缓存和数据库都查不到。'],['击穿保护','热点 key 失效时，用互斥锁或 singleflight 只放一个请求回源。'],['雪崩削峰','给 TTL 增加随机抖动，避免大量 key 同时过期。'],['前置过滤','布隆过滤器拦截不存在 key，降低数据库压力。']],
    flow:['Request','Bloom Filter','Cache','Mutex Rebuild','Database'],
    demo:'redis-log',
    code:['func get(key string) Value {','    if !bloom.MightContain(key) { return Nil }','    if v := cache.Get(key); v != nil { return v }','    lock(key)','    defer unlock(key)','    v := db.Query(key)','    cache.Set(key, v, ttl+jitter())','    return v','}']
  },
  'client-tracking-resp3': {
    module:'redis', title:'Client Tracking / RESP3', tags:['客户端缓存','失效通知','RESP3'],
    summary:'Client Tracking 允许客户端缓存 Redis 读结果，并在 key 变更时收到失效通知；RESP3 提供更丰富的数据类型表达。',
    concepts:[['客户端缓存','热点读可以缓存在客户端本地，减少网络往返。'],['失效通知','Redis 记录客户端读过哪些 key，写入时通知客户端删除本地缓存。'],['RESP3','协议层支持 map、set、push 等更丰富类型。'],['适用边界','适合读多写少热点 key；客户端需要正确处理失效消息。']],
    steps:[['开启 Tracking','客户端发送 CLIENT TRACKING ON。'],['本地命中','读取 key 后缓存到客户端内存。'],['写入变更','服务端检测 key 被修改。'],['推送失效','Redis 通过 push 消息通知客户端删除本地缓存。']],
    flow:['CLIENT TRACKING','GET key','Local Cache','SET key','Invalidation Push'],
    demo:'redis-log',
    code:['client.Do("CLIENT", "TRACKING", "ON")','value := client.Get("profile:42")','localCache.Set("profile:42", value)','// Redis later sends invalidation push','localCache.Delete("profile:42")']
  },
  'redis-stack-vector': {
    module:'redis', title:'Redis Stack / 向量搜索', tags:['RediSearch','JSON','Vector'],
    summary:'Redis Stack 把搜索、JSON、时序和向量检索带入 Redis，适合低延迟检索、RAG 缓存和实时推荐场景。',
    concepts:[['RediSearch','提供全文检索、二级索引和聚合能力。'],['RedisJSON','直接存储和更新 JSON 文档。'],['向量搜索','用 HNSW/FLAT 索引做近似最近邻检索。'],['RAG 缓存','把 embedding、文档片段和检索结果放入 Redis。']],
    steps:[['写入文档','JSON.SET 保存文档和元数据。'],['建立索引','FT.CREATE 定义文本字段和向量字段。'],['写入向量','embedding 作为二进制向量存储。'],['KNN 查询','FT.SEARCH 用向量相似度找最近文档。']],
    flow:['JSON Doc','Embedding','Vector Index','KNN Search','RAG Context'],
    demo:'redis-log',
    code:['FT.CREATE idx ON JSON PREFIX 1 doc:','SCHEMA $.title AS title TEXT','$.embedding AS vec VECTOR HNSW 6 TYPE FLOAT32 DIM 1536','FT.SEARCH idx "*=>[KNN 5 @vec $query]"']
  },
  'sliding-window': {
    module:'algo',
    title:'双指针 / 滑动窗口',
    tags:['O(n)','连续区间','限流窗口'],
    summary:'滑动窗口用 left/right 两个指针维护一个连续区间，在移动过程中增量维护窗口状态，避免对每个区间重复扫描。',
    explain:{
      what:'把“枚举所有子数组”的 O(n²) 思路，改成两个边界单调移动。右指针负责纳入新元素，左指针负责排除不合法元素。',
      when:'适合连续子数组、最长/最短满足条件区间、固定窗口统计、时间窗口限流、流式指标聚合。',
      pitfall:'关键是判断窗口什么时候“合法”。如果窗口状态无法增量维护，或左右边界不单调，滑动窗口就不适用。'
    },
    concepts:[
      ['窗口不变量','每一步都维护一个明确的不变量，例如 sum <= target、窗口内无重复字符、窗口大小固定为 k。'],
      ['右扩左缩','right 只向右扩张，left 只向右收缩，因此每个元素最多进入和离开窗口一次。'],
      ['增量状态','用 map、计数器、sum、maxDeque 等结构增量更新窗口状态，避免重新扫描窗口。'],
      ['限流类比','固定时间窗口、滑动时间窗口和令牌桶都可以借助“窗口内事件集合”来理解。']
    ],
    steps:[
      ['定义窗口语义','明确窗口 [left, right] 代表什么，以及答案在窗口合法时还是不合法时更新。'],
      ['右指针扩张','把 nums[right] 加入窗口，同步更新 sum/count/frequency 等状态。'],
      ['左指针收缩','当窗口违反约束时，持续移除 nums[left]，直到恢复合法。'],
      ['更新答案','根据题意更新最大长度、最小长度、计数或当前窗口聚合值。']
    ],
    flow:['left','right 扩张','更新状态','while 不合法','left 收缩','答案'],
    demo:'window',
    idea:[
      '// 模板：右扩，左缩，维护窗口不变量',
      'for right := 0; right < n; right++ {',
      '    add(nums[right])',
      '    for !valid(window) {',
      '        remove(nums[left])',
      '        left++',
      '    }',
      '    ans = best(ans, window)',
      '}'
    ],
    code:[
      'func longestUnique(s string) int {',
      '    left, ans := 0, 0',
      '    freq := map[byte]int{}',
      '',
      '    for right := 0; right < len(s); right++ {',
      '        freq[s[right]]++',
      '',
      '        for freq[s[right]] > 1 {',
      '            freq[s[left]]--',
      '            left++',
      '        }',
      '',
      '        ans = max(ans, right-left+1)',
      '    }',
      '    return ans',
      '}'
    ]
  },
  'monotonic-structures': {
    module:'algo',
    title:'单调栈 / 单调队列',
    tags:['Next Greater','窗口最大值','O(n)'],
    summary:'单调结构维护一个有序候选集合：栈适合找“下一个更大/更小”，队列适合滑动窗口最大/最小。',
    explain:{
      what:'进入结构前，先把以后不可能成为答案的元素弹出。剩下的元素保持单调，栈顶或队首就是当前最有价值的候选。',
      when:'适合 Next Greater Element、柱状图最大矩形、每日温度、滑动窗口最大值、区间最值等问题。',
      pitfall:'单调栈解决的是“最近更大/更小”的相对位置；单调队列还要额外删除已经滑出窗口的过期下标。'
    },
    concepts:[
      ['淘汰无用元素','如果新元素更强，旧元素在之后永远不会成为答案，可以直接弹出。'],
      ['保存下标','通常保存下标而不是值，因为需要判断距离、窗口过期或回填答案位置。'],
      ['单调队列','队首是当前窗口最优值，队尾维护单调性，窗口移动时移除过期下标。'],
      ['线性复杂度','每个元素最多入栈/入队一次、出栈/出队一次，因此总复杂度 O(n)。']
    ],
    steps:[
      ['读取新元素','按顺序扫描数组，把当前元素作为新候选。'],
      ['弹出弱候选','当栈顶或队尾元素不可能再成为答案时，将其弹出。'],
      ['写入答案','对于被弹出的元素，当前元素就是它的下一个更大值。'],
      ['保留候选','把当前下标压入结构，等待未来元素处理。']
    ],
    flow:['当前元素','比较栈顶','弹出弱候选','记录答案','压入下标'],
    demo:'stack',
    idea:[
      '// 单调递减栈：找每个元素右侧第一个更大值',
      'for i, x := range nums {',
      '    for len(st) > 0 && nums[top(st)] < x {',
      '        ans[top(st)] = x',
      '        pop(&st)',
      '    }',
      '    st = append(st, i)',
      '}'
    ],
    code:[
      'func nextGreater(nums []int) []int {',
      '    ans := make([]int, len(nums))',
      '    for i := range ans { ans[i] = -1 }',
      '    st := []int{}',
      '',
      '    for i, x := range nums {',
      '        for len(st) > 0 && nums[st[len(st)-1]] < x {',
      '            j := st[len(st)-1]',
      '            st = st[:len(st)-1]',
      '            ans[j] = x',
      '        }',
      '        st = append(st, i)',
      '    }',
      '    return ans',
      '}'
    ]
  },
  'probabilistic-ds': topic('algo','近似数据结构',['Bloom','HLL','CMS'],'近似结构用可控误差换取低内存，适合海量去重、基数估计和频率统计。',['确定误差模型','哈希映射','低内存存储','概率答案'],['hash','bit array','estimate','error bound']),

  'cloud-htap': topic('db','云原生 / HTAP',['NewSQL','存算分离'],'云原生数据库强调弹性、分布式事务、存算分离和行列混合分析。',['拆分计算存储','分布式事务','列存副本','弹性扩缩容'],['Compute','Storage','Raft','Column Store']),
  'kraft': topic('kafka','KRaft 模式',['Controller','Metadata Quorum'],'KRaft 用 Kafka 自身的元数据日志替代 ZooKeeper，简化部署和控制面一致性。',['Controller Quorum','元数据日志','Broker 注册','Leader 选举'],['Controller','Metadata Log','Broker','Partition']),
  'tiered-storage': topic('kafka','Tiered Storage',['冷热分层','Object Storage'],'分层存储把历史日志下沉对象存储，本地磁盘只保留热数据，降低长保留成本。',['热数据本地','冷数据上传','按需读取','独立扩容'],['Local Log','Remote Log','Object Storage','Fetch']),
  'exactly-once': topic('kafka','Exactly Once',['Idempotent','Transaction'],'Kafka 的精确一次依赖幂等 Producer、事务和 offset 原子提交共同配合。',['Producer ID','序列号去重','事务提交','offset 纳入事务'],['PID','Sequence','Txn Log','Offset']),
  'schema-connect': topic('kafka','Schema / Connect 生态',['Schema Registry','Connect'],'Schema Registry、Avro/Protobuf 和 Kafka Connect 是生产数据管道的关键配套。',['定义 schema','序列化消息','Connector 拉取','Sink 写入'],['Schema','Producer','Connect','Sink']),
  'ebpf': topic('linux','eBPF 可观测',['kprobe','tracepoint'],'eBPF 可以在安全沙箱中运行内核侧程序，用于观测、网络和安全。',['加载程序','挂载 hook','采集事件','用户态读取'],['BPF Program','Hook','Map','User Space']),
  'cgroup-namespace': topic('linux','cgroup v2 / Namespace',['Container','Resource'],'namespace 隔离视图，cgroup v2 限制资源，二者构成容器基础。',['隔离进程视图','限制 CPU/内存','挂载文件系统','启动容器进程'],['Namespace','cgroup v2','rootfs','process']),
  'zero-copy': topic('linux','零拷贝',['sendfile','mmap'],'零拷贝减少用户态和内核态之间的数据复制，适合文件传输和网络服务。',['文件页缓存','避免用户态拷贝','网卡 DMA','发送完成'],['Page Cache','sendfile','Socket','NIC']),

  'tls-ech': topic('network','TLS 1.3 / ECH',['1-RTT','ECH'],'TLS 1.3 简化握手，ECH 进一步隐藏 ClientHello 中的敏感域名信息。',['ClientHello','密钥协商','证书验证','加密通信'],['ClientHello','ECDHE','Certificate','AEAD']),
  'doh-dot-cdn': topic('network','DoH / DoT / CDN',['DNS','Edge'],'隐私 DNS 保护解析过程，CDN 通过边缘缓存和调度降低访问延迟。',['加密 DNS','递归解析','边缘调度','缓存命中'],['DoH','Resolver','CDN Edge','Cache']),
  'bbr-v2': topic('network','BBR v2 / QUIC 拥塞控制',['BBR','CUBIC'],'BBR 从带宽和 RTT 建模拥塞，区别于传统丢包驱动的 Reno/CUBIC。',['测量带宽','估计 RTT','控制发送速率','处理竞争流'],['Bandwidth','RTT','pacing','cwnd'])

function topic(module, title, tags, summary, steps, flow) {
  const demoByModule = {
    algo: 'window',
    db: 'layers',
    kafka: 'lanes',
    redis: 'redis-log',
    linux: 'layers',
    network: 'protocol'
  };
  return {
    module, title, tags, summary,
    demo: demoByModule[module] || 'layers',
    explain: {
      what: `${title} 关注的是现代工程中反复出现的一类模式，不只是单个 API 或名词。`,
      when: `当系统规模、性能、可靠性或成本成为主要约束时，可以用这个专题中的方法建立判断框架。`,
      pitfall: `不要只记结论，要同时看清它解决的问题、引入的成本，以及不适合使用的边界。`
    },
    concepts: steps.map((s, i) => [s, `第 ${i + 1} 步关注 ${s}，理解它在完整链路中的作用。`]),
    steps: steps.map((s, i) => [s, `围绕“${title}”的第 ${i + 1} 个关键动作：${s}。`]),
    flow,
    idea: [
      `// ${title}: 思考顺序`,
      `1. 先确认问题边界`,
      `2. 再选择核心结构或协议`,
      `3. 最后评估代价与失败场景`
    ],
    code: [
      `// ${title}: conceptual flow`,
      `func learn${title.replace(/[^A-Za-z0-9\u4e00-\u9fa5]/g, '')}() {`,
      ...flow.map((f, i) => `    step${i + 1}("${f}")`),
      `}`
    ]
  };
}

const params = new URLSearchParams(location.search);
const topicId = params.get('id') || 'redis-stream';
const data = TOPICS[topicId] || TOPICS['redis-stream'];
const meta = MODULE_META[data.module];
document.documentElement.style.setProperty('--accent', meta.color);
document.title = data.title + ' - 现代专题';
const explain = data.explain || {};
window.PAGE_CONCEPTS = [
  ['核心概念', explain.what || data.summary],
  ['适用场景', explain.when || '当这个问题反复出现，并且需要稳定复用一套判断框架时使用。'],
  ['常见误区', explain.pitfall || '不要脱离适用边界，也不要只记 API 名称而忽略背后的代价。'],
  ...data.concepts
].map(([title, body]) => ({ title, body }));

document.getElementById('backLink').href = meta.back;
document.getElementById('pageTitle').textContent = data.title;
document.getElementById('codeName').textContent = topicId.replace(/-/g, '_') + '.go';
document.getElementById('tags').innerHTML = data.tags.map(t => `<span class="tag">${t}</span>`).join('');

const stepGrid = document.getElementById('stepGrid');
const vizDemo = document.getElementById('vizDemo');
const flow = document.getElementById('flow');
const codeBody = document.getElementById('codeBody');
const descText = document.getElementById('descText');
const stepCounter = document.getElementById('stepCounter');
const btnPlay = document.getElementById('btnPlay');
const speedRange = document.getElementById('speedRange');
const SPEED = [1400,1000,700,450,260];
let cur = 0, playing = false, timer = null;

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function codeHtml(line) {
  return escapeHtml(line)
    .replace(/(func|type|return|for|if|else|map|string|int|struct)/g, '<span class="kw">$1</span>')
    .replace(/"(.*?)"/g, '<span class="st">"$1"</span>')
    .replace(/(\/\/.*)$/g, '<span class="cm">$1</span>');
}

function renderDemo() {
  const active = cur;
  const flowItems = data.flow || [];
  const title = escapeHtml(data.title);
  if (data.demo === 'window') {
    const values = ['A','B','C','B','D','A','E'];
    const left = Math.min(active, 3);
    const right = Math.min(active + 2, values.length - 1);
    vizDemo.innerHTML = `
      <div class="demo-title">${title} · 窗口移动</div>
      <div class="window-row">
        ${values.map((v,i)=>`<div class="cell${i>=left&&i<=right?' active':' dim'}">${i===left?'<span class="ptr">L</span>':''}${i===right?'<span class="ptr">R</span>':''}${v}</div>`).join('')}
      </div>
    `;
    return;
  }
  if (data.demo === 'stack') {
    const values = [2, 1, 5, 3, 6];
    const stack = values.slice(0, Math.min(active + 2, values.length));
    vizDemo.innerHTML = `
      <div class="demo-title">${title} · 候选结构</div>
      <div class="stack-row">
        <div class="window-row">${values.map((v,i)=>`<div class="cell${i===active?' active':''}">${v}</div>`).join('')}</div>
        <span class="flow-arrow">→</span>
        <div class="stack-col">${stack.map((v,i)=>`<div class="cell${i===stack.length-1?' active':''}">${v}</div>`).join('')}</div>
      </div>
    `;
    return;
  }
  if (data.demo === 'redis-log') {
    vizDemo.innerHTML = `
      <div class="demo-title">${title} · 命令 / 事件流</div>
      <div class="log-row">
        ${flowItems.map((f,i)=>`<div class="log-entry${i===active?' active':''}">${escapeHtml(f)}</div>`).join('')}
      </div>
    `;
    return;
  }
  if (data.demo === 'lanes') {
    vizDemo.innerHTML = `
      <div class="demo-title">${title} · 分布式链路</div>
      <div class="lane-row">
        ${flowItems.map((f,i)=>`<div class="lane${i===active?' active':''}"><h4>${escapeHtml(f)}</h4><p>${i===active?'当前步骤正在处理这里。':'等待上游状态推进。'}</p></div>`).join('')}
      </div>
    `;
    return;
  }
  if (data.demo === 'protocol') {
    vizDemo.innerHTML = `
      <div class="demo-title">${title} · 协议阶段</div>
      <div class="protocol-row">
        ${flowItems.map((f,i)=>`<div class="packet${i===active?' active':''}">${escapeHtml(f)}</div>${i<flowItems.length-1?'<span class="flow-arrow">⇄</span>':''}`).join('')}
      </div>
    `;
    return;
  }
  vizDemo.innerHTML = `
    <div class="demo-title">${title} · 分层链路</div>
    <div class="layer-row">
      ${flowItems.map((f,i)=>`<div class="layer${i===active?' active':''}">${escapeHtml(f)}</div>`).join('')}
    </div>
  `;
}

function render() {
  renderDemo();
  stepGrid.innerHTML = data.steps.map(([title, body], i) => `
    <div class="step-card${i === cur ? ' active' : ''}">
      <div class="step-num">STEP ${i + 1}</div>
      <div class="step-title">${escapeHtml(title)}</div>
      <div class="step-body">${escapeHtml(body)}</div>
    </div>
  `).join('');
  flow.innerHTML = data.flow.map((f, i) => `
    ${i ? '<span class="flow-arrow">→</span>' : ''}
    <div class="flow-node${i === cur ? ' active' : ''}">${escapeHtml(f)}</div>
  `).join('');
  codeBody.innerHTML = data.code.map((line, i) => `
    <div class="code-line${Math.abs(i - cur - 1) <= 1 ? ' active' : ''}">
      <span class="ln">${i + 1}</span><span class="lc">${codeHtml(line) || '&nbsp;'}</span>
    </div>
  `).join('');
  descText.textContent = data.steps[cur][1];
  stepCounter.textContent = `${cur + 1} / ${data.steps.length}`;
  document.getElementById('btnPrev').disabled = cur === 0;
  document.getElementById('btnNext').disabled = cur === data.steps.length - 1;
}

function pause(){playing=false;clearTimeout(timer);btnPlay.textContent='▶ 播放';}
function play(){playing=true;btnPlay.textContent='⏸ 暂停';tick();}
function tick(){if(!playing)return;if(cur<data.steps.length-1){cur++;render();timer=setTimeout(tick,SPEED[+speedRange.value-1]);}else pause();}
document.getElementById('btnReset').onclick=()=>{pause();cur=0;render();};
document.getElementById('btnPrev').onclick=()=>{pause();if(cur>0){cur--;render();}};
document.getElementById('btnNext').onclick=()=>{pause();if(cur<data.steps.length-1){cur++;render();}};
btnPlay.onclick=()=>{playing?pause():play();};
render();
if (window.NavTracker) NavTracker.track(data.title, window.location.href, '🧭', meta.label);
</script>
</body>
</html>
