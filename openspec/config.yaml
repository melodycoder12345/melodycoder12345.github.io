schema: spec-driven

context: |
  Static HTML/CSS/JavaScript knowledge site with Vitest and Playwright.
  Canonical knowledge nodes live in knowledge/nodes/*.json and reviewed
  relations live in knowledge/relations.json. knowledge-data.js is generated.
  New knowledge pages must include page profiles, meaningful relations,
  navigation/SEO entry points, failure or boundary cases, and desktop checks.
  Existing concept pages are reused when they already own a topic; do not
  duplicate a concept merely because it appears in another learning stage.

rules:
  proposal:
    - State whether existing knowledge pages are reused, extended, or newly created.
    - Keep one independently releasable learning outcome in one change.
  specs:
    - Include scenarios for stage ordering, concept reuse, interaction states, and verification.
  tasks:
    - Separate OpenSpec, content, knowledge data, and automated verification work.
