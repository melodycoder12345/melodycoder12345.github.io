<script>
window.PAGE_CONCEPTS = [
  { title: 'Buffer Pool', body: `Buffer Pool 是数据库自己的页缓存，缓存数据页、索引页和部分元数据。命中时直接从内存读页，未命中才触发磁盘 I/O。` },
  { title: '页表 HashMap', body: `页号到 frame 的映射通常用哈希表维护，读取时先 O(1) 判断页面是否已经在内存中。` },
  { title: '教学版 LRU', body: `本页演示的是教科书 LRU：最近访问的页移动到链表头部，淘汰时从尾部选择最久未使用页。哈希表 + 双向链表可以让命中和移动都保持 O(1)。`, tag: 'LRU' },
  { title: '脏页', body: `被修改但尚未写回磁盘的页面称为脏页。淘汰脏页前必须先刷盘，并满足 WAL 的先写日志规则。` },
  { title: '缓存污染', body: `全表扫描可能一次性读入大量冷页，挤掉热点页。InnoDB 使用 young/old 分区等策略降低顺序扫描对热点缓存的污染。` }
];

// ─── Constants ───────────────────────────────────────────────────────────────
const CAPACITY = 4;
const ACCESS_SEQ = [1,2,3,4,1,5,1,6,2,3,5,7];
const SPEED = [1200,800,500,300,150];

// ─── Go code lines ────────────────────────────────────────────────────────────
const CODE_LINES = [
  {ln:1,  html:`<span class="cm">// 教学版 BufferPool: HashMap + 双向链表 实现 O(1) LRU</span>`},
  {ln:2,  html:`<span class="kw">type</span> <span class="id">BufferPool</span> <span class="kw">struct</span> {`},
  {ln:3,  html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">frames</span> <span class="kw">map</span>[<span class="kw">int</span>]*<span class="id">Page</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// pageID → Page，O(1) 查找</span>`},
  {ln:4,  html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">lru</span>    *<span class="pkg">list</span>.<span class="id">List</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// 双向链表，MRU ← → LRU</span>`},
  {ln:5,  html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">elems</span>  <span class="kw">map</span>[<span class="kw">int</span>]*<span class="pkg">list</span>.<span class="id">Element</span>`},
  {ln:6,  html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">cap</span>    <span class="kw">int</span>`},
  {ln:7,  html:`}`},
  {ln:8,  html:``},
  {ln:9,  html:`<span class="cm">// GetPage 读取页面，O(1) 时间复杂度</span>`},
  {ln:10, html:`<span class="kw">func</span> (<span class="id">bp</span> *<span class="id">BufferPool</span>) <span class="fn">GetPage</span>(<span class="id">pageID</span> <span class="kw">int</span>) *<span class="id">Page</span> {`},
  {ln:11, html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// 1. 查询 HashMap，O(1) 判断是否在缓冲池</span>`},
  {ln:12, html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> <span class="id">elem</span>, <span class="id">ok</span> := <span class="id">bp</span>.<span class="id">elems</span>[<span class="id">pageID</span>]; <span class="id">ok</span> {`},
  {ln:13, html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">bp</span>.<span class="id">lru</span>.<span class="fn">MoveToFront</span>(<span class="id">elem</span>) <span class="cm">// O(1) 移动到 MRU 端</span>`},
  {ln:14, html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> <span class="id">bp</span>.<span class="id">frames</span>[<span class="id">pageID</span>] <span class="cm">// 缓存命中 ✓</span>`},
  {ln:15, html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {ln:16, html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// 2. 缓存未命中，检查是否需要驱逐</span>`},
  {ln:17, html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> <span class="fn">len</span>(<span class="id">bp</span>.<span class="id">frames</span>) &gt;= <span class="id">bp</span>.<span class="id">cap</span> {`},
  {ln:18, html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">bp</span>.<span class="fn">evict</span>() <span class="cm">// 驱逐 LRU 末尾页面</span>`},
  {ln:19, html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {ln:20, html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// 3. 从磁盘读取（慢！磁盘 I/O）</span>`},
  {ln:21, html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">page</span> := <span class="fn">readDisk</span>(<span class="id">pageID</span>)`},
  {ln:22, html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">bp</span>.<span class="id">frames</span>[<span class="id">pageID</span>] = <span class="id">page</span>`},
  {ln:23, html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">bp</span>.<span class="id">elems</span>[<span class="id">pageID</span>] = <span class="id">bp</span>.<span class="id">lru</span>.<span class="fn">PushFront</span>(<span class="id">pageID</span>)`},
  {ln:24, html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> <span class="id">page</span>`},
  {ln:25, html:`}`},
  {ln:26, html:``},
  {ln:27, html:`<span class="cm">// evict 驱逐最久未使用的页面，O(1)</span>`},
  {ln:28, html:`<span class="kw">func</span> (<span class="id">bp</span> *<span class="id">BufferPool</span>) <span class="fn">evict</span>() {`},
  {ln:29, html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">victim</span> := <span class="id">bp</span>.<span class="id">lru</span>.<span class="fn">Back</span>()`},
  {ln:30, html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">id</span> := <span class="id">victim</span>.<span class="id">Value</span>.(<span class="kw">int</span>)`},
  {ln:31, html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> <span class="id">bp</span>.<span class="id">frames</span>[<span class="id">id</span>].<span class="id">dirty</span> { <span class="fn">writeDisk</span>(<span class="id">bp</span>.<span class="id">frames</span>[<span class="id">id</span>]) }`},
  {ln:32, html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">delete</span>(<span class="id">bp</span>.<span class="id">frames</span>, <span class="id">id</span>)`},
  {ln:33, html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">delete</span>(<span class="id">bp</span>.<span class="id">elems</span>, <span class="id">id</span>)`},
  {ln:34, html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">bp</span>.<span class="id">lru</span>.<span class="fn">Remove</span>(<span class="id">victim</span>)`},
  {ln:35, html:`}`},
];

// ─── Step Generation ─────────────────────────────────────────────────────────
function generateSteps() {
  const steps = [];
  // current pool state: array of 4 frames {pageId: null|N, highlight: null}
  const pool = Array.from({length: CAPACITY}, () => ({pageId: null, highlight: null}));
  // lruOrder: most-recent first
  let lruOrder = [];
  let diskReads = 0;
  let cacheHits = 0;
  let cacheMisses = 0;

  function clonePool(p) { return p.map(f => ({...f})); }
  function cloneArr(a) { return [...a]; }

  // Step 0: initial state
  steps.push({
    pool: clonePool(pool),
    lruOrder: cloneArr(lruOrder),
    requesting: null,
    reqIndex: -1,
    diskReads,
    cacheHits,
    cacheMisses,
    highlightLines: [1,2,3,4,5,6,7],
    description: '初始状态：缓冲池为空，HashMap 和双向链表均为空。',
  });

  for (let i = 0; i < ACCESS_SEQ.length; i++) {
    const pageId = ACCESS_SEQ[i];

    // Reset all highlights
    pool.forEach(f => f.highlight = null);

    // Step A: requesting
    steps.push({
      pool: clonePool(pool),
      lruOrder: cloneArr(lruOrder),
      requesting: pageId,
      reqIndex: i,
      diskReads,
      cacheHits,
      cacheMisses,
      highlightLines: [10,11,12],
      description: `正在请求 Page ${pageId} → 查询 HashMap 判断是否已在缓冲池...`,
    });

    const inPool = lruOrder.includes(pageId);

    if (inPool) {
      // HIT: move to front
      cacheHits++;
      lruOrder = [pageId, ...lruOrder.filter(x => x !== pageId)];
      // Update highlight
      const frameIdx = pool.findIndex(f => f.pageId === pageId);
      if (frameIdx !== -1) pool[frameIdx].highlight = 'hit';

      steps.push({
        pool: clonePool(pool),
        lruOrder: cloneArr(lruOrder),
        requesting: pageId,
        reqIndex: i,
        diskReads,
        cacheHits,
        cacheMisses,
        highlightLines: [12,13,14],
        description: `✓ 命中！Page ${pageId} 已在缓冲池（Frame ${pool.findIndex(f=>f.pageId===pageId)}），移至 LRU 头部（MRU）。`,
      });
    } else {
      // MISS
      cacheMisses++;
      const isFull = lruOrder.length >= CAPACITY;

      if (isFull) {
        const evictId = lruOrder[lruOrder.length - 1];
        const evictFrameIdx = pool.findIndex(f => f.pageId === evictId);

        // Mark evicting frame
        pool.forEach(f => f.highlight = null);
        if (evictFrameIdx !== -1) pool[evictFrameIdx].highlight = 'evict';

        steps.push({
          pool: clonePool(pool),
          lruOrder: cloneArr(lruOrder),
          requesting: pageId,
          reqIndex: i,
          diskReads,
          cacheHits,
          cacheMisses,
          highlightLines: [16,17,18,28,29,30,31,32,33,34],
          description: `✗ 未命中，缓冲池已满（${CAPACITY}/${CAPACITY}）。驱逐 LRU 末尾 Page ${evictId}（最久未使用）。`,
        });

        diskReads++;
        // Actually evict
        lruOrder = lruOrder.filter(x => x !== evictId);
        if (evictFrameIdx !== -1) {
          pool[evictFrameIdx].pageId = pageId;
          pool[evictFrameIdx].highlight = 'load';
        }
        lruOrder = [pageId, ...lruOrder];

        steps.push({
          pool: clonePool(pool),
          lruOrder: cloneArr(lruOrder),
          requesting: pageId,
          reqIndex: i,
          diskReads,
          cacheHits,
          cacheMisses,
          highlightLines: [20,21,22,23],
          description: `磁盘 I/O：Page ${evictId} 已驱逐，Page ${pageId} 从磁盘读入 Frame ${evictFrameIdx}，加入 LRU 头部。`,
        });
      } else {
        // Space available
        diskReads++;
        const emptyIdx = pool.findIndex(f => f.pageId === null);
        pool[emptyIdx].pageId = pageId;
        pool[emptyIdx].highlight = 'load';
        lruOrder = [pageId, ...lruOrder];

        steps.push({
          pool: clonePool(pool),
          lruOrder: cloneArr(lruOrder),
          requesting: pageId,
          reqIndex: i,
          diskReads,
          cacheHits,
          cacheMisses,
          highlightLines: [16,17,20,21,22,23],
          description: `✗ 未命中，缓冲池有空闲（Frame ${emptyIdx}）。从磁盘读取 Page ${pageId}，磁盘读取次数 +1。`,
        });
      }
    }
  }

  // Final summary
  pool.forEach(f => f.highlight = null);
  steps.push({
    pool: clonePool(pool),
    lruOrder: cloneArr(lruOrder),
    requesting: null,
    reqIndex: ACCESS_SEQ.length,
    diskReads,
    cacheHits,
    cacheMisses,
    highlightLines: [],
    description: `模拟完成。命中率 ${(cacheHits/(cacheHits+cacheMisses)*100).toFixed(1)}%，共 ${diskReads} 次磁盘 I/O，${cacheHits} 次缓存命中。`,
  });

  return steps;
}

// ─── State ────────────────────────────────────────────────────────────────────
const steps = generateSteps();
let cur = 0, playing = false, timer = null;

// ─── DOM refs ─────────────────────────────────────────────────────────────────
const poolFrames  = document.getElementById('poolFrames');
const lruChain    = document.getElementById('lruChain');
const reqSeq      = document.getElementById('reqSeq');
const statsRow    = document.getElementById('statsRow');
const descText    = document.getElementById('descText');
const stepCounter = document.getElementById('stepCounter');
const codeBody    = document.getElementById('codeBody');
const btnReset    = document.getElementById('btnReset');
const btnPrev     = document.getElementById('btnPrev');
const btnPlay     = document.getElementById('btnPlay');
const btnNext     = document.getElementById('btnNext');
const speedRange  = document.getElementById('speedRange');

// ─── Render Code ─────────────────────────────────────────────────────────────
function buildCode() {
  codeBody.innerHTML = CODE_LINES.map(({ln, html}) =>
    `<div class="code-line" data-ln="${ln}">` +
      `<span class="ln">${ln}</span>` +
      `<span class="lc">${html}</span>` +
    `</div>`
  ).join('');
}

function highlightLines(lines) {
  document.querySelectorAll('.code-line').forEach(el => {
    el.classList.toggle('active', lines.includes(+el.dataset.ln));
  });
  // Auto-scroll to first active line
  if (lines.length > 0) {
    const first = document.querySelector(`.code-line[data-ln="${lines[0]}"]`);
    if (first) first.scrollIntoView({block:'nearest', behavior:'smooth'});
  }
}

// ─── Render Frame Box ─────────────────────────────────────────────────────────
function renderFrameBox(frame, idx) {
  const pageColors = {
    hit:   'rgba(74,222,128,0.15)',
    miss:  'rgba(248,113,113,0.15)',
    evict: 'rgba(251,146,60,0.15)',
    load:  'rgba(56,189,248,0.15)',
  };
  const borderColors = {
    hit:   '#4ade80',
    miss:  '#f87171',
    evict: '#fb923c',
    load:  '#38bdf8',
  };
  const bg     = frame.highlight ? pageColors[frame.highlight]  : 'rgba(255,255,255,0.03)';
  const border = frame.highlight ? borderColors[frame.highlight]: 'var(--border)';

  const inner = frame.pageId !== null
    ? `<div class="frame-page">Page ${frame.pageId}</div>
       <div class="frame-rows">rows ${(frame.pageId-1)*5+1}-${frame.pageId*5}</div>`
    : `<div class="frame-empty">[ empty ]</div>`;

  return `<div class="frame-box" style="background:${bg};border-color:${border};">
    <div class="frame-label">Frame ${idx}</div>
    ${inner}
  </div>`;
}

// ─── Render LRU Chain ─────────────────────────────────────────────────────────
function renderLRUChain(lruOrder) {
  if (lruOrder.length === 0) {
    lruChain.innerHTML = '<span style="color:var(--dim);font-size:0.82rem;font-family:monospace;">空</span>';
    return;
  }
  lruChain.innerHTML = lruOrder.map((pid, i) => {
    const isMRU = i === 0;
    const isLRU = i === lruOrder.length - 1;
    const badge = isMRU
      ? `<span class="lru-badge" style="color:var(--green)">MRU</span>`
      : isLRU
        ? `<span class="lru-badge" style="color:var(--red)">LRU</span>`
        : '';
    const arrow = i > 0 ? `<span class="lru-arrow">→</span>` : '';
    return `<div class="lru-node">
      ${arrow}
      <div class="lru-page">P${pid}${badge}</div>
    </div>`;
  }).join('');
}

// ─── Render Access Sequence ───────────────────────────────────────────────────
function renderReqSeq(reqIndex, pool, lruOrder) {
  reqSeq.innerHTML = ACCESS_SEQ.map((pid, i) => {
    let cls = 'req-item';
    if (i === reqIndex) cls += ' active';
    else if (i < reqIndex) {
      // Determine if this was a hit or miss by checking if it's in the current pool
      // We use a heuristic: check final outcome coloring stored per-step
      cls += ' done-miss'; // will be overridden below via stored result
    }
    return `<div class="${cls}" title="Page ${pid}">${pid}</div>`;
  }).join('');
}

function renderReqSeqFromSteps(reqIndex) {
  // Build hit/miss map from steps
  const resultMap = {};
  for (const s of steps) {
    if (s.reqIndex >= 0 && s.reqIndex < ACCESS_SEQ.length) {
      if (s.description.startsWith('✓')) resultMap[s.reqIndex] = 'hit';
      else if (s.description.startsWith('✗')) resultMap[s.reqIndex] = 'miss';
    }
  }
  reqSeq.innerHTML = ACCESS_SEQ.map((pid, i) => {
    let cls = 'req-item';
    if (i === reqIndex) cls += ' active';
    else if (i < reqIndex) {
      cls += resultMap[i] === 'hit' ? ' done-hit' : ' done-miss';
    }
    return `<div class="${cls}" title="Page ${pid}">${pid}</div>`;
  }).join('');
}

// ─── Render Stats ─────────────────────────────────────────────────────────────
function renderStats(s) {
  const total = s.cacheHits + s.cacheMisses;
  const hitRate = total > 0 ? (s.cacheHits / total * 100).toFixed(1) : '0.0';
  statsRow.innerHTML = `
    <div class="stat-item"><div class="stat-label">缓存命中</div><div class="stat-val" style="color:var(--green)">${s.cacheHits}</div></div>
    <div class="stat-item"><div class="stat-label">缓存未命中</div><div class="stat-val" style="color:var(--red)">${s.cacheMisses}</div></div>
    <div class="stat-item"><div class="stat-label">磁盘 I/O</div><div class="stat-val" style="color:var(--orange)">${s.diskReads}</div></div>
    <div class="stat-item"><div class="stat-label">命中率</div><div class="stat-val" style="color:var(--blue)">${hitRate}%</div></div>
    <div class="stat-item"><div class="stat-label">LRU 容量</div><div class="stat-val">${s.lruOrder.length} / ${CAPACITY}</div></div>
  `;
}

// ─── Main Render ─────────────────────────────────────────────────────────────
function render() {
  const s = steps[cur];

  // Pool frames
  poolFrames.innerHTML = s.pool.map((f, i) => renderFrameBox(f, i)).join('');

  // LRU chain
  renderLRUChain(s.lruOrder);

  // Access sequence
  renderReqSeqFromSteps(s.reqIndex);

  // Stats
  renderStats(s);

  // Description
  descText.textContent = s.description;
  stepCounter.textContent = `步骤 ${cur} / ${steps.length - 1}`;

  // Code highlight
  highlightLines(s.highlightLines);

  // Button states
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;
}

// ─── Playback Controls ────────────────────────────────────────────────────────
function play() {
  playing = true;
  btnPlay.innerHTML = '⏸ 暂停';
  tick();
}

function pause() {
  playing = false;
  clearTimeout(timer);
  btnPlay.innerHTML = '▶ 播放';
}

function tick() {
  if (!playing) return;
  if (cur < steps.length - 1) {
    cur++;
    render();
    timer = setTimeout(tick, SPEED[+speedRange.value - 1]);
  } else {
    pause();
  }
}

btnPlay.addEventListener('click', () => {
  if (playing) pause();
  else if (cur < steps.length - 1) play();
  else { cur = 0; render(); play(); }
});

btnNext.addEventListener('click', () => {
  if (cur < steps.length - 1) { cur++; render(); }
});

btnPrev.addEventListener('click', () => {
  if (cur > 0) { cur--; render(); }
});

btnReset.addEventListener('click', () => {
  pause();
  cur = 0;
  render();
});

// ─── Init ─────────────────────────────────────────────────────────────────────
buildCode();
render();
</script>
<script src="../footer.js"></script>
</body>
</html>
