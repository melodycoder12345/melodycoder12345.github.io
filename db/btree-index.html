<script>
window.PAGE_CONCEPTS = [
  { title: 'B+ 树高度', body: `B+ 树保持多路平衡，真实数据库中高度通常只有 3-4 层。一次点查只需从根到叶访问少量页，复杂度约为 O(log n)。` },
  { title: '叶节点存数据', body: `B+ 树内部节点只保存分隔键和子指针，数据记录或 row_id 存在叶节点。这样内部节点更小，单页容纳更多 key，树高度更低。` },
  { title: '叶子链表', body: `所有叶节点按 key 顺序相连。范围查询先定位左边界叶节点，再沿链表顺序扫描，避免反复从根查找。`, tag: 'Range Scan' },
  { title: '节点分裂', body: `插入导致叶节点或内部节点溢出时，会分裂节点并把分隔键上推。分裂可能级联到根节点，从而让树高度增加一层。` },
  { title: '聚簇与二级索引', body: `聚簇索引叶子保存整行数据，二级索引叶子通常保存主键值。二级索引命中后可能需要回表读取完整行。` }
];

  {id:9,name:'Eve',dept:'CS',salary:8800},
  {id:11,name:'Frank',dept:'HR',salary:7500},
  {id:13,name:'Grace',dept:'FE',salary:9000},
];

// B+ tree node definitions (static for visualization)
// node id, type, keys, children ids, rows (leaf)
const TREE_NODES={
  root:{id:'root',isLeaf:false,keys:[5],children:['n1','n2']},
  n1:{id:'n1',isLeaf:false,keys:[3],children:['l1','l2']},
  n2:{id:'n2',isLeaf:false,keys:[9,11],children:['l3','l4','l5']},
  l1:{id:'l1',isLeaf:true,keys:[1,3],rows:[ROWS[0],ROWS[1]],next:'l2'},

  l3:{id:'l3',isLeaf:true,keys:[5,7,9],rows:[ROWS[2],ROWS[3],ROWS[4]],next:'l4'},
  l4:{id:'l4',isLeaf:true,keys:[9,11],rows:[ROWS[4],ROWS[5]],next:'l5'},
  l5:{id:'l5',isLeaf:true,keys:[11,13],rows:[ROWS[5],ROWS[6]],next:null},

const LEAVES=['l1','l2','l3','l4','l5'];

// Layout
const SVG_W=680, SVG_H=320;
const NODE_H=36, INT_W=72, LEAF_W=100;
const nodePos={
  root:{x:SVG_W/2,y:44,w:INT_W},
  n1:{x:SVG_W*0.3,y:130,w:INT_W},

// ─── Code lines ──────────────────────────────────────────────────────
const CODE_LINES=[
  {ln:1, html:'<span class="cm">// B+ 树索引：数据只存叶节点，叶节点用链表连接</span>'},

  {ln:19,html:'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> <span class="id">k</span> == <span class="id">key</span> { <span class="kw">return</span> &<span class="id">node</span>.<span class="id">rows</span>[<span class="id">i</span>] }'},

  {ln:21,html:'&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> <span class="num">nil</span> <span class="cm">// 未找到</span>'},
  {ln:22,html:'}'},
  {ln:23,html:''},
  {ln:24,html:'<span class="cm">// RangeQuery: 先找左端点，再沿链表扫描</span>'},
  {ln:25,html:'<span class="kw">func</span> (<span class="id">t</span> *<span class="id">BPlusTree</span>) <span class="fn">RangeQuery</span>(<span class="id">lo</span>, <span class="id">hi</span> <span class="kw">int</span>) []<span class="id">Row</span> {'},

  {ln:35,html:'&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> <span class="id">result</span>'},
  {ln:36,html:'}'},
];

    {highlightNodes:[],foundNodes:[],rangeNodes:[],insertLeaf:'l3',splitFrom:null,splitTo:null,result:[],highlightLines:[],description:'叶节点 [5,7,9] 已满（3键）→ 插入 id=6 后变为 [5,6,7,9]，触发分裂'},
    {highlightNodes:[],foundNodes:[],rangeNodes:[],insertLeaf:null,splitFrom:'l3',splitTo:'l3b',result:[],highlightLines:[],description:'分裂叶节点：左半 [5,6]，右半 [7,9]；中间键 7 上推到父节点。链表指针重新连接'},
    {highlightNodes:['n2'],foundNodes:[],rangeNodes:[],insertLeaf:null,splitFrom:null,splitTo:null,result:[newRow],highlightLines:[],description:'父节点 [9,11] 接收上推键 7 → 变为 [7,9,11]，仍在阶数内无需再分裂。插入完成！'},
  ];
}

// ─── State machine ────────────────────────────────────────────────────
let activeTab=0;
let steps=[], cur=0, playing=false, timer=null;
const SPEED=[1200,800,500,300,150];

const allSteps=[makeSearchSteps(),makeRangeSteps(),makeInsertSteps()];

function switchTab(t){
  activeTab=t;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===t));
  pause();
  steps=allSteps[t];
  cur=0;
  render();
}

// ─── SVG renderer ────────────────────────────────────────────────────
function getNodeColor(nodeId,step){
  if(step.foundNodes&&step.foundNodes.includes(nodeId)) return 'var(--green)';
  if(step.rangeNodes&&step.rangeNodes.includes(nodeId)) return 'var(--purple)';
  if(step.highlightNodes&&step.highlightNodes.includes(nodeId)) return 'var(--yellow)';
  const n=TREE_NODES[nodeId];
  if(n.isLeaf) return 'var(--teal)';
  return 'var(--blue)';
}
function getNodeBg(nodeId,step){
  if(step.foundNodes&&step.foundNodes.includes(nodeId)) return 'rgba(74,222,128,.18)';
  if(step.rangeNodes&&step.rangeNodes.includes(nodeId)) return 'rgba(192,132,252,.18)';
  if(step.highlightNodes&&step.highlightNodes.includes(nodeId)) return 'rgba(251,191,36,.18)';
  return 'rgba(30,41,59,0.95)';
}

function renderTree(step){
  const svg=document.getElementById('treeSvg');
  const W=Math.max(svg.clientWidth,SVG_W);
  const scaleX=W/SVG_W;
  svg.setAttribute('viewBox',`0 0 ${SVG_W} ${SVG_H}`);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svg.style.height='320px';

  let html='';

  // Draw edges first
  // root → n1, n2
  function edge(fromId,toId){
    const fp=nodePos[fromId], tp=nodePos[toId];
    const x1=fp.x, y1=fp.y+NODE_H/2;
    const x2=tp.x, y2=tp.y-NODE_H/2;
    const hl=(step.highlightNodes&&(step.highlightNodes.includes(fromId)||step.highlightNodes.includes(toId)));
    const rng=(step.rangeNodes&&(step.rangeNodes.includes(fromId)||step.rangeNodes.includes(toId)));
    const fnd=(step.foundNodes&&(step.foundNodes.includes(fromId)||step.foundNodes.includes(toId)));
    const color=fnd?'#4ade80':rng?'#c084fc':hl?'#fbbf24':'#334155';
    const w=hl||fnd||rng?2:1.5;
    html+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" marker-end="url(#arrowhead-${fnd?'green':rng?'purple':hl?'yellow':'gray'})"/>`;
  }
  edge('root','n1'); edge('root','n2');
  edge('n1','l1'); edge('n1','l2');
  edge('n2','l3'); edge('n2','l4'); edge('n2','l5');

  // Leaf linked list arrows
  const leafPairs=[['l1','l2'],['l2','l3'],['l3','l4'],['l4','l5']];
  leafPairs.forEach(([a,b])=>{
    const ap=nodePos[a], bp=nodePos[b];
    const x1=ap.x+ap.w/2+2, y1=ap.y+NODE_H/2+12;
    const x2=bp.x-bp.w/2-2, y2=bp.y+NODE_H/2+12;
    const bothRange=step.rangeNodes&&step.rangeNodes.includes(a)&&step.rangeNodes.includes(b);
    const color=bothRange?'#c084fc':'#334155';
    const dashArray=bothRange?'':'5,4';
    html+=`<path d="M${x1},${y1} Q${(x1+x2)/2},${y1+22} ${x2},${y2}" fill="none" stroke="${color}" stroke-width="${bothRange?2:1.5}" stroke-dasharray="${dashArray}" opacity="${bothRange?1:0.5}" marker-end="url(#arrowhead-${bothRange?'purple':'gray'})"/>`;
  });

  // Draw split indicator
  if(step.insertLeaf==='l3'){
    const p=nodePos['l3'];
    html+=`<rect x="${p.x-p.w/2-4}" y="${p.y-NODE_H/2-4}" width="${p.w+8}" height="${NODE_H+8}" rx="8" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.9"/>`;
    html+=`<text x="${p.x}" y="${p.y+NODE_H/2+26}" text-anchor="middle" fill="var(--orange)" font-size="11" font-family="monospace">← 叶节点已满！</text>`;
  }
  if(step.splitFrom==='l3'){
    const p=nodePos['l3'];
    html+=`<rect x="${p.x-p.w/2}" y="${p.y-NODE_H/2}" width="${p.w/2-2}" height="${NODE_H}" rx="6" fill="rgba(251,191,36,.2)" stroke="var(--yellow)" stroke-width="2"/>`;
    html+=`<text x="${p.x-p.w/4}" y="${p.y+5}" text-anchor="middle" fill="var(--yellow)" font-size="11" font-family="monospace">[5,6]</text>`;
    html+=`<rect x="${p.x+2}" y="${p.y-NODE_H/2}" width="${p.w/2-2}" height="${NODE_H}" rx="6" fill="rgba(251,191,36,.2)" stroke="var(--yellow)" stroke-width="2"/>`;
    html+=`<text x="${p.x+p.w/4}" y="${p.y+5}" text-anchor="middle" fill="var(--yellow)" font-size="11" font-family="monospace">[7,9]</text>`;
    html+=`<text x="${p.x}" y="${p.y+NODE_H/2+28}" text-anchor="middle" fill="var(--yellow)" font-size="11" font-family="monospace">7 上推到父节点 →</text>`;
  }

  // Draw nodes
  Object.entries(TREE_NODES).forEach(([id,node])=>{
    // skip split visualization override for l3
    if((step.splitFrom||step.insertLeaf==='l3')&&id==='l3') return;
    const p=nodePos[id];
    const color=getNodeColor(id,step);
    const bg=getNodeBg(id,step);
    const rx=node.isLeaf?7:6;
    html+=`<rect x="${p.x-p.w/2}" y="${p.y-NODE_H/2}" width="${p.w}" height="${NODE_H}" rx="${rx}" fill="${bg}" stroke="${color}" stroke-width="${(step.highlightNodes&&step.highlightNodes.includes(id))||(step.foundNodes&&step.foundNodes.includes(id))||(step.rangeNodes&&step.rangeNodes.includes(id))?2:1.5}"/>`;
    if(node.isLeaf){
      html+=`<text x="${p.x}" y="${p.y+5}" text-anchor="middle" fill="${color}" font-size="11.5" font-family="'JetBrains Mono',monospace">[${node.keys.join(',')}]</text>`;
      html+=`<text x="${p.x}" y="${p.y-NODE_H/2-5}" text-anchor="middle" fill="${color}" font-size="9.5" opacity="0.7">leaf</text>`;
    } else {
      html+=`<text x="${p.x}" y="${p.y+5}" text-anchor="middle" fill="${color}" font-size="12" font-family="'JetBrains Mono',monospace">[${node.keys.join(',')}]</text>`;
    }
  });

  // Arrowhead defs
  const arrowDefs=[
    {id:'gray',color:'#334155'},
    {id:'yellow',color:'#fbbf24'},
    {id:'green',color:'#4ade80'},
    {id:'purple',color:'#c084fc'},
  ].map(({id,color})=>`<marker id="arrowhead-${id}" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="${color}"/></marker>`).join('');

  svg.innerHTML=`<defs>${arrowDefs}</defs>${html}`;
}

function renderResult(step){
  const el=document.getElementById('resultArea');
  if(!step.result||step.result.length===0){el.innerHTML='';return;}
  const tab=activeTab;
  let html=`<table class="result-table"><thead><tr><th>id</th><th>name</th><th>dept</th><th>salary</th></tr></thead><tbody>`;
  step.result.forEach(r=>{
    html+=`<tr class="found"><td class="found-key">${r.id}</td><td>${r.name}</td><td>${r.dept}</td><td>${r.salary}</td></tr>`;
  });
  html+=`</tbody></table><div class="result-info">${tab===1?'范围查询结果 id ∈ [5,11]：'+step.result.length+' 行':'查询结果：'+step.result.length+' 行'}</div>`;
  el.innerHTML=html;
}

// ─── Code panel ───────────────────────────────────────────────────────
function buildCodePanel(){
  const cb=document.getElementById('codeBody');
  cb.innerHTML=CODE_LINES.map(l=>`<div class="code-line" data-ln="${l.ln}"><span class="ln">${l.ln}</span><span class="lc">${l.html}</span></div>`).join('');
}

function highlightLines(lines){
  document.querySelectorAll('.code-line').forEach(el=>{
    el.classList.toggle('active',lines.includes(+el.dataset.ln));
  });
  if(lines.length){
    const first=document.querySelector(`.code-line[data-ln="${lines[0]}"]`);
    if(first) first.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
}

// ─── Render ───────────────────────────────────────────────────────────
function render(){
  if(!steps.length) return;
  const step=steps[cur];
  renderTree(step);
  renderResult(step);
  highlightLines(step.highlightLines||[]);
  document.getElementById('desc').textContent=step.description||'';
  document.getElementById('stepCounter').textContent=`${cur+1} / ${steps.length}`;
}

// ─── Controls ─────────────────────────────────────────────────────────
const btnPlay=document.getElementById('btnPlay');
const speedRange=document.getElementById('speedRange');

function play(){if(cur>=steps.length-1)cur=0;playing=true;btnPlay.innerHTML='⏸ 暂停';tick();}
function pause(){playing=false;clearTimeout(timer);btnPlay.innerHTML='▶ 播放';}
function tick(){if(!playing)return;if(cur<steps.length-1){cur++;render();timer=setTimeout(tick,SPEED[+speedRange.value-1]);}else pause();}

document.getElementById('btnReset').onclick=()=>{pause();cur=0;render();};
document.getElementById('btnPrev').onclick=()=>{pause();if(cur>0){cur--;render();}};
document.getElementById('btnPlay').onclick=()=>{playing?pause():play();};
document.getElementById('btnNext').onclick=()=>{pause();if(cur<steps.length-1){cur++;render();}};

// ─── Init ─────────────────────────────────────────────────────────────
buildCodePanel();
document.querySelectorAll('.code-line').forEach(el=>{
  el.addEventListener('click',()=>{
    const ln=+el.dataset.ln;
    let best=-1,bd=Infinity;
    steps.forEach((s,i)=>{if((s.highlightLines||[]).includes(ln)){const d=Math.abs(i-cur);if(d<bd){bd=d;best=i;}}});
    if(best>=0){cur=best;render();}
  });
});
switchTab(0);
</script>
<script src="../footer.js"></script>
</body>
</html>
