<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对称与非对称加密 - 安全</title>
<script src="../nav.js"></script>
<style>
:root{--bg:#0f172a;--text:#e2e8f0;--dim:#94a3b8;--dim2:#64748b;--accent:#fbbf24;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(circle at 20% 0%,rgba(251,191,36,.1),transparent 38%),var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1260px;margin:0 auto;padding:40px 32px 80px}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--dim2);margin-bottom:24px}
.breadcrumb a{color:var(--dim2)}.breadcrumb a:hover{color:var(--text)}
.page-title{font-size:clamp(1.6rem,3.5vw,2.8rem);letter-spacing:-.04em;margin-bottom:6px;background:linear-gradient(135deg,#f8fafc,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{color:var(--dim);font-size:.95rem;margin-bottom:28px;max-width:640px;line-height:1.75}
.layout{display:grid;grid-template-columns:240px 1fr;gap:20px}
.left-panel{border:1px solid rgba(255,255,255,.07);background:rgba(17,24,39,.7);border-radius:18px;padding:18px}
.left-panel h3{font-size:.72rem;color:var(--dim2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px}
.step-btn{width:100%;text-align:left;border:1px solid transparent;background:none;color:var(--dim);padding:9px 12px;border-radius:10px;cursor:pointer;font-size:.82rem;line-height:1.5;transition:.15s;margin-bottom:4px;display:block}
.step-btn:hover{border-color:rgba(251,191,36,.3);color:var(--text)}
.step-btn.active{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.4);color:var(--text)}
.step-index{display:inline-block;width:18px;height:18px;border-radius:50%;background:rgba(251,191,36,.15);color:var(--accent);font-size:.68rem;font-weight:700;text-align:center;line-height:18px;margin-right:7px}
.ctrl{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ctrl button{flex:1;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--dim);border-radius:10px;padding:8px 4px;cursor:pointer;font-size:.76rem;transition:.15s}
.ctrl button:hover{border-color:var(--accent);color:var(--text)}
.center-panel{border:1px solid rgba(255,255,255,.07);background:rgba(17,24,39,.7);border-radius:18px;padding:22px;min-height:540px;display:flex;flex-direction:column;gap:14px}
.step-msg{border-left:3px solid var(--accent);background:rgba(251,191,36,.06);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.86rem;color:var(--text);line-height:1.7}
/* Crypto viz */
.crypto-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.data-block{border-radius:8px;padding:9px 13px;font-family:monospace;font-size:.78rem;text-align:center;min-width:110px;transition:all .35s}
.data-block.plaintext{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:#86efac}
.data-block.ciphertext{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:#fca5a5;font-size:.65rem;word-break:break-all}
.data-block.key{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:#fde68a}
.data-block.sig{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);color:#c4b5fd;font-size:.65rem;word-break:break-all}
.data-block.hash{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#bae6fd;font-size:.65rem;word-break:break-all}
.op-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 12px;font-size:.78rem;font-weight:600;white-space:nowrap}
.op-box.active{border-color:var(--accent);background:rgba(251,191,36,.1);color:var(--accent)}
.arrow-right{color:var(--dim2);font-size:1.2rem}
.arrow-right.active{color:var(--accent)}
.section-label{font-size:.72rem;color:var(--dim2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:700}
.cbc-chain{display:flex;gap:0;align-items:center;overflow-x:auto}
.cbc-block{text-align:center;flex-shrink:0}
.cbc-block-inner{border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:7px 10px;font-family:monospace;font-size:.68rem;margin:0 3px;min-width:80px;transition:all .4s}
.cbc-block-inner.iv{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.3);color:#bae6fd}
.cbc-block-inner.plain{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.25);color:#86efac}
.cbc-block-inner.cipher{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.25);color:#fca5a5}
.cbc-block-inner.active{box-shadow:0 0 16px rgba(251,191,36,.3);border-color:var(--accent)}
.xor-label{font-size:.7rem;color:var(--dim2);margin:2px 0}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.compare-card{border:1px solid rgba(255,255,255,.07);background:rgba(30,41,59,.4);border-radius:12px;padding:14px}
.compare-card h3{font-size:.82rem;margin-bottom:10px;color:var(--accent)}
.compare-card p{font-size:.78rem;color:var(--dim);line-height:1.75}
</style>
</head>
<body>
<main class="wrap">
  <div class="breadcrumb"><a href="../index.html">首页</a><span>/</span><a href="index.html">安全</a><span>/</span>对称与非对称加密</div>
  <h1 class="page-title">对称与非对称加密</h1>
  <p class="subtitle">对称加密（AES）用同一密钥加解密，速度快但密钥分发困难；非对称加密（RSA）用公钥加密/私钥解密（机密性），或私钥签名/公钥验证（真实性）。两者通常组合使用：RSA 协商会话密钥，AES 加密数据。</p>

  <div class="layout">
    <div class="left-panel">
      <h3>步骤</h3>
      <div id="stepList"></div>
      <div class="ctrl">
        <button onclick="prev()">← 上一步</button>
        <button onclick="next()">下一步 →</button>
        <button onclick="reset()">重置</button>
        <button id="playBtn" onclick="togglePlay()">▶ 播放</button>
      </div>
    </div>
    <div class="center-panel">
      <div class="step-msg" id="stepMsg">点击"下一步"观察对称与非对称加密的工作原理。</div>

      <div id="vizArea"></div>

      <div class="compare-grid" id="compareGrid" style="display:none">
        <div class="compare-card">
          <h3>🔒 加密（保证机密性）</h3>
          <p>公钥加密 → 私钥解密<br>目标：只有私钥持有者能读取内容<br>例：HTTPS 密钥交换（RSA/ECDH）</p>
        </div>
        <div class="compare-card">
          <h3>✍️ 签名（保证真实性）</h3>
          <p>私钥签名 → 公钥验证<br>目标：证明消息确实来自私钥持有者<br>例：JWT 签名、代码签名、TLS 证书</p>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
const STEPS = [
  {type:'intro',
   msg:'密码学基础：加密保证机密性（只有指定接收方能读取），签名保证真实性（确认发送方身份）。AES 是最常用的对称加密算法，RSA 是最常用的非对称算法。'},
  {type:'aes-plain',
   msg:'AES 对称加密第 1 步：有明文 "Hello, World!"，和一个 256 位密钥（K）。发送方和接收方共享同一个密钥——密钥分发是对称加密的核心挑战。'},
  {type:'aes-encrypt',
   msg:'AES 加密：明文经过 AES-256 算法（内部有多轮 SubBytes/ShiftRows/MixColumns）生成密文。密文看起来完全随机，无法从密文反推明文（没有密钥）。'},
  {type:'aes-cbc',
   msg:'AES-CBC 模式（链式）：每个明文块在加密前先和前一块密文做 XOR（链式），第一块使用随机 IV。这使得相同的明文产生不同的密文，防止模式分析攻击。'},
  {type:'rsa-encrypt',
   msg:'RSA 非对称加密：Alice 用 Bob 的公钥加密消息，只有 Bob 的私钥能解密。任何人都可以加密（公钥公开），但只有私钥持有者能解密。'},
  {type:'rsa-sign',
   msg:'RSA 数字签名：Bob 对消息做 Hash（SHA-256），用私钥对 Hash 加密生成签名。任何人用 Bob 的公钥解密签名，得到 Hash，与消息的 Hash 对比——一致则签名有效。'},
  {type:'compare',
   msg:'总结：加密（公钥→私钥方向）保证机密性；签名（私钥→公钥方向）保证真实性。TLS 握手同时使用两者：RSA/ECDH 协商密钥，然后用对称密钥加密数据。'},
];

let cur = -1, timer = null;

function renderViz(step){
  const viz = document.getElementById('vizArea');
  const cmp = document.getElementById('compareGrid');
  cmp.style.display = 'none';
  if(!step || step.type === 'intro'){
    viz.innerHTML = '<div style="color:var(--dim);font-size:.88rem;padding:20px 0">准备就绪，点击下一步开始...</div>';
    return;
  }
  if(step.type === 'aes-plain'){
    viz.innerHTML = `
      <div class="section-label">AES 对称加密</div>
      <div class="crypto-row">
        <div class="data-block plaintext">明文<br>"Hello, World!"</div>
        <div class="arrow-right">+</div>
        <div class="data-block key">密钥 K<br>（256 bit）</div>
        <div class="arrow-right">→</div>
        <div class="data-block ciphertext" style="opacity:0.3">密文<br>（待加密）</div>
      </div>`;
  } else if(step.type === 'aes-encrypt'){
    viz.innerHTML = `
      <div class="section-label">AES 加密完成</div>
      <div class="crypto-row">
        <div class="data-block plaintext">明文<br>"Hello, World!"</div>
        <div class="arrow-right active">→</div>
        <div class="op-box active">AES-256</div>
        <div class="arrow-right active">→</div>
        <div class="data-block ciphertext">密文<br>A1B2C3D4E5F6...<br>（不可读）</div>
      </div>
      <div style="margin-top:12px">
        <div class="crypto-row">
          <div class="data-block ciphertext">密文</div>
          <div class="arrow-right active">→</div>
          <div class="op-box active">AES-256 解密</div>
          <div class="arrow-right active">→</div>
          <div class="data-block plaintext">明文<br>"Hello, World!"</div>
          <div class="data-block key" style="margin-left:8px">需要密钥 K</div>
        </div>
      </div>`;
  } else if(step.type === 'aes-cbc'){
    viz.innerHTML = `
      <div class="section-label">AES-CBC 链式模式</div>
      <div class="cbc-chain">
        <div class="cbc-block">
          <div class="cbc-block-inner iv">IV<br>（随机）</div>
          <div class="xor-label">⊕</div>
          <div class="cbc-block-inner plain active">Block 1<br>Plaintext</div>
          <div class="xor-label">↓ AES</div>
          <div class="cbc-block-inner cipher">C1<br>密文块1</div>
        </div>
        <div style="display:flex;align-items:center;font-size:1.2rem;color:var(--dim2);padding:0 4px;margin-top:40px">→</div>
        <div class="cbc-block">
          <div class="cbc-block-inner cipher" style="opacity:0.7">C1（前块）</div>
          <div class="xor-label">⊕</div>
          <div class="cbc-block-inner plain active">Block 2<br>Plaintext</div>
          <div class="xor-label">↓ AES</div>
          <div class="cbc-block-inner cipher">C2<br>密文块2</div>
        </div>
        <div style="display:flex;align-items:center;font-size:1.2rem;color:var(--dim2);padding:0 4px;margin-top:40px">→</div>
        <div class="cbc-block">
          <div class="cbc-block-inner cipher" style="opacity:0.7">C2（前块）</div>
          <div class="xor-label">⊕</div>
          <div class="cbc-block-inner plain active">Block 3<br>Plaintext</div>
          <div class="xor-label">↓ AES</div>
          <div class="cbc-block-inner cipher">C3<br>密文块3</div>
        </div>
      </div>
      <div style="font-size:.74rem;color:var(--dim2);margin-top:10px">⊕ = XOR；每块密文依赖所有前块，相同明文块产生不同密文</div>`;
  } else if(step.type === 'rsa-encrypt'){
    viz.innerHTML = `
      <div class="section-label">RSA 非对称加密（保证机密性）</div>
      <div class="crypto-row">
        <div class="data-block plaintext">消息 M</div>
        <div class="arrow-right active">→</div>
        <div class="op-box active">RSA 加密<br>（Bob 公钥）</div>
        <div class="arrow-right active">→</div>
        <div class="data-block ciphertext">密文 C</div>
      </div>
      <div style="margin-top:10px" class="crypto-row">
        <div class="data-block ciphertext">密文 C</div>
        <div class="arrow-right active">→</div>
        <div class="op-box active">RSA 解密<br>（Bob 私钥）</div>
        <div class="arrow-right active">→</div>
        <div class="data-block plaintext">消息 M</div>
      </div>
      <div style="margin-top:10px;font-size:.78rem;color:var(--dim);background:rgba(255,255,255,.03);border-radius:8px;padding:10px">
        ✓ 公钥公开，任何人能加密<br>✓ 只有 Bob 私钥能解密<br>✗ 不能证明消息来源（谁都可以用公钥加密）
      </div>`;
  } else if(step.type === 'rsa-sign'){
    viz.innerHTML = `
      <div class="section-label">RSA 数字签名（保证真实性）</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap">
        <div style="flex:1;min-width:220px">
          <div style="font-size:.72rem;color:var(--ok);margin-bottom:6px">签名（Bob 发送方）</div>
          <div class="crypto-row" style="flex-direction:column;align-items:flex-start;gap:6px">
            <div class="data-block plaintext" style="width:100%">消息 M</div>
            <div style="display:flex;align-items:center;gap:6px;width:100%">
              <div class="op-box active" style="flex:1">Hash（SHA-256）</div>
            </div>
            <div class="data-block hash" style="width:100%">H = SHA-256(M)<br>2cf24db...（32字节）</div>
            <div class="op-box active" style="width:100%">私钥加密 Hash</div>
            <div class="data-block sig" style="width:100%">签名 = Encrypt(H, 私钥)</div>
          </div>
        </div>
        <div style="flex:1;min-width:220px">
          <div style="font-size:.72rem;color:var(--warn);margin-bottom:6px">验签（接收方）</div>
          <div class="crypto-row" style="flex-direction:column;align-items:flex-start;gap:6px">
            <div class="data-block sig" style="width:100%">收到签名</div>
            <div class="op-box active" style="width:100%">公钥解密</div>
            <div class="data-block hash" style="width:100%">H' = Decrypt(签名, 公钥)</div>
            <div class="data-block plaintext" style="width:100%">消息 M</div>
            <div class="op-box active" style="width:100%">Hash（SHA-256）</div>
            <div class="data-block hash" style="width:100%">H = SHA-256(M)</div>
            <div style="font-size:.78rem;padding:6px 10px;border-radius:6px;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.25);color:var(--ok);width:100%">H == H' → 签名有效 ✓</div>
          </div>
        </div>
      </div>`;
  } else if(step.type === 'compare'){
    viz.innerHTML = '';
    cmp.style.display = 'grid';
  }
}

function buildStepList(){
  const list = document.getElementById('stepList');
  list.innerHTML = '';
  const labels = ['概念介绍','AES 准备','AES 加解密','CBC 链式','RSA 加密','RSA 签名','总结对比'];
  STEPS.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'step-btn' + (i === cur ? ' active' : '');
    btn.innerHTML = `<span class="step-index">${i+1}</span>${labels[i]}`;
    btn.onclick = () => { cur = i; renderStep(); };
    list.appendChild(btn);
  });
}

function renderStep(){
  const step = cur >= 0 ? STEPS[cur] : null;
  document.getElementById('stepMsg').textContent = step ? step.msg : '点击"下一步"观察对称与非对称加密的工作原理。';
  renderViz(step);
  buildStepList();
}

function next(){ if(cur < STEPS.length-1){ cur++; renderStep(); } }
function prev(){ if(cur > -1){ cur--; renderStep(); } }
function reset(){ cur = -1; stopPlay(); renderStep(); }
function togglePlay(){ if(timer) stopPlay(); else startPlay(); }
function startPlay(){
  document.getElementById('playBtn').textContent = '⏸ 暂停';
  timer = setInterval(() => {
    if(cur < STEPS.length-1){ cur++; renderStep(); } else stopPlay();
  }, 2200);
}
function stopPlay(){
  if(timer){ clearInterval(timer); timer = null; }
  document.getElementById('playBtn').textContent = '▶ 播放';
}

renderStep();
</script>
</body>
</html>
