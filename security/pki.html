<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>PKI 与证书体系 - 安全</title>

<style>
:root{
  --bg:#0f172a;--text:#e2e8f0;--dim:#94a3b8;--dim2:#64748b;
  --accent:#f87171;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;
  --blue:#38bdf8;--purple:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:radial-gradient(circle at 18% 0%,rgba(248,113,113,.12),transparent 36%),
             radial-gradient(circle at 88% 14%,rgba(167,139,250,.07),transparent 28%),
             var(--bg);
  color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:40px 32px 80px}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--dim2);margin-bottom:22px}
.breadcrumb a{color:var(--dim2)}.breadcrumb a:hover{color:var(--text)}
.page-title{font-size:clamp(1.7rem,3.5vw,2.8rem);letter-spacing:-.04em;margin-bottom:6px;
  background:linear-gradient(135deg,#f8fafc,#f87171);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{color:var(--dim);font-size:.93rem;margin-bottom:28px;max-width:720px;line-height:1.8}

/* === Layout === */
.layout{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.left-panel{
  border:1px solid rgba(255,255,255,.07);background:rgba(17,24,39,.75);
  border-radius:18px;padding:18px;position:sticky;top:24px;
}
.left-panel h3{font-size:.68rem;color:var(--dim2);text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px}

/* Scene tabs */
.scene-tabs{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.scene-tab{
  width:100%;text-align:left;border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.03);color:var(--dim);
  padding:9px 12px;border-radius:10px;cursor:pointer;font-size:.8rem;
  font-family:inherit;transition:.15s;line-height:1.4;
}
.scene-tab:hover{border-color:rgba(248,113,113,.35);color:var(--text)}
.scene-tab.active{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.45);color:var(--text)}
.scene-tab .scene-num{
  display:inline-block;width:18px;height:18px;border-radius:50%;
  background:rgba(248,113,113,.18);color:var(--accent);
  font-size:.66rem;font-weight:700;text-align:center;line-height:18px;margin-right:7px;
}
.scene-tab.active .scene-num{background:rgba(248,113,113,.35)}

.divider{border:none;border-top:1px solid rgba(255,255,255,.06);margin:12px 0}

/* Step list */
.step-list{display:flex;flex-direction:column;gap:3px;max-height:260px;overflow-y:auto;margin-bottom:12px}
.step-btn{
  width:100%;text-align:left;border:1px solid transparent;
  background:none;color:var(--dim);padding:7px 10px;border-radius:8px;
  cursor:pointer;font-size:.76rem;line-height:1.5;transition:.12s;
  font-family:inherit;
}
.step-btn:hover{border-color:rgba(248,113,113,.25);color:var(--text)}
.step-btn.active{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.3);color:var(--text)}
.step-num{
  display:inline-block;width:16px;height:16px;border-radius:50%;
  background:rgba(248,113,113,.12);color:var(--accent);
  font-size:.62rem;font-weight:700;text-align:center;line-height:16px;margin-right:6px;
}
.ctrl{display:flex;gap:6px;flex-wrap:wrap}
.ctrl button{
  flex:1;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);
  color:var(--dim);border-radius:8px;padding:7px 4px;cursor:pointer;
  font-size:.73rem;font-family:inherit;transition:.13s;
}
.ctrl button:hover{border-color:var(--accent);color:var(--text)}
.ctrl button.primary{border-color:rgba(248,113,113,.4);color:var(--accent);background:rgba(248,113,113,.07)}

/* === Center Panel === */
.center-panel{
  border:1px solid rgba(255,255,255,.07);background:rgba(17,24,39,.75);
  border-radius:18px;padding:22px;min-height:580px;display:flex;flex-direction:column;gap:14px;
}
.step-msg{
  border-left:3px solid var(--accent);background:rgba(248,113,113,.06);
  border-radius:0 10px 10px 0;padding:10px 14px;
  font-size:.85rem;color:var(--text);line-height:1.75;white-space:pre-line;
}
.anim-area{flex:1;min-height:420px;position:relative}

/* === Scene 1: Certificate Chain === */
.chain-wrap{
  display:flex;flex-direction:column;align-items:center;gap:0;
  padding:20px 10px;
}
.cert-card{
  width:420px;border:1.5px solid rgba(255,255,255,.12);
  background:rgba(30,41,59,.7);border-radius:14px;padding:14px 18px;
  font-size:.78rem;transition:all .4s;position:relative;
}
.cert-card.leaf{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.06)}
.cert-card.intermediate{border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.04)}
.cert-card.root{border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.06)}
.cert-card.verified{
  border-color:rgba(74,222,128,.55)!important;
  background:rgba(74,222,128,.08)!important;
  box-shadow:0 0 20px rgba(74,222,128,.18);
}
.cert-title{
  font-weight:700;font-size:.82rem;margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;
}
.cert-title .cert-label{font-size:.65rem;padding:2px 7px;border-radius:99px;font-weight:600}
.cert-title .cert-label.leaf-lbl{background:rgba(248,113,113,.2);color:#fca5a5}
.cert-title .cert-label.int-lbl{background:rgba(251,191,36,.18);color:#fde68a}
.cert-title .cert-label.root-lbl{background:rgba(167,139,250,.2);color:#c4b5fd}
.cert-field{display:flex;gap:6px;margin-bottom:3px;color:var(--dim);line-height:1.6}
.cert-key{color:var(--dim2);min-width:58px}
.cert-val{color:var(--dim);font-family:monospace;font-size:.74rem}
.cert-val.highlight{color:var(--text)}
.chain-arrow{
  width:2px;height:32px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.3));
  margin:0 auto;position:relative;
}
.chain-arrow::after{
  content:'↓';position:absolute;left:50%;transform:translateX(-50%) translateY(-50%);
  top:50%;font-size:.9rem;color:var(--dim2);background:rgba(17,24,39,.9);
  padding:0 4px;
}
.chain-arrow.active::after{color:var(--ok)}
.verify-badge{
  position:absolute;top:10px;right:14px;
  font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:99px;
  opacity:0;transition:opacity .4s;
}
.verify-badge.show{opacity:1}
.verify-badge.ok{background:rgba(74,222,128,.2);color:#4ade80;border:1px solid rgba(74,222,128,.3)}
.verify-badge.fail{background:rgba(248,113,113,.2);color:#f87171;border:1px solid rgba(248,113,113,.35)}
.trust-anchor{
  margin-top:8px;text-align:center;font-size:.72rem;color:var(--purple);
  background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.2);
  border-radius:8px;padding:5px 14px;display:inline-block;opacity:0;transition:opacity .4s;
}
.trust-anchor.show{opacity:1}
.chain-success{
  margin-top:12px;text-align:center;font-size:.88rem;font-weight:700;
  color:var(--ok);background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.25);
  border-radius:10px;padding:10px 20px;opacity:0;transition:opacity .5s;
}
.chain-success.show{opacity:1}

/* Browser request row */
.browser-row{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
  font-size:.79rem;color:var(--dim);
}
.browser-box{
  border:1px solid rgba(255,255,255,.1);background:rgba(30,41,59,.5);
  border-radius:8px;padding:7px 12px;font-family:monospace;font-size:.74rem;
}
.browser-box.active{border-color:rgba(248,113,113,.4);color:var(--text)}
.arrow-right{color:var(--dim2);font-size:1rem}

/* === Scene 2: ACME Swimlane === */
.swimlane-wrap{overflow-x:auto}
.swimlane{display:grid;gap:0;min-width:580px}
.swimlane-3{grid-template-columns:repeat(3,1fr)}
.lane-header{
  font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  padding:8px 10px;background:rgba(255,255,255,.04);
  border-bottom:1px solid rgba(255,255,255,.07);text-align:center;color:var(--dim);
}
.lane-col{
  border-right:1px dashed rgba(255,255,255,.06);padding:6px 4px;
  min-height:36px;position:relative;display:flex;align-items:center;justify-content:center;
}
.lane-col:last-child{border-right:none}
.swim-msg{
  display:flex;align-items:center;font-size:.72rem;font-family:monospace;
  padding:5px 8px;border-radius:6px;white-space:normal;text-align:center;
  opacity:0;transition:opacity .35s;width:100%;justify-content:center;line-height:1.4;
}
.swim-msg.show{opacity:1}
.swim-msg.req{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);color:#fca5a5}
.swim-msg.resp{background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.2);color:#86efac}
.swim-msg.action{background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.2);color:#7dd3fc}
.swim-msg.ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:#4ade80;font-weight:700}
.acme-timer{
  margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:.8rem;
}
.timer-bar{
  flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);overflow:hidden;
}
.timer-fill{height:100%;border-radius:3px;transition:width .4s;background:var(--warn)}
.timer-fill.critical{background:var(--err)}

/* === Scene 3: Revocation === */
.revoke-wrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.revoke-left{flex:1;min-width:260px}
.revoke-right{flex:1;min-width:260px}
.cert-card-lg{
  border:1.5px solid rgba(255,255,255,.12);background:rgba(30,41,59,.7);
  border-radius:14px;padding:16px;font-size:.78rem;position:relative;transition:all .4s;
}
.revoked-badge{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);
  font-size:1.3rem;font-weight:900;color:#f87171;
  border:3px solid #f87171;border-radius:6px;padding:6px 16px;
  background:rgba(17,24,39,.85);letter-spacing:.1em;
  opacity:0;transition:opacity .5s;
}
.revoked-badge.show{opacity:1}
.cert-card-lg.revoked{border-color:rgba(248,113,113,.5)!important;filter:brightness(.8)}

.ocsp-row{
  display:flex;flex-direction:column;gap:8px;margin-top:12px;
}
.ocsp-step{
  display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.07);
  background:rgba(30,41,59,.4);border-radius:8px;padding:9px 12px;
  font-size:.76rem;opacity:0;transition:opacity .35s,border-color .35s;
}
.ocsp-step.show{opacity:1}
.ocsp-step.ok-step{border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.04)}
.ocsp-step.fail-step{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.05);color:#fca5a5}
.ocsp-icon{font-size:1rem;flex-shrink:0}

.perf-compare{
  margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.perf-box{
  border:1px solid rgba(255,255,255,.08);background:rgba(30,41,59,.5);
  border-radius:10px;padding:12px;font-size:.76rem;
}
.perf-box h4{font-size:.7rem;color:var(--dim2);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:8px}
.perf-bar-wrap{margin:4px 0 2px}
.perf-bar{height:8px;border-radius:4px;transition:width .5s}
.perf-label{font-size:.68rem;color:var(--dim2);margin-top:3px}

/* === Scene 4: Internal PKI / mTLS === */
.mtls-wrap{display:flex;flex-direction:column;gap:12px}
.mtls-nodes{
  display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;
}
.pki-node{
  border:1.5px solid rgba(255,255,255,.1);background:rgba(30,41,59,.6);
  border-radius:14px;padding:14px 16px;font-size:.78rem;text-align:center;
  min-width:130px;transition:all .35s;flex:1;
}
.pki-node.vault{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.05)}
.pki-node.svc{border-color:rgba(56,189,248,.3);background:rgba(56,189,248,.04)}
.pki-node.active{
  border-color:rgba(74,222,128,.55)!important;background:rgba(74,222,128,.08)!important;
  box-shadow:0 0 18px rgba(74,222,128,.2);
}
.pki-node .node-icon{font-size:1.5rem;margin-bottom:4px}
.pki-node .node-name{font-weight:700;font-size:.82rem;margin-bottom:4px}
.pki-node .node-info{font-size:.68rem;color:var(--dim2);line-height:1.5}
.mtls-arrows{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;
}
.flow-arrow{
  border:1px solid rgba(255,255,255,.07);background:rgba(30,41,59,.4);
  border-radius:8px;padding:7px 12px;font-size:.74rem;font-family:monospace;
  opacity:0;transition:opacity .35s;display:flex;align-items:center;gap:6px;
  white-space:nowrap;
}
.flow-arrow.show{opacity:1}
.flow-arrow.req{border-color:rgba(248,113,113,.3);color:#fca5a5}
.flow-arrow.resp{border-color:rgba(74,222,128,.3);color:#86efac}
.flow-arrow.mtls{border-color:rgba(167,139,250,.35);color:#c4b5fd}
.cert-ttl{
  font-family:monospace;font-size:.72rem;
  background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);
  border-radius:6px;padding:4px 10px;color:#fde68a;display:inline-block;margin-top:6px;
}
.vs-table{
  margin-top:14px;border:1px solid rgba(255,255,255,.07);border-radius:12px;overflow:hidden;
  font-size:.76rem;
}
.vs-row{display:grid;grid-template-columns:140px 1fr 1fr;border-bottom:1px solid rgba(255,255,255,.05)}
.vs-row:last-child{border-bottom:none}
.vs-cell{padding:8px 12px;border-right:1px solid rgba(255,255,255,.05);color:var(--dim)}
.vs-cell:last-child{border-right:none}
.vs-cell.hdr{color:var(--dim2);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;background:rgba(255,255,255,.03)}
.vs-cell.ok-cell{color:var(--ok)}
.vs-cell.warn-cell{color:var(--warn)}
</style>
</head>
<body>
<main class="wrap">
  <div class="breadcrumb">
    <a href="../index.html">首页</a><span>/</span>
    <a href="index.html">安全</a><span>/</span>
    PKI 与证书体系
  </div>
  <h1 class="page-title">PKI 与证书体系</h1>
  <p class="subtitle">公钥基础设施（PKI）是 HTTPS 信任链的基础。CA（证书颁发机构）为服务器签发数字证书，证书包含公钥和身份信息，浏览器通过验证证书链（叶证书→中间 CA→根 CA）确认服务器身份真实性，防止中间人攻击。</p>

  <div class="layout">
    <!-- Left Panel -->
    <div class="left-panel">
      <h3>场景</h3>
      <div class="scene-tabs">
        <button class="scene-tab active" onclick="switchScene(0)">
          <span class="scene-num">1</span>证书链验证
        </button>
        <button class="scene-tab" onclick="switchScene(1)">
          <span class="scene-num">2</span>ACME 自动续签
        </button>
        <button class="scene-tab" onclick="switchScene(2)">
          <span class="scene-num">3</span>证书吊销
        </button>
        <button class="scene-tab" onclick="switchScene(3)">
          <span class="scene-num">4</span>内网 PKI / mTLS
        </button>
      </div>
      <hr class="divider">
      <h3>步骤</h3>
      <div class="step-list" id="stepList"></div>
      <div class="ctrl">
        <button onclick="prev()">← 上一步</button>
        <button onclick="next()">下一步 →</button>
        <button onclick="reset()">重置</button>
        <button id="playBtn" class="primary" onclick="togglePlay()">▶ 播放</button>
      </div>
    </div>

    <!-- Center Panel -->
    <div class="center-panel">
      <div class="step-msg" id="stepMsg">选择左侧场景，点击"下一步"或"播放"开始动画。</div>
      <div class="anim-area" id="animArea"></div>
    </div>
  </div>
</main>

<script>
/* ===== SCENE DATA ===== */
const SCENES = [

/* ---- Scene 0: Certificate Chain Verification ---- */
{
  label: '证书链验证',
  steps: [
    {
      label: '浏览器发起 HTTPS 请求',
      msg: 'Step 1：浏览器访问 https://example.com，TCP 连接建立后进入 TLS 握手。服务器在握手中返回证书链（Certificate message），包含叶证书和中间 CA 证书。',
      s: {phase:0}
    },
    {
      label: '查看叶证书内容',
      msg: 'Step 2：浏览器收到叶证书（Leaf Certificate）。\n\nSubject: CN=example.com\nIssuer: Let\'s Encrypt R3\nValid: 2024-01-01 → 2024-04-01\nPublic Key: EC 256-bit\nSignature: SHA256withECDSA（由 Let\'s Encrypt R3 私钥签名）\nSAN: DNS:example.com, DNS:www.example.com',
      s: {phase:1}
    },
    {
      label: '找到中间 CA 证书',
      msg: 'Step 3：叶证书的 Issuer 字段指向 "Let\'s Encrypt R3"（中间 CA）。浏览器从服务器一同发来的证书链中找到这张中间 CA 证书。\n\nSubject: CN=Let\'s Encrypt R3\nIssuer: ISRG Root X1\nPublic Key: RSA 2048-bit',
      s: {phase:2}
    },
    {
      label: '验证叶证书签名 ✓',
      msg: 'Step 4：浏览器用 Let\'s Encrypt R3 的公钥（RSA 2048）验证叶证书上的签名。\n\nVerify(R3.pubKey, leaf.signature, leaf.tbsCertificate) → OK\n\n验证通过！叶证书的内容未被篡改，且确实由 Let\'s Encrypt R3 签发。',
      s: {phase:3, verifyLeaf:true}
    },
    {
      label: '找到根 CA（Trust Anchor）',
      msg: 'Step 5：中间 CA 的 Issuer 是 "ISRG Root X1"（Let\'s Encrypt 的根 CA）。根 CA 证书不在网络传输，而是内置在操作系统 / 浏览器的信任库中（Trust Store）。\n\n这是信任链的锚点（Trust Anchor）——无需网络即可验证。',
      s: {phase:4}
    },
    {
      label: '验证中间 CA 签名 ✓',
      msg: 'Step 6：浏览器用 ISRG Root X1 的公钥（从本地信任库取出）验证中间 CA 证书的签名。\n\nVerify(Root.pubKey, R3.signature, R3.tbsCertificate) → OK\n\n整条证书链验证通过！TLS 握手继续，连接建立。',
      s: {phase:5, verifyLeaf:true, verifyInt:true}
    },
    {
      label: '信任链验证成功',
      msg: 'Step 7：证书链完整验证。浏览器确认：\n① example.com 的公钥可信（由受信 CA 签发）\n② 证书未过期，域名匹配 SAN 字段\n③ 可用该公钥加密会话密钥，防止中间人攻击\n\nTLS 握手继续：发送 Finished 消息，切换对称加密。',
      s: {phase:6, verifyLeaf:true, verifyInt:true, success:true}
    },
  ]
},

/* ---- Scene 1: ACME Auto-renewal ---- */

/* ===== State ===== */
let sceneIdx = 0, stepIdx = -1, timer = null;

function switchScene(i){
  sceneIdx = i;
  stepIdx = -1;
  stopPlay();
  document.querySelectorAll('.scene-tab').forEach((t,j)=>t.classList.toggle('active',i===j));
  renderAll();
}

function renderAll(){
  buildStepList();
  renderStepMsg();
  renderAnim();
}

function buildStepList(){
  const scene = SCENES[sceneIdx];
  const list = document.getElementById('stepList');
  list.innerHTML = '';
  scene.steps.forEach((s,i)=>{
    const b = document.createElement('button');
    b.className = 'step-btn'+(i===stepIdx?' active':'');
    b.innerHTML = `<span class="step-num">${i+1}</span>${s.label}`;
    b.onclick = ()=>{ stepIdx=i; stopPlay(); renderAll(); };
    list.appendChild(b);
  });
}

function renderStepMsg(){
  const scene = SCENES[sceneIdx];
  const el = document.getElementById('stepMsg');
  if(stepIdx < 0){
    el.textContent = `场景 ${sceneIdx+1}：${scene.label}。点击"下一步"或"播放"开始。`;
  } else {
    el.textContent = scene.steps[stepIdx].msg;
  }
}

/* ===== Render Animation by Scene ===== */
function renderAnim(){
  const area = document.getElementById('animArea');
  if(sceneIdx===0) renderScene0(area);
  else if(sceneIdx===1) renderScene1(area);
  else if(sceneIdx===2) renderScene2(area);
  else if(sceneIdx===3) renderScene3(area);
}

/* --- Scene 1: ACME --- */
function renderScene1(area){
  const step = stepIdx >= 0 ? SCENES[1].steps[stepIdx] : null;
  const s = step ? step.s : {rows:[], timerPct:33};
  const rows = s.rows || [];
  const pct = s.timerPct || 33;
  const isNew = s.timerPct===100;

  // Build rows grouped by 3
  let rowsHTML = '';
  for(let i=0;i<rows.length;i+=3){
    rowsHTML += '<div class="swimlane swimlane-3" style="border-bottom:1px solid rgba(255,255,255,.04)">';
    for(let c=0;c<3;c++){
      const cell = rows[i+c];
      if(cell && cell.text){
        rowsHTML += `<div class="lane-col"><div class="swim-msg show ${cell.cls}">${cell.text}</div></div>`;
      } else {
        rowsHTML += `<div class="lane-col"></div>`;
      }
    }
    rowsHTML += '</div>';
  }

  area.innerHTML = `
  <div>
    <div class="acme-timer">
      <span style="font-size:.76rem;color:var(--dim2);white-space:nowrap">证书有效期</span>
      <div class="timer-bar">
        <div class="timer-fill${pct<=33&&!isNew?' critical':''}" style="width:${isNew?100:pct}%;background:${isNew?'var(--ok)':pct<=33?'var(--err)':'var(--warn)'}"></div>
      </div>
      <span style="font-size:.74rem;color:${isNew?'var(--ok)':pct<=33?'var(--err)':'var(--warn)'}">
        ${isNew?'已续签（90天）':pct<=33?'剩余 ~30天（触发续签）':'正常'}
      </span>
    </div>
    <div class="swimlane-wrap">
      <div class="swimlane swimlane-3">
        <div class="lane-header">Certbot（客户端）</div>
        <div class="lane-header">ACME Server（Let's Encrypt）</div>
        <div class="lane-header">Web Server（Nginx）</div>
      </div>
      ${rowsHTML}
    </div>
  </div>`;
}

        <div class="cert-field"><span class="cert-key">Valid</span><span class="cert-val">2024-01-01 → 2024-04-01</span></div>

        <div class="revoked-badge${isRevoked?' show':''}">REVOKED</div>
      </div>

      ${isBlocked?`
      <div style="margin-top:12px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);border-radius:10px;padding:12px;font-size:.78rem;color:#fca5a5;text-align:center">
        <div style="font-size:1rem;margin-bottom:4px">🚫</div>
        <div style="font-weight:700">ERR_CERT_REVOKED</div>
        <div style="color:var(--dim);font-size:.72rem;margin-top:4px">此证书已被吊销，连接不安全</div>
      </div>`:''}
    </div>

    <div class="revoke-right">
      <div style="font-size:.7rem;color:var(--dim2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">吊销流程</div>
      <div class="ocsp-row">
        ${ocspSteps.map((o,i)=>`
          <div class="ocsp-step${showSteps.includes(i)?' show':''} ${showSteps.includes(i)?o.cls:''}">
            <span class="ocsp-icon">${o.icon}</span>
            <span>${o.text}</span>
          </div>
        `).join('')}
      </div>

      ${isCompare?`
      <div style="font-size:.7rem;color:var(--dim2);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 8px">性能对比</div>
      <div class="perf-compare">
        <div class="perf-box">
          <h4>OCSP Stapling</h4>
          <div class="perf-bar-wrap">
            <div class="perf-bar" style="width:8%;background:var(--ok)"></div>
          </div>
          <div class="perf-label" style="color:var(--ok)">额外延迟 ≈ 0ms</div>
          <div style="font-size:.7rem;color:var(--dim2);margin-top:6px;line-height:1.6">服务器预取缓存<br>握手中直接附带<br>✓ 保护用户隐私</div>
        </div>
        <div class="perf-box">
          <h4>主动 OCSP 查询</h4>
          <div class="perf-bar-wrap">
            <div class="perf-bar" style="width:75%;background:var(--warn)"></div>
          </div>
          <div class="perf-label" style="color:var(--warn)">额外延迟 50–200ms</div>
          <div style="font-size:.7rem;color:var(--dim2);margin-top:6px;line-height:1.6">浏览器额外 HTTP 请求<br>依赖 CA 服务器可用<br>✗ CA 可追踪访问行为</div>
        </div>
      </div>`:''}
    </div>
  </div>`;
}

/* --- Scene 3: Internal PKI / mTLS --- */
function renderScene3(area){
  const step = stepIdx >= 0 ? SCENES[3].steps[stepIdx] : null;
  const s = step ? step.s : {phase:0, arrows:[]};
  const phase = s.phase || 0;
  const arrows = s.arrows || [];
  const showTable = s.showTable || false;

  area.innerHTML = `
  <div class="mtls-wrap">
    <div class="mtls-nodes">
      <div class="pki-node vault${phase>=1?' active':''}">
        <div class="node-icon">🏛️</div>
        <div class="node-name">Vault PKI</div>
        <div class="node-info">内部 CA<br>TTL: 24h roles</div>
        ${phase>=1?`<div class="cert-ttl">Root CA: 10yr</div>`:''}
      </div>

      <div class="pki-node svc${phase>=2?' active':''}">
        <div class="node-icon">⚙️</div>
        <div class="node-name">Service A</div>
        <div class="node-info">请求方<br>service-a.internal</div>
        ${phase>=2?`<div class="cert-ttl">cert TTL: 24h</div>`:''}
      </div>

      <div class="pki-node svc${phase>=3?' active':''}">
        <div class="node-icon">📦</div>
        <div class="node-name">Service B</div>
        <div class="node-info">响应方<br>service-b.internal</div>
        ${phase>=3?`<div class="cert-ttl">cert TTL: 24h</div>`:''}
      </div>
    </div>

    <div class="mtls-arrows">
      ${arrows.includes('req')?`<div class="flow-arrow req show">A → Vault: pki/issue/service-cert cn=service-a.internal ttl=24h</div>`:''}
      ${arrows.includes('resp')?`<div class="flow-arrow resp show">Vault → A: { certificate, private_key, issuing_ca }</div>`:''}
      ${arrows.includes('mtls')?`<div class="flow-arrow mtls show">mTLS: A ↔ B — 双方互相验证证书（零信任）</div>`:''}
      ${arrows.includes('renew')?`<div class="flow-arrow resp show">12h 后：Vault Agent 自动续签 → 无停机轮转</div>`:''}
    </div>

    ${phase>=3?`
    <div style="background:rgba(167,139,250,.06);border:1px solid rgba(167,139,250,.2);border-radius:10px;padding:12px;font-size:.76rem;color:#c4b5fd;line-height:1.7">
      <strong>mTLS 握手（双向认证）：</strong><br>
      ① A → B: Client Hello + A 的证书<br>
      ② B 验证 A 的证书（由 Company Internal CA 签发）✓<br>
      ③ B → A: Server Hello + B 的证书 + CertificateRequest<br>
      ④ A 验证 B 的证书 ✓ → 双方共享对称密钥，连接建立
    </div>`:''}

    ${showTable?`
    <div class="vs-table">
      <div class="vs-row">
        <div class="vs-cell hdr">对比项</div>
        <div class="vs-cell hdr">公网长期证书（1 年）</div>
        <div class="vs-cell hdr">内网短期证书（24h）</div>
      </div>
      <div class="vs-row">
        <div class="vs-cell" style="color:var(--dim2)">私钥泄漏影响窗口</div>
        <div class="vs-cell warn-cell">最长 1 年</div>
        <div class="vs-cell ok-cell">最长 24 小时</div>
      </div>
      <div class="vs-row">
        <div class="vs-cell" style="color:var(--dim2)">吊销机制</div>
        <div class="vs-cell warn-cell">需要 CRL/OCSP</div>
        <div class="vs-cell ok-cell">直接过期，无需吊销</div>
      </div>
      <div class="vs-row">
        <div class="vs-cell" style="color:var(--dim2)">续签方式</div>
        <div class="vs-cell warn-cell">ACME 每 60 天手动/自动</div>
        <div class="vs-cell ok-cell">Vault Agent 全自动轮转</div>
      </div>
      <div class="vs-row">
        <div class="vs-cell" style="color:var(--dim2)">适用场景</div>
        <div class="vs-cell" style="color:var(--dim)">公网 HTTPS 服务</div>
        <div class="vs-cell" style="color:var(--dim)">内网 mTLS / 零信任</div>
      </div>
    </div>`:''}
  </div>`;
}

/* ===== Controls ===== */
function next(){
  const scene = SCENES[sceneIdx];
  if(stepIdx < scene.steps.length-1){ stepIdx++; renderAll(); }
  else stopPlay();
}
function prev(){
  if(stepIdx > -1){ stepIdx--; renderAll(); }
}
function reset(){
  stepIdx = -1;
  stopPlay();
  renderAll();
}
function togglePlay(){
  if(timer) stopPlay();
  else startPlay();
}
function startPlay(){
  document.getElementById('playBtn').textContent = '⏸ 暂停';
  timer = setInterval(()=>{
    const scene = SCENES[sceneIdx];
    if(stepIdx < scene.steps.length-1){ stepIdx++; renderAll(); }
    else stopPlay();
  }, 2400);
}
function stopPlay(){
  if(timer){ clearInterval(timer); timer=null; }
  document.getElementById('playBtn').textContent = '▶ 播放';
}

/* Initial render */
renderAll();
</script>
