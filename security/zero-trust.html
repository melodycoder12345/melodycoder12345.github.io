<script>
/* ─── SVG helpers ─── */
const VW = 800, VH = 420;

function svgWrap(content) {
  return `<svg viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="ah"     markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#94a3b8"/></marker>
  <marker id="ah-ok"  markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4ade80"/></marker>
  <marker id="ah-err" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f87171"/></marker>
  <marker id="ah-warn"markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#fbbf24"/></marker>
  <marker id="ah-ok-s"markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0,0 3,8 6" fill="#4ade80"/></marker>
  <marker id="ah-b"   markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#38bdf8"/></marker>
  <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
${content}
</svg>`;
}

function R(x,y,w,h,rx,fill,stroke,sw=1.5){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
}
function Ci(cx,cy,r,fill,stroke,sw=1.5){
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
}
function T(x,y,s,fill,size=11,anchor='middle',extra=''){
  return `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="${size}" fill="${fill}" ${extra}>${s}</text>`;
}
function L(x1,y1,x2,y2,col,mk='ah',sw=1.5,dash=''){
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${sw}" marker-end="url(#${mk})"${dash?` stroke-dasharray="${dash}"`:''}/>`;
}
function P(d,col,mk='ah',sw=1.5,dash=''){
  return `<path d="${d}" stroke="${col}" stroke-width="${sw}" fill="none" marker-end="url(#${mk})"${dash?` stroke-dasharray="${dash}"`:''}/>`;
}
function node(x,y,w,h,label,sub,fill,stroke,sw=1.5){
  let o = R(x-w/2,y-h/2,w,h,9,fill,stroke,sw);
  o += T(x, sub?y-9:y, label,'#e2e8f0',10);
  if(sub) o += T(x,y+8,sub,'#94a3b8',8);
  return o;
}
function ck(x,y,ok){
  const col=ok?'#4ade80':'#f87171', bg=ok?'rgba(74,222,128,.18)':'rgba(248,113,113,.18)';
  return Ci(x,y,10,bg,col,2)+T(x,y,ok?'✓':'✗',col,11);
}
function badge(x,y,txt,col){
  const w=txt.length*6.5+16;
  return R(x-w/2,y-10,w,20,6,col.replace(')',',0.12)').replace('rgb','rgba'),'none')+
         T(x,y,txt,col,8);
}

/* ─── SCENE 1: Traditional Perimeter ─── */
function rings(innerOk=true, outerLabel='Internet / 外网'){
  let s='';
  s+=`<circle cx="310" cy="215" r="172" fill="rgba(248,113,113,0.03)" stroke="rgba(248,113,113,0.45)" stroke-width="1.5" stroke-dasharray="6,4"/>`;
  s+=T(310,46,outerLabel,'#f87171',10);
  s+=`<circle cx="310" cy="215" r="103" fill="${innerOk?'rgba(74,222,128,0.04)':'rgba(248,113,113,0.04)'}" stroke="${innerOk?'rgba(74,222,128,0.45)':'rgba(248,113,113,0.45)'}" stroke-width="1.5"/>`;
  s+=T(310,120,innerOk?'可信内网':'已沦陷',innerOk?'#4ade80':'#f87171',9);
  s+=R(386,188,70,24,5,'rgba(251,191,36,0.1)','rgba(251,191,36,0.4)');
  s+=T(421,200,'🔥 防火墙','#fbbf24',9);
  return s;
}
function internalNodes(webState,dbState,pcState){
  const nodeColor=s=>({ok:'rgba(74,222,128,0.12)',err:'rgba(248,113,113,0.18)',neutral:'rgba(17,24,39,0.85)'}[s]||'rgba(17,24,39,0.85)');
  const nodeStroke=s=>({ok:'rgba(74,222,128,0.55)',err:'rgba(248,113,113,0.65)',neutral:'rgba(255,255,255,0.15)'}[s]||'rgba(255,255,255,0.15)');
  const labels={ok:'✓',err:'⚠ 入侵',neutral:''};
  let o='';
  o+=node(255,192,72,30,'Web Server',webState!=='neutral'?labels[webState]:'',nodeColor(webState),nodeStroke(webState));
  o+=node(370,192,72,30,'Database',dbState!=='neutral'?labels[dbState]:'',nodeColor(dbState),nodeStroke(dbState));
  o+=node(312,260,72,30,'Employee PC',pcState!=='neutral'?labels[pcState]:'',nodeColor(pcState),nodeStroke(pcState));
  return o;
}

    draw(){

  { label:'数据库泄露',

    draw(){

/* ─── SCENE 2: Zero Trust Verification Chain ─── */
function gate(x,y,title,sub,state){
  const fills={idle:'rgba(17,24,39,0.85)',check:'rgba(251,191,36,0.12)',pass:'rgba(74,222,128,0.12)',fail:'rgba(248,113,113,0.12)'};
  const strokes={idle:'rgba(255,255,255,0.15)',check:'rgba(251,191,36,0.6)',pass:'rgba(74,222,128,0.6)',fail:'rgba(248,113,113,0.6)'};
  const icons={idle:'□',check:'🔍',pass:'✓',fail:'✗'};
  const icols={idle:'#64748b',check:'#fbbf24',pass:'#4ade80',fail:'#f87171'};
  let o=R(x-46,y-33,92,66,9,fills[state],strokes[state],state==='idle'?1:2);
  o+=T(x,y-16,title,'#e2e8f0',10);
  o+=T(x,y-2,sub,'#94a3b8',8);
  o+=T(x,y+17,icons[state],icols[state],state==='idle'?10:13);
  return o;
}

/* ─── SCENE 3: mTLS ─── */
function certBox(x,y,subject,spiffe){
  let o=R(x-80,y-40,160,80,8,'rgba(56,189,248,0.07)','rgba(56,189,248,0.35)');
  o+=T(x,y-22,'📜 Certificate','#bae6fd',9);
  o+=T(x,y-6,'Subject: '+subject,'#94a3b8',8);
  o+=T(x,y+8,'Issuer: Internal CA','#94a3b8',8);
  o+=T(x,y+24,spiffe,'#64748b',7.5);
  return o;
}

/* ─── Main Logic ─── */
const SCENARIOS = [
  { name:'传统边界缺陷', icon:'🏰', steps: PERIM_STEPS },
  { name:'零信任验证链', icon:'🔐', steps: ZT_STEPS },
  { name:'mTLS 服务互信', icon:'🔒', steps: MTLS_STEPS },
  { name:'异常访问阻断', icon:'🚨', steps: ANOMALY_STEPS },
];

let curTab=0, curStep=-1, timer=null;

function renderTabs(){
  const el=document.getElementById('tabList');
  el.innerHTML='';
  SCENARIOS.forEach((sc,i)=>{
    const btn=document.createElement('button');
    btn.className='tab-btn'+(i===curTab?' active':'');
    btn.innerHTML=`<span style="font-size:1rem;line-height:1">${sc.icon}</span>${sc.name}`;
    btn.onclick=()=>{ curTab=i; curStep=-1; stopPlay(); render(); };
    el.appendChild(btn);
  });
}

function renderStepList(){
  const el=document.getElementById('stepList');
  el.innerHTML='';
  SCENARIOS[curTab].steps.forEach((s,i)=>{
    const btn=document.createElement('button');
    btn.className='step-btn'+(i===curStep?' active':'');
    btn.innerHTML=`<span class="si">${i+1}</span>${s.label}`;
    btn.onclick=()=>{ curStep=i; stopPlay(); render(); };
    el.appendChild(btn);
  });
}

function getPreview(tab){
  const icons=['🏰','🔐','🔒','🚨'];
  const labels=['传统边界安全模型','零信任请求验证链','mTLS 服务间互信','异常访问阻断'];
  return svgWrap(
    Ci(400,190,70,'rgba(248,113,113,0.06)','rgba(248,113,113,0.2)')+
    T(400,186,icons[tab],'#f87171',40)+
    T(400,272,labels[tab],'#94a3b8',13)+
    T(400,298,'点击"下一步"开始观察','#64748b',10)
  );
}

function render(){
  const sc=SCENARIOS[curTab];
  const step=curStep>=0?sc.steps[curStep]:null;
  document.getElementById('stepMsg').textContent=step
    ?step.msg
    :`场景 ${curTab+1}：${sc.name}\n\n点击"下一步"开始观察。`;
  document.getElementById('animArea').innerHTML=step?step.draw():getPreview(curTab);
  renderTabs();
  renderStepList();
}

function next(){ const l=SCENARIOS[curTab].steps.length; if(curStep<l-1){curStep++;render();} }
function prev(){ if(curStep>-1){curStep--;render();} }
function reset(){ curStep=-1; stopPlay(); render(); }
function togglePlay(){ if(timer) stopPlay(); else startPlay(); }
function startPlay(){
  document.getElementById('playBtn').textContent='⏸ 暂停';
  timer=setInterval(()=>{
    const l=SCENARIOS[curTab].steps.length;
    if(curStep<l-1){curStep++;render();}else stopPlay();
  },2400);
}
function stopPlay(){
  if(timer){clearInterval(timer);timer=null;}
  document.getElementById('playBtn').textContent='▶ 播放';
}

render();
</script>
