<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Kubernetes 将存储解耦为三层：StorageClass（存储类型）、PersistentVolume（实际磁盘资源）、PersistentVolumeClaim（Pod 的存储申请）。动态 Provision 让 CSI driver 自动创建磁盘，Pod 重调度时数据持久保留。">
<link rel="canonical" href="https://melodycoder12345.github.io/cloud-native/k8s-storage.html">
<meta property="og:title" content="K8s 存储：PV / PVC / StorageClass — 码海拾贝">
<meta property="og:description" content="Kubernetes 将存储解耦为三层：StorageClass、PersistentVolume、PersistentVolumeClaim。动态 Provision 让 CSI driver 自动创建磁盘，Pod 重调度时数据持久保留。">
<meta property="og:url" content="https://melodycoder12345.github.io/cloud-native/k8s-storage.html">
<meta property="og:type" content="article">
<meta property="og:site_name" content="码海拾贝">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="K8s 存储：PV / PVC / StorageClass — 码海拾贝">
<meta name="twitter:description" content="Kubernetes 将存储解耦为三层：StorageClass、PersistentVolume、PersistentVolumeClaim。动态 Provision 让 CSI driver 自动创建磁盘，Pod 重调度时数据持久保留。">
<title>K8s 存储：PV / PVC / StorageClass - 云原生</title>
<script src="../nav.js"></script>
<style>
:root{--bg:#0f172a;--text:#e2e8f0;--dim:#94a3b8;--dim2:#64748b;--accent:#38bdf8;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(circle at 20% 0%,rgba(56,189,248,.1),transparent 38%),radial-gradient(circle at 85% 15%,rgba(129,140,248,.07),transparent 30%),var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1300px;margin:0 auto;padding:40px 32px 80px}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--dim2);margin-bottom:24px}
.breadcrumb a{color:var(--dim2)}.breadcrumb a:hover{color:var(--text)}
.page-title{font-size:clamp(1.6rem,3.5vw,2.8rem);letter-spacing:-.04em;margin-bottom:6px;background:linear-gradient(135deg,#f8fafc,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{color:var(--dim);font-size:.95rem;margin-bottom:28px;max-width:700px;line-height:1.75}
/* Layout */
.layout{display:grid;grid-template-columns:272px 1fr;gap:20px;align-items:start}
.left-panel{border:1px solid rgba(255,255,255,.07);background:rgba(17,24,39,.7);border-radius:18px;padding:16px;position:sticky;top:20px}
.panel-section-title{font-size:.67rem;color:var(--dim2);text-transform:uppercase;letter-spacing:.12em;margin-bottom:9px;font-weight:700}
.panel-divider{height:1px;background:rgba(255,255,255,.06);margin:12px 0}
/* Scene tabs */
.scene-tab{width:100%;text-align:left;border:1px solid transparent;background:none;color:var(--dim);padding:8px 10px;border-radius:9px;cursor:pointer;font-size:.79rem;line-height:1.45;transition:.15s;margin-bottom:3px;display:flex;align-items:center;gap:0}
.scene-tab:hover{border-color:rgba(56,189,248,.25);color:var(--text)}
.scene-tab.active{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.4);color:var(--text);font-weight:600}
.scene-num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(56,189,248,.15);color:var(--accent);font-size:.64rem;font-weight:700;margin-right:7px;flex-shrink:0}
/* Step list */
.step-btn{width:100%;text-align:left;border:1px solid transparent;background:none;color:var(--dim);padding:6px 9px;border-radius:8px;cursor:pointer;font-size:.76rem;line-height:1.45;transition:.15s;margin-bottom:2px;display:flex;align-items:flex-start;gap:0}
.step-btn:hover{border-color:rgba(56,189,248,.2);color:var(--text)}
.step-btn.active{background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.35);color:var(--text)}
.step-idx{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:rgba(56,189,248,.12);color:var(--accent);font-size:.62rem;font-weight:700;margin-right:6px;flex-shrink:0;margin-top:1px}
/* Controls */
.ctrl{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.ctrl button{flex:1;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--dim);border-radius:9px;padding:7px 4px;cursor:pointer;font-size:.73rem;transition:.15s;min-width:50px}
.ctrl button:hover{border-color:var(--accent);color:var(--text)}
/* Center panel */
.center-panel{border:1px solid rgba(255,255,255,.07);background:rgba(17,24,39,.7);border-radius:18px;padding:22px;min-height:560px}
.step-msg{border-left:3px solid var(--accent);background:rgba(56,189,248,.06);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.86rem;color:var(--text);line-height:1.7;margin-bottom:18px}
/* Arch diagram */
.arch-diagram{display:flex;flex-direction:column;gap:0}
.arch-layer{border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:13px 15px;background:rgba(30,41,59,.2)}
.arch-layer.user-layer{border-color:rgba(56,189,248,.14)}
.arch-layer.k8s-layer{border-color:rgba(129,140,248,.14)}
.arch-layer.storage-layer{border-color:rgba(74,222,128,.12)}
.layer-header{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.layer-label{font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2);font-weight:700}
.layer-badge{font-size:.6rem;padding:2px 6px;border-radius:4px;font-family:monospace}
.user-layer .layer-badge{background:rgba(56,189,248,.09);color:#7dd3fc;border:1px solid rgba(56,189,248,.18)}
.k8s-layer .layer-badge{background:rgba(129,140,248,.09);color:#c7d2fe;border:1px solid rgba(129,140,248,.18)}
.storage-layer .layer-badge{background:rgba(74,222,128,.07);color:#86efac;border:1px solid rgba(74,222,128,.16)}
.arch-cards{display:flex;gap:9px;align-items:stretch;flex-wrap:wrap}
.flow-arrow{display:flex;align-items:center;color:var(--dim2);font-size:.8rem;padding:0 1px;transition:color .3s;flex-shrink:0}
.flow-arrow.active{color:var(--accent)}
/* Arch cards */
.arch-card{border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;background:rgba(15,23,42,.5);min-width:125px;transition:all .35s;position:relative;flex:none}
.arch-card .card-icon{font-size:1.2rem;margin-bottom:4px}
.arch-card .card-name{font-size:.77rem;font-weight:700;color:var(--text);margin-bottom:2px}
.arch-card .card-detail{font-size:.66rem;color:var(--dim2);font-family:monospace;line-height:1.5}
.arch-card.active{border-color:var(--accent);background:rgba(56,189,248,.07);box-shadow:0 0 14px rgba(56,189,248,.12)}
.arch-card.done{border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.05)}
.arch-card.error{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.06)}
.arch-card.warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.05)}
/* Status badge */
.status-badge{display:inline-block;font-size:.63rem;font-weight:700;padding:2px 6px;border-radius:4px;margin-top:5px;font-family:monospace;transition:all .3s}
.status-badge.pending{background:rgba(251,191,36,.15);color:var(--warn);border:1px solid rgba(251,191,36,.3)}
.status-badge.available{background:rgba(56,189,248,.12);color:#7dd3fc;border:1px solid rgba(56,189,248,.25)}
.status-badge.bound{background:rgba(74,222,128,.12);color:var(--ok);border:1px solid rgba(74,222,128,.3)}
.status-badge.running{background:rgba(74,222,128,.12);color:var(--ok);border:1px solid rgba(74,222,128,.3)}
.status-badge.failed{background:rgba(248,113,113,.12);color:var(--err);border:1px solid rgba(248,113,113,.3)}
.status-badge.dead{background:rgba(248,113,113,.12);color:var(--err);border:1px solid rgba(248,113,113,.3)}
.status-badge.hidden{display:none}
/* Capacity bar */
.capacity-bar{margin-top:7px;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.capacity-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .8s cubic-bezier(.25,.46,.45,.94),background .4s}
/* Connector between layers */
.arch-connector{display:flex;justify-content:center;align-items:center;height:26px;position:relative}
.conn-vert{width:2px;height:18px;background:rgba(255,255,255,.06);border-radius:1px;transition:all .4s}
.conn-vert.active{background:var(--accent);box-shadow:0 0 8px rgba(56,189,248,.35)}
.conn-vert.done{background:rgba(74,222,128,.5)}
.conn-label{position:absolute;right:calc(50% + 10px);font-size:.62rem;color:var(--dim2);white-space:nowrap;font-family:monospace}
.conn-label.active{color:var(--accent)}
/* Info box */
.info-box{margin-top:12px;border-radius:10px;padding:9px 13px;font-size:.82rem;line-height:1.65;display:none}
.info-box.show{display:block}
.info-box.error-box{border:1px solid rgba(248,113,113,.4);background:rgba(248,113,113,.07);color:var(--err)}
.info-box.success-box{border:1px solid rgba(74,222,128,.35);background:rgba(74,222,128,.06);color:var(--ok)}
.info-box.warn-box{border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.06);color:var(--warn)}
/* CSI call indicator */
.csi-call{font-size:.65rem;font-family:monospace;padding:2px 6px;border-radius:4px;background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.13);color:#7dd3fc;margin-top:4px;display:none}
.csi-call.show{display:inline-block}
.csi-call.active{background:rgba(56,189,248,.16);border-color:var(--accent);color:var(--accent)}
/* Node boxes for scene 2 */
.node-container{display:flex;gap:12px;flex-wrap:wrap}
.node-box{border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 13px;background:rgba(30,41,59,.4);flex:1;min-width:175px;transition:all .35s}
.node-box.active-node{border-color:var(--accent);background:rgba(56,189,248,.07);box-shadow:0 0 12px rgba(56,189,248,.1)}
.node-box.dead-node{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.05);opacity:.75}
.node-box.new-node{border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.05)}
.node-name{font-size:.74rem;font-weight:700;margin-bottom:8px;color:var(--text)}
.node-pod{display:flex;align-items:center;gap:5px;font-size:.7rem;padding:5px 8px;border-radius:7px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);margin-bottom:4px;transition:all .3s}
.node-pod.running{border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.06)}
.node-pod.dead{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.05);opacity:.55;text-decoration:line-through}
.node-pod.starting{border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.05)}
.node-pod.hidden{display:none}
.node-mount{font-size:.65rem;color:var(--dim2);font-family:monospace;margin-top:3px}
/* Pulse & shake animations */
@keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(56,189,248,.4)}70%{box-shadow:0 0 0 9px rgba(56,189,248,0)}100%{box-shadow:0 0 0 0 rgba(56,189,248,0)}}
.arch-card.active.pulse{animation:pulse-ring 1.6s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.arch-card.error{animation:shake .5s ease}
</style>
</head>
<body>
<main class="wrap">
  <div class="breadcrumb"><a href="../index.html">首页</a><span>/</span><a href="index.html">云原生</a><span>/</span>K8s 存储 PV/PVC</div>
  <h1 class="page-title">K8s 存储：PV / PVC / StorageClass</h1>
  <p class="subtitle">StorageClass 描述动态制备策略，PersistentVolume 表示集群存储资源，PersistentVolumeClaim 表达用户请求。CSI 可实现制备、挂载和扩容；持久性、拓扑、访问模式、故障切换与在线扩容能力取决于存储后端、CSI 驱动及配置。</p>

  <div class="layout">
    <div class="left-panel">
      <div class="panel-section-title">场景</div>
      <div id="sceneTabs">
        <button class="scene-tab" onclick="selectScene(0)"><span class="scene-num">1</span>动态 Provision</button>
        <button class="scene-tab" onclick="selectScene(1)"><span class="scene-num">2</span>Pod 故障重调度</button>
        <button class="scene-tab" onclick="selectScene(2)"><span class="scene-num">3</span>静态 Provision</button>
        <button class="scene-tab" onclick="selectScene(3)"><span class="scene-num">4</span>存储扩容</button>
      </div>
      <div class="panel-divider"></div>
      <div class="panel-section-title">步骤</div>
      <div id="stepList" style="max-height:245px;overflow-y:auto;padding-right:2px"></div>
      <div class="ctrl">
        <button onclick="prev()">← 上一步</button>
        <button onclick="next()">下一步 →</button>
        <button onclick="reset()">重置</button>
        <button id="playBtn" onclick="togglePlay()">▶ 播放</button>
      </div>
    </div>

    <div class="center-panel">
      <div class="step-msg" id="stepMsg">选择左侧场景，点击「下一步」开始动画。</div>
      <div id="diagramArea"></div>
    </div>
  </div>
</main>

<script>
// ─── Helpers ───────────────────────────────────────────────────────────────
const d   = id => document.getElementById(id);
const cl  = (id, cls) => { const e = d(id); if (e) e.className = cls; };
const tx  = (id, txt) => { const e = d(id); if (e) e.textContent = txt; };
const sh  = (id, show) => { const e = d(id); if (e) e.style.display = show ? '' : 'none'; };

function card(id, state) {
  const e = d(id);
  if (!e) return;
  e.className = 'arch-card' + (state ? ' ' + state : '');
}
function badge(id, text, cls) {
  const e = d(id);
  if (!e) return;
  if (!text) { e.className = 'status-badge hidden'; return; }
  e.textContent = text;
  e.className = 'status-badge ' + (cls || '');
}
function conn(id, state) {
  const e = d(id);
  if (!e) return;
  e.className = 'conn-vert' + (state ? ' ' + state : '');
}
function arrow(id, active) {
  const e = d(id);
  if (!e) return;
  e.className = 'flow-arrow' + (active ? ' active' : '');
}
function csiCall(id, active) {
  const e = d(id);
  if (!e) return;
  e.className = 'csi-call' + (active ? ' show active' : '');
}
function infoBox(id, type, text) {
  const e = d(id);
  if (!e) return;
  if (!text) { e.className = 'info-box'; return; }
  e.className = 'info-box ' + type + '-box show';
  e.textContent = text;
}
function setFill(id, pct) {
  const e = d(id);
  if (!e) return;
  e.style.width = pct + '%';
  e.style.background = pct >= 85 ? 'var(--err)' : pct >= 65 ? 'var(--warn)' : 'var(--accent)';
}

// ─── Scene 1: 动态 Provision ──────────────────────────────────────────────
const S1_DIAGRAM = `
<div class="arch-diagram">
  <div class="arch-layer user-layer">
    <div class="layer-header"><span class="layer-label">用户层</span><span class="layer-badge">User Space</span></div>
    <div class="arch-cards">
      <div class="arch-card" id="pod">
        <div class="card-icon">🗄️</div>
        <div class="card-name">Pod</div>
        <div class="card-detail">myapp-pod</div>
        <div class="status-badge hidden" id="pod-status"></div>
      </div>
      <div class="flow-arrow" id="pod-pvc-arrow">──ref──▶</div>
      <div class="arch-card" id="pvc">
        <div class="card-icon">📋</div>
        <div class="card-name">PVC</div>
        <div class="card-detail">my-pvc · 20Gi<br>storageClass: ssd</div>
        <div class="status-badge hidden" id="pvc-status"></div>
      </div>
    </div>
  </div>
  <div class="arch-connector">
    <div class="conn-vert" id="bind-conn"></div>
    <span class="conn-label">binding</span>
  </div>
  <div class="arch-layer k8s-layer">
    <div class="layer-header"><span class="layer-label">K8s 控制面</span><span class="layer-badge">Control Plane</span></div>
    <div class="arch-cards">
      <div class="arch-card" id="sc">
        <div class="card-icon">⚙️</div>
        <div class="card-name">StorageClass</div>
        <div class="card-detail">name: ssd<br>provisioner: ebs.csi<br>type: gp3</div>
      </div>
      <div class="flow-arrow" id="sc-pv-arrow">──▶</div>
      <div class="arch-card" id="pv">
        <div class="card-icon">💽</div>
        <div class="card-name">PV</div>
        <div class="card-detail" id="pv-detail">（尚未创建）</div>
        <div class="status-badge hidden" id="pv-status"></div>
      </div>
    </div>
  </div>
  <div class="arch-connector">
    <div class="conn-vert" id="csi-conn"></div>
    <span class="conn-label">CSI gRPC</span>
  </div>
  <div class="arch-layer storage-layer">
    <div class="layer-header"><span class="layer-label">存储后端</span><span class="layer-badge">Storage Backend</span></div>
    <div class="arch-cards">
      <div class="arch-card" id="csi-driver">
        <div class="card-icon">🔌</div>
        <div class="card-name">CSI Driver</div>
        <div class="card-detail">aws-ebs-csi-driver</div>
        <div class="csi-call" id="csi-call-create">CreateVolume(20Gi, gp3)</div>
        <div class="csi-call" id="csi-call-publish">NodePublish(vol-xxx)</div>
      </div>
      <div class="flow-arrow" id="csi-cloud-arrow">──▶</div>
      <div class="arch-card" id="cloud-api">
        <div class="card-icon">☁️</div>
        <div class="card-name">AWS EC2 API</div>
        <div class="card-detail">CreateVolume request</div>
      </div>
      <div class="flow-arrow" id="cloud-disk-arrow">──▶</div>
      <div class="arch-card" id="disk">
        <div class="card-icon">💾</div>
        <div class="card-name">EBS Volume</div>
        <div class="card-detail" id="disk-detail">（尚未创建）</div>
        <div class="status-badge hidden" id="disk-status"></div>
      </div>
    </div>
  </div>
  <div class="info-box" id="mount-info"></div>
</div>`;

const SCENE1 = {
  title: '动态 Provision', subtitle: 'CSI driver 按需自动创建 PV',
  diagram: S1_DIAGRAM,
  steps: [
    {
      label: '初始状态',
      msg: '初始状态：集群中已配置好 StorageClass "ssd"（provisioner: ebs.csi.aws.com，volumeType: gp3）。尚无 PVC 和 PV。CSI driver 以 DaemonSet + Deployment 方式运行在集群中，随时监听存储请求。三层架构：StorageClass 是模板，PV 是实际磁盘对象，PVC 是用户的存储申请。',
      apply() {
        card('pod', ''); badge('pod-status', null);
        card('pvc', ''); badge('pvc-status', null);
        card('sc', 'active pulse');
        card('pv', ''); tx('pv-detail', '（尚未创建）'); badge('pv-status', null);
        conn('bind-conn', ''); conn('csi-conn', '');
        card('csi-driver', ''); csiCall('csi-call-create', false); csiCall('csi-call-publish', false);
        card('cloud-api', '');
        card('disk', ''); tx('disk-detail', '（尚未创建）'); badge('disk-status', null);
        arrow('pod-pvc-arrow', false); arrow('sc-pv-arrow', false);
        arrow('csi-cloud-arrow', false); arrow('cloud-disk-arrow', false);
        infoBox('mount-info', '', null);
      }
    },
    {
      label: 'Step 1：用户创建 PVC',
      msg: 'Step 1：用户提交 PVC YAML，声明 storage: 20Gi，storageClassName: ssd，accessModes: [ReadWriteOnce]。kubectl apply 后，PVC 对象进入 Pending 状态，等待 K8s 处理。此时没有可用的 PV，controller 将触发动态 Provision 流程。',
      apply() {
        card('pod', ''); badge('pod-status', null);
        card('pvc', 'active pulse'); badge('pvc-status', 'Pending', 'pending');
        card('sc', '');
        card('pv', ''); tx('pv-detail', '（尚未创建）'); badge('pv-status', null);
        conn('bind-conn', ''); conn('csi-conn', '');
        card('csi-driver', ''); csiCall('csi-call-create', false); csiCall('csi-call-publish', false);
        card('cloud-api', '');
        card('disk', ''); tx('disk-detail', '（尚未创建）'); badge('disk-status', null);
        arrow('pod-pvc-arrow', false); arrow('sc-pv-arrow', false);
        arrow('csi-cloud-arrow', false); arrow('cloud-disk-arrow', false);
        infoBox('mount-info', '', null);
      }
    },
    {
      label: 'Step 2：匹配 StorageClass',
      msg: 'Step 2：K8s 的 external-provisioner sidecar（与 CSI driver 同 Pod）监控到 Pending PVC，读取 storageClassName="ssd"，找到对应的 StorageClass（provisioner: ebs.csi.aws.com）。external-provisioner 将代理 CSI driver 执行 CreateVolume。',
      apply() {
        card('pod', ''); badge('pod-status', null);

// ─── Scene Registry ───────────────────────────────────────────────────────────
const SCENES = [SCENE1, SCENE2, SCENE3, SCENE4];
let curScene = 0, curStep = -1, timer = null;

// ─── Navigation ───────────────────────────────────────────────────────────────
function selectScene(idx) {
  curScene = idx;
  curStep = -1;
  stopPlay();
  renderScene();
}

function renderScene() {
  const scene = SCENES[curScene];
  // Update scene tab buttons
  document.querySelectorAll('.scene-tab').forEach((btn, i) => {
    btn.className = 'scene-tab' + (i === curScene ? ' active' : '');
  });
  // Inject diagram HTML
  d('diagramArea').innerHTML = scene.diagram;
  // Update step message
  d('stepMsg').textContent = scene.title + '：' + scene.subtitle + '。选择左侧步骤或点击「下一步」开始动画。';
  // Rebuild step list
  const stepList = d('stepList');
  stepList.innerHTML = '';
  scene.steps.forEach((step, i) => {
    const btn = document.createElement('button');
    btn.className = 'step-btn' + (i === curStep ? ' active' : '');
    btn.innerHTML = `<span class="step-idx">${i + 1}</span>${step.label}`;
    btn.onclick = () => { curStep = i; render(); };
    stepList.appendChild(btn);
  });
  // Apply initial diagram state
  if (scene.steps.length > 0) scene.steps[0].apply();
}

function render() {
  const scene = SCENES[curScene];
  const step = scene.steps[curStep];
  if (!step) return;
  d('stepMsg').textContent = step.msg;
  step.apply();
  document.querySelectorAll('.step-btn').forEach((btn, i) => {
    btn.className = 'step-btn' + (i === curStep ? ' active' : '');
  });
}

function next() {
  const scene = SCENES[curScene];
  if (curStep < scene.steps.length - 1) { curStep++; render(); }
}
function prev() {
  if (curStep > 0) { curStep--; render(); }
  else if (curStep === 0) { curStep = -1; renderScene(); }
}
function reset() {
  curStep = -1;
  stopPlay();
  renderScene();
}
function togglePlay() {
  if (timer) stopPlay(); else startPlay();
}
function startPlay() {
  d('playBtn').textContent = '⏸ 暂停';
  timer = setInterval(() => {
    const scene = SCENES[curScene];
    if (curStep < scene.steps.length - 1) { curStep++; render(); } else stopPlay();
  }, 2400);
}
function stopPlay() {
  if (timer) { clearInterval(timer); timer = null; }
  d('playBtn').textContent = '▶ 播放';
}

// Init
selectScene(0);
