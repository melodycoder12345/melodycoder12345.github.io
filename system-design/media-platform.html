<section class="dc-hero"><article class="dc-card"><div class="dc-eyebrow">系统设计 / 音视频</div><h1 class="dc-title">视频与直播平台架构</h1><p class="dc-summary">点播和直播共享编码、转码、分片与 CDN 基础设施，但直播额外承担采集稳定性、端到端低延迟、实时互动和突发并发。</p></article><aside class="dc-card dc-principles"><div class="dc-principle"><strong>点播重吞吐与成本</strong><span>异步转码、多码率文件、缓存命中和存储生命周期是主线。</span></div><div class="dc-principle"><strong>直播重延迟与连续性</strong><span>采集、转码、分发和播放每一段都会贡献端到端延迟。</span></div><div class="dc-principle"><strong>CDN 不是全部</strong><span>回源保护、热点调度、鉴权、弱网和质量监控同样关键。</span></div></aside></section>
<div class="dc-decision"><b>选型重点：</b>先明确点播或直播、目标延迟、清晰度梯度、峰值并发和成本预算，再选择 HLS/LL-HLS、WebRTC 或其他传输方案；不要仅凭协议名称做决定。</div>
