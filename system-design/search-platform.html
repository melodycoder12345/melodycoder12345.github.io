<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="统一理解搜索引擎离线索引、在线检索和搜索建议链路，并保留两套系统设计动画。"><link rel="canonical" href="https://melodycoder12345.github.io/system-design/search-platform.html"><title>搜索平台架构 - 系统设计</title><script src="../nav.js"></script><link rel="stylesheet" href="../demo-collection.css"><style>body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(245,158,11,.12),transparent 34%),#0f172a;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh}.dc-shell{--dc-accent:#f59e0b}</style></head><body><main class="dc-shell">
<section class="dc-hero"><article class="dc-card"><div class="dc-eyebrow">系统设计 / 检索</div><h1 class="dc-title">搜索平台架构</h1><p class="dc-summary">把爬取与写入、倒排索引、召回排序、搜索建议和热词更新放在同一条工程链路中，避免把“搜索引擎”和“自动补全”当成完全独立的系统。</p></article><aside class="dc-card dc-principles"><div class="dc-principle"><strong>离线与在线分离</strong><span>索引构建关注吞吐和新鲜度，查询链路关注尾延迟和结果质量。</span></div><div class="dc-principle"><strong>建议不是主搜索缩小版</strong><span>它依赖前缀、热度、个性化与严格延迟预算。</span></div><div class="dc-principle"><strong>先定义质量指标</strong><span>相关性、召回率、零结果率和延迟共同决定架构。</span></div></aside></section>
<div class="dc-decision"><b>工程边界：</b>中小规模业务优先评估 Elasticsearch/OpenSearch 等成熟检索系统；只有数据规模、排序目标或成本约束足够特殊时，才拆建专用索引与查询服务。</div>
