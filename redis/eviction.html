<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redis 内存淘汰策略 - 可视化学习</title>
<style>
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#0d1117;
  --border:#334155; --text:#e2e8f0; --dim:#94a3b8; --dim2:#64748b;
  --blue:#38bdf8; --yellow:#fbbf24; --orange:#fb923c;
  --green:#4ade80; --purple:#c084fc; --red:#f87171; --teal:#2dd4bf;
  --redis:#dc382c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
nav{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;flex-wrap:wrap;}
.back-btn{color:var(--dim);text-decoration:none;font-size:0.9rem;transition:color 0.15s;}.back-btn:hover{color:var(--text);}
nav h1{font-size:1.15rem;font-weight:600;}
.badges{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
.badge{font-size:0.72rem;padding:3px 10px;border-radius:100px;font-family:monospace;font-weight:500;}
.main{display:flex;flex:1;overflow:hidden;}
.viz-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;}
.viz-area{flex:1;overflow-y:auto;padding:20px 24px;}
.desc-box{padding:10px 20px;background:rgba(255,255,255,0.03);border-top:1px solid var(--border);font-size:0.88rem;color:var(--dim);min-height:48px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.step-counter{margin-left:auto;font-size:0.8rem;color:var(--dim);font-family:monospace;white-space:nowrap;}
.code-panel{width:46%;min-width:360px;display:flex;flex-direction:column;overflow:hidden;}
.code-panel-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:0.85rem;color:var(--dim);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.code-dot{width:10px;height:10px;border-radius:50%;}
.code-body{flex:1;overflow-y:auto;padding:10px 0;background:var(--panel2);}
.code-body::-webkit-scrollbar{width:5px;}.code-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.code-line{display:flex;align-items:stretch;padding:0;cursor:pointer;transition:background 0.12s;font-family:'JetBrains Mono',monospace;font-size:0.8rem;line-height:1.65;}
.code-line:hover{background:rgba(255,255,255,0.04);}.code-line.active{background:rgba(251,191,36,0.12);}.code-line.active .ln{color:var(--yellow);}
.ln{min-width:44px;padding:0 10px 0 14px;color:#4b5563;text-align:right;user-select:none;flex-shrink:0;font-size:0.76rem;}
.lc{padding:0 14px 0 4px;flex:1;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.num{color:#79c0ff;}.pkg{color:#ffa657;}.cm{color:#8b949e;}.id{color:#e6edf3;}
.controls{display:flex;align-items:center;gap:8px;padding:10px 20px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.btn{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:7px;cursor:pointer;font-size:0.83rem;transition:all 0.15s;}
.btn:hover{background:rgba(255,255,255,0.12);}.btn.primary{background:rgba(220,56,44,0.15);border-color:rgba(220,56,44,0.4);color:var(--redis);}
.btn:disabled{opacity:0.38;cursor:not-allowed;}
.speed-wrap{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:0.78rem;color:var(--dim);}
input[type=range]{-webkit-appearance:none;width:80px;height:3px;background:var(--border);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--redis);cursor:pointer;}

/* Viz */
.mem-bar-wrap{margin-bottom:16px;}
.mem-bar{height:28px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:6px;overflow:hidden;position:relative;}
.mem-fill{height:100%;transition:width 0.5s ease;border-radius:4px;display:flex;align-items:center;padding-left:10px;font-size:0.78rem;font-weight:600;}
.mem-label{font-size:0.8rem;color:var(--dim);margin-bottom:6px;display:flex;justify-content:space-between;}
.key-pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.key-item{padding:6px 12px;border-radius:6px;font-family:monospace;font-size:0.8rem;border:1px solid;transition:all 0.4s;position:relative;}
.key-item.evict{background:rgba(248,113,113,0.15)!important;border-color:rgba(248,113,113,0.5)!important;color:var(--red)!important;text-decoration:line-through;transform:scale(0.95);}
.key-item.sample{box-shadow:0 0 8px var(--yellow);border-color:var(--yellow)!important;}
.policy-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid;margin-bottom:10px;font-size:0.83rem;}
.policy-name{font-family:monospace;font-weight:600;min-width:140px;}
.policy-desc{color:var(--dim);flex:1;}
.policy-tag{font-size:0.7rem;padding:2px 8px;border-radius:10px;font-family:monospace;}
.lru-clock{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.clock-item{padding:4px 10px;border-radius:5px;font-family:monospace;font-size:0.78rem;background:rgba(255,255,255,0.05);border:1px solid var(--border);transition:all 0.4s;}
.clock-item .clock-label{color:var(--dim2);font-size:0.68rem;}
.clock-item.hot{border-color:rgba(56,189,248,0.4);background:rgba(56,189,248,0.08);color:var(--blue);}
.clock-item.cold{border-color:rgba(248,113,113,0.4);background:rgba(248,113,113,0.08);color:var(--red);}
.freq-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.freq-key{font-family:monospace;font-size:0.8rem;min-width:80px;color:var(--text);}
.freq-track{flex:1;height:12px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;}
.freq-fill{height:100%;border-radius:3px;transition:width 0.5s;}
.freq-val{font-size:0.75rem;color:var(--dim);min-width:35px;text-align:right;font-family:monospace;}

@media(max-width:768px){
  body{height:auto!important;min-height:100vh;overflow-y:auto!important;}
  nav{flex-wrap:wrap;padding:8px 14px;gap:6px;}
  nav h1{font-size:0.95rem;}
  .badges{margin-left:0!important;width:100%;order:3;}
  .main{flex-direction:column!important;overflow:visible!important;height:auto!important;flex:none!important;}
  .viz-panel{border-right:none!important;border-bottom:1px solid var(--border);height:340px!important;min-height:340px!important;flex:none!important;}
  .code-panel{width:100%!important;min-width:unset!important;height:320px!important;flex:none!important;}
  .controls{flex-wrap:wrap!important;gap:5px!important;height:auto!important;}
  .speed-wrap{margin-left:0!important;width:100%;justify-content:flex-end;}
}
</style>
<script src="../nav.js"></script>
<script src="../concept.js"></script>
</head>
<body>
<nav>
  <a href="index.html" class="back-btn">← 返回</a>
  <h1>Redis 内存淘汰策略</h1>
  <div class="badges">
    <span class="badge" style="background:rgba(220,56,44,0.15);color:#dc382c">LRU</span>
    <span class="badge" style="background:rgba(56,189,248,0.15);color:#38bdf8">LFU</span>
    <span class="badge" style="background:rgba(74,222,128,0.15);color:#4ade80">淘汰策略</span>

<div class="main">

</div>
<div class="controls">
  <button class="btn" id="btnReset">⏮ 重置</button>
  <button class="btn" id="btnPrev">◀ 上一步</button>
  <button class="btn primary" id="btnPlay">▶ 播放</button>
  <button class="btn" id="btnNext">下一步 ▶</button>
  <div class="speed-wrap"><span>🐢</span><input type="range" id="speedRange" min="1" max="5" value="3"><span>🐇</span></div>
</div>
<script>
if (window.NavTracker) NavTracker.track('Redis 内存淘汰', 'redis/eviction.html', '🗑️', 'Redis');

window.PAGE_CONCEPTS = [
  { title: 'maxmemory 配置', body: `当 Redis 内存使用达到 maxmemory 上限时，新写入会触发淘汰策略。未设置则内存无上限，可能导致 OOM。生产必须配置。` },
  { title: 'noeviction', body: `默认策略：内存满时拒绝新写入，返回 OOM 错误。适合不允许丢数据的场景（如消息队列），需配合监控报警。` },
  { title: 'LRU 算法', body: `Least Recently Used：淘汰最近最少使用的 key。Redis 用近似 LRU（随机采样 N 个 key），避免维护完整 LRU 链表的开销。`, tag: '近似实现' },
  { title: 'LFU 算法', body: `Least Frequently Used（Redis 4.0+）：淘汰访问频率最低的 key。用 Morris Counter 近似计数（8 bit），结合访问时间衰减，比 LRU 更适合热点数据保留。`, tag: 'Redis 4.0+' },
  { title: 'volatile vs allkeys', body: `volatile-* 只淘汰设置了 TTL 的 key，保护无过期时间的 key。allkeys-* 面向所有 key，内存压力大时更激进淘汰。纯缓存场景推荐 allkeys-lru/lfu。` }
];

const CODE_LINES = [
  {html:`<span class="kw">package</span> <span class="pkg">main</span>`},
  {html:``},
  {html:`<span class="kw">import</span> (`},
  {html:`&nbsp;&nbsp;<span class="st">"context"</span>`},
  {html:`&nbsp;&nbsp;<span class="st">"fmt"</span>`},
  {html:`&nbsp;&nbsp;<span class="st">"time"</span>`},
  {html:`&nbsp;&nbsp;<span class="st">"github.com/redis/go-redis/v9"</span>`},
  {html:`)`},
  {html:``},
  {html:`<span class="kw">var</span> <span class="id">ctx</span> = <span class="pkg">context</span>.<span class="fn">Background</span>()`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">demonstrateLRU</span>(<span class="id">rdb</span> *<span class="id">redis</span>.<span class="fn">Client</span>) {`},
  {html:`&nbsp;&nbsp;<span class="cm">// 设置 maxmemory 和淘汰策略</span>`},
  {html:`&nbsp;&nbsp;<span class="id">rdb</span>.<span class="fn">ConfigSet</span>(<span class="id">ctx</span>, <span class="st">"maxmemory"</span>, <span class="st">"100mb"</span>)`},
  {html:`&nbsp;&nbsp;<span class="id">rdb</span>.<span class="fn">ConfigSet</span>(<span class="id">ctx</span>, <span class="st">"maxmemory-policy"</span>, <span class="st">"allkeys-lru"</span>)`},
  {html:``},
  {html:`&nbsp;&nbsp;<span class="cm">// 带 TTL 的 key (volatile 策略下优先淘汰)</span>`},
  {html:`&nbsp;&nbsp;<span class="id">rdb</span>.<span class="fn">Set</span>(<span class="id">ctx</span>, <span class="st">"session:1"</span>, <span class="st">"user-data"</span>, <span class="num">30</span>*<span class="id">time</span>.<span class="fn">Minute</span>)`},
  {html:`&nbsp;&nbsp;<span class="id">rdb</span>.<span class="fn">Set</span>(<span class="id">ctx</span>, <span class="st">"session:2"</span>, <span class="st">"user-data"</span>, <span class="num">5</span>*<span class="id">time</span>.<span class="fn">Minute</span>)`},
  {html:``},
  {html:`&nbsp;&nbsp;<span class="cm">// 无 TTL 的 key</span>`},
  {html:`&nbsp;&nbsp;<span class="id">rdb</span>.<span class="fn">Set</span>(<span class="id">ctx</span>, <span class="st">"config:theme"</span>, <span class="st">"dark"</span>, <span class="num">0</span>)`},
  {html:``},
  {html:`&nbsp;&nbsp;<span class="cm">// 查看内存使用</span>`},
  {html:`&nbsp;&nbsp;<span class="id">info</span>, _ := <span class="id">rdb</span>.<span class="fn">Info</span>(<span class="id">ctx</span>, <span class="st">"memory"</span>).<span class="fn">Result</span>()`},
  {html:`&nbsp;&nbsp;<span class="pkg">fmt</span>.<span class="fn">Println</span>(<span class="id">info</span>)`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">demonstrateLFU</span>(<span class="id">rdb</span> *<span class="id">redis</span>.<span class="fn">Client</span>) {`},
  {html:`&nbsp;&nbsp;<span class="id">rdb</span>.<span class="fn">ConfigSet</span>(<span class="id">ctx</span>, <span class="st">"maxmemory-policy"</span>, <span class="st">"allkeys-lfu"</span>)`},
  {html:``},
  {html:`&nbsp;&nbsp;<span class="cm">// 频繁访问的 key 不会被淘汰</span>`},
  {html:`&nbsp;&nbsp;<span class="kw">for</span> <span class="id">i</span> := <span class="num">0</span>; <span class="id">i</span> &lt; <span class="num">100</span>; <span class="id">i</span>++ {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">rdb</span>.<span class="fn">Get</span>(<span class="id">ctx</span>, <span class="st">"hot:key"</span>)`},
  {html:`&nbsp;&nbsp;}`},
  {html:``},
  {html:`&nbsp;&nbsp;<span class="cm">// 很少访问的 key 更容易被淘汰</span>`},
  {html:`&nbsp;&nbsp;<span class="id">rdb</span>.<span class="fn">Get</span>(<span class="id">ctx</span>, <span class="st">"cold:key"</span>) <span class="cm">// 只访问一次</span>`},
  {html:`}`},
];


const KEYS = [
  {name:'user:1', color:'var(--blue)', ttl:'30m', access: 5},
  {name:'cache:home', color:'var(--green)', ttl:'10m', access: 15},
  {name:'session:abc', color:'var(--purple)', ttl:'5m', access: 2},
  {name:'config:theme', color:'var(--teal)', ttl:'∞', access: 1},
  {name:'hot:key', color:'var(--yellow)', ttl:'∞', access: 100},
  {name:'counter', color:'var(--orange)', ttl:'∞', access: 8},
];

const STEPS = [
  {
    highlightLines:[12,13,14,15],
    hlJs:[5,6], hlPy:[5,6],
    description:"内存达到 maxmemory 限制：Redis 开始根据配置的淘汰策略选择要驱逐的 key",
    render: () => renderMemFull()
  },
  {
    highlightLines:[12,13,14,15],
    hlJs:[5,6], hlPy:[5,6],
    description:"策略 1: noeviction — 内存满时直接返回 OOM 错误，不淘汰任何 key（适合不能丢数据的场景）",
    render: () => renderNoEviction()
  },
  {
    highlightLines:[13,14,15],
    hlJs:[6,7,8], hlPy:[6,7],
    description:"策略 2: allkeys-lru — 从所有 key 中淘汰最近最少使用的 key（访问时间最老的）",
    render: () => renderLruOverview()
  },
  {
    highlightLines:[17,18,19,20,21,22],
    hlJs:[10,11,12,13], hlPy:[9,10,11,12,13],
    description:"LRU 时钟: Redis 用 24bit 记录每个 key 的最近访问时间（秒级精度），内存占用小",
    render: () => renderLruClock()
  },
  {
    highlightLines:[13,14,15],
    hlJs:[6,7], hlPy:[6,7],
    description:"近似 LRU: 随机采样 N 个 key（默认 5 个），找出其中访问时间最老的进行淘汰，避免维护链表",
    render: () => renderLruSample()
  },
  {
    highlightLines:[29,30],
    hlJs:[20,21], hlPy:[20,21],
    description:"策略 3: allkeys-lfu — 淘汰访问频率最低的 key（Morris Counter 对数衰减计数）",
    render: () => renderLfuOverview()
  },
  {
    highlightLines:[31,32,33,34,35,36,37],
    hlJs:[21,22,23,24,25,26], hlPy:[21,22,23,24],
    description:"LFU 计数器: 8bit 衰减计数，最近访问少频率高的 key 不易被淘汰，对数增长避免溢出",
    render: () => renderLfuCounter()
  },
  {
    highlightLines:[14,15,17,18,19],
    hlJs:[6,7,10,11], hlPy:[6,7,9,10],
    description:"策略 4: volatile-lru — 只在设置了过期时间(TTL)的 key 中进行 LRU 淘汰",
    render: () => renderVolatileLru()
  },
  {
    highlightLines:[13,14,15],
    hlJs:[5,6], hlPy:[5,6],
    description:"策略 5: allkeys-random — 从所有 key 中随机淘汰（最简单，不考虑使用频率）",
    render: () => renderRandom()
  },
  {
    highlightLines:[12,13,14,15,29,30],
    hlJs:[5,6,20,21], hlPy:[5,6,20,21],
    description:"最佳实践：缓存场景用 allkeys-lru，纯会话存储用 volatile-lru，严格不丢数据用 noeviction",
    render: () => renderBestPractice()
  },
];

let step = 0, playing = false, timer = null;
const SPEED = [900,550,320,180,80];

function memBar(usedPct, color) {
  return `<div class="mem-bar-wrap">
    <div class="mem-label"><span>内存使用</span><span style="color:${usedPct>80?'var(--red)':'var(--text)'}">${usedPct}% / 100MB</span></div>
    <div class="mem-bar">
      <div class="mem-fill" style="width:${usedPct}%;background:${color || (usedPct>80?'var(--red)':'var(--green)')}">${usedPct > 20 ? usedPct + '%' : ''}</div>
    </div>
  </div>`;
}

function keyPool(evictIdx, sampleIdxs) {
  return `<div class="key-pool">${KEYS.map((k,i) =>
    `<div class="key-item${i===evictIdx?' evict':''}${(sampleIdxs||[]).includes(i)?' sample':''}"
      style="background:rgba(255,255,255,0.04);border-color:var(--border);color:${k.color};">
      ${k.name}<br>
      <span style="font-size:0.65rem;color:var(--dim2);">TTL:${k.ttl}</span>
    </div>`
  ).join('')}</div>`;
}

function renderMemFull() {
  document.getElementById('vizArea').innerHTML = `
    ${memBar(95, 'var(--red)')}
    <div style="padding:12px 16px;background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.3);border-radius:8px;font-family:monospace;font-size:0.83rem;margin-bottom:14px;color:var(--red);">
      OOM: maxmemory 100mb exceeded
    </div>
    <div style="font-size:0.83rem;color:var(--dim);margin-bottom:12px;">当前 key 池：</div>
    ${keyPool(-1, [])}`;
}

function renderNoEviction() {
  document.getElementById('vizArea').innerHTML = `
    ${memBar(95, 'var(--red)')}
    <div class="policy-row" style="border-color:rgba(248,113,113,0.4);background:rgba(248,113,113,0.06);">
      <div class="policy-name" style="color:var(--red)">noeviction</div>
      <div class="policy-desc">内存满时返回错误，不淘汰任何 key</div>
      <div class="policy-tag" style="background:rgba(248,113,113,0.1);color:var(--red)">适合主库</div>
    </div>
    <div style="padding:12px 16px;background:var(--panel2);border-radius:8px;font-family:monospace;font-size:0.8rem;color:var(--red);margin-top:10px;">
      ERR: command not allowed when used memory &gt; 'maxmemory'
    </div>
    <div style="margin-top:12px;font-size:0.82rem;color:var(--dim);">
      适合场景：数据不能丢失的主数据库。需要监控内存并及时扩容。
    </div>`;
}

function renderLruOverview() {
  document.getElementById('vizArea').innerHTML = `
    ${memBar(92, 'var(--orange)')}
    <div class="policy-row" style="border-color:rgba(56,189,248,0.4);background:rgba(56,189,248,0.06);">
      <div class="policy-name" style="color:var(--blue)">allkeys-lru</div>
      <div class="policy-desc">淘汰所有 key 中最近最少使用的</div>
      <div class="policy-tag" style="background:rgba(56,189,248,0.1);color:var(--blue)">推荐缓存</div>
    </div>
    <div style="font-size:0.82rem;color:var(--dim);margin:10px 0 8px;">最近访问时间（越旧越容易被淘汰）：</div>
    ${keyPool(3, [])}
    <div style="margin-top:8px;padding:10px 14px;background:rgba(255,255,255,0.03);border-radius:8px;font-size:0.8rem;color:var(--dim);">
      config:theme 最久未访问 → 被淘汰
    </div>`;
}

function renderLruClock() {
  document.getElementById('vizArea').innerHTML = `
    <div style="font-size:0.88rem;font-weight:600;color:var(--blue);margin-bottom:12px;">LRU Clock — 24bit 时间戳</div>
    <div class="lru-clock">
      ${KEYS.map((k, i) => {
        const age = [3, 1, 5, 10, 0, 2][i]; // minutes since last access
        const hot = age <= 2;
        return `<div class="clock-item ${hot?'hot':'cold'}">
          <div>${k.name}</div>
          <div class="clock-label">${age === 0 ? '刚访问' : age + '分钟前'}</div>
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:14px;padding:12px 16px;background:rgba(255,255,255,0.03);border-radius:8px;font-size:0.82rem;color:var(--dim);line-height:1.8;">

      <div style="margin-top:4px;"><strong style="color:var(--text)">精度：</strong>1秒（LRU_CLOCK_RESOLUTION = 1000ms），2^24 秒 ≈ 194天循环一次</div>
    </div>`;
}

function render() {
  STEPS[step].render();
  renderCode();
  document.getElementById('descText').textContent = STEPS[step].description;
  document.getElementById('stepCounter').textContent = `${step + 1} / ${STEPS.length}`;
  document.getElementById('btnPrev').disabled = step === 0;
  document.getElementById('btnNext').disabled = step === STEPS.length - 1;
}

function renderCode() {
  const lines = CODE_LINES;
  const hl = (STEPS[step]||{}).highlightLines || [];
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((l, i) =>
    `<div class="code-line${hl.includes(i+1)?' active':''}" onclick="jumpToLine(${i+1})">
      <span class="ln">${i+1}</span><span class="lc">${l.html||'&nbsp;'}</span></div>`
  ).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}

function jumpToLine(lineNum) {
  for (let i = STEPS.length-1; i >= 0; i--) {
    const hl = (STEPS[i]||{}).highlightLines || [];
    if (hl.includes(lineNum)) { step = i; render(); return; }
  }
}

function play() { if (step >= STEPS.length-1) step = 0; playing = true; document.getElementById('btnPlay').innerHTML = '⏸ 暂停'; tick(); }
function pause() { playing = false; clearTimeout(timer); document.getElementById('btnPlay').innerHTML = '▶ 播放'; }
function tick() { if (!playing) return; if (step < STEPS.length-1) { step++; render(); timer = setTimeout(tick, SPEED[parseInt(document.getElementById('speedRange').value)-1]); } else pause(); }

document.getElementById('btnPlay').addEventListener('click', () => playing ? pause() : play());
document.getElementById('btnPrev').addEventListener('click', () => { pause(); if(step>0){step--;render();} });
document.getElementById('btnNext').addEventListener('click', () => { pause(); if(step<STEPS.length-1){step++;render();} });
document.getElementById('btnReset').addEventListener('click', () => { pause(); step=0; render(); });

render();
</script>
