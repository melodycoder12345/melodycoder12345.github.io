<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redis 持久化机制 - 可视化学习</title>
<style>
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#0d1117;
  --border:#334155; --text:#e2e8f0; --dim:#94a3b8; --dim2:#64748b;
  --blue:#38bdf8; --yellow:#fbbf24; --orange:#fb923c;
  --green:#4ade80; --purple:#c084fc; --red:#f87171; --teal:#2dd4bf;
  --redis:#dc382c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
nav{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;flex-wrap:wrap;}
.back-btn{color:var(--dim);text-decoration:none;font-size:0.9rem;transition:color 0.15s;}.back-btn:hover{color:var(--text);}
nav h1{font-size:1.15rem;font-weight:600;}
.badges{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
.badge{font-size:0.72rem;padding:3px 10px;border-radius:100px;font-family:monospace;font-weight:500;}
.main{display:flex;flex:1;overflow:hidden;}
.viz-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;}
.viz-area{flex:1;overflow-y:auto;padding:20px 24px;}
.desc-box{padding:10px 20px;background:rgba(255,255,255,0.03);border-top:1px solid var(--border);font-size:0.88rem;color:var(--dim);min-height:48px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.step-counter{margin-left:auto;font-size:0.8rem;color:var(--dim);font-family:monospace;white-space:nowrap;}
.code-panel{width:46%;min-width:360px;display:flex;flex-direction:column;overflow:hidden;}
.code-panel-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:0.85rem;color:var(--dim);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.code-dot{width:10px;height:10px;border-radius:50%;}
.code-body{flex:1;overflow-y:auto;padding:10px 0;background:var(--panel2);}
.code-body::-webkit-scrollbar{width:5px;}.code-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.code-line{display:flex;align-items:stretch;padding:0;cursor:pointer;transition:background 0.12s;font-family:'JetBrains Mono',monospace;font-size:0.8rem;line-height:1.65;}
.code-line:hover{background:rgba(255,255,255,0.04);}.code-line.active{background:rgba(251,191,36,0.12);}.code-line.active .ln{color:var(--yellow);}
.ln{min-width:44px;padding:0 10px 0 14px;color:#4b5563;text-align:right;user-select:none;flex-shrink:0;font-size:0.76rem;}
.lc{padding:0 14px 0 4px;flex:1;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.num{color:#79c0ff;}.pkg{color:#ffa657;}.cm{color:#8b949e;}.id{color:#e6edf3;}
.controls{display:flex;align-items:center;gap:8px;padding:10px 20px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.btn{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:7px;cursor:pointer;font-size:0.83rem;transition:all 0.15s;}
.btn:hover{background:rgba(255,255,255,0.12);}.btn.primary{background:rgba(220,56,44,0.15);border-color:rgba(220,56,44,0.4);color:var(--redis);}
.btn:disabled{opacity:0.38;cursor:not-allowed;}
.speed-wrap{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:0.78rem;color:var(--dim);}
input[type=range]{-webkit-appearance:none;width:80px;height:3px;background:var(--border);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--redis);cursor:pointer;}

/* Viz */
.flow-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.flow-box{border-radius:8px;padding:10px 16px;font-size:0.83rem;font-family:monospace;border:1px solid;transition:all 0.4s;text-align:center;min-width:100px;}
.flow-box.active{box-shadow:0 0 14px currentColor;opacity:1;}.flow-box.dim{opacity:0.4;}
.flow-arrow{color:var(--dim);font-size:1.2rem;flex-shrink:0;}
.timeline{position:relative;padding-left:28px;margin-bottom:14px;}
.timeline::before{content:'';position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--border);border-radius:2px;}
.tl-item{position:relative;margin-bottom:12px;}
.tl-dot{position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid;transition:all 0.4s;}
.tl-text{font-size:0.82rem;color:var(--dim);line-height:1.6;}
.tl-text strong{color:var(--text);}
.process-box{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:12px;}
.process-title{font-size:0.88rem;font-weight:600;margin-bottom:10px;}
.vs-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.vs-card{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.vs-card h3{font-size:0.9rem;font-weight:600;margin-bottom:10px;}
.vs-row-item{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--dim);padding:4px 0;border-bottom:1px solid rgba(51,65,85,0.3);}
.vs-row-item:last-child{border-bottom:none;}
.vs-row-item span:last-child{color:var(--text);font-weight:500;}
.file-box{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-family:monospace;font-size:0.78rem;color:var(--dim2);margin-top:8px;}
.file-box .filename{color:var(--blue);font-weight:600;margin-bottom:4px;}
.pulse{animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}

@media(max-width:768px){
  body{height:auto!important;min-height:100vh;overflow-y:auto!important;}
  nav{flex-wrap:wrap;padding:8px 14px;gap:6px;}
  nav h1{font-size:0.95rem;}
  .badges{margin-left:0!important;width:100%;order:3;}
  .main{flex-direction:column!important;overflow:visible!important;height:auto!important;flex:none!important;}
  .viz-panel{border-right:none!important;border-bottom:1px solid var(--border);height:340px!important;min-height:340px!important;flex:none!important;}
  .code-panel{width:100%!important;min-width:unset!important;height:320px!important;flex:none!important;}
  .controls{flex-wrap:wrap!important;gap:5px!important;height:auto!important;}
  .speed-wrap{margin-left:0!important;width:100%;justify-content:flex-end;}
  .vs-grid{grid-template-columns:1fr!important;}
}
</style>
<script src="../nav.js"></script>
<script src="../concept.js"></script>
</head>
<body>
<nav>

</div>
<div class="controls">
  <button class="btn" id="btnReset">⏮ 重置</button>
  <button class="btn" id="btnPrev">◀ 上一步</button>

</div>
<script>
NavTracker.track('Redis 持久化', 'redis/persistence.html', '💾', 'Redis');

window.PAGE_CONCEPTS = [
  { title: 'RDB 快照', body: `定期对整个数据集做全量快照，fork 子进程执行 BGSAVE，主进程不阻塞。恢复速度快，适合备份，但可能丢失最后一次快照后的数据。` },
  { title: 'AOF 日志', body: `每条写命令追加到 AOF 文件。三种 fsync 策略：always（每条都刷盘，最安全）、everysec（每秒一次，推荐）、no（由 OS 决定）。` },
  { title: 'AOF Rewrite', body: `AOF 文件随时间膨胀，BGREWRITEAOF 启动子进程重写，将内存数据序列化为等效的最小命令集，压缩文件大小。`, tag: 'BGREWRITEAOF' },
  { title: '混合持久化', body: `Redis 4.0+ 推荐方案：AOF 文件头部嵌入 RDB 快照，后半段是增量 AOF 命令。重启时先加载 RDB 再重放 AOF，兼顾速度与完整性。`, tag: '推荐' },
  { title: '持久化选型', body: `纯缓存（可丢）：关闭两者。数据不可丢：AOF everysec + 定期 RDB 备份。高频快照：RDB（注意 fork 开销）。生产推荐：混合持久化。` }
];

function renderBgsave() {

function render() {
  STEPS[step].render();
  renderCode();
  document.getElementById('descText').textContent = STEPS[step].description;
  document.getElementById('stepCounter').textContent = `${step + 1} / ${STEPS.length}`;
  document.getElementById('btnPrev').disabled = step === 0;
  document.getElementById('btnNext').disabled = step === STEPS.length - 1;
}

function renderCode() {
  const lines = CODE_LINES;
  const hl = (STEPS[step]||{}).highlightLines || [];
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((l, i) =>
    `<div class="code-line${hl.includes(i+1)?' active':''}" onclick="jumpToLine(${i+1})">
      <span class="ln">${i+1}</span><span class="lc">${l.html||'&nbsp;'}</span></div>`
  ).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}

function jumpToLine(lineNum) {
  for (let i = STEPS.length-1; i >= 0; i--) {
    const hl = (STEPS[i]||{}).highlightLines || [];
    if (hl.includes(lineNum)) { step = i; render(); return; }
  }
}

function play() { if (step >= STEPS.length-1) step = 0; playing = true; document.getElementById('btnPlay').innerHTML = '⏸ 暂停'; tick(); }
function pause() { playing = false; clearTimeout(timer); document.getElementById('btnPlay').innerHTML = '▶ 播放'; }
function tick() { if (!playing) return; if (step < STEPS.length-1) { step++; render(); timer = setTimeout(tick, SPEED[parseInt(document.getElementById('speedRange').value)-1]); } else pause(); }

document.getElementById('btnPlay').addEventListener('click', () => playing ? pause() : play());
document.getElementById('btnPrev').addEventListener('click', () => { pause(); if(step>0){step--;render();} });
document.getElementById('btnNext').addEventListener('click', () => { pause(); if(step<STEPS.length-1){step++;render();} });
document.getElementById('btnReset').addEventListener('click', () => { pause(); step=0; render(); });

render();
</script>
