const CODE_LINES = [
  {html:`<span class="kw">package</span> <span class="pkg">main</span>`},

  {html:`<span class="kw">type</span> <span class="id">TreeNode</span> <span class="kw">struct</span> {`},

  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> val &lt; root.Val {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;root.Left = <span class="fn">insert</span>(root.Left, val)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;} <span class="kw">else if</span> val &gt; root.Val {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;root.Right = <span class="fn">insert</span>(root.Right, val)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> root`},
  {html:`}`},
  {html:``},
  {html:`<span class="cm">// 搜索节点</span>`},
  {html:`<span class="kw">func</span> <span class="fn">search</span>(root *<span class="id">TreeNode</span>, val <span class="kw">int</span>) *<span class="id">TreeNode</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> root == <span class="kw">nil</span> || root.Val == val {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> root`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> val &lt; root.Val {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> <span class="fn">search</span>(root.Left, val)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> <span class="fn">search</span>(root.Right, val)`},

];

window.LANG_PLAIN = {
  js: `class BSTNode {
    constructor(val) { this.val = val; this.left = this.right = null; }
}

class BST {
    constructor() { this.root = null; }

    insert(val) {
        this.root = this._insert(this.root, val);
    }

    _insert(node, val) {
        if (!node) return new BSTNode(val);
        if (val < node.val) node.left = this._insert(node.left, val);
        else if (val > node.val) node.right = this._insert(node.right, val);
        return node;
    }

    search(val) {
        let cur = this.root;
        while (cur) {
            if (val === cur.val) return cur;
            cur = val < cur.val ? cur.left : cur.right;
        }
        return null;
    }

    delete(val) {
        this.root = this._delete(this.root, val);
    }

    _delete(node, val) {
        if (!node) return null;
        if (val < node.val) node.left = this._delete(node.left, val);
        else if (val > node.val) node.right = this._delete(node.right, val);
        else {
            if (!node.left) return node.right;
            if (!node.right) return node.left;
            let min = node.right;
            while (min.left) min = min.left;
            node.val = min.val;
            node.right = this._delete(node.right, min.val);
        }
        return node;
    }
}`,
  py: `class BSTNode:
    def __init__(self, val):
        self.val = val
        self.left = self.right = None

class BST:
    def __init__(self):
        self.root = None

    def insert(self, val):
        self.root = self._insert(self.root, val)

    def _insert(self, node, val):
        if not node:
            return BSTNode(val)
        if val < node.val:
            node.left = self._insert(node.left, val)
        elif val > node.val:
            node.right = self._insert(node.right, val)
        return node

    def search(self, val):
        cur = self.root
        while cur:
            if val == cur.val:
                return cur
            cur = cur.left if val < cur.val else cur.right
        return None

    def delete(self, val):
        self.root = self._delete(self.root, val)

    def _delete(self, node, val):
        if not node:
            return None
        if val < node.val:
            node.left = self._delete(node.left, val)
        elif val > node.val:
            node.right = self._delete(node.right, val)
        else:
            if not node.left:
                return node.right
            if not node.right:
                return node.left
            cur = node.right
            while cur.left:
                cur = cur.left
            node.val = cur.val
            node.right = self._delete(node.right, cur.val)
        return node`
};

// BST node structure (JS object)
function newNode(val){return {val,left:null,right:null};}
function insert(root,val){
  if(!root)return newNode(val);
  if(val<root.val)root.left=insert(root.left,val);
  else if(val>root.val)root.right=insert(root.right,val);
  return root;
}
function buildInitialTree(){
  let r=null;
  for(const v of [50,30,70,20,40,60,80])r=insert(r,v);
  return r;
}

let tree=buildInitialTree();
let steps=[];
let cur=0,playing=false,timer=null;
const SPEED = [2000,1200,700,350,120];
const SPEED_LABELS = ['极慢','慢','中速','快','极快'];
let currentOp='insert';

const svg=document.getElementById('treeSvg'),codeBody=document.getElementById('codeBody'),
  descText=document.getElementById('descText'),stepCounter=document.getElementById('stepCounter'),
  btnPlay=document.getElementById('btnPlay'),btnPrev=document.getElementById('btnPrev'),
  btnNext=document.getElementById('btnNext'),btnReset=document.getElementById('btnReset'),
  speedRange=document.getElementById('speedRange'),goBtn=document.getElementById('goBtn'),
  opVal=document.getElementById('opVal'),resetTreeBtn=document.getElementById('resetTreeBtn');
const speedVal = document.getElementById('speedVal');
function updateSpeedLabel(){speedVal.textContent=SPEED_LABELS[parseInt(speedRange.value)-1];}
speedRange.addEventListener('input',updateSpeedLabel);
updateSpeedLabel();

const opBtns={insert:document.getElementById('opInsert'),search:document.getElementById('opSearch')};
Object.entries(opBtns).forEach(([op,btn])=>btn.addEventListener('click',()=>{
  currentOp=op;Object.values(opBtns).forEach(b=>b.classList.remove('active-op'));btn.classList.add('active-op');
}));

function cloneTree(node){if(!node)return null;return{val:node.val,left:cloneTree(node.left),right:cloneTree(node.right)};}
function generateInsertSteps(tree,val){
  const s=[];
  function snap(t,visited,current,newNode,lines,desc){
    s.push({tree:cloneTree(t),visited:[...visited],current,newNode,lines,desc});
  }
  const visited=[];
  let cur=tree;
  snap(tree,visited,cur?.val,null,[9,10],`insert(${val}): 从根节点 ${cur?.val} 开始`);
  while(cur){
    snap(tree,visited,cur.val,null,[13],`当前节点 ${cur.val}，${val} < ${cur.val}? ${val<cur.val}`);
    if(val===cur.val){snap(tree,visited,cur.val,null,[17],`${val} 已存在，无需插入`);return s;}
    visited.push(cur.val);
    if(val<cur.val){
      snap(tree,visited,cur.val,null,[14],`${val} < ${cur.val}，向左子树走`);
      if(!cur.left){
        const nt=cloneTree(tree);let n=nt;for(const v of visited){if(n.val===v){if(n.left&&n.left.val===cur.val)n=n.left;else if(n.right&&n.right.val===cur.val)n=n.right;else break;}}
        insert(nt,val);snap(nt,visited,null,val,[10,11,12],`左子树为 nil，创建新节点 {Val:${val}}`);
        return s;
      }
      cur=cur.left;
    }else{
      snap(tree,visited,cur.val,null,[15,16],`${val} > ${cur.val}，向右子树走`);
      if(!cur.right){
        const nt=cloneTree(tree);insert(nt,val);snap(nt,visited,null,val,[10,11,12],`右子树为 nil，创建新节点 {Val:${val}}`);
        return s;
      }
      cur=cur.right;
    }
  }
  return s;
}
function generateSearchSteps(tree,val){
  const s=[];
  function snap(visited,current,found,lines,desc){
    s.push({tree:cloneTree(tree),visited:[...visited],current,newNode:null,found,lines,desc});
  }
  snap([],tree?.val,null,[22,23],`search(${val}): 从根节点 ${tree?.val} 开始`);
  let cur=tree;const visited=[];
  while(cur){
    if(cur.val===val){snap(visited,cur.val,cur.val,[23,24],`找到 ${val}！`);return s;}
    snap(visited,cur.val,null,[26],`${cur.val} != ${val}，${val} < ${cur.val}? ${val<cur.val}`);
    visited.push(cur.val);
    if(val<cur.val){snap(visited,cur.val,null,[27],`向左子树搜索`);cur=cur.left;}
    else{snap(visited,cur.val,null,[29],`向右子树搜索`);cur=cur.right;}
    if(!cur)snap(visited,null,null,[23],`子树为 nil，未找到 ${val}`);
  }
  return s;
}

goBtn.addEventListener('click',()=>{
  pause();
  const val=parseInt(opVal.value);if(isNaN(val))return;
  let ns=[];
  if(currentOp==='insert'){ns=generateInsertSteps(tree,val);tree=insert(cloneTree(tree),val);}
  else if(currentOp==='search'){ns=generateSearchSteps(tree,val);}
  steps=ns;cur=0;render();
});
resetTreeBtn.addEventListener('click',()=>{tree=buildInitialTree();steps=[];cur=0;renderTree(tree,[],null,null,null);descText.textContent='树已重置';stepCounter.textContent='';});

function renderCode() {
  const lines = (LangSwitcher.current !== 'go' && LangSwitcher.getLines(LangSwitcher.current))
    || CODE_LINES;
  const hl = LangSwitcher.getHL(steps[cur] || {});
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i) ? ' active' : '';
    return `<div class="code-line${active}" onclick="jumpToLine(${i})">${line.html || '&nbsp;'}</div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}
function buildCode(){ renderCode(); }
function highlightLines(lines){
  renderCode();
}
function jumpToLine(ln){if(LangSwitcher.current!=='go')return;let t=cur,b=Infinity;steps.forEach((s,i)=>{if(s.lines&&s.lines.includes(ln)){const d=Math.abs(i-cur);if(d<b){b=d;t=i;}}});cur=t;render();}

// Tree layout
function computeLayout(root){
  const pos={};let idx=0;
  function inorder(node,depth){if(!node)return;inorder(node.left,depth+1);pos[node.val]={x:idx++,y:depth};inorder(node.right,depth+1);}
  inorder(root,0);
  return pos;
}
const NR=24,PAD=40,DY=64;
function renderTree(root,visited,current,newNodeVal,foundVal){
  svg.innerHTML='';
  if(!root){const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x','50%');t.setAttribute('y','50%');t.setAttribute('fill','#475569');t.setAttribute('font-size','14');t.setAttribute('text-anchor','middle');t.setAttribute('font-family','monospace');t.textContent='空树';svg.appendChild(t);return;}
  const pos=computeLayout(root);
  const rect=svg.getBoundingClientRect();
  const n=Object.keys(pos).length;
  const totalW=rect.width||600;
  const cellW=Math.min((totalW-PAD*2)/Math.max(n,1),80);
  const xScale=i=>PAD+i*cellW+cellW/2;
  const yScale=d=>PAD+d*DY+NR;
  // Defs
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML=`<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  svg.appendChild(defs);
  // Draw edges first
  function drawEdges(node){
    if(!node)return;
    const px=xScale(pos[node.val].x),py=yScale(pos[node.val].y);
    if(node.left){const cx=xScale(pos[node.left.val].x),cy=yScale(pos[node.left.val].y);const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',px);l.setAttribute('y1',py+NR);l.setAttribute('x2',cx);l.setAttribute('y2',cy-NR);l.setAttribute('stroke','#334155');l.setAttribute('stroke-width','1.5');svg.appendChild(l);}
    if(node.right){const cx=xScale(pos[node.right.val].x),cy=yScale(pos[node.right.val].y);const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',px);l.setAttribute('y1',py+NR);l.setAttribute('x2',cx);l.setAttribute('y2',cy-NR);l.setAttribute('stroke','#334155');l.setAttribute('stroke-width','1.5');svg.appendChild(l);}
    drawEdges(node.left);drawEdges(node.right);
  }
  drawEdges(root);
  // Draw nodes
  function drawNodes(node){
    if(!node)return;
    const x=xScale(pos[node.val].x),y=yScale(pos[node.val].y);
    const isVisited=visited.includes(node.val);
    const isCurrent=current===node.val;
    const isNew=newNodeVal===node.val;
    const isFound=foundVal===node.val;
    let fill='#1e293b',stroke='#334155',textCol='#e2e8f0';
    if(isVisited){fill='rgba(56,189,248,0.15)';stroke='#38bdf8';}
    if(isCurrent){fill='rgba(251,191,36,0.2)';stroke='#fbbf24';textCol='#fbbf24';}
    if(isNew){fill='rgba(74,222,128,0.25)';stroke='#4ade80';textCol='#4ade80';}
    if(isFound){fill='rgba(74,222,128,0.25)';stroke='#4ade80';textCol='#4ade80';}
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',NR);
    c.setAttribute('fill',fill);c.setAttribute('stroke',stroke);c.setAttribute('stroke-width','2');
    if(isCurrent||isNew||isFound)c.setAttribute('filter','url(#glow)');
    svg.appendChild(c);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',x);t.setAttribute('y',y+5);
    t.setAttribute('fill',textCol);t.setAttribute('font-size','14');t.setAttribute('font-weight','700');
    t.setAttribute('text-anchor','middle');t.setAttribute('font-family','monospace');
    t.textContent=node.val;svg.appendChild(t);
    drawNodes(node.left);drawNodes(node.right);
  }
  drawNodes(root);
}
function render(){
  if(steps.length===0){renderTree(tree,[],null,null,null);descText.textContent='选择操作并执行';stepCounter.textContent='';renderCode();return;}
  const s=steps[cur];
  renderTree(s.tree,s.visited||[],s.current,s.newNode,s.found);
  renderCode();
  descText.textContent=s.desc;
  stepCounter.textContent=`${cur+1} / ${steps.length}`;
  btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;
}
function play(){if(cur>=steps.length-1)cur=0;playing=true;btnPlay.innerHTML='⏸ 暂停';tick();}
function pause(){playing=false;clearTimeout(timer);btnPlay.innerHTML='▶ 播放';}
function tick(){if(!playing)return;if(cur<steps.length-1){cur++;render();timer=setTimeout(tick,SPEED[parseInt(speedRange.value)-1]);}else pause();}
btnPlay.addEventListener('click',()=>playing?pause():play());
btnPrev.addEventListener('click',()=>{pause();if(cur>0){cur--;render();}});
btnNext.addEventListener('click',()=>{pause();if(cur<steps.length-1){cur++;render();}});
btnReset.addEventListener('click',()=>{pause();cur=0;render();});
LangSwitcher.init(renderCode);
buildCode();renderTree(tree,[],null,null,null);descText.textContent='初始 BST：50,30,70,20,40,60,80';
window.addEventListener('resize',()=>render());
</script>
</body>
</html>
