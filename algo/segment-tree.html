const INIT_ARR = [1,3,5,7,9,11];
const N = INIT_ARR.length;
let arr = [...INIT_ARR];
let tree = new Array(4*N).fill(0);
let nodeStates = {}; // node index -> 'default'|'yellow'|'green'|'orange'|'gray'
let isAnimating = false;
let editingIdx = -1;

// Step-by-step playback state
let STEPS = [];
let stepIdx = -1;
let playing = false;
let playTimer = null;
const SPEED = [1000, 650, 400, 220, 100];

// Build tree
function buildTree() {
  tree = new Array(4*N).fill(0);
  function build(node, l, r) {
    if (l === r) { tree[node] = arr[l]; return; }
    const mid = (l+r)>>1;
    build(2*node, l, mid);
    build(2*node+1, mid+1, r);
    tree[node] = tree[2*node] + tree[2*node+1];
  }
  build(1, 0, N-1);
}

// Compute node positions for SVG
// Tree has up to 4 levels for n=6
const SVG_W = 780, SVG_H = 340;
const LEVELS = 4;
const LEVEL_H = 75;
const START_Y = 36;

function getNodeLayout(node, l, r) {
  // DFS to compute positions
  let positions = {};
  let levelNodes = {};
  function dfs(nd, lv, lo, ro) {
    if (!levelNodes[lv]) levelNodes[lv] = [];
    levelNodes[lv].push({nd, lo, ro});
    if (lo === ro) return;
    const mid = (lo+ro)>>1;
    dfs(2*nd, lv+1, lo, mid);
    dfs(2*nd+1, lv+1, mid+1, ro);
  }
  dfs(1, 0, 0, N-1);
  // Assign x by leaf order
  const leafOrder = {};
  let leafIdx = 0;
  function assignLeaf(nd, lo, ro) {
    if (lo===ro) { leafOrder[nd] = leafIdx++; return; }
    const mid=(lo+ro)>>1;
    assignLeaf(2*nd,lo,mid);
    assignLeaf(2*nd+1,mid+1,ro);
  }
  assignLeaf(1,0,N-1);
  const totalLeaves = N;
  const leafSpacing = (SVG_W-80) / totalLeaves;
  const leafStart = 40 + leafSpacing/2;
  function assignPos(nd, lo, ro, lv) {
    if (lo===ro) {
      positions[nd] = {x: leafStart + leafOrder[nd]*leafSpacing, y: START_Y + lv*LEVEL_H, l:lo, r:ro, lv};
      return;
    }
    const mid=(lo+ro)>>1;
    assignPos(2*nd,lo,mid,lv+1);
    assignPos(2*nd+1,mid+1,ro,lv+1);
    const lx=positions[2*nd].x, rx=positions[2*nd+1].x;
    positions[nd]={x:(lx+rx)/2, y:START_Y+lv*LEVEL_H, l:lo, r:ro, lv};
  }
  assignPos(1,0,N-1,0);
  return positions;
}

let nodePositions = {};

function getNodeColor(nd) {
  const state = nodeStates[nd] || 'default';
  if (state==='yellow') return {fill:'#2a1a00',stroke:'#fbbf24',text:'#fbbf24'};
  if (state==='green') return {fill:'#052e16',stroke:'#4ade80',text:'#4ade80'};
  if (state==='orange') return {fill:'#431407',stroke:'#fb923c',text:'#fb923c'};
  if (state==='gray') return {fill:'#1e293b',stroke:'#475569',text:'#475569'};
  return {fill:'#1e293b',stroke:'#38bdf8',text:'#e2e8f0'};
}

function renderSVG() {
  const svg = document.getElementById('mainSvg');
  svg.innerHTML = '';

  nodePositions = getNodeLayout();

  // Draw edges first
  function drawEdges(nd, lo, ro) {
    if (lo===ro) return;
    const mid=(lo+ro)>>1;
    const {x:px,y:py} = nodePositions[nd];
    const {x:lx,y:ly} = nodePositions[2*nd];
    const {x:rx,y:ry} = nodePositions[2*nd+1];
    [lx,rx].forEach((cx,i)=>{
      const cy = [ly,ry][i];
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      const lnd = i===0?2*nd:2*nd+1;
      const isHL = (nodeStates[nd]&&nodeStates[nd]!=='default') || (nodeStates[lnd]&&nodeStates[lnd]!=='default');
      line.setAttribute('x1',px); line.setAttribute('y1',py+18);
      line.setAttribute('x2',cx); line.setAttribute('y2',cy-18);
      line.setAttribute('stroke', isHL ? '#475569' : '#334155');
      line.setAttribute('stroke-width','1.5');
      svg.appendChild(line);
    });
    drawEdges(2*nd,lo,mid);
    drawEdges(2*nd+1,mid+1,ro);
  }
  drawEdges(1,0,N-1);

  // Draw nodes
  function drawNodes(nd, lo, ro) {
    const {x,y,l,r,lv} = nodePositions[nd];
    const isLeaf = lo===ro;
    const colors = getNodeColor(nd);
    const W = isLeaf ? 42 : 62;
    const H = isLeaf ? 42 : 34;
    const CR = isLeaf ? 4 : 8;

    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x', x-W/2); rect.setAttribute('y', y-H/2);
    rect.setAttribute('width',W); rect.setAttribute('height',H);
    rect.setAttribute('rx',isLeaf?4:CR);
    rect.setAttribute('fill', colors.fill);
    rect.setAttribute('stroke', colors.stroke);
    rect.setAttribute('stroke-width', nodeStates[nd]&&nodeStates[nd]!=='default' ? '2.5' : '1.5');
    rect.setAttribute('class','st-node');
    svg.appendChild(rect);

    if (!isLeaf) {
      const rangeT = document.createElementNS('http://www.w3.org/2000/svg','text');
      rangeT.setAttribute('x',x); rangeT.setAttribute('y',y-5);
      rangeT.setAttribute('text-anchor','middle');
      rangeT.setAttribute('fill','#94a3b8'); rangeT.setAttribute('font-size','0.6rem');
      rangeT.setAttribute('font-family','monospace');
      rangeT.textContent = `[${l},${r}]`;
      svg.appendChild(rangeT);

      const valT = document.createElementNS('http://www.w3.org/2000/svg','text');
      valT.setAttribute('x',x); valT.setAttribute('y',y+9);
      valT.setAttribute('text-anchor','middle');
      valT.setAttribute('fill', colors.text); valT.setAttribute('font-size','0.85rem');
      valT.setAttribute('font-weight','700'); valT.setAttribute('font-family','monospace');
      valT.textContent = tree[nd];
      svg.appendChild(valT);
    } else {
      const rangeT = document.createElementNS('http://www.w3.org/2000/svg','text');
      rangeT.setAttribute('x',x); rangeT.setAttribute('y',y-8);
      rangeT.setAttribute('text-anchor','middle');
      rangeT.setAttribute('fill','#94a3b8'); rangeT.setAttribute('font-size','0.58rem');
      rangeT.setAttribute('font-family','monospace');
      rangeT.textContent = `[${l}]`;
      svg.appendChild(rangeT);

      const valT = document.createElementNS('http://www.w3.org/2000/svg','text');
      valT.setAttribute('x',x); valT.setAttribute('y',y+7);
      valT.setAttribute('text-anchor','middle');
      valT.setAttribute('fill', colors.text); valT.setAttribute('font-size','0.9rem');
      valT.setAttribute('font-weight','700'); valT.setAttribute('font-family','monospace');
      valT.textContent = tree[nd];
      svg.appendChild(valT);
    }

    if (lo!==ro) {
      const mid=(lo+ro)>>1;
      drawNodes(2*nd,lo,mid);
      drawNodes(2*nd+1,mid+1,ro);
    }
  }
  drawNodes(1,0,N-1);
}

function renderArr(hlIdx=-1, hlType='default') {
  const cells = document.getElementById('arrCells');
  cells.innerHTML = '';
  for (let i=0;i<N;i++) {
    const wrap = document.createElement('div');
    wrap.className = 'arr-cell';
    const cidx = document.createElement('div');
    cidx.className = 'cidx';
    cidx.textContent = i;
    const cell = document.createElement('div');
    cell.className = 'arr-val' + (i===hlIdx && hlType==='update' ? ' hl-update' : '') + (i===hlIdx && hlType==='query' ? ' hl-query' : '');
    if (i===editingIdx) {
      const inp = document.createElement('input');
      inp.type='number'; inp.value=arr[i];
      inp.style.cssText='width:2.6rem;height:2.4rem;background:#0c2340;border:none;color:var(--blue);font-size:0.9rem;font-weight:700;text-align:center;font-family:monospace;';
      inp.onblur = ()=>{ const v=parseInt(inp.value); if(!isNaN(v)){arr[i]=v; buildTree();} editingIdx=-1; render(); };
      inp.onkeydown = (e)=>{ if(e.key==='Enter'||e.key==='Escape') inp.blur(); };
      cell.className='arr-val editing';
      cell.appendChild(inp);
      setTimeout(()=>inp.focus(),0);
    } else {
      cell.textContent = arr[i];
      cell.onclick = ()=>{ if(isAnimating) return; editingIdx=i; renderArr(); };
    }
    wrap.appendChild(cidx);
    wrap.appendChild(cell);
    cells.appendChild(wrap);
  }
}

function render(hlIdx=-1, hlType='default') {
  renderArr(hlIdx, hlType);
  renderSVG();
}

function addLog(msg) {
  const c = document.getElementById('logContainer');
  const d = document.createElement('div');
  d.className = 'log-entry';
  d.innerHTML = msg;
  c.insertBefore(d, c.firstChild);
  if (c.children.length > 60) c.removeChild(c.lastChild);
}

function setButtons(disabled) {
  ['btnQuery','btnUpdate'].forEach(id=>document.getElementById(id).disabled=disabled);
}

async function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function setNodeState(nd, state) { nodeStates[nd]=state; }
function clearNodeStates() { nodeStates={}; }

function doQuery() {
  if (isAnimating) return;
  pausePlay();
  const ql = parseInt(document.getElementById('ql').value);
  const qr = parseInt(document.getElementById('qr').value);

  if (isNaN(ql)||isNaN(qr)||ql<0||qr>=N||ql>qr) {
    addLog(`<span class="tag-orange">无效范围，请输入 0-${N-1} 之间且 l ≤ r</span>`);
    return;
  }

  addLog(`<span class="tag">Query [${ql}, ${qr}]</span> 开始查询...`);
  document.getElementById('resultVal').textContent = '...';
  document.getElementById('resultSteps').textContent = '';

  // Record steps
  STEPS = [];
  let simStates = {};
  let totalSum = 0;

  function snap(states, desc, logMsg, resultText) {
    STEPS.push({
      nodeStates: JSON.parse(JSON.stringify(states)),
      description: desc,
      logMsg: logMsg || null,
      resultText: resultText || null,
      hlIdx: -1, hlType: 'default'
    });
  }

  // Initial state
  snap({}, `Query [${ql}, ${qr}] 开始`, null, null);

  function queryRec(nd, l, r) {
    simStates[nd] = 'yellow';
    snap(simStates, `访问节点 [${l},${r}]`, null, null);

    if (ql<=l && r<=qr) {
      simStates[nd] = 'green';
      snap(simStates, `[${l},${r}] 完全覆盖，返回 ${tree[nd]}`,
        `<span class="tag-green">[${l},${r}] 完全覆盖，返回 ${tree[nd]}</span>`, null);
      return tree[nd];
    }
    if (qr<l || r<ql) {
      simStates[nd] = 'gray';
      snap(simStates, `[${l},${r}] 不相交，跳过`,
        `<span class="tag" style="color:var(--dim)">[${l},${r}] 不相交，跳过</span>`, null);
      return 0;
    }
    simStates[nd] = 'orange';
    snap(simStates, `[${l},${r}] 部分覆盖，拆分...`,
      `<span class="tag-orange">[${l},${r}] 部分覆盖，拆分...</span>`, null);
    const mid=(l+r)>>1;
    const lv = queryRec(2*nd, l, mid);
    const rv = queryRec(2*nd+1, mid+1, r);
    return lv+rv;
  }

  totalSum = queryRec(1, 0, N-1);

  // Final step
  snap({}, `查询完成：Sum[${ql},${qr}] = ${totalSum}`,
    `<span class="tag-green">查询结果：Sum[${ql},${qr}] = ${totalSum}</span>`,
    `${totalSum}`);

  stepIdx = 0;
  applyStep();
  updatePlaybackUI();
}

function doUpdate() {
  if (isAnimating) return;
  pausePlay();
  const idx = parseInt(document.getElementById('uidx').value);
  const val = parseInt(document.getElementById('uval').value);

  if (isNaN(idx)||isNaN(val)||idx<0||idx>=N) {
    addLog(`<span class="tag-orange">无效索引，请输入 0-${N-1}</span>`);
    return;
  }

  addLog(`<span class="tag">Update(${idx}, ${val})</span> 开始更新 arr[${idx}] = ${val}...`);
  document.getElementById('resultVal').textContent = '—';
  document.getElementById('resultSteps').textContent = '';

  // Record steps using a simulation on a copy of tree
  STEPS = [];
  let simTree = [...tree];
  let simArr = [...arr];
  simArr[idx] = val;
  let simStates = {};

  function snap(states, treeSnap, arrSnap, desc, logMsg, hlIdx, hlType) {
    STEPS.push({
      nodeStates: JSON.parse(JSON.stringify(states)),
      treeSnapshot: [...treeSnap],
      arrSnapshot: [...arrSnap],
      description: desc,
      logMsg: logMsg || null,
      resultText: null,
      hlIdx: hlIdx !== undefined ? hlIdx : -1,
      hlType: hlType || 'default'
    });
  }

  // Initial state
  snap({}, tree, arr, `Update(${idx}, ${val}) 开始`, null, -1, 'default');

  function updateRec(nd, l, r) {
    simStates[nd] = 'yellow';
    snap(simStates, simTree, simArr, `访问节点 [${l},${r}]`, null, -1, 'default');

    if (l===r) {
      simTree[nd] = val;
      simStates[nd] = 'orange';
      snap(simStates, simTree, simArr, `叶节点 [${l}] 更新为 ${val}`,
        `<span class="tag-orange">叶节点 [${l}] 更新为 ${val}</span>`, idx, 'update');
      return;
    }
    const mid=(l+r)>>1;
    if (idx<=mid) updateRec(2*nd, l, mid);
    else updateRec(2*nd+1, mid+1, r);

    simTree[nd] = simTree[2*nd] + simTree[2*nd+1];
    simStates[nd] = 'green';
    snap(simStates, simTree, simArr, `节点 [${l},${r}] 重新计算 sum = ${simTree[nd]}`,
      `<span class="tag-green">节点 [${l},${r}] 重新计算 sum = ${simTree[nd]}</span>`, idx, 'update');
  }

  updateRec(1, 0, N-1);

  // Final step - apply changes
  snap({}, simTree, simArr, `更新完成，arr[${idx}] = ${val}，根节点 sum = ${simTree[1]}`,
    `<span class="tag-green">更新完成，arr[${idx}] = ${val}，根节点 sum = ${simTree[1]}</span>`, idx, 'update');

  stepIdx = 0;
  applyStep();
  updatePlaybackUI();
}

// --- Step-by-step playback controls ---
function applyStep() {
  if (STEPS.length === 0 || stepIdx < 0 || stepIdx >= STEPS.length) return;
  const s = STEPS[stepIdx];

  // Apply node states
  nodeStates = s.nodeStates ? JSON.parse(JSON.stringify(s.nodeStates)) : {};

  // Apply tree/arr snapshot if present (for update operations)
  if (s.treeSnapshot) tree = [...s.treeSnapshot];
  if (s.arrSnapshot) arr = [...s.arrSnapshot];

  renderSVG();
  renderArr(s.hlIdx !== undefined ? s.hlIdx : -1, s.hlType || 'default');

  // Show result
  if (s.resultText) {
    document.getElementById('resultVal').textContent = s.resultText;
  }
  // Show step description
  document.getElementById('resultSteps').textContent = s.description || '';

  // Add log if present
  if (s.logMsg) addLog(s.logMsg);

  updatePlaybackUI();
}

function updatePlaybackUI() {
  const info = document.getElementById('stepInfo');
  const btnPrevEl = document.getElementById('btnPrev');
  const btnNextEl = document.getElementById('btnNext');
  if (STEPS.length === 0) {
    info.textContent = '';
    btnPrevEl.disabled = true;
    btnNextEl.disabled = true;
  } else {
    info.textContent = `${stepIdx + 1} / ${STEPS.length}`;
    btnPrevEl.disabled = stepIdx <= 0;
    btnNextEl.disabled = stepIdx >= STEPS.length - 1;
  }
}

function stepNext() {
  if (STEPS.length === 0 || stepIdx >= STEPS.length - 1) return;
  stepIdx++;
  applyStep();
}

function stepPrev() {
  if (STEPS.length === 0 || stepIdx <= 0) return;
  stepIdx--;
  // For prev, we need to replay from start to rebuild log correctly
  // Simpler: just apply the state snapshot
  const s = STEPS[stepIdx];
  nodeStates = s.nodeStates ? JSON.parse(JSON.stringify(s.nodeStates)) : {};
  if (s.treeSnapshot) tree = [...s.treeSnapshot];
  if (s.arrSnapshot) arr = [...s.arrSnapshot];
  renderSVG();
  renderArr(s.hlIdx !== undefined ? s.hlIdx : -1, s.hlType || 'default');
  if (s.resultText) document.getElementById('resultVal').textContent = s.resultText;
  document.getElementById('resultSteps').textContent = s.description || '';
  updatePlaybackUI();
}

function togglePlay() {
  if (playing) {
    pausePlay();
  } else {
    startPlay();
  }
}

function startPlay() {
  if (STEPS.length === 0) return;
  if (stepIdx >= STEPS.length - 1) stepIdx = 0;
  playing = true;
  document.getElementById('btnPlay').textContent = '⏸ 暂停';
  playTick();
}

function pausePlay() {
  playing = false;
  if (playTimer) { clearTimeout(playTimer); playTimer = null; }
  document.getElementById('btnPlay').textContent = '▶ 播放';
}

function playTick() {
  if (!playing) return;
  if (stepIdx < STEPS.length - 1) {
    stepIdx++;
    applyStep();
    const speed = SPEED[parseInt(document.getElementById('speedSlider').value) - 1];
    playTimer = setTimeout(playTick, speed);
  } else {
    pausePlay();
  }
}

function stepReset() {
  pausePlay();
  STEPS = [];
  stepIdx = -1;
  clearNodeStates();
  render();
  updatePlaybackUI();
  document.getElementById('resultVal').textContent = '—';
  document.getElementById('resultSteps').textContent = '';
}

async function doBuildAnim() {
  clearNodeStates();
  const order = [];
  function collectPostOrder(nd,l,r) {
    if(l===r){order.push({nd,l,r}); return;}
    const mid=(l+r)>>1;
    collectPostOrder(2*nd,l,mid);
    collectPostOrder(2*nd+1,mid+1,r);
    order.push({nd,l,r});
  }
  collectPostOrder(1,0,N-1);
  for (const {nd,l,r} of order) {
    setNodeState(nd,'green');
    renderSVG();
    await sleep(90);
  }
  await sleep(300);
  clearNodeStates();
  renderSVG();
}

function doReset() {
  pausePlay();
  STEPS = [];
  stepIdx = -1;
  arr = [...INIT_ARR];
  buildTree();
  clearNodeStates();
  editingIdx=-1;
  document.getElementById('logContainer').innerHTML='';
  document.getElementById('resultVal').textContent='—';
  document.getElementById('resultSteps').textContent='';
  render();
  updatePlaybackUI();
  addLog('<span class="tag">重置</span> 数组恢复为 [1,3,5,7,9,11]');
}

// Init
buildTree();
nodePositions = getNodeLayout();
render();
updatePlaybackUI();
addLog('<span class="tag">初始化</span> 数组 [1,3,5,7,9,11]，线段树构建完成，根节点 sum = 36');
LangSwitcher.init(renderCode);
renderCode();
doBuildAnim();
</script>
