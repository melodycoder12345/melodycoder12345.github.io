const T = 2;
const MAX_LEAF_KEYS = 2 * T;  // leaf can hold up to 2t keys before splitting
const MAX_INNER_KEYS = 2 * T - 1; // internal: 2t-1 keys

let nodeIdCounter = 0;
class BPNode {
  constructor(isLeaf = true) {
    this.keys = [];
    this.children = [];
    this.isLeaf = isLeaf;
    this.next = null;
    this.id = nodeIdCounter++;
  }
}

function cloneNode(n) {
  if (!n) return null;
  const c = new BPNode(n.isLeaf);
  c.keys = [...n.keys];
  c.id = n.id;
  c.next = null; // links rebuilt separately
  c.children = n.children.map(cloneNode);
  return c;
}

function getLeaves(root) {
  if (!root) return [];
  if (root.isLeaf) return [root];
  return root.children.flatMap(getLeaves);
}

function treeHeight(n) { return n ? 1 + (n.children.length ? Math.max(...n.children.map(treeHeight)) : 0) : 0; }
function leafKeyCount(root) { return getLeaves(root).reduce((s, l) => s + l.keys.length, 0); }

function mkStep(root, highlight, splitting, settled, description, lines) {
  return { root: cloneNode(root), highlight: [...(highlight||[])], splitting: [...(splitting||[])], settled: [...(settled||[])], description, highlightLines: lines||[] };
}

      node.keys.splice(pos < 0 ? node.keys.length : pos, 0, k);

    const pos = node.keys.findIndex(x => x > mid);
    const ins = pos < 0 ? node.keys.length : pos;
    node.keys.splice(ins, 0, mid);
    node.children.splice(ins + 1, 0, right);
    stepsArr.push(mkStep(root, [node.id], [], [], `中间键 ${mid} 上升到内部节点 → [${node.keys.join(',')}]`, [28,29,30]));
    if (node.keys.length > MAX_INNER_KEYS) {
      stepsArr.push(mkStep(root, [node.id], [node.id], [], `内部节点键数超限，分裂`, [28,29,30,31,32,33,34]));
      const splitMid = node.keys[T - 1];
      const rightInner = new BPNode(false);
      rightInner.keys = node.keys.slice(T);
      rightInner.children = node.children.slice(T);
      node.keys = node.keys.slice(0, T - 1);
      node.children = node.children.slice(0, T);
      stepsArr.push(mkStep(root, [], [node.id, rightInner.id], [], `内部节点分裂，mid=${splitMid} 上升`, [28,29,30,31,32,33,34]));
      return { split: true, mid: splitMid, right: rightInner };
    }
    return { split: false };
  }

  stepsArr.push(mkStep(root, [], [], [], `准备插入 ${k}`, []));
  const res = insertNode(root, k);
  if (res.split) {
    const newRoot = new BPNode(false);
    newRoot.keys = [res.mid];
    newRoot.children = [root, res.right];
    stepsArr.push(mkStep(newRoot, [newRoot.id], [], [], `根节点分裂，新根 [${res.mid}] 产生`, []));
    return newRoot;
  }
  return root;
}

function doInsert() {
  pause();
  const val = parseInt(document.getElementById('insertVal').value) || 18;
  const stepsArr = [];
  bpRoot = bpInsert(bpRoot, val, stepsArr);
  steps = stepsArr; cur = 0; render();
}

function doSearch() {
  pause();
  const val = parseInt(document.getElementById('insertVal').value) || 18;
  const stepsArr = [];
  function search(node) {
    stepsArr.push(mkStep(bpRoot, [node.id], [], [], `在${node.isLeaf ? '叶节点' : '内部节点'} [${node.keys.join(',')}] 中查找 ${val}`, []));
    if (node.isLeaf) {
      if (node.keys.includes(val)) stepsArr.push(mkStep(bpRoot, [node.id], [], [val], `找到 ${val}！`, []));
      else stepsArr.push(mkStep(bpRoot, [node.id], [], [], `叶节点中没有 ${val}`, []));
      return;
    }
    let i = node.keys.findIndex(x => val < x);
    if (i < 0) i = node.keys.length;
    stepsArr.push(mkStep(bpRoot, [node.children[i].id], [], [], `${val} < ${node.keys[i] || '∞'}，进入子节点 ${i}`, []));
    search(node.children[i]);
  }
  stepsArr.push(mkStep(bpRoot, [], [], [], `查找 ${val}`, []));
  search(bpRoot);
  steps = stepsArr; cur = 0; render();
}

function doPreset() {
  pause();
  bpRoot = new BPNode(true); nodeIdCounter = 0; bpRoot.id = nodeIdCounter++;
  steps = []; cur = 0;
  const vals = [10, 20, 5, 30, 15, 25, 35, 40, 45];
  const allSteps = [];
  for (const v of vals) {
    bpRoot = bpInsert(bpRoot, v, allSteps);
  }
  steps = allSteps; cur = 0; render();
}

const treeSvg = document.getElementById('treeSvg');
const descText = document.getElementById('descText');
const stepCounter = document.getElementById('stepCounter');
const leafCount = document.getElementById('leafCount');
const treeHeightEl = document.getElementById('treeHeight');
const codeBody = document.getElementById('codeBody');
const speedRange = document.getElementById('speedRange');
const btnPlay = document.getElementById('btnPlay');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnReset = document.getElementById('btnReset');

function layoutBPTree(root) {
  if (!root) return {};
  const positions = {};
  const KW = 30, NH = 32;
  let leafX = 10;

  function place(node, depth) {
    if (node.isLeaf) {
      const w = node.keys.length * KW + 16;
      positions[node.id] = { x: leafX + w / 2, y: depth, isLeaf: true, w };
      leafX += w + 16;
      return;
    }
    node.children.forEach(c => place(c, depth + 1));
    const cxs = node.children.map(c => positions[c.id].x);
    positions[node.id] = { x: (cxs[0] + cxs[cxs.length - 1]) / 2, y: depth, isLeaf: false };
  }
  place(root, 0);
  return positions;
}

function getNodeColor(id, isLeaf, s) {
  if (!s) return isLeaf ? '#4ade80' : '#38bdf8';
  if (s.splitting.includes(id)) return '#fb923c';
  if (s.highlight.includes(id)) return '#fbbf24';
  return isLeaf ? '#4ade80' : '#38bdf8';
}

function renderBPTree(s) {
  const root = s ? s.root : bpRoot;
  const rect = treeSvg.parentElement.getBoundingClientRect();
  const W = rect.width || 600, H = rect.height || 280;
  treeSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  treeSvg.innerHTML = '';

  if (!root) { return; }

  const positions = layoutBPTree(root);
  const allPos = Object.values(positions);
  if (allPos.length === 0) return;
  const maxDepth = Math.max(...allPos.map(p => p.y));
  const maxX = Math.max(...allPos.map(p => p.x + 60));
  const scaleX = (W - 20) / Math.max(maxX, 1);
  const KW = 30, NH = 32;
  const levelH = maxDepth > 0 ? (H - NH * 2 - 20) / maxDepth : H / 2;

  function tx(x) { return x * scaleX + 10; }
  function ty(d) { return 20 + d * levelH; }

  // Draw edges
  function drawEdges(node) {
    if (!node || node.isLeaf) return;
    const p = positions[node.id];
    node.children.forEach(c => {
      const cp = positions[c.id];
      if (!cp) return;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', tx(p.x)); line.setAttribute('y1', ty(p.y) + NH / 2);
      line.setAttribute('x2', tx(cp.x)); line.setAttribute('y2', ty(cp.y) - NH / 2);
      line.setAttribute('stroke', '#334155'); line.setAttribute('stroke-width', '1.5');
      treeSvg.appendChild(line);
      drawEdges(c);
    });
  }
  drawEdges(root);

  // Draw leaf chain links
  const leaves = getLeaves(root);
  for (let i = 0; i < leaves.length - 1; i++) {
    const p1 = positions[leaves[i].id];
    const p2 = positions[leaves[i + 1].id];
    if (!p1 || !p2) continue;
    const x1 = tx(p1.x) + (p1.w || 60) / 2 * scaleX;
    const x2 = tx(p2.x) - (p2.w || 60) / 2 * scaleX;
    const y = ty(p1.y) + NH / 2 + 12;
    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
    marker.setAttribute('id', `arr${i}`);
    marker.setAttribute('markerWidth', '8'); marker.setAttribute('markerHeight', '8');
    marker.setAttribute('refX', '6'); marker.setAttribute('refY', '3');
    marker.setAttribute('orient', 'auto');
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    poly.setAttribute('points', '0 0, 6 3, 0 6'); poly.setAttribute('fill', '#c084fc');
    marker.appendChild(poly); defs.appendChild(marker);
    treeSvg.appendChild(defs);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${Math.min(x1, W - 10)} ${ty(p1.y) + NH / 2} L ${Math.min(x1, W - 10)} ${y} L ${Math.max(x2, 10)} ${y} L ${Math.max(x2, 10)} ${ty(p2.y) + NH / 2}`);
    path.setAttribute('stroke', '#c084fc55'); path.setAttribute('stroke-width', '1'); path.setAttribute('fill', 'none');
    path.setAttribute('marker-end', `url(#arr${i})`);
    treeSvg.appendChild(path);
  }

  // Draw nodes
  function drawNode(node) {
    if (!node) return;
    const color = getNodeColor(node.id, node.isLeaf, s);
    const p = positions[node.id];
    if (!p) return;
    const nkeys = node.keys.length;
    const w = nkeys * KW + 16;
    const rx = tx(p.x) - w / 2;
    const ry = ty(p.y) - NH / 2;

    const rect2 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect2.setAttribute('x', rx); rect2.setAttribute('y', ry);
    rect2.setAttribute('width', w); rect2.setAttribute('height', NH);
    rect2.setAttribute('rx', '5');
    rect2.setAttribute('fill', color + '18');
    rect2.setAttribute('stroke', color);
    rect2.setAttribute('stroke-width', node.isLeaf ? '2' : '1.5');
    treeSvg.appendChild(rect2);

    // Leaf bottom line indicator
    if (node.isLeaf) {
      const leafLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      leafLine.setAttribute('x1', rx + 2); leafLine.setAttribute('y1', ry + NH - 2);
      leafLine.setAttribute('x2', rx + w - 2); leafLine.setAttribute('y2', ry + NH - 2);
      leafLine.setAttribute('stroke', color); leafLine.setAttribute('stroke-width', '2'); leafLine.setAttribute('opacity', '0.4');
      treeSvg.appendChild(leafLine);
    }

    node.keys.forEach((k, i) => {
      if (i > 0) {
        const sep = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        sep.setAttribute('x1', rx + i * KW + 8); sep.setAttribute('y1', ry + 4);
        sep.setAttribute('x2', rx + i * KW + 8); sep.setAttribute('y2', ry + NH - 4);
        sep.setAttribute('stroke', color + '44'); sep.setAttribute('stroke-width', '1');
        treeSvg.appendChild(sep);
      }
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', rx + i * KW + KW / 2 + 8);
      txt.setAttribute('y', ry + NH / 2 + 1);
      txt.setAttribute('text-anchor', 'middle'); txt.setAttribute('dominant-baseline', 'middle');
      txt.setAttribute('fill', s && s.settled.includes(k) ? '#4ade80' : color);
      txt.setAttribute('font-size', '12'); txt.setAttribute('font-weight', '600');
      txt.setAttribute('font-family', 'monospace');
      txt.textContent = k;
      treeSvg.appendChild(txt);
    });

    node.children.forEach(c => drawNode(c));
  }
  drawNode(root);

  // Label
  if (leaves.length > 0) {
    const lastLeaf = leaves[leaves.length - 1];
    const p = positions[lastLeaf.id];
    if (p) {
      const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      lbl.setAttribute('x', tx(p.x) + (p.w || 60) / 2); lbl.setAttribute('y', ty(p.y) + NH / 2 + 18);
      lbl.setAttribute('fill', '#c084fc'); lbl.setAttribute('font-size', '11');
      lbl.textContent = '← 叶节点链表 →';
      treeSvg.appendChild(lbl);
    }
  }
}

function render() {
  if (steps.length === 0) {
    renderBPTree(null);
    renderCode();
    descText.textContent = 'B+ 树：内部节点仅做索引，所有数据存于叶节点，叶节点用链表串联';
    leafCount.textContent = leafKeyCount(bpRoot);
    treeHeightEl.textContent = treeHeight(bpRoot);
    stepCounter.textContent = '0 / 0';
    return;
  }
  const s = steps[cur];
  renderBPTree(s);
  renderCode();
  descText.textContent = s.description;
  stepCounter.textContent = `${cur + 1} / ${steps.length}`;
  leafCount.textContent = s.root ? leafKeyCount(s.root) : 0;
  treeHeightEl.textContent = s.root ? treeHeight(s.root) : 0;
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;
}

function renderCode() {
  const lines = (LangSwitcher.current !== 'go' && LangSwitcher.getLines(LangSwitcher.current))
    || CODE_LINES;
  const hl = LangSwitcher.getHL(steps[cur] || {});
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i) ? ' active' : '';
    return `<div class="code-line${active}" onclick="jumpToLine(${i})">${line.html || '&nbsp;'}</div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}
function buildCode() { renderCode(); }
function highlightLines(lines) { renderCode(); }
function jumpToLine(ln) {
  if (LangSwitcher.current !== 'go') return;
  if (steps.length === 0) return;
  let t2 = cur, b = Infinity;
  steps.forEach((s, i) => { if (s.highlightLines && s.highlightLines.includes(ln)) { const d = Math.abs(i - cur); if (d < b) { b = d; t2 = i; } } });
  cur = t2; render();
}

function play() { if (cur >= steps.length - 1) cur = 0; playing = true; btnPlay.innerHTML = '⏸ 暂停'; tick(); }
function pause() { playing = false; clearTimeout(timer); btnPlay.innerHTML = '▶ 播放'; }
function tick() { if (!playing) return; if (cur < steps.length - 1) { cur++; render(); timer = setTimeout(tick, SPEED[parseInt(speedRange.value) - 1]); } else pause(); }

btnPlay.addEventListener('click', () => playing ? pause() : play());
btnPrev.addEventListener('click', () => { pause(); if (cur > 0) { cur--; render(); } });
btnNext.addEventListener('click', () => { pause(); if (cur < steps.length - 1) { cur++; render(); } });
btnReset.addEventListener('click', () => { pause(); cur = 0; render(); });

LangSwitcher.init(renderCode);
buildCode();
doPreset();
</script>
</body>
</html>
