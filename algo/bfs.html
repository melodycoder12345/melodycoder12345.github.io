<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广度优先搜索 BFS - 算法可视化</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--border:#334155;--text:#e2e8f0;--dim:#94a3b8;--blue:#38bdf8;--yellow:#fbbf24;--orange:#fb923c;--green:#4ade80;--purple:#c084fc;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
nav{display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.back-btn{color:var(--dim);text-decoration:none;font-size:0.9rem;}.back-btn:hover{color:var(--text);}
nav h1{font-size:1.2rem;font-weight:600;}.complexity{margin-left:auto;display:flex;gap:8px;}
.badge{font-size:0.75rem;padding:3px 10px;border-radius:100px;font-family:monospace;}
.badge.time{background:rgba(251,191,36,0.15);color:var(--yellow);}.badge.space{background:rgba(56,189,248,0.15);color:var(--blue);}
.main{display:flex;flex:1;overflow:hidden;}
.viz-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;}
.op-row{display:flex;gap:8px;padding:10px 24px;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;}
.start-label{font-size:0.82rem;color:var(--dim);}
.start-btns{display:flex;gap:4px;}
.start-btn{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:5px;cursor:pointer;font-size:0.8rem;font-family:monospace;font-weight:600;transition:all 0.15s;}
.start-btn:hover{background:rgba(255,255,255,0.1);}.start-btn.active-start{background:rgba(251,191,36,0.15);border-color:var(--yellow);color:var(--yellow);}
.go-btn{background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.3);color:var(--yellow);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:0.82rem;margin-left:auto;}
.go-btn:hover{background:rgba(251,191,36,0.25);}
.viz-area{flex:1;overflow:hidden;position:relative;}
svg#graphSvg{width:100%;height:100%;}
.info-overlay{position:absolute;bottom:8px;left:24px;right:24px;display:flex;gap:12px;flex-wrap:wrap;}
.info-box{background:rgba(15,23,42,0.85);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:0.78rem;}
.info-box-label{color:var(--dim);margin-bottom:4px;}
.info-box-val{font-family:monospace;display:flex;gap:4px;flex-wrap:wrap;}
.q-item{padding:1px 6px;border-radius:3px;font-size:0.75rem;font-weight:600;font-family:monospace;}
.desc-box{padding:10px 24px;background:rgba(255,255,255,0.03);border-top:1px solid var(--border);font-size:0.9rem;color:var(--dim);min-height:44px;display:flex;align-items:center;gap:12px;}
.step-counter{margin-left:auto;font-size:0.8rem;color:var(--dim);font-family:monospace;white-space:nowrap;}
.code-panel{width:45%;min-width:380px;display:flex;flex-direction:column;overflow:hidden;}
.code-panel-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:0.85rem;color:var(--dim);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.code-dot{width:10px;height:10px;border-radius:50%;}
.code-body{flex:1;overflow-y:auto;padding:16px 0;background:#0d1117;}
.code-body::-webkit-scrollbar{width:6px;}.code-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.code-line{display:flex;align-items:stretch;padding:1px 0;cursor:pointer;transition:background 0.15s;font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.6;}
.code-line:hover{background:rgba(255,255,255,0.04);}.code-line.active{background:rgba(251,191,36,0.12);}.code-line.active .ln{color:var(--yellow);}
.ln{min-width:48px;padding:0 12px 0 16px;color:#4b5563;text-align:right;user-select:none;flex-shrink:0;font-size:0.78rem;}
.lc{padding:0 16px 0 4px;flex:1;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.num{color:#79c0ff;}.pkg{color:#ffa657;}.op{color:#ff7b72;}.id{color:#e6edf3;}.cm{color:#8b949e;font-style:italic;}
.controls{display:flex;align-items:center;gap:10px;padding:12px 24px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.btn{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:7px;cursor:pointer;font-size:0.85rem;transition:all 0.15s;}
.btn:hover{background:rgba(255,255,255,0.12);}.btn.primary{background:rgba(251,191,36,0.15);border-color:rgba(251,191,36,0.3);color:var(--yellow);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.speed-wrap{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:0.8rem;color:var(--dim);}
input[type=range]{-webkit-appearance:none;width:90px;height:4px;background:var(--border);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--yellow);cursor:pointer;}
.legend{display:flex;gap:12px;margin-left:auto;}
.leg{display:flex;align-items:center;gap:4px;font-size:0.72rem;color:var(--dim);}
.leg-dot{width:10px;height:10px;border-radius:50%;}

/* MOBILE_INJECTED */
@media(max-width:768px){
  body{height:auto!important;min-height:100vh;overflow-y:auto!important;overflow-x:hidden;}
  nav{flex-wrap:wrap;padding:10px 16px;gap:6px;height:auto!important;}
  nav h1{font-size:1rem;flex:1;}
  .complexity{margin-left:0!important;width:100%;order:3;margin-top:4px;}
  .badge{font-size:0.7rem;padding:2px 6px;}
  .main{flex-direction:column!important;overflow:visible!important;height:auto!important;flex:none!important;}
  .viz-panel{border-right:none!important;border-bottom:1px solid var(--border);height:280px!important;min-height:280px!important;flex:none!important;overflow:hidden;}
  .viz-area{padding:14px 10px 10px!important;}
  .bar-wrap{max-width:32px!important;}
  .bar-val{font-size:0.6rem!important;}
  .bar-label{font-size:0.65rem!important;}
  .code-panel{width:100%!important;min-width:unset!important;height:340px!important;flex:none!important;}
  .code-line{font-size:0.76rem!important;}
  .ln{min-width:36px!important;padding:0 8px 0 8px!important;}
  .controls{flex-wrap:wrap!important;padding:10px 14px!important;gap:6px!important;height:auto!important;}
  .btn{padding:6px 10px!important;font-size:0.8rem!important;}
  .speed-wrap{margin-left:0!important;width:100%;justify-content:flex-end;}
  .stats{flex-wrap:wrap;gap:6px;}
  .stat{font-size:0.74rem;}
  .desc-box{padding:8px 14px!important;font-size:0.8rem!important;}
  .legend{padding:6px 14px!important;gap:6px!important;}
  .leg{font-size:0.68rem!important;}
}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="back-btn">← 返回</a>
  <h1>广度优先搜索 BFS</h1>
  <div class="complexity"><span class="badge time">O(V+E)</span><span class="badge space">O(V)</span></div>
</nav>
<div class="main">
  <div class="viz-panel">
    <div class="op-row">
      <span class="start-label">起始节点：</span>
      <div class="start-btns" id="startBtns"></div>
      <div class="legend">
        <div class="leg"><div class="leg-dot" style="background:#94a3b8"></div>未访问</div>
        <div class="leg"><div class="leg-dot" style="background:#fbbf24"></div>队列中</div>
        <div class="leg"><div class="leg-dot" style="background:#4ade80"></div>已访问</div>
        <div class="leg"><div class="leg-dot" style="background:#38bdf8"></div>当前处理</div>
      </div>
      <button class="go-btn" id="goBtn">开始 BFS ▶</button>
    </div>
    <div class="viz-area">
      <svg id="graphSvg"></svg>
      <div class="info-overlay">
        <div class="info-box">
          <div class="info-box-label">队列 Queue</div>
          <div class="info-box-val" id="queueDisplay"></div>
        </div>
        <div class="info-box">
          <div class="info-box-label">已访问 Visited</div>
          <div class="info-box-val" id="visitedDisplay"></div>
        </div>
      </div>
    </div>
    <div class="desc-box">
      <span id="descText">选择起始节点并点击开始</span>
      <span class="step-counter" id="stepCounter"></span>
    </div>
  </div>
  <div class="code-panel">
    <div class="code-panel-header">
      <div class="code-dot" style="background:#ff5f57"></div>
      <div class="code-dot" style="background:#febc2e"></div>
      <div class="code-dot" style="background:#28c840"></div>
      <span style="margin-left:4px">bfs.go</span>
    </div>
    <div class="code-body" id="codeBody"></div>
  </div>
</div>
<div class="controls">
  <button class="btn" id="btnReset">⏮ 重置</button>
  <button class="btn" id="btnPrev">◀ 上一步</button>
  <button class="btn primary" id="btnPlay">▶ 播放</button>
  <button class="btn" id="btnNext">下一步 ▶</button>
  <div class="speed-wrap"><span>🐢</span><input type="range" id="speedRange" min="1" max="5" value="3"><span>🐇</span></div>
</div>
<script>
const CODE_LINES = [
  {html:`<span class="kw">package</span> <span class="pkg">main</span>`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">bfs</span>(graph <span class="kw">map</span>[<span class="kw">int</span>][]<span class="kw">int</span>, start <span class="kw">int</span>) []<span class="kw">int</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;visited := <span class="fn">make</span>(<span class="kw">map</span>[<span class="kw">int</span>]<span class="kw">bool</span>)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;queue := []<span class="kw">int</span>{start}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;result := []<span class="kw">int</span>{}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;visited[start] = <span class="kw">true</span>`},
  {html:``},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> <span class="fn">len</span>(queue) &gt; <span class="num">0</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;node := queue[<span class="num">0</span>]          <span class="cm">// 取出队首</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;queue = queue[<span class="num">1</span>:]         <span class="cm">// 队列前移</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;result = <span class="fn">append</span>(result, node)`},
  {html:``},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> _, neighbor := <span class="kw">range</span> graph[node] {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> !visited[neighbor] {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;visited[neighbor] = <span class="kw">true</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;queue = <span class="fn">append</span>(queue, neighbor)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> result`},
  {html:`}`},
];

// Graph definition
const NODES = [0,1,2,3,4,5,6];
const EDGES = [[0,1],[0,2],[1,3],[1,4],[2,4],[2,5],[3,6],[4,6],[5,6]];
const GRAPH = {};
NODES.forEach(n=>GRAPH[n]=[]);
EDGES.forEach(([a,b])=>{GRAPH[a].push(b);GRAPH[b].push(a);});

// Node positions (normalized 0-1)
const NODE_POS = {0:{x:0.5,y:0.12},1:{x:0.2,y:0.38},2:{x:0.8,y:0.38},3:{x:0.1,y:0.68},4:{x:0.45,y:0.68},5:{x:0.85,y:0.68},6:{x:0.5,y:0.9}};
const NR=26;

function generateBfsSteps(start){
  const steps=[];
  const visited=new Set();const queue=[start];visited.add(start);
  function snap(cur,visited,queue,lines,desc){
    steps.push({current:cur,visited:new Set(visited),queue:[...queue],highlightLines:lines,description:desc});
  }
  snap(null,visited,[...queue],[2,3,4,5,6],`BFS 从节点 ${start} 开始，初始化队列`);
  while(queue.length>0){
    snap(null,visited,[...queue],[8],`队列不为空，继续循环`);
    const node=queue.shift();
    snap(node,visited,[...queue],[9,10,11],`取出队首 ${node}，加入结果`);
    for(const nb of GRAPH[node]){
      snap(node,visited,[...queue],[13,14],`检查邻居 ${nb}，是否已访问: ${visited.has(nb)}`);
      if(!visited.has(nb)){
        visited.add(nb);queue.push(nb);
        snap(node,visited,[...queue],[15,16],`${nb} 未访问，标记并加入队列`);
      }
    }
  }
  snap(null,visited,[],[19,20],`BFS 完成！`);
  return steps;
}

let steps=[];let cur=0,playing=false,timer=null;const SPEED=[800,500,300,180,80];
let startNode=0;

const graphSvg=document.getElementById('graphSvg'),codeBody=document.getElementById('codeBody'),
  descText=document.getElementById('descText'),stepCounter=document.getElementById('stepCounter'),
  queueDisplay=document.getElementById('queueDisplay'),visitedDisplay=document.getElementById('visitedDisplay'),
  btnPlay=document.getElementById('btnPlay'),btnPrev=document.getElementById('btnPrev'),
  btnNext=document.getElementById('btnNext'),btnReset=document.getElementById('btnReset'),
  speedRange=document.getElementById('speedRange'),goBtn=document.getElementById('goBtn'),
  startBtnsEl=document.getElementById('startBtns');

// Build start node buttons
NODES.forEach(n=>{
  const btn=document.createElement('button');btn.className='start-btn'+(n===0?' active-start':'');
  btn.textContent=n;btn.addEventListener('click',()=>{
    startNode=n;document.querySelectorAll('.start-btn').forEach(b=>b.classList.remove('active-start'));
    btn.classList.add('active-start');
  });
  startBtnsEl.appendChild(btn);
});

goBtn.addEventListener('click',()=>{pause();steps=generateBfsSteps(startNode);cur=0;render();});

function buildCode(){
  codeBody.innerHTML=CODE_LINES.map((l,i)=>`<div class="code-line" data-line="${i}"><span class="ln">${i+1}</span><span class="lc">${l.html||'&nbsp;'}</span></div>`).join('');
  codeBody.querySelectorAll('.code-line').forEach(el=>el.addEventListener('click',()=>jumpToLine(parseInt(el.dataset.line))));
}
function highlightLines(lines){
  codeBody.querySelectorAll('.code-line').forEach(el=>el.classList.remove('active'));
  lines.forEach(ln=>{const el=codeBody.querySelector(`[data-line="${ln}"]`);if(el)el.classList.add('active');});
  if(lines.length>0){const f=codeBody.querySelector(`[data-line="${lines[0]}"]`);if(f)f.scrollIntoView({block:'nearest'});}
}
function jumpToLine(ln){let t=cur,b=Infinity;steps.forEach((s,i)=>{if(s.highlightLines&&s.highlightLines.includes(ln)){const d=Math.abs(i-cur);if(d<b){b=d;t=i;}}});cur=t;render();}

function drawGraph(current, visited, inQueue){
  graphSvg.innerHTML='';
  const r=graphSvg.getBoundingClientRect();
  const W=r.width||600,H=r.height||300;
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML=`<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  graphSvg.appendChild(defs);
  const px=n=>NODE_POS[n].x*(W-NR*2-20)+NR+10;
  const py=n=>NODE_POS[n].y*(H-NR*2-20)+NR+10;
  EDGES.forEach(([a,b])=>{
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    const bothVis=visited.has(a)&&visited.has(b);
    l.setAttribute('x1',px(a));l.setAttribute('y1',py(a));l.setAttribute('x2',px(b));l.setAttribute('y2',py(b));
    l.setAttribute('stroke',bothVis?'rgba(74,222,128,0.4)':'#334155');l.setAttribute('stroke-width',bothVis?'2':'1.5');
    graphSvg.appendChild(l);
  });
  NODES.forEach(n=>{
    const x=px(n),y=py(n);
    const isVisited=visited.has(n);const isQueue=inQueue.includes(n);const isCurrent=current===n;
    let fill='#1e293b',stroke='#475569',textCol='#94a3b8';
    if(isVisited){fill='rgba(74,222,128,0.2)';stroke='#4ade80';textCol='#4ade80';}
    if(isQueue&&!isVisited){fill='rgba(251,191,36,0.15)';stroke='#fbbf24';textCol='#fbbf24';}
    if(isCurrent){fill='rgba(56,189,248,0.25)';stroke='#38bdf8';textCol='#38bdf8';}
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',NR);
    c.setAttribute('fill',fill);c.setAttribute('stroke',stroke);c.setAttribute('stroke-width','2');
    if(isCurrent)c.setAttribute('filter','url(#glow)');
    graphSvg.appendChild(c);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',x);t.setAttribute('y',y+5);
    t.setAttribute('fill',textCol);t.setAttribute('font-size','15');t.setAttribute('font-weight','700');
    t.setAttribute('text-anchor','middle');t.setAttribute('font-family','monospace');
    t.textContent=n;graphSvg.appendChild(t);
  });
}
function renderInfoBoxes(visited, queue){
  queueDisplay.innerHTML=queue.map(n=>`<span class="q-item" style="background:rgba(251,191,36,0.15);color:#fbbf24">${n}</span>`).join('') || '<span style="color:#475569">空</span>';
  visitedDisplay.innerHTML=[...visited].map(n=>`<span class="q-item" style="background:rgba(74,222,128,0.12);color:#4ade80">${n}</span>`).join('') || '<span style="color:#475569">空</span>';
}
function render(){
  if(steps.length===0){drawGraph(null,new Set(),[]);renderInfoBoxes(new Set(),[]);descText.textContent='选择起始节点并点击开始';stepCounter.textContent='';return;}
  const s=steps[cur];
  drawGraph(s.current,s.visited,s.queue);
  renderInfoBoxes(s.visited,s.queue);
  if(s.highlightLines)highlightLines(s.highlightLines);
  descText.textContent=s.description;
  stepCounter.textContent=`${cur+1} / ${steps.length}`;
  btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;
}
function play(){if(cur>=steps.length-1)cur=0;playing=true;btnPlay.innerHTML='⏸ 暂停';tick();}
function pause(){playing=false;clearTimeout(timer);btnPlay.innerHTML='▶ 播放';}
function tick(){if(!playing)return;if(cur<steps.length-1){cur++;render();timer=setTimeout(tick,SPEED[parseInt(speedRange.value)-1]);}else pause();}
btnPlay.addEventListener('click',()=>playing?pause():play());
btnPrev.addEventListener('click',()=>{pause();if(cur>0){cur--;render();}});
btnNext.addEventListener('click',()=>{pause();if(cur<steps.length-1){cur++;render();}});
btnReset.addEventListener('click',()=>{pause();cur=0;render();});
buildCode();drawGraph(null,new Set(),[]);renderInfoBoxes(new Set(),[]);
descText.textContent='图有 7 个节点（0-6），9 条边';
window.addEventListener('resize',()=>render());
</script>
<script src="../nav.js"></script>
</body>
</html>
