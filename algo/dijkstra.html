<script>
const CODE_LINES = [
  {html:`<span class="kw">package</span> <span class="pkg">main</span>`},
  {html:``},
  {html:`<span class="kw">import</span> <span class="st">"container/heap"</span>`},
  {html:``},
  {html:`<span class="kw">type</span> <span class="id">Item</span> <span class="kw">struct</span> { node, dist <span class="kw">int</span> }`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">dijkstra</span>(graph [][]<span class="id">Item</span>, src <span class="kw">int</span>) []<span class="kw">int</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;n := <span class="fn">len</span>(graph)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;dist := <span class="fn">make</span>([]<span class="kw">int</span>, n)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> i := <span class="kw">range</span> dist { dist[i] = <span class="id">math</span>.<span class="id">MaxInt</span> }  <span class="cm">// ∞</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;dist[src] = <span class="num">0</span>`},
  {html:``},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// 优先队列（最小堆）</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;pq := &amp;<span class="id">PriorityQueue</span>{{src, <span class="num">0</span>}}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">heap</span>.<span class="fn">Init</span>(pq)`},
  {html:``},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> pq.<span class="fn">Len</span>() <span class="op">></span> <span class="num">0</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;item := <span class="id">heap</span>.<span class="fn">Pop</span>(pq).(<span class="id">Item</span>)  <span class="cm">// 取距离最小节点</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;u := item.node`},
  {html:``},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> item.dist <span class="op">></span> dist[u] { <span class="kw">continue</span> }  <span class="cm">// 已处理过</span>`},
  {html:``},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> _, e := <span class="kw">range</span> graph[u] {  <span class="cm">// 遍历邻居</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;v, w := e.node, e.dist`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;newDist := dist[u] + w`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> newDist <span class="op"><</span> dist[v] {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;dist[v] = newDist`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">heap</span>.<span class="fn">Push</span>(pq, <span class="id">Item</span>{v, newDist})`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> dist`},
  {html:`}`},
];

window.LANG_PLAIN = {
  js: `function dijkstra(graph, start) {
    const dist = {};
    const visited = new Set();
    const prev = {};

    for (const node in graph) {
        dist[node] = Infinity;
    }
    dist[start] = 0;

    while (true) {
        // Pick unvisited node with minimum distance
        let u = null;
        for (const node in dist) {
            if (!visited.has(node) && (u === null || dist[node] < dist[u])) {
                u = node;
            }
        }
        if (u === null || dist[u] === Infinity) break;
        visited.add(u);

        for (const [v, weight] of (graph[u] || [])) {
            const alt = dist[u] + weight;
            if (alt < dist[v]) {
                dist[v] = alt;
                prev[v] = u;
            }
        }
    }
    return { dist, prev };
}

const graph = {
    A: [['B', 4], ['C', 2]],
    B: [['D', 5]],
    C: [['B', 1], ['D', 8]],
    D: []
};
const { dist } = dijkstra(graph, 'A');
console.log(dist); // A:0, B:3, C:2, D:8`,
  py: `import heapq

def dijkstra(graph, start):
    dist = {node: float('inf') for node in graph}
    dist[start] = 0
    prev = {}
    pq = [(0, start)]

    while pq:
        d, u = heapq.heappop(pq)
        if d > dist[u]:
            continue
        for v, weight in graph.get(u, []):
            alt = dist[u] + weight
            if alt < dist[v]:
                dist[v] = alt
                prev[v] = u
                heapq.heappush(pq, (alt, v))

    return dist, prev

graph = {
    'A': [('B', 4), ('C', 2)],
    'B': [('D', 5)],
    'C': [('B', 1), ('D', 8)],
    'D': []
}
dist, _ = dijkstra(graph, 'A')
print(dist)  # A:0, B:3, C:2, D:8`
};

// Graph: 7 nodes (0=A, 1=B, 2=C, 3=D, 4=E, 5=F, 6=G)
const NODE_NAMES = ['A','B','C','D','E','F','G'];
const NODE_POS = [
  {x:0.12,y:0.45}, // A
  {x:0.32,y:0.15}, // B
  {x:0.55,y:0.10}, // C
  {x:0.30,y:0.70}, // D
  {x:0.55,y:0.55}, // E
  {x:0.78,y:0.25}, // F
  {x:0.80,y:0.72}, // G
];
// Edges: [from, to, weight] (undirected)
const EDGES = [
  [0,1,4],[0,3,2],
  [1,2,5],[1,4,3],[1,3,1],
  [2,5,2],[2,4,4],
  [3,4,6],[3,6,8],
  [4,5,3],[4,6,2],
  [5,6,5],
];

const INF = Infinity;
let startNode = 0;
let steps = [], cur = 0, playing = false, timer = null;
const SPEED = [800,500,300,180,80];

function generateDijkstraSteps(src) {
  const steps = [];
  const n = NODE_NAMES.length;
  const dist = Array(n).fill(INF);
  const prev = Array(n).fill(-1);
  const settled = new Set();
  dist[src] = 0;

  // Build adjacency
  const adj = Array.from({length: n}, () => []);
  for (const [u, v, w] of EDGES) { adj[u].push({v, w}); adj[v].push({v: u, w}); }

  // Priority queue simulation (array sorted)
  let pq = [{node: src, dist: 0}];

  function mkStep(current, pq2, desc, lines, activeEdge) {
    return {
      dist: [...dist], prev: [...prev], settled: new Set(settled),
      current, pq: pq2.map(x=>({...x})),
      description: desc, highlightLines: lines,
      activeEdge: activeEdge || null
    };
  }

  steps.push(mkStep(-1, [], `Dijkstra 从节点 ${NODE_NAMES[src]} 开始，初始化所有距离为 ∞`, [7,8,9,10], null));
  steps.push(mkStep(src, [{node:src,dist:0}], `dist[${NODE_NAMES[src]}]=0，加入优先队列`, [13,14], null));

  while (pq.length > 0) {
    pq.sort((a, b) => a.dist - b.dist);
    const { node: u, dist: ud } = pq.shift();

    if (ud > dist[u]) {
      steps.push(mkStep(u, [...pq], `弹出 (${NODE_NAMES[u]}, ${ud})，但 dist[${NODE_NAMES[u]}]=${dist[u]} 更小，跳过`, [17,18,20], null));
      continue;
    }

    settled.add(u);
    steps.push(mkStep(u, [...pq], `从队列取出距离最小节点 ${NODE_NAMES[u]}（dist=${dist[u]}），标记为已确定`, [17,18,20], null));

    for (const {v, w} of adj[u]) {
      if (settled.has(v)) continue;
      const newDist = dist[u] + w;
      steps.push(mkStep(u, [...pq], `检查边 ${NODE_NAMES[u]}→${NODE_NAMES[v]} (权重${w})：${dist[u]}+${w}=${newDist} vs dist[${NODE_NAMES[v]}]=${dist[v]==INF?'∞':dist[v]}`, [22,23,24], {u,v,w}));
      if (newDist < dist[v]) {
        dist[v] = newDist;
        prev[v] = u;
        pq.push({node: v, dist: newDist});
        steps.push(mkStep(u, [...pq], `更新！dist[${NODE_NAMES[v]}] = ${newDist}，加入队列`, [25,26,27], {u,v,w}));
      } else {
        steps.push(mkStep(u, [...pq], `无需更新，dist[${NODE_NAMES[v]}]=${dist[v]} 更优`, [25], {u,v,w}));
      }
    }
  }

  steps.push(mkStep(-1, [], `算法完成！从 ${NODE_NAMES[src]} 到各节点最短距离已确定`, [31], null));
  return steps;
}

function setStart(s) {
  pause();
  startNode = s;
  document.querySelectorAll('.start-btn').forEach((b, i) => b.classList.toggle('active', i === s));
  steps = generateDijkstraSteps(s);
  cur = 0; render();
}

const graphSvg = document.getElementById('graphSvg');
const sideInfo = document.getElementById('sideInfo');
const descText = document.getElementById('descText');
const stepCounter = document.getElementById('stepCounter');
const codeBody = document.getElementById('codeBody');
const speedRange = document.getElementById('speedRange');
const btnPlay = document.getElementById('btnPlay');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnReset = document.getElementById('btnReset');

function getNodeColor(s, i) {
  if (!s) return '#94a3b8';
  if (i === s.current) return '#fbbf24';
  if (s.settled.has(i)) return '#4ade80';
  if (s.pq.some(p => p.node === i)) return '#38bdf8';
  return '#94a3b8';
}

function isPathEdge(s, u, v) {
  if (!s || s.prev[v] === u || s.prev[u] === v) return s && s.settled.has(u) && s.settled.has(v);
  return false;
}

function renderGraph(s) {
  const rect = graphSvg.parentElement.getBoundingClientRect();
  const W = rect.width || 400, H = rect.height || 300;
  graphSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  graphSvg.innerHTML = '';

  const R = 22;
  const pos = NODE_POS.map(p => ({ x: p.x * W, y: p.y * H }));

  // Draw edges
  for (const [u, v, w] of EDGES) {
    const isActive = s && s.activeEdge && ((s.activeEdge.u === u && s.activeEdge.v === v) || (s.activeEdge.u === v && s.activeEdge.v === u));
    const isPath = isPathEdge(s, u, v);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', pos[u].x); line.setAttribute('y1', pos[u].y);
    line.setAttribute('x2', pos[v].x); line.setAttribute('y2', pos[v].y);
    line.setAttribute('stroke', isActive ? '#fbbf24' : isPath ? '#c084fc' : '#334155');
    line.setAttribute('stroke-width', isActive ? '3' : isPath ? '2.5' : '1.5');
    graphSvg.appendChild(line);
    // Weight label
    const mx = (pos[u].x + pos[v].x) / 2, my = (pos[u].y + pos[v].y) / 2;
    const wt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    wt.setAttribute('x', mx); wt.setAttribute('y', my - 4);
    wt.setAttribute('text-anchor', 'middle'); wt.setAttribute('fill', isActive ? '#fbbf24' : '#64748b');
    wt.setAttribute('font-size', '11'); wt.setAttribute('font-family', 'monospace');
    wt.textContent = w;
    graphSvg.appendChild(wt);
  }

  // Draw nodes
  for (let i = 0; i < NODE_NAMES.length; i++) {
    const color = getNodeColor(s, i);
    const { x, y } = pos[i];
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', x); circle.setAttribute('cy', y); circle.setAttribute('r', R);
    circle.setAttribute('fill', color + '33'); circle.setAttribute('stroke', color);
    circle.setAttribute('stroke-width', i === (s && s.current) ? '3' : '2');
    if (i === (s && s.current)) circle.setAttribute('filter', `drop-shadow(0 0 8px ${color})`);
    graphSvg.appendChild(circle);

    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', x); label.setAttribute('y', y + 1);
    label.setAttribute('text-anchor', 'middle'); label.setAttribute('dominant-baseline', 'middle');
    label.setAttribute('fill', color); label.setAttribute('font-size', '14'); label.setAttribute('font-weight', '700');
    label.setAttribute('font-family', 'monospace');
    label.textContent = NODE_NAMES[i];
    graphSvg.appendChild(label);

    // Distance label
    if (s && s.dist[i] !== INF) {
      const dl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      dl.setAttribute('x', x); dl.setAttribute('y', y - R - 5);
      dl.setAttribute('text-anchor', 'middle'); dl.setAttribute('fill', color);
      dl.setAttribute('font-size', '12'); dl.setAttribute('font-family', 'monospace');
      dl.textContent = s.dist[i];
      graphSvg.appendChild(dl);
    }
  }
}

function renderSideInfo(s) {
  if (!s) { sideInfo.innerHTML = ''; return; }
  let html = `<div class="info-title">节点距离</div>`;
  for (let i = 0; i < NODE_NAMES.length; i++) {
    const isCurrent = i === s.current;
    const isSettled = s.settled.has(i);
    html += `<div class="dist-row${isCurrent?' current':isSettled?' settled':''}">
      <span class="dist-label">${NODE_NAMES[i]}</span>
      <span class="dist-val" style="color:${getNodeColor(s,i)}">${s.dist[i]===INF?'∞':s.dist[i]}</span>
    </div>`;
  }
  html += `<div class="info-title" style="margin-top:12px">优先队列 (${s.pq.length})</div>`;
  s.pq.slice().sort((a,b)=>a.dist-b.dist).forEach(item => {
    html += `<div class="pq-item">(${NODE_NAMES[item.node]}, ${item.dist})</div>`;
  });
  sideInfo.innerHTML = html;
}

function render() {
  if (steps.length === 0) {
    renderGraph(null); renderSideInfo(null);
    descText.textContent = '选择起始节点，点击播放';
    stepCounter.textContent = '0 / 0';
    return;
  }
  const s = steps[cur];
  renderGraph(s); renderSideInfo(s);
  renderCode();
  descText.textContent = s.description;
  stepCounter.textContent = `${cur + 1} / ${steps.length}`;
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;
}

function buildCode() {
  codeBody.innerHTML = CODE_LINES.map((l, i) => `<div class="code-line" data-line="${i}"><span class="ln">${i + 1}</span><span class="lc">${l.html || '&nbsp;'}</span></div>`).join('');
  codeBody.querySelectorAll('.code-line').forEach(el => el.addEventListener('click', () => jumpToLine(parseInt(el.dataset.line))));
}
function highlightLines(lines) {
  codeBody.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
  (lines || []).forEach(ln => { const el = codeBody.querySelector(`[data-line="${ln}"]`); if (el) el.classList.add('active'); });
  if (lines && lines.length > 0) { const f = codeBody.querySelector(`[data-line="${lines[0]}"]`); if (f) f.scrollIntoView({ block: 'nearest' }); }
}
function jumpToLine(ln) {
  if (steps.length === 0) return;
  let t = cur, b = Infinity;
  steps.forEach((s, i) => { if (s.highlightLines.includes(ln)) { const d = Math.abs(i - cur); if (d < b) { b = d; t = i; } } });
  cur = t; render();
}
function renderCode() {
  const lines = (LangSwitcher.current !== 'go' && LangSwitcher.getLines(LangSwitcher.current))
    || CODE_LINES;
  const hl = steps[cur] ? LangSwitcher.getHL(steps[cur]) : [];
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i) ? ' active' : '';
    return `<div class="code-line${active}" onclick="jumpToLine(${i})">${line.html || '&nbsp;'}</div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}

function play() { if (cur >= steps.length - 1) cur = 0; playing = true; btnPlay.innerHTML = '⏸ 暂停'; tick(); }
function pause() { playing = false; clearTimeout(timer); btnPlay.innerHTML = '▶ 播放'; }
function tick() { if (!playing) return; if (cur < steps.length - 1) { cur++; render(); timer = setTimeout(tick, SPEED[parseInt(speedRange.value) - 1]); } else pause(); }

btnPlay.addEventListener('click', () => playing ? pause() : play());
btnPrev.addEventListener('click', () => { pause(); if (cur > 0) { cur--; render(); } });
btnNext.addEventListener('click', () => { pause(); if (cur < steps.length - 1) { cur++; render(); } });
btnReset.addEventListener('click', () => { pause(); steps = generateDijkstraSteps(startNode); cur = 0; render(); });

LangSwitcher.init(renderCode);
steps = generateDijkstraSteps(startNode);
render();
</script>
</body>
</html>
