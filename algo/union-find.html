<script>
const CODE_LINES = [
  {html:`<span class="kw">type</span> <span class="fn">UnionFind</span> <span class="kw">struct</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;parent []<span class="kw">int</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;rank   []<span class="kw">int</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;count  <span class="kw">int</span>`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">NewUF</span>(n <span class="kw">int</span>) *<span class="fn">UnionFind</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;p := <span class="fn">make</span>([]<span class="kw">int</span>, n)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> i := <span class="kw">range</span> p { p[i] = i }`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> &amp;<span class="fn">UnionFind</span>{p, <span class="fn">make</span>([]<span class="kw">int</span>, n), n}`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">func</span> (uf *<span class="fn">UnionFind</span>) <span class="fn">Find</span>(x <span class="kw">int</span>) <span class="kw">int</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> uf.parent[x] != x {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;uf.parent[x] = uf.<span class="fn">Find</span>(uf.parent[x])  <span class="cm">// 路径压缩</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> uf.parent[x]`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">func</span> (uf *<span class="fn">UnionFind</span>) <span class="fn">Union</span>(x, y <span class="kw">int</span>) <span class="kw">bool</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;px, py := uf.<span class="fn">Find</span>(x), uf.<span class="fn">Find</span>(y)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> px == py { <span class="kw">return false</span> }`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> uf.rank[px] &lt; uf.rank[py] { px, py = py, px }`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;uf.parent[py] = px  <span class="cm">// 按秩合并</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> uf.rank[px] == uf.rank[py] { uf.rank[px]++ }`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;uf.count--`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return true</span>`},
  {html:`}`},
];

window.LANG_PLAIN = {
  js: `class UnionFind {
    constructor(n) {
        this.parent = Array.from({length: n}, (_, i) => i);
        this.rank = new Array(n).fill(0);
        this.count = n;
    }

    find(x) {
        if (this.parent[x] !== x) {
            this.parent[x] = this.find(this.parent[x]); // path compression
        }
        return this.parent[x];
    }

    union(x, y) {
        const px = this.find(x), py = this.find(y);
        if (px === py) return false;
        if (this.rank[px] < this.rank[py]) this.parent[px] = py;
        else if (this.rank[px] > this.rank[py]) this.parent[py] = px;
        else { this.parent[py] = px; this.rank[px]++; }
        this.count--;
        return true;
    }

    connected(x, y) { return this.find(x) === this.find(y); }
}

const uf = new UnionFind(6);
uf.union(0, 1); uf.union(1, 2); uf.union(3, 4);
console.log(uf.connected(0, 2)); // true
console.log(uf.connected(0, 3)); // false
console.log(uf.count);           // 3 components`,
  py: `class UnionFind:
    def __init__(self, n):
        self.parent = list(range(n))
        self.rank = [0] * n
        self.count = n

    def find(self, x):
        if self.parent[x] != x:
            self.parent[x] = self.find(self.parent[x])  # path compression
        return self.parent[x]

    def union(self, x, y):
        px, py = self.find(x), self.find(y)
        if px == py:
            return False
        if self.rank[px] < self.rank[py]:
            self.parent[px] = py
        elif self.rank[px] > self.rank[py]:
            self.parent[py] = px
        else:
            self.parent[py] = px
            self.rank[px] += 1
        self.count -= 1
        return True

    def connected(self, x, y):
        return self.find(x) == self.find(y)

uf = UnionFind(6)
uf.union(0, 1); uf.union(1, 2); uf.union(3, 4)
print(uf.connected(0, 2))  # True
print(uf.connected(0, 3))  # False
print(uf.count)             # 3 components`
};

function renderCode() {
  const lines = (LangSwitcher.current !== 'go' && LangSwitcher.getLines(LangSwitcher.current))
    || CODE_LINES;
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    return `<div class="code-line"><span class="ln">${i+1}</span><span class="lc">${line.html || '&nbsp;'}</span></div>`;
  }).join('');
}

const N = 10;
const COLORS = ['#38bdf8','#4ade80','#fb923c','#c084fc','#fbbf24','#f87171','#34d399','#a78bfa','#f472b6','#60a5fa'];

let parent = Array.from({length:N},(_,i)=>i);
let rank = new Array(N).fill(0);
let count = N;
let highlighted = [];
let isAnimating = false;

const SVG_W = 700, SVG_H = 320;
const ROW1_Y = 90, ROW2_Y = 230;
const ROW1_X = [70,175,280,385,490];
const ROW2_X = [70,175,280,385,490];
const R = 28;

function findRoot(x) {
  while (parent[x] !== x) x = parent[x];
  return x;
}

function findPath(x) {
  let path = [x];
  while (parent[x] !== x) { x = parent[x]; path.push(x); }
  return path;
}

function getNodePos(i) {
  if (i < 5) return {x: ROW1_X[i], y: ROW1_Y};
  return {x: ROW2_X[i-5], y: ROW2_Y};
}

function getColor(i) {
  return COLORS[findRoot(i) % COLORS.length];
}

function renderSVG(hlPath=[], hlRoot=-1) {
  const svg = document.getElementById('mainSvg');
  svg.innerHTML = '';

  // Draw edges (parent arrows)
  for (let i = 0; i < N; i++) {
    const p = parent[i];
    const {x:x1,y:y1} = getNodePos(i);
    const {x:x2,y:y2} = getNodePos(p);
    if (p === i) {
      // self-loop for root
      const arc = `M${x1-R},${y1} a${R},${R*0.6} 0 1,1 ${R*2},0`;
      const el = document.createElementNS('http://www.w3.org/2000/svg','path');
      el.setAttribute('d', arc);
      el.setAttribute('fill','none');
      el.setAttribute('stroke', COLORS[i % COLORS.length]);
      el.setAttribute('stroke-width','1.5');
      el.setAttribute('stroke-dasharray','4 2');
      el.setAttribute('opacity','0.45');
      svg.appendChild(el);
    } else {
      // arrow from i to parent
      const dx = x2-x1, dy = y2-y1;
      const dist = Math.sqrt(dx*dx+dy*dy);
      const ux = dx/dist, uy = dy/dist;
      const sx = x1+ux*R, sy = y1+uy*R;
      const ex = x2-ux*(R+6), ey = y2-uy*(R+6);
      const isHL = hlPath.includes(i);
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',sx); line.setAttribute('y1',sy);
      line.setAttribute('x2',ex); line.setAttribute('y2',ey);
      line.setAttribute('stroke', isHL ? '#fb923c' : '#334155');
      line.setAttribute('stroke-width', isHL ? '2.5' : '1.5');
      line.setAttribute('marker-end','url(#arr)');
      svg.appendChild(line);
    }
  }

  // Arrow marker
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  const marker = document.createElementNS('http://www.w3.org/2000/svg','marker');
  marker.setAttribute('id','arr'); marker.setAttribute('markerWidth','8');
  marker.setAttribute('markerHeight','8'); marker.setAttribute('refX','6');
  marker.setAttribute('refY','3'); marker.setAttribute('orient','auto');
  const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
  poly.setAttribute('points','0 0, 6 3, 0 6'); poly.setAttribute('fill','#64748b');
  marker.appendChild(poly); defs.appendChild(marker); svg.insertBefore(defs,svg.firstChild);

  // Draw nodes
  for (let i = 0; i < N; i++) {
    const {x,y} = getNodePos(i);
    const color = COLORS[findRoot(i) % COLORS.length];
    const isRoot = parent[i] === i;
    const isHL = hlPath.includes(i);
    const isHLRoot = i === hlRoot;
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');

    // Double circle for root
    if (isRoot) {
      const outer = document.createElementNS('http://www.w3.org/2000/svg','circle');
      outer.setAttribute('cx',x); outer.setAttribute('cy',y); outer.setAttribute('r',R+5);
      outer.setAttribute('fill','none');
      outer.setAttribute('stroke', isHLRoot ? '#4ade80' : color);
      outer.setAttribute('stroke-width','1.5'); outer.setAttribute('opacity','0.5');
      g.appendChild(outer);
    }

    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',x); circle.setAttribute('cy',y); circle.setAttribute('r',R);
    circle.setAttribute('fill', isHL ? '#431407' : '#1e293b');
    circle.setAttribute('stroke', isHL ? '#fb923c' : isHLRoot ? '#4ade80' : color);
    circle.setAttribute('stroke-width', isHL || isHLRoot ? '2.5' : '2');
    g.appendChild(circle);

    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',x); txt.setAttribute('y',y+1);
    txt.setAttribute('text-anchor','middle'); txt.setAttribute('dominant-baseline','middle');
    txt.setAttribute('fill', color); txt.setAttribute('font-size','1.05rem');
    txt.setAttribute('font-weight','700'); txt.setAttribute('font-family','monospace');
    txt.textContent = i;
    g.appendChild(txt);

    // parent label
    const ptxt = document.createElementNS('http://www.w3.org/2000/svg','text');
    ptxt.setAttribute('x',x+R*0.62); ptxt.setAttribute('y',y+R*0.62);
    ptxt.setAttribute('text-anchor','middle'); ptxt.setAttribute('dominant-baseline','middle');
    ptxt.setAttribute('fill','#94a3b8'); ptxt.setAttribute('font-size','0.6rem');
    ptxt.setAttribute('font-family','monospace');
    ptxt.textContent = 'p:'+parent[i];
    g.appendChild(ptxt);

    svg.appendChild(g);
  }

  // rank labels below nodes
  for (let i = 0; i < N; i++) {
    const {x,y} = getNodePos(i);
    if (rank[i] > 0) {
      const rt = document.createElementNS('http://www.w3.org/2000/svg','text');
      rt.setAttribute('x',x); rt.setAttribute('y',y+R+14);
      rt.setAttribute('text-anchor','middle');
      rt.setAttribute('fill','#c084fc'); rt.setAttribute('font-size','0.65rem');
      rt.textContent = 'r:'+rank[i];
      svg.appendChild(rt);
    }
  }
}

function renderArrays(hlPath=[], hlRoot=-1) {
  const pc = document.getElementById('parentCells');
  const rc = document.getElementById('rankCells');
  pc.innerHTML = '';
  rc.innerHTML = '';
  for (let i = 0; i < N; i++) {
    const c1 = document.createElement('div');
    c1.style.cssText = 'display:inline-flex;flex-direction:column;align-items:center;margin-right:2px;';
    const cell = document.createElement('div');
    cell.className = 'cell' + (hlPath.includes(i) ? ' highlight-path' : '') + (i===hlRoot ? ' highlight-root' : '');
    cell.innerHTML = `<span class="idx">${i}</span><span class="val">${parent[i]}</span>`;
    c1.appendChild(cell);
    pc.appendChild(c1);

    const c2 = document.createElement('div');
    c2.style.cssText = 'display:inline-flex;flex-direction:column;align-items:center;margin-right:2px;';
    const cell2 = document.createElement('div');
    cell2.className = 'cell';
    cell2.innerHTML = `<span class="idx">${i}</span><span class="val">${rank[i]}</span>`;
    c2.appendChild(cell2);
    rc.appendChild(c2);
  }
}

function renderSets() {
  const row = document.getElementById('setsRow');
  row.innerHTML = '';
  const sets = {};
  for (let i = 0; i < N; i++) {
    const r = findRoot(i);
    if (!sets[r]) sets[r] = [];
    sets[r].push(i);
  }
  document.getElementById('setCount').textContent = `共 ${Object.keys(sets).length} 个集合`;
  Object.entries(sets).forEach(([root, members]) => {
    const chip = document.createElement('div');
    chip.className = 'set-chip';
    const color = COLORS[parseInt(root) % COLORS.length];
    chip.style.background = color + '22';
    chip.style.borderColor = color;
    chip.style.color = color;
    chip.textContent = `{${members.join(',')}}`;
    row.appendChild(chip);
  });
}

function addLog(msg, cls='') {
  const c = document.getElementById('logContainer');
  const d = document.createElement('div');
  d.className = 'log-entry';
  d.innerHTML = msg;
  c.insertBefore(d, c.firstChild);
  if (c.children.length > 50) c.removeChild(c.lastChild);
}

function render(hlPath=[], hlRoot=-1) {
  renderSVG(hlPath, hlRoot);
  renderArrays(hlPath, hlRoot);
  renderSets();
}

function setButtons(disabled) {
  ['btnUnion','btnFind'].forEach(id => document.getElementById(id).disabled = disabled);
}

async function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }

async function doFind() {
  if (isAnimating) return;
  isAnimating = true;
  setButtons(true);
  const x = parseInt(document.getElementById('fx').value);
  addLog(`<span class="tag">Find(${x})</span> 开始路径追溯...`);

  // Find path to root
  const path = findPath(x);
  const root = path[path.length-1];

  // Animate path highlight
  for (let i = 0; i < path.length; i++) {
    render(path.slice(0,i+1), root);
    await sleep(350);
  }
  addLog(`<span class="tag-orange">路径：${path.join(' → ')}</span>，根节点 = ${root}`);

  await sleep(400);

  // Path compression
  const before = path.slice();
  for (const node of path) { if (node !== root) parent[node] = root; }
  addLog(`<span class="tag-green">路径压缩：${before.filter(n=>n!==root).join(', ')} → 直接指向 ${root}</span>`);

  render([], root);
  await sleep(200);
  render();
  isAnimating = false;
  setButtons(false);
}

async function doUnion() {
  if (isAnimating) return;
  isAnimating = true;
  setButtons(true);
  const a = parseInt(document.getElementById('ua').value);
  const b = parseInt(document.getElementById('ub').value);
  addLog(`<span class="tag">Union(${a},${b})</span> 开始...`);

  // Find roots with path animation
  const pathA = findPath(a);
  const rootA = pathA[pathA.length-1];
  for (let i = 0; i < pathA.length; i++) {
    render(pathA.slice(0,i+1));
    await sleep(280);
  }
  addLog(`Find(${a}) → 路径 ${pathA.join('→')} → 根 ${rootA}`);
  for (const node of pathA) { if (node !== rootA) parent[node] = rootA; }

  await sleep(350);

  const pathB = findPath(b);
  const rootB = pathB[pathB.length-1];
  for (let i = 0; i < pathB.length; i++) {
    render(pathB.slice(0,i+1));
    await sleep(280);
  }
  addLog(`Find(${b}) → 路径 ${pathB.join('→')} → 根 ${rootB}`);
  for (const node of pathB) { if (node !== rootB) parent[node] = rootB; }

  render();
  await sleep(350);

  if (rootA === rootB) {
    addLog(`<span class="tag-orange">${a} 和 ${b} 已在同一集合，无需合并</span>`);
  } else {
    let rx = rootA, ry = rootB;
    if (rank[rx] < rank[ry]) [rx,ry] = [ry,rx];
    parent[ry] = rx;
    if (rank[rx] === rank[ry]) rank[rx]++;
    count--;
    addLog(`<span class="tag-green">按秩合并：rank[${rx}]=${rank[rx]} ≥ rank[${ry}]，parent[${ry}]=${rx}</span>`);
    render([], rx);
    await sleep(400);
    render();
  }

  isAnimating = false;
  setButtons(false);
}

function doReset() {
  parent = Array.from({length:N},(_,i)=>i);
  rank = new Array(N).fill(0);
  count = N;
  document.getElementById('logContainer').innerHTML = '';
  render();
  addLog('<span class="tag">重置</span> 所有节点恢复为独立集合');
}

render();
addLog('<span class="tag">初始化</span> 10 个独立节点，每个节点为独立集合');
LangSwitcher.init(renderCode);
renderCode();
</script>
