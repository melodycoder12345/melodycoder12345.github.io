<script>

  {html:``},

  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">h</span>.<span class="fn">siftUp</span>(i)              <span class="cm">// 上浮</span>`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">func</span> (<span class="id">h</span> *<span class="id">MaxHeap</span>) <span class="fn">siftUp</span>(i <span class="kw">int</span>) {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> i <span class="op">></span> <span class="num">0</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;p := <span class="id">h</span>.<span class="fn">parent</span>(i)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> <span class="id">h</span>.<span class="id">data</span>[i] <span class="op"><=</span> <span class="id">h</span>.<span class="id">data</span>[p] { <span class="kw">break</span> }`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">h</span>.<span class="id">data</span>[i], <span class="id">h</span>.<span class="id">data</span>[p] = <span class="id">h</span>.<span class="id">data</span>[p], <span class="id">h</span>.<span class="id">data</span>[i]`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;i = p`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`}`},

  {html:`<span class="kw">func</span> (<span class="id">h</span> *<span class="id">MaxHeap</span>) <span class="fn">ExtractMax</span>() <span class="kw">int</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;max := <span class="id">h</span>.<span class="id">data</span>[<span class="num">0</span>]              <span class="cm">// 保存堆顶</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;n := <span class="fn">len</span>(<span class="id">h</span>.<span class="id">data</span>)`},

  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">h</span>.<span class="id">data</span> = <span class="id">h</span>.<span class="id">data</span>[:<span class="id">n</span><span class="op">-</span><span class="num">1</span>]`},

  {html:`&nbsp;&nbsp;&nbsp;&nbsp;n := <span class="fn">len</span>(<span class="id">h</span>.<span class="id">data</span>)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;largest := i`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;l, r := <span class="id">h</span>.<span class="fn">left</span>(i), <span class="id">h</span>.<span class="fn">right</span>(i)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> l <span class="op"><</span> n &amp;&amp; <span class="id">h</span>.<span class="id">data</span>[l] <span class="op">></span> <span class="id">h</span>.<span class="id">data</span>[largest] { largest = l }`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> r <span class="op"><</span> n &amp;&amp; <span class="id">h</span>.<span class="id">data</span>[r] <span class="op">></span> <span class="id">h</span>.<span class="id">data</span>[largest] { largest = r }`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> largest <span class="op">==</span> i { <span class="kw">break</span> }`},

// Heap state
let heapData = [80, 60, 70, 30, 40, 50, 20];
let steps = [], cur = 0, playing = false, timer = null;
const SPEED = [800,500,300,180,80];

function heapHeight(n) { return n <= 0 ? 0 : Math.floor(Math.log2(n)) + 1; }

function cloneState(data, comparing, swapping, settled, description, lines) {
  return { data: [...data], comparing: [...(comparing||[])], swapping: [...(swapping||[])], settled: [...(settled||[])], description, highlightLines: lines };
}

function generateInsertSteps(initData, val) {
  const steps = [];
  const a = [...initData];
  steps.push(cloneState(a, [], [], [], `准备插入 ${val} 到堆末尾`, [11]));
  a.push(val);
  let i = a.length - 1;
  steps.push(cloneState(a, [i], [], [], `将 ${val} 插入到末尾位置 ${i}`, [12, 13]));
  steps.push(cloneState(a, [i], [], [], `开始 siftUp，从位置 ${i} 上浮`, [14]));
  while (i > 0) {
    const p = Math.floor((i - 1) / 2);
    steps.push(cloneState(a, [i, p], [], [], `比较 arr[${i}]=${a[i]} 与父节点 arr[${p}]=${a[p]}`, [17, 18, 19]));
    if (a[i] <= a[p]) {
      steps.push(cloneState(a, [], [], [i], `${a[i]} ≤ ${a[p]}，无需上浮，结束`, [20]));
      break;
    }
    [a[i], a[p]] = [a[p], a[i]];
    steps.push(cloneState(a, [], [i, p], [], `${a[p]} > ${a[i]}（交换前），交换位置 ${i} 和 ${p}`, [21, 22]));
    i = p;
  }
  if (i === 0) steps.push(cloneState(a, [], [], [0], `已到达根节点，siftUp 结束`, [23]));
  steps.push(cloneState(a, [], [], [], `插入完成，堆顶最大值为 ${a[0]}`, [11]));
  return { steps, finalData: a };
}

function generateExtractSteps(initData) {
  const steps = [];
  const a = [...initData];
  if (a.length === 0) return { steps: [cloneState([], [], [], [], '堆为空', [])], finalData: [] };
  const maxVal = a[0];
  steps.push(cloneState(a, [], [], [], `准备取出堆顶最大值 ${maxVal}`, [26]));
  steps.push(cloneState(a, [0], [], [], `记录堆顶 max = ${maxVal}`, [27]));
  const last = a[a.length - 1];
  a[0] = a[a.length - 1];
  a.pop();
  steps.push(cloneState(a, [0], [], [], `将末尾元素 ${last} 移到堆顶，删除末尾`, [28, 29, 30]));
  steps.push(cloneState(a, [], [], [], `开始 siftDown，从顶部下沉`, [31]));
  let i = 0;
  while (true) {
    const n = a.length;
    let largest = i;
    const l = 2 * i + 1, r = 2 * i + 2;
    steps.push(cloneState(a, [i, l < n ? l : -1, r < n ? r : -1].filter(x => x >= 0), [], [], `检查 i=${i} 的左右子节点，找最大者`, [35, 36, 37, 38]));
    if (l < n && a[l] > a[largest]) largest = l;
    if (r < n && a[r] > a[largest]) largest = r;
    if (largest === i) {
      steps.push(cloneState(a, [], [], [i], `arr[${i}]=${a[i]} 已是局部最大，下沉结束`, [39]));
      break;
    }
    [a[i], a[largest]] = [a[largest], a[i]];
    steps.push(cloneState(a, [], [i, largest], [], `arr[${largest}]=${a[i]} 更大（交换前），交换 ${i} 和 ${largest}`, [40, 41]));
    i = largest;
  }
  steps.push(cloneState(a, [], [], [], `ExtractMax 完成，返回 ${maxVal}，新堆顶 ${a[0] || '-'}`, [26]));
  return { steps, finalData: a };
}

function generateBuildSteps(initData) {
  const steps = [];
  const a = [...initData];
  const n = a.length;
  steps.push(cloneState(a, [], [], [], `BuildHeap：对 [${a.join(',')}] 原地建堆`, []));
  for (let i = Math.floor(n / 2) - 1; i >= 0; i--) {
    steps.push(cloneState(a, [i], [], [], `对节点 ${i} 执行 siftDown`, []));
    let cur2 = i;
    while (true) {
      let largest = cur2;
      const l = 2 * cur2 + 1, r = 2 * cur2 + 2;
      if (l < n && a[l] > a[largest]) largest = l;
      if (r < n && a[r] > a[largest]) largest = r;
      if (largest === cur2) break;
      steps.push(cloneState(a, [], [cur2, largest], [], `交换 arr[${cur2}]=${a[cur2]} 和 arr[${largest}]=${a[largest]}`, [40]));
      [a[cur2], a[largest]] = [a[largest], a[cur2]];
      cur2 = largest;
    }
  }
  steps.push(cloneState(a, [], [], [], `BuildHeap 完成，最大堆已建立，堆顶 = ${a[0]}`, []));
  return { steps, finalData: a };
}

function doInsert() {
  pause();
  const val = parseInt(document.getElementById('insertVal').value) || 50;
  const res = generateInsertSteps(heapData, val);
  steps = res.steps;
  heapData = res.finalData;
  cur = 0; render();
}
function doExtractMax() {
  pause();
  const res = generateExtractSteps(heapData);
  steps = res.steps;
  heapData = res.finalData;
  cur = 0; render();
}
function doBuildHeap() {
  pause();
  heapData = [80, 60, 70, 30, 40, 50, 20];
  const res = generateBuildSteps([45, 20, 65, 10, 30, 55, 80]);
  steps = res.steps;
  heapData = res.finalData;
  cur = 0; render();
}

const vizArea = document.getElementById('treeSvg');
const arrRow = document.getElementById('arrRow');
const descText = document.getElementById('descText');
const stepCounter = document.getElementById('stepCounter');
const sizeCount = document.getElementById('sizeCount');
const heightCount = document.getElementById('heightCount');
const codeBody = document.getElementById('codeBody');
const speedRange = document.getElementById('speedRange');
const btnPlay = document.getElementById('btnPlay');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnReset = document.getElementById('btnReset');

const COLORS = { default:'#38bdf8', compare:'#fbbf24', swap:'#fb923c', settled:'#4ade80', root:'#f87171' };

function getNodeColor(s, i) {
  if (s.swapping.includes(i)) return COLORS.swap;
  if (s.comparing.includes(i)) return COLORS.compare;
  if (s.settled.includes(i)) return COLORS.settled;
  if (i === 0 && s.data.length > 0) return COLORS.root;
  return COLORS.default;
}

function renderTree(s) {
  const data = s.data;
  const n = data.length;
  const W = vizArea.parentElement.clientWidth || 500;
  const H = vizArea.parentElement.clientHeight * 0.65 || 200;
  vizArea.setAttribute('viewBox', `0 0 ${W} ${H}`);
  vizArea.innerHTML = '';
  if (n === 0) { vizArea.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#94a3b8" font-size="14">堆为空</text>'; return; }

  const R = 22;
  const levels = Math.floor(Math.log2(n)) + 1;
  const nodePos = [];
  for (let i = 0; i < n; i++) {
    const level = Math.floor(Math.log2(i + 1));
    const levelStart = Math.pow(2, level) - 1;
    const levelCount = Math.min(Math.pow(2, level), n - levelStart);
    const totalInLevel = Math.pow(2, level);
    const posInLevel = i - levelStart;
    const xFraction = (posInLevel + 0.5) / totalInLevel;
    const x = xFraction * W;
    const y = (level + 0.5) * (H / (levels + 0.3));
    nodePos[i] = { x, y };
  }

  // Draw edges
  for (let i = 1; i < n; i++) {
    const p = Math.floor((i - 1) / 2);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', nodePos[p].x); line.setAttribute('y1', nodePos[p].y);
    line.setAttribute('x2', nodePos[i].x); line.setAttribute('y2', nodePos[i].y);
    line.setAttribute('stroke', '#334155'); line.setAttribute('stroke-width', '2');
    vizArea.appendChild(line);
  }

  // Draw nodes
  for (let i = 0; i < n; i++) {
    const color = getNodeColor(s, i);
    const { x, y } = nodePos[i];
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', x); circle.setAttribute('cy', y); circle.setAttribute('r', R);
    circle.setAttribute('fill', color + '33'); circle.setAttribute('stroke', color); circle.setAttribute('stroke-width', '2');
    if (s.swapping.includes(i) || s.comparing.includes(i)) circle.setAttribute('filter', `drop-shadow(0 0 6px ${color})`);
    vizArea.appendChild(circle);
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', x); text.setAttribute('y', y + 1);
    text.setAttribute('text-anchor', 'middle'); text.setAttribute('dominant-baseline', 'middle');
    text.setAttribute('fill', color); text.setAttribute('font-size', '14'); text.setAttribute('font-weight', '600');
    text.setAttribute('font-family', 'monospace');
    text.textContent = data[i];
    vizArea.appendChild(text);
    // index label
    const idx = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    idx.setAttribute('x', x + R - 4); idx.setAttribute('y', y - R + 4);
    idx.setAttribute('text-anchor', 'middle'); idx.setAttribute('fill', '#94a3b8'); idx.setAttribute('font-size', '10');
    idx.textContent = i;
    vizArea.appendChild(idx);
  }
}

function renderArr(s) {
  arrRow.innerHTML = '';
  s.data.forEach((val, i) => {
    const color = getNodeColor(s, i);
    const cell = document.createElement('div');
    cell.className = 'arr-cell';
    cell.style.background = color + '22';
    cell.style.borderColor = color;
    cell.style.color = color;
    if (s.swapping.includes(i) || s.comparing.includes(i)) cell.style.boxShadow = `0 0 10px ${color}88`;
    cell.innerHTML = `${val}<span class="arr-idx">${i}</span>`;
    arrRow.appendChild(cell);
  });
}

function render() {
  if (steps.length === 0) {
    const state = { data: [...heapData], comparing: [], swapping: [], settled: [], highlightLines: [] };
    renderTree(state); renderArr(state);
    descText.textContent = '选择操作开始演示';
    sizeCount.textContent = heapData.length;
    heightCount.textContent = heapHeight(heapData.length);
    stepCounter.textContent = '0 / 0';
    return;
  }
  const s = steps[cur];
  renderTree(s); renderArr(s);
  highlightLines(s.highlightLines);
  descText.textContent = s.description;
  stepCounter.textContent = `${cur + 1} / ${steps.length}`;
  sizeCount.textContent = s.data.length;
  heightCount.textContent = heapHeight(s.data.length);
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;
}

function buildCode() {
  codeBody.innerHTML = CODE_LINES.map((l, i) => `<div class="code-line" data-line="${i}"><span class="ln">${i + 1}</span><span class="lc">${l.html || '&nbsp;'}</span></div>`).join('');
  codeBody.querySelectorAll('.code-line').forEach(el => el.addEventListener('click', () => jumpToLine(parseInt(el.dataset.line))));
}
function highlightLines(lines) {
  codeBody.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
  (lines || []).forEach(ln => { const el = codeBody.querySelector(`[data-line="${ln}"]`); if (el) el.classList.add('active'); });
  if (lines && lines.length > 0) { const f = codeBody.querySelector(`[data-line="${lines[0]}"]`); if (f) f.scrollIntoView({ block: 'nearest' }); }
}
function jumpToLine(ln) {
  if (steps.length === 0) return;
  let t = cur, b = Infinity;
  steps.forEach((s, i) => { if (s.highlightLines.includes(ln)) { const d = Math.abs(i - cur); if (d < b) { b = d; t = i; } } });
  cur = t; render();
}

function play() { if (cur >= steps.length - 1) cur = 0; playing = true; btnPlay.innerHTML = '⏸ 暂停'; tick(); }
function pause() { playing = false; clearTimeout(timer); btnPlay.innerHTML = '▶ 播放'; }
function tick() { if (!playing) return; if (cur < steps.length - 1) { cur++; render(); timer = setTimeout(tick, SPEED[parseInt(speedRange.value) - 1]); } else pause(); }

btnPlay.addEventListener('click', () => playing ? pause() : play());
btnPrev.addEventListener('click', () => { pause(); if (cur > 0) { cur--; render(); } });
btnNext.addEventListener('click', () => { pause(); if (cur < steps.length - 1) { cur++; render(); } });
btnReset.addEventListener('click', () => { pause(); heapData = [80, 60, 70, 30, 40, 50, 20]; steps = []; cur = 0; render(); });

buildCode();
// Initialize with build-heap demo
const initRes = generateBuildSteps([45, 20, 65, 10, 30, 55, 80]);
steps = initRes.steps;
heapData = initRes.finalData;
render();
</script>
