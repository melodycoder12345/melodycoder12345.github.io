  js: `function heapSort(arr) {

def heapify(arr, n, i):

    left = 2 * i + 1
    right = 2 * i + 2

};

function generateSteps(initArr) {
  const steps = [];
  const a = [...initArr];
  const n = a.length;
  let cmps = 0, swps = 0;

  function push(arr, comparing, swapping, sorted, heapTop, phase, highlightLines, description) {
    steps.push({
      arr: [...arr],
      comparing: [...comparing],
      swapping: [...swapping],
      sorted: [...sorted],
      heapTop: heapTop,
      phase,
      highlightLines: [...highlightLines],
      description,
      cmps,
      swps
    });
  }

  // Initial state
  push(a, [], [], [], -1, 'init', [29, 30], '初始数组，准备堆排序');
  push(a, [], [], [], -1, 'init', [4, 5], '调用 heapSort，n = ' + n);

  // ── Phase 1: BuildHeap ──
  push(a, [], [], [], -1, 'build', [6, 7], '阶段一：建最大堆，从最后一个非叶节点开始');

  for (let i = Math.floor(n / 2) - 1; i >= 0; i--) {
    push(a, [], [], [], i, 'build', [7, 8], `建堆阶段：对节点 ${i}（值=${a[i]}）执行 siftDown`);

    // siftDown(a, i, n)
    let cur = i;
    push(a, [], [], [], cur, 'build', [17, 18, 19], `siftDown 开始：节点 ${cur}，largest = ${cur}`);
    while (true) {
      let largest = cur;
      const l = 2 * cur + 1;
      const r = 2 * cur + 2;

      push(a, [], [], [], cur, 'build', [20], `计算子节点：l=${l}, r=${r}`);

      if (l < n) {
        cmps++;
        push(a, [l, largest], [], [], cur, 'build', [21], `比较 arr[${l}]=${a[l]} 和 arr[${largest}]=${a[largest]}`);
        if (a[l] > a[largest]) {
          largest = l;
          push(a, [l], [], [], cur, 'build', [21], `arr[${l}]=${a[l]} 更大，largest = ${l}`);
        }
      }
      if (r < n) {
        cmps++;
        push(a, [r, largest], [], [], cur, 'build', [22], `比较 arr[${r}]=${a[r]} 和 arr[${largest}]=${a[largest]}`);
        if (a[r] > a[largest]) {
          largest = r;
          push(a, [r], [], [], cur, 'build', [22], `arr[${r}]=${a[r]} 更大，largest = ${r}`);
        }
      }

      push(a, [], [], [], cur, 'build', [23], `largest=${largest}，${largest === cur ? '等于 i，堆性质满足，break' : '不等于 i，需要交换'}`);
      if (largest === cur) break;

      // swap
      [a[cur], a[largest]] = [a[largest], a[cur]];
      swps++;
      push(a, [], [cur, largest], [], cur, 'build', [24], `交换 arr[${cur}]↔arr[${largest}]`);
      push(a, [], [], [], largest, 'build', [25], `i = ${largest}，继续向下检查`);
      cur = largest;
    }
    push(a, [], [], [], -1, 'build', [9], `节点 ${i} 的 siftDown 完成`);
  }

  push(a, [], [], [], 0, 'build', [9], '建堆完成！堆顶 arr[0]=' + a[0] + ' 是最大值');

  // ── Phase 2: HeapSort ──
  push(a, [], [], [], 0, 'sort', [10, 11], '阶段二：反复取出堆顶放到末尾');

  const sorted = [];

  for (let i = n - 1; i > 0; i--) {
    // swap arr[0] and arr[i]
    push(a, [], [], [...sorted], 0, 'sort', [11, 12], `将堆顶 arr[0]=${a[0]} 与 arr[${i}]=${a[i]} 交换`);
    [a[0], a[i]] = [a[i], a[0]];
    swps++;
    sorted.unshift(i);
    push(a, [], [0, i], [...sorted], -1, 'sort', [12], `arr[${i}]=${a[i]} 已就位`);

    if (i > 1) {
      push(a, [], [], [...sorted], 0, 'sort', [13], `对缩小后的堆（大小=${i}）执行 siftDown`);

      // siftDown(a, 0, i)
      let cur = 0;
      push(a, [], [], [...sorted], cur, 'sort', [17, 18, 19], `siftDown 开始：节点 ${cur}`);
      while (true) {
        let largest = cur;
        const l = 2 * cur + 1;
        const r = 2 * cur + 2;

        push(a, [], [], [...sorted], cur, 'sort', [20], `计算子节点：l=${l}, r=${r}`);

        if (l < i) {
          cmps++;
          push(a, [l, largest], [], [...sorted], cur, 'sort', [21], `比较 arr[${l}]=${a[l]} 和 arr[${largest}]=${a[largest]}`);
          if (a[l] > a[largest]) {
            largest = l;
            push(a, [l], [], [...sorted], cur, 'sort', [21], `arr[${l}]=${a[l]} 更大，largest = ${l}`);
          }
        }
        if (r < i) {
          cmps++;
          push(a, [r, largest], [], [...sorted], cur, 'sort', [22], `比较 arr[${r}]=${a[r]} 和 arr[${largest}]=${a[largest]}`);
          if (a[r] > a[largest]) {
            largest = r;
            push(a, [r], [], [...sorted], cur, 'sort', [22], `arr[${r}]=${a[r]} 更大，largest = ${r}`);
          }
        }

        push(a, [], [], [...sorted], cur, 'sort', [23], `largest=${largest}，${largest === cur ? '等于 i，堆性质满足，break' : '不等于 i，需要交换'}`);
        if (largest === cur) break;

        [a[cur], a[largest]] = [a[largest], a[cur]];
        swps++;
        push(a, [], [cur, largest], [...sorted], cur, 'sort', [24], `交换 arr[${cur}]↔arr[${largest}]`);
        push(a, [], [], [...sorted], largest, 'sort', [25], `i = ${largest}，继续向下检查`);
        cur = largest;
      }
      push(a, [], [], [...sorted], 0, 'sort', [14], `siftDown 完成，新堆顶 arr[0]=${a[0]}`);
    }
  }

  sorted.unshift(0);
  push(a, [], [], [...sorted], -1, 'sort', [31, 32, 33], '堆排序完成！');
  return steps;
}

const INITIAL = [64, 34, 25, 12, 22, 11, 90];
const MAX_VAL = Math.max(...INITIAL);
let steps = generateSteps(INITIAL);
let cur = 0, playing = false, timer = null;
const SPEED = [2000, 1200, 700, 350, 120];

const vizArea = document.getElementById('vizArea'),
  codeBody = document.getElementById('codeBody'),
  descText = document.getElementById('descText'),
  stepCounter = document.getElementById('stepCounter'),
  cmpCount = document.getElementById('cmpCount'),
  swpCount = document.getElementById('swpCount'),
  btnPlay = document.getElementById('btnPlay'),
  btnPrev = document.getElementById('btnPrev'),
  btnNext = document.getElementById('btnNext'),
  btnReset = document.getElementById('btnReset'),
  speedRange = document.getElementById('speedRange'),
  speedVal = document.getElementById('speedVal');
const SPEED_LABELS = ['慢','较慢','中','较快','快'];
function updateSpeedLabel() { speedVal.textContent = SPEED_LABELS[parseInt(speedRange.value) - 1]; }
speedRange.addEventListener('input', updateSpeedLabel);
updateSpeedLabel();

function buildCode() {
  codeBody.innerHTML = CODE_LINES.map((l, i) =>
    `<div class="code-line" data-line="${i}"><span class="ln">${i + 1}</span><span class="lc">${l.html || '&nbsp;'}</span></div>`
  ).join('');
  codeBody.querySelectorAll('.code-line').forEach(el =>
    el.addEventListener('click', () => jumpToLine(parseInt(el.dataset.line)))
  );
}

function highlightLines(lines) {
  codeBody.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
  lines.forEach(ln => {
    const el = codeBody.querySelector(`[data-line="${ln}"]`);
    if (el) el.classList.add('active');
  });
  if (lines.length > 0) {
    const f = codeBody.querySelector(`[data-line="${lines[0]}"]`);
    if (f) f.scrollIntoView({ block: 'nearest' });
  }
}

function jumpToLine(ln) {
  let t = cur, b = Infinity;
  steps.forEach((s, i) => {
    if (s.highlightLines.includes(ln)) {
      const d = Math.abs(i - cur);
      if (d < b) { b = d; t = i; }
    }
  });
  cur = t;
  render();
}

function renderCode() {
  const lines = (LangSwitcher.current !== 'go' && LangSwitcher.getLines(LangSwitcher.current))
    || CODE_LINES;
  const hl = LangSwitcher.getHL(steps[cur]);
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i) ? ' active' : '';
    return `<div class="code-line${active}" onclick="jumpToLine(${i})">${line.html || '&nbsp;'}</div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}

function buildBars(n) {
  vizArea.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const w = document.createElement('div');
    w.className = 'bar-wrap';
    const b = document.createElement('div');
    b.className = 'bar';
    const v = document.createElement('div');
    v.className = 'bar-val';
    b.appendChild(v);
    const l = document.createElement('div');
    l.className = 'bar-label';
    w.appendChild(b);
    w.appendChild(l);
    vizArea.appendChild(w);
  }
}

function render() {
  const s = steps[cur];
  if (vizArea.children.length !== s.arr.length) buildBars(s.arr.length);
  vizArea.querySelectorAll('.bar-wrap').forEach((wrap, i) => {
    const bar = wrap.querySelector('.bar'), lbl = wrap.querySelector('.bar-label');
    bar.style.height = `${Math.max(s.arr[i] / MAX_VAL * 100, 6).toFixed(1)}%`;
    bar.querySelector('.bar-val').textContent = s.arr[i];
    lbl.textContent = i;
    let color = '#38bdf8';
    if (s.sorted.includes(i)) color = '#4ade80';
    if (i === s.heapTop && s.heapTop >= 0) color = '#f87171';
    if (s.swapping.includes(i)) color = '#fb923c';
    if (s.comparing.includes(i)) color = '#fbbf24';
    bar.style.background = color;
    bar.style.boxShadow = (s.comparing.includes(i) || s.swapping.includes(i) || i === s.heapTop)
      ? `0 0 12px ${color}88` : 'none';
    const valEl = bar.querySelector('.bar-val');
    const isActive = s.comparing.includes(i) || s.swapping.includes(i) || i === s.heapTop;
    valEl.style.fontSize = isActive ? '0.95rem' : '0.82rem';
    valEl.style.fontWeight = isActive ? '900' : '700';
  });
  renderCode();
  descText.textContent = s.description;
  stepCounter.textContent = `${cur + 1} / ${steps.length}`;
  cmpCount.textContent = s.cmps;
  swpCount.textContent = s.swps;
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;
}

function play() { if (cur >= steps.length - 1) cur = 0; playing = true; btnPlay.innerHTML = '⏸ 暂停'; tick(); }
function pause() { playing = false; clearTimeout(timer); btnPlay.innerHTML = '▶ 播放'; }
function tick() {
  if (!playing) return;
  if (cur < steps.length - 1) { cur++; render(); timer = setTimeout(tick, SPEED[parseInt(speedRange.value) - 1]); }
  else pause();
}

btnPlay.addEventListener('click', () => playing ? pause() : play());
btnPrev.addEventListener('click', () => { pause(); if (cur > 0) { cur--; render(); } });
btnNext.addEventListener('click', () => { pause(); if (cur < steps.length - 1) { cur++; render(); } });
btnReset.addEventListener('click', () => { pause(); cur = 0; render(); });

buildCode();
buildBars(INITIAL.length);
LangSwitcher.init(renderCode);
render();
setTimeout(function(){
  var p=document.getElementById('__autoConcept');if(!p)return;
  var d=document.createElement('div');
  d.innerHTML='<div class="cp-divider" style="margin:6px 0 0"></div>'+
    '<div class="cp-section"><div class="cp-title">算法原理</div>'+
    '<div class="cp-desc">两阶段：① 建最大堆（所有父节点 ≥ 子节点）；② 反复将堆顶（最大值）与末尾交换，缩小堆范围后重新堆化，直到堆为空。</div></div>'+
    '<div class="cp-divider"></div>'+
    '<div class="cp-section"><div class="cp-title">复杂度</div>'+
    '<table class="cp-table"><tr><td>最好时间</td><td>O(n log n)</td></tr><tr><td>平均时间</td><td>O(n log n)</td></tr><tr><td>最坏时间</td><td>O(n log n)</td></tr><tr><td>空间</td><td>O(1)</td></tr><tr><td>稳定性</td><td><span class="cp-tag unstable">不稳定</span></td></tr></table></div>'+
    '<div class="cp-divider"></div>'+
    '<div class="cp-section" style="padding-bottom:14px"><div class="cp-title">关键特性</div>'+
    '<ul class="cp-list"><li><strong>性能稳定</strong>：最坏情况仍是 O(n log n)，不受数据分布影响</li><li><strong>原地排序</strong>：O(1) 额外空间，优于归并排序</li><li><strong>实际较慢</strong>：访问模式缓存不友好，常数因子大于快速排序</li><li>堆数据结构还用于实现优先队列、任务调度等</li></ul></div>';
  p.querySelectorAll('.sn-auto-concept-h,.sn-auto-card').forEach(function(el){el.remove();});
  p.appendChild(d);
},250);
</script>
</body>
