// ─── Code ─────────────────────────────────────────────────────────
const CODE = [
  {h:`<span class="kw">type</span> Color <span class="kw">bool</span>`},                                         // 0
  {h:`<span class="kw">const</span> (Red Color = <span class="kw">true</span>; Black Color = <span class="kw">false</span>)`},  // 1
  {h:``},                                                                           // 2
  {h:`<span class="kw">type</span> Node <span class="kw">struct</span> {`},                                         // 3
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;Key   <span class="kw">int</span>`},                                              // 4
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;Color Color`},                                                        // 5
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;Left, Right, Parent *Node`},                                          // 6
  {h:`}`},                                                                          // 7
  {h:``},                                                                           // 8
  {h:`<span class="kw">func</span> (t *RBTree) <span class="fn">insert</span>(key <span class="kw">int</span>) {`},         // 9
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// 1. BST 插入，新节点着红色</span>`},                    // 10
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;n := &Node{Key: key, Color: Red}`},                               // 11
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;t.<span class="fn">bstInsert</span>(n)`},                                    // 12
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// 2. 修复红黑树性质</span>`},                            // 13
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;t.<span class="fn">fixInsert</span>(n)`},                                   // 14
  {h:`}`},                                                                          // 15
  {h:``},                                                                           // 16
  {h:`<span class="kw">func</span> (t *RBTree) <span class="fn">fixInsert</span>(n *Node) {`},          // 17
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> n.Parent != <span class="kw">nil</span> && n.Parent.Color == Red {`}, // 18
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;uncle := n.Parent.Parent.Right`},                  // 19
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> uncle != <span class="kw">nil</span> && uncle.Color == Red {`}, // 20
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// Case 1: 叔叔红色 → 颜色翻转</span>`}, // 21
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;n.Parent.Color = Black`},              // 22
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;uncle.Color = Black`},                 // 23
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;n.Parent.Parent.Color = Red`},         // 24
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;n = n.Parent.Parent`},                // 25
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;} <span class="kw">else</span> {`},                          // 26
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> n == n.Parent.Right {`},     // 27
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// Case 2: LR → 先左旋变LL</span>`}, // 28
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;n = n.Parent`},                  // 29
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;t.<span class="fn">leftRotate</span>(n)`},      // 30
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},                             // 31
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// Case 3: LL → 右旋+颜色翻转</span>`},// 32
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;n.Parent.Color = Black`},              // 33
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;n.Parent.Parent.Color = Red`},         // 34
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;t.<span class="fn">rightRotate</span>(n.Parent.Parent)`},  // 35
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},                                // 36
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;}`},                                    // 37
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;t.root.Color = Black`},                   // 38
  {h:`}`},                                                                          // 39
  {h:``},                                                                           // 40
  {h:`<span class="kw">func</span> (t *RBTree) <span class="fn">leftRotate</span>(x *Node) {`},        // 41
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;y := x.Right`},                                        // 42
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;x.Right = y.Left`},                                    // 43
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> y.Left != <span class="kw">nil</span> { y.Left.Parent = x }`}, // 44
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;y.Parent = x.Parent`},                                // 45
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// ... link y to x's parent</span>`},             // 46
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;y.Left = x; x.Parent = y`},                            // 47
  {h:`}`},                                                                          // 48
];

// ─── Scene data ───────────────────────────────────────────────────
// Node: {id, key, color:'R'|'B', x, y}
// Edge: [from_id, to_id]
// Step: {nodes, edges, hl, dimHL, desc, code, caseLabel}

function n(id, key, color, x, y) { return {id, key, color, x, y}; }

// Positions for the 7-node tree
const NP = { // name → [x, y]
  r15:[290,45], r10:[155,135], r20:[425,135],
  r8:[82,225],  r12:[228,225], r18:[355,225], r25:[498,225],
  r7:[38,310],  r9:[126,310],  r11:[184,310], r13:[272,310]
};

      { nodes:[n('a',10,'B',290,50),n('b',5,'R',155,140),n('c',15,'R',425,140),n('d',3,'R',80,230)],
        edges:[['a','b'],['a','c'],['b','d']], hl:['d'], desc:'插入 3：BST 插入为红色节点，作为 5 的左子节点', code:[9,10,11,12], caseLabel:'BST Insert' },
      { nodes:[n('a',10,'B',290,50),n('b',5,'R',155,140),n('c',15,'R',425,140),n('d',3,'R',80,230)],
        edges:[['a','b'],['a','c'],['b','d']], hl:['d','b','c'], desc:'违规！3(R)→5(R) 连续红色。父节点 5 是红色，叔叔节点 15 也是红色 → Case 1：颜色翻转', code:[17,18,19,20], caseLabel:'Case 1 触发' },
      { nodes:[n('a',10,'R',290,50),n('b',5,'B',155,140),n('c',15,'B',425,140),n('d',3,'R',80,230)],
        edges:[['a','b'],['a','c'],['b','d']], hl:['a','b','c'], desc:'Case 1：父节点 5→黑，叔叔 15→黑，祖父 10→红。颜色翻转使两个子树黑色节点数相同', code:[21,22,23,24,25], caseLabel:'Case 1：颜色翻转' },
      { nodes:[n('a',10,'B',290,50),n('b',5,'B',155,140),n('c',15,'B',425,140),n('d',3,'R',80,230)],
        edges:[['a','b'],['a','c'],['b','d']], hl:['a'], desc:'根节点必须是黑色！10 是根节点，强制改回黑色。树恢复平衡', code:[38], caseLabel:'根节点→黑' },
      { nodes:[n('a',10,'B',290,50),n('b',5,'B',155,140),n('c',15,'B',425,140),n('d',3,'R',80,230),n('e',7,'R',230,230)],
        edges:[['a','b'],['a','c'],['b','d'],['b','e']], hl:['e'], desc:'插入 7 (BST 插入为红色，作为 5 的右子节点)。父节点 5(B) 是黑色 → 无违规，无需修复', code:[9,11,12,14], caseLabel:'无违规 ✓' },
      { nodes:[n('a',10,'B',290,50),n('b',5,'B',155,140),n('c',15,'B',425,140),n('d',3,'R',80,230),n('e',7,'R',230,230),n('f',6,'R',175,310)],
        edges:[['a','b'],['a','c'],['b','d'],['b','e'],['e','f']], hl:['f','e'], desc:'插入 6 (6 是 7(R) 的左子节点)。父节点 7(R) 是红色！叔叔=3(R) 也是红色 → Case 1 (LR方向)', code:[17,18,20], caseLabel:'Case 1 触发' },
      { nodes:[n('a',10,'B',290,50),n('b',5,'R',155,140),n('c',15,'B',425,140),n('d',3,'B',80,230),n('e',7,'B',230,230),n('f',6,'R',175,310)],
        edges:[['a','b'],['a','c'],['b','d'],['b','e'],['e','f']], hl:['b','d','e'], desc:'Case 1：3→黑，7→黑，5→红。检查 5：父节点 10(B) 是黑色，无需继续修复。树平衡 ✓', code:[22,23,24,25,37,38], caseLabel:'Case 1：颜色翻转' },
    ]
  },
  {

    steps: [
      { nodes:[n('a',15,'B',290,45),n('b',10,'R',155,135),n('c',20,'R',425,135),n('d',8,'B',82,225),n('e',12,'B',228,225),n('f',18,'B',355,225),n('g',25,'B',498,225)],
        edges:[['a','b'],['a','c'],['b','d'],['b','e'],['c','f'],['c','g']], hl:[], desc:'查找目标值 18。从根节点 15 开始', code:[9,10], caseLabel:'SEARCH 18' },
      { nodes:[n('a',15,'B',290,45),n('b',10,'R',155,135),n('c',20,'R',425,135),n('d',8,'B',82,225),n('e',12,'B',228,225),n('f',18,'B',355,225),n('g',25,'B',498,225)],

      { nodes:[n('a',15,'B',290,45),n('b',10,'R',155,135),n('c',20,'R',425,135),n('d',8,'B',82,225),n('e',12,'B',228,225),n('f',18,'B',355,225),n('g',25,'B',498,225)],
        edges:[['a','b'],['a','c'],['b','d'],['b','e'],['c','f'],['c','g']], hl:['a','c'], desc:'访问节点 20。18 < 20，向左子树继续搜索', code:[], caseLabel:'20 → 左' },

        edges:[['a','b'],['a','c'],['b','d'],['b','e'],['c','f'],['c','g']], hl:[], desc:'删除操作目标：删除 10(R)。10 有两个子节点 8 和 12', code:[], caseLabel:'DELETE 10' },
      { nodes:[n('a',15,'B',290,45),n('b',10,'R',155,135),n('c',20,'R',425,135),n('d',8,'B',82,225),n('e',12,'B',228,225),n('f',18,'B',355,225),n('g',25,'B',498,225)],
        edges:[['a','b'],['a','c'],['b','d'],['b','e'],['c','f'],['c','g']], hl:['b','e'], desc:'双子节点删除策略：找 10 的中序后继节点（右子树最小值）= 12。将 12 的 key 复制到 10 的位置', code:[], caseLabel:'找中序后继 12' },
      { nodes:[n('a',15,'B',290,45),n('b',12,'R',155,135),n('c',20,'R',425,135),n('d',8,'B',82,225),n('e',12,'B',228,225),n('f',18,'B',355,225),n('g',25,'B',498,225)],
        edges:[['a','b'],['a','c'],['b','d'],['b','e'],['c','f'],['c','g']], hl:['b','e'], desc:'10 位置替换为 12（key 值复制）。现在真正要删除的是原来的 12(B) 节点（黑色无子节点）', code:[], caseLabel:'复制 key 值' },
      { nodes:[n('a',15,'B',290,45),n('b',12,'R',155,135),n('c',20,'R',425,135),n('d',8,'B',82,225),n('f',18,'B',355,225),n('g',25,'B',498,225)],
        edges:[['a','b'],['a','c'],['b','d'],['c','f'],['c','g']], hl:['b'], desc:'移除原 12(B) 节点（黑色叶节点）。删除黑色节点会破坏"黑高"，需要修复', code:[], caseLabel:'移除黑色节点' },
      { nodes:[n('a',15,'B',290,45),n('b',12,'R',155,135),n('c',20,'R',425,135),n('d',8,'B',82,225),n('f',18,'B',355,225),n('g',25,'B',498,225)],
        edges:[['a','b'],['a','c'],['b','d'],['c','f'],['c','g']], hl:['b','d'], desc:'兄弟节点 8(B) 是黑色且无红色子节点。父节点 12(R) 变黑，兄弟 8 变红，恢复黑高平衡', code:[], caseLabel:'修复黑高' },
      { nodes:[n('a',15,'B',290,45),n('b',12,'B',155,135),n('c',20,'R',425,135),n('d',8,'R',82,225),n('f',18,'B',355,225),n('g',25,'B',498,225)],
        edges:[['a','b'],['a','c'],['b','d'],['c','f'],['c','g']], hl:[], desc:'删除完成！12(B) 为黑色，8(R) 为红色。各路径黑高一致，所有红黑树性质满足 ✓', code:[], caseLabel:'删除完成 ✓' },
    ]
  }
];

const SPEED = [900, 600, 380, 220, 100];
let curScene = 0, curStep = 0, playing = false, timer = null;

// ─── SVG rendering ────────────────────────────────────────────────
const NODE_R = 19;
const SVG_NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

function nodeById(nodes, id) { return nodes.find(n => n.id === id); }

function drawEdge(svg, nodes, [fid, tid], hlSet, phase) {
  const f = nodeById(nodes, fid), t = nodeById(nodes, tid);
  if (!f || !t) return;
  const dx = t.x - f.x, dy = t.y - f.y, len = Math.sqrt(dx*dx+dy*dy);
  const sx = f.x + dx/len*NODE_R, sy = f.y + dy/len*NODE_R;
  const ex = t.x - dx/len*(NODE_R+2), ey = t.y - dy/len*(NODE_R+2);
  const isHL = hlSet.includes(fid) && hlSet.includes(tid);
  const line = el('line', {x1:sx,y1:sy,x2:ex,y2:ey,
    stroke: isHL ? '#38bdf8' : '#475569', 'stroke-width': isHL ? '2' : '1.5',
    'stroke-linecap': 'round'
  });
  svg.appendChild(line);
}

function drawNode(svg, node, isHL, isPhase) {
  const g = el('g', {});
  // Drop shadow if highlighted
  if (isHL) {
    const sh = el('circle', {cx:node.x, cy:node.y, r:NODE_R+4,
      fill: node.color==='R' ? 'rgba(239,68,68,.2)' : 'rgba(56,189,248,.15)'
    });
    g.appendChild(sh);
  }
  // Main circle
  const fill = node.color==='R'
    ? (isHL ? '#991b1b' : '#7f1d1d')
    : (isHL ? '#1e3a5f' : '#1e293b');
  const stroke = node.color==='R'
    ? (isHL ? '#f87171' : '#ef4444')
    : (isHL ? '#38bdf8' : '#64748b');
  const circle = el('circle', {cx:node.x, cy:node.y, r:NODE_R,
    fill, stroke, 'stroke-width':'2.5'
  });
  g.appendChild(circle);
  // Key label
  const txt = el('text', {x:node.x, y:node.y+5, 'text-anchor':'middle',
    'font-size':'12', 'font-weight':'700', 'font-family':'monospace',
    fill: isHL ? '#fff' : '#e2e8f0'
  });
  txt.textContent = node.key;
  g.appendChild(txt);
  // Color label (R/B)
  const clabel = el('text', {x:node.x, y:node.y-NODE_R-4, 'text-anchor':'middle',
    'font-size':'8', 'font-family':'monospace',
    fill: node.color==='R' ? '#f87171' : '#94a3b8'
  });
  clabel.textContent = node.color==='R' ? 'R' : 'B';
  g.appendChild(clabel);
  svg.appendChild(g);
}

// ─── Render ───────────────────────────────────────────────────────
function render() {
  const scene = SCENES[curScene];
  const step = scene.steps[curStep];
  const svg = document.getElementById('rbtSvg');
  svg.innerHTML = '';

  // Draw edges first
  step.edges.forEach(e => drawEdge(svg, step.nodes, e, step.hl));

  // Draw nodes
  step.nodes.forEach(n => drawNode(svg, n, step.hl.includes(n.id)));

  // Case badge
  const badge = document.getElementById('caseBadge');
  if (step.caseLabel) {
    badge.style.display = '';
    badge.textContent = step.caseLabel;
    if (step.caseLabel.includes('Case 1')) {
      badge.style.background = 'rgba(251,191,36,.15)'; badge.style.color = '#fbbf24';
    } else if (step.caseLabel.includes('Case 2') || step.caseLabel.includes('Case 3')) {
      badge.style.background = 'rgba(192,132,252,.15)'; badge.style.color = '#c084fc';
    } else if (step.caseLabel.includes('✓')) {
      badge.style.background = 'rgba(74,222,128,.15)'; badge.style.color = '#4ade80';
    } else if (step.caseLabel.includes('违规')) {
      badge.style.background = 'rgba(248,113,113,.15)'; badge.style.color = '#f87171';
    } else {
      badge.style.background = 'rgba(56,189,248,.1)'; badge.style.color = '#38bdf8';
    }
  } else {
    badge.style.display = 'none';
  }

  // Code
  document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
  step.code.forEach(ln => {
    const el2 = document.querySelector(`.code-line[data-ln="${ln}"]`);
    if (el2) { el2.classList.add('active'); el2.scrollIntoView({block:'nearest'}); }
  });

  document.getElementById('stepDesc').textContent = step.desc;
  document.getElementById('stepCtr').textContent = `${curStep+1} / ${scene.steps.length}`;
  document.getElementById('btnPlay').disabled = false;
  buildStepList();
}

function buildStepList() {
  const scene = SCENES[curScene];
  document.getElementById('stepList').innerHTML = scene.steps.map((s,i) =>
    `<div class="step-item${i===curStep?' active':''}" onclick="goStep(${i})">
      <div class="step-num">步骤 ${i+1}</div>
      <div class="step-text">${s.desc.slice(0,55)}${s.desc.length>55?'…':''}</div>
    </div>`
  ).join('');
}

function buildCode() {
  document.getElementById('codeBody').innerHTML = CODE.map((l,i) =>
    `<div class="code-line" data-ln="${i}"><span class="ln">${i+1}</span><span class="lc">${l.h||'&nbsp;'}</span></div>`
  ).join('');
}

// ─── Controls ─────────────────────────────────────────────────────
function switchScene(idx) {
  curScene = idx; curStep = 0; pause();
  document.querySelectorAll('.scene-tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  buildStepList(); render();
}
function goStep(i) { pause(); curStep = i; render(); }
function reset() { pause(); curStep = 0; render(); }
function prev() { pause(); if (curStep > 0) { curStep--; render(); } }
function next() { pause(); if (curStep < SCENES[curScene].steps.length-1) { curStep++; render(); } }
function togglePlay() { if (playing) pause(); else { if (curStep >= SCENES[curScene].steps.length-1) curStep=0; play(); } }
function play() { playing=true; document.getElementById('btnPlay').textContent='⏸ 暂停'; tick(); }
function pause() { playing=false; clearTimeout(timer); document.getElementById('btnPlay').textContent='▶ 播放'; }
function tick() {
  if (!playing) return;
  const spd = SPEED[parseInt(document.getElementById('speedRange').value)-1];
  if (curStep < SCENES[curScene].steps.length-1) { curStep++; render(); timer=setTimeout(tick,spd); }
  else pause();
}

buildCode(); buildStepList(); render();
</script>
