  .stat{font-size:0.74rem;}

}

<body>
<nav>

  <h1>插入排序 Insertion Sort</h1>
  <div class="complexity"><span class="badge time">时间 O(n²)</span><span class="badge space">空间 O(1)</span></div>
</nav>
<div class="main">
  <div class="viz-panel">
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:#4ade80"></div>已排序区</div>
      <div class="leg"><div class="leg-dot" style="background:#c084fc"></div>当前 key</div>
      <div class="leg"><div class="leg-dot" style="background:#fbbf24"></div>比较中</div>
      <div class="leg"><div class="leg-dot" style="background:#fb923c"></div>后移中</div>
    </div>
    <div class="viz-area" id="vizArea"></div>
  </div>
  <div class="code-panel">
    <div class="code-panel-header">
      <div class="code-dot" style="background:#ff5f57"></div>
      <div class="code-dot" style="background:#febc2e"></div>
      <div class="code-dot" style="background:#28c840"></div>
      <span style="margin-left:4px" data-base="insertion_sort">insertion_sort.go</span>
    </div>
    <div class="code-body" id="codeBody"></div>
  </div>
</div>
<div class="controls">
  <button class="btn" id="btnReset">⏮ 重置</button>
  <button class="btn" id="btnPrev">◀ 上一步</button>
  <button class="btn primary" id="btnPlay">▶ 播放</button>
  <button class="btn" id="btnNext">下一步 ▶</button>
  <div class="desc-box">
    <span id="descText">点击播放开始演示</span>
    <div class="stats">
      <div class="stat">比较 <span id="cmpCount">0</span></div>
      <div class="stat">移动 <span id="swpCount">0</span></div>
    </div>
    <span class="step-counter" id="stepCounter">0 / 0</span>
  </div>
  <div class="speed-wrap">
    <span class="speed-label">速度</span>
    <span>慢</span>
    <input type="range" id="speedRange" min="1" max="5" value="2">
    <span>快</span>
    <span class="speed-val" id="speedVal">慢</span>
  </div>
</div>
<script>
const CODE_LINES = [
  {html:`<span class="kw">package</span> <span class="pkg">main</span>`},
  {html:``},
  {html:`<span class="kw">import</span> <span class="st">"fmt"</span>`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">insertionSort</span>(arr []<span class="kw">int</span>) {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;n := <span class="fn">len</span>(arr)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> i := <span class="num">1</span>; i &lt; n; i<span class="op">++</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;key := arr[i]`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;j := i <span class="op">-</span> <span class="num">1</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> j &gt;= <span class="num">0</span> &amp;&amp; arr[j] &gt; key {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;arr[j<span class="op">+</span><span class="num">1</span>] = arr[j]`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;j<span class="op">--</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;arr[j<span class="op">+</span><span class="num">1</span>] = key`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">main</span>() {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;arr := []<span class="kw">int</span>{<span class="num">64</span>, <span class="num">34</span>, <span class="num">25</span>, <span class="num">12</span>, <span class="num">22</span>, <span class="num">11</span>, <span class="num">90</span>}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">insertionSort</span>(arr)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">fmt</span>.<span class="fn">Println</span>(arr)`},
  {html:`}`},
];

window.LANG_PLAIN = {
  js: `function insertionSort(arr) {
    const n = arr.length;
    for (let i = 1; i < n; i++) {
        const key = arr[i];
        let j = i - 1;
        while (j >= 0 && arr[j] > key) {
            arr[j + 1] = arr[j];
            j--;
        }
        arr[j + 1] = key;
    }
}

const arr = [12, 11, 13, 5, 6];
insertionSort(arr);
console.log(arr);`,
  py: `def insertion_sort(arr):
    n = len(arr)
    for i in range(1, n):
        key = arr[i]
        j = i - 1
        while j >= 0 and arr[j] > key:
            arr[j + 1] = arr[j]
            j -= 1
        arr[j + 1] = key

arr = [12, 11, 13, 5, 6]
insertion_sort(arr)
print(arr)`
};

function generateSteps(arr){
  const steps=[];const a=[...arr];const n=a.length;let cmps=0,moves=0;
  steps.push({arr:[...a],key:-1,current:-1,comparing:[],shifting:[],sorted:[0],highlightLines:[18],description:'初始数组，arr[0] 已就位',cmps,moves});
  for(let i=1;i<n;i++){
    const key=a[i];
    steps.push({arr:[...a],key,current:i,comparing:[],shifting:[],sorted:Array.from({length:i},(_,k)=>k),highlightLines:[6,7,8],description:`取出 key=${key}，准备插入到已排序区`,cmps,moves});
    let j=i-1;
    while(j>=0&&a[j]>key){
      cmps++;
      steps.push({arr:[...a],key,current:i,comparing:[j],shifting:[],sorted:Array.from({length:i},(_,k)=>k),highlightLines:[9],description:`arr[${j}]=${a[j]} > key=${key}，需要后移`,cmps,moves});
      a[j+1]=a[j];moves++;
      steps.push({arr:[...a],key,current:j+1,comparing:[],shifting:[j,j+1],sorted:Array.from({length:i},(_,k)=>k),highlightLines:[10,11],description:`arr[${j+1}] = arr[${j}] = ${a[j]}，元素后移`,cmps,moves});
      j--;
    }
    if(j>=0){cmps++;steps.push({arr:[...a],key,current:j+1,comparing:[j],shifting:[],sorted:Array.from({length:i},(_,k)=>k),highlightLines:[9],description:`arr[${j}]=${a[j]} <= key=${key}，停止`,cmps,moves});}
    a[j+1]=key;
    const sorted=Array.from({length:i+1},(_,k)=>k);
    steps.push({arr:[...a],key:-1,current:j+1,comparing:[],shifting:[],sorted,highlightLines:[13],description:`插入 key=${key} 到位置 ${j+1}`,cmps,moves});
  }
  steps.push({arr:[...a],key:-1,current:-1,comparing:[],shifting:[],sorted:Array.from({length:n},(_,k)=>k),highlightLines:[19,20,21],description:'排序完成！',cmps,moves});
  return steps;
}

const INITIAL=[64,34,25,12,22,11,90];const MAX_VAL=Math.max(...INITIAL);
let steps=generateSteps(INITIAL);let cur=0,playing=false,timer=null;const SPEED=[2000,1200,700,350,120];

const vizArea=document.getElementById('vizArea'),codeBody=document.getElementById('codeBody'),
  descText=document.getElementById('descText'),stepCounter=document.getElementById('stepCounter'),
  cmpCount=document.getElementById('cmpCount'),swpCount=document.getElementById('swpCount'),
  btnPlay=document.getElementById('btnPlay'),btnPrev=document.getElementById('btnPrev'),
  btnNext=document.getElementById('btnNext'),btnReset=document.getElementById('btnReset'),
  speedRange=document.getElementById('speedRange'),speedVal=document.getElementById('speedVal');
const SPEED_LABELS=['慢','较慢','中','较快','快'];
function updateSpeedLabel(){speedVal.textContent=SPEED_LABELS[parseInt(speedRange.value)-1];}
speedRange.addEventListener('input',updateSpeedLabel);
updateSpeedLabel();

function buildCode(){codeBody.innerHTML=CODE_LINES.map((l,i)=>`<div class="code-line" data-line="${i}"><span class="ln">${i+1}</span><span class="lc">${l.html||'&nbsp;'}</span></div>`).join('');codeBody.querySelectorAll('.code-line').forEach(el=>el.addEventListener('click',()=>jumpToLine(parseInt(el.dataset.line))));}
function highlightLines(lines){codeBody.querySelectorAll('.code-line').forEach(el=>el.classList.remove('active'));lines.forEach(ln=>{const el=codeBody.querySelector(`[data-line="${ln}"]`);if(el)el.classList.add('active');});if(lines.length>0){const f=codeBody.querySelector(`[data-line="${lines[0]}"]`);if(f)f.scrollIntoView({block:'nearest'});}}
function jumpToLine(ln){let t=cur,b=Infinity;steps.forEach((s,i)=>{if(s.highlightLines.includes(ln)){const d=Math.abs(i-cur);if(d<b){b=d;t=i;}}});cur=t;render();}
function renderCode() {
  const lines = (LangSwitcher.current !== 'go' && LangSwitcher.getLines(LangSwitcher.current))
    || CODE_LINES;
  const hl = LangSwitcher.getHL(steps[cur]);
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i) ? ' active' : '';
    return `<div class="code-line${active}" onclick="jumpToLine(${i})">${line.html || '&nbsp;'}</div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}
function buildBars(n){vizArea.innerHTML='';for(let i=0;i<n;i++){const w=document.createElement('div');w.className='bar-wrap';const b=document.createElement('div');b.className='bar';const v=document.createElement('div');v.className='bar-val';b.appendChild(v);const l=document.createElement('div');l.className='bar-label';w.appendChild(b);w.appendChild(l);vizArea.appendChild(w);}}
function render(){
  const s=steps[cur];if(vizArea.children.length!==s.arr.length)buildBars(s.arr.length);
  vizArea.querySelectorAll('.bar-wrap').forEach((wrap,i)=>{
    const bar=wrap.querySelector('.bar'),lbl=wrap.querySelector('.bar-label');
    bar.style.height=`${Math.max(s.arr[i]/MAX_VAL*100,6).toFixed(1)}%`;
    bar.querySelector('.bar-val').textContent=s.arr[i];lbl.textContent=i;
    let color='#38bdf8';
    if(s.sorted.includes(i))color='#4ade80';
    if(s.shifting.includes(i))color='#fb923c';
    if(s.comparing.includes(i))color='#fbbf24';
    if(i===s.current&&s.key>=0)color='#c084fc';
    bar.style.background=color;
    bar.style.boxShadow=(s.comparing.includes(i)||s.shifting.includes(i)||i===s.current)?`0 0 12px ${color}88`:'none';
    const valEl=bar.querySelector('.bar-val');
    const isActive=s.comparing.includes(i)||s.shifting.includes(i)||(i===s.current&&s.key>=0);
    valEl.style.fontSize=isActive?'0.95rem':'0.82rem';
    valEl.style.fontWeight=isActive?'900':'700';
  });
  renderCode();descText.textContent=s.description;
  stepCounter.textContent=`${cur+1} / ${steps.length}`;cmpCount.textContent=s.cmps;swpCount.textContent=s.moves;
  btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;
}
function play(){if(cur>=steps.length-1)cur=0;playing=true;btnPlay.innerHTML='⏸ 暂停';tick();}
function pause(){playing=false;clearTimeout(timer);btnPlay.innerHTML='▶ 播放';}
function tick(){if(!playing)return;if(cur<steps.length-1){cur++;render();timer=setTimeout(tick,SPEED[parseInt(speedRange.value)-1]);}else pause();}
btnPlay.addEventListener('click',()=>playing?pause():play());
btnPrev.addEventListener('click',()=>{pause();if(cur>0){cur--;render();}});
btnNext.addEventListener('click',()=>{pause();if(cur<steps.length-1){cur++;render();}});
btnReset.addEventListener('click',()=>{pause();cur=0;render();});
buildCode();buildBars(INITIAL.length);LangSwitcher.init(renderCode);render();
setTimeout(function(){
  var p=document.getElementById('__autoConcept');if(!p)return;
  var d=document.createElement('div');
  d.innerHTML='<div class="cp-divider" style="margin:6px 0 0"></div>'+
    '<div class="cp-section"><div class="cp-title">算法原理</div>'+
    '<div class="cp-desc">维护已排序前缀，逐一取出新元素，向左找到合适位置后插入。类似整理扑克牌——将每张牌插到已排序手牌的正确位置。</div></div>'+
    '<div class="cp-divider"></div>'+
    '<div class="cp-section"><div class="cp-title">复杂度</div>'+
    '<table class="cp-table"><tr><td>最好时间</td><td>O(n)</td></tr><tr><td>平均时间</td><td>O(n²)</td></tr><tr><td>最坏时间</td><td>O(n²)</td></tr><tr><td>空间</td><td>O(1)</td></tr><tr><td>稳定性</td><td><span class="cp-tag stable">稳定</span></td></tr></table></div>'+
    '<div class="cp-divider"></div>'+
    '<div class="cp-section" style="padding-bottom:14px"><div class="cp-title">关键特性</div>'+
