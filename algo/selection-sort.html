<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选择排序 - 算法可视化</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--border:#334155;--text:#e2e8f0;--dim:#94a3b8;--blue:#38bdf8;--yellow:#fbbf24;--orange:#fb923c;--green:#4ade80;--purple:#c084fc;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
nav{display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.back-btn{color:var(--dim);text-decoration:none;font-size:0.9rem;}.back-btn:hover{color:var(--text);}
nav h1{font-size:1.2rem;font-weight:600;}.complexity{margin-left:auto;display:flex;gap:8px;}
.badge{font-size:0.75rem;padding:3px 10px;border-radius:100px;font-family:monospace;}
.badge.time{background:rgba(56,189,248,0.15);color:var(--blue);}.badge.space{background:rgba(196,132,252,0.15);color:var(--purple);}
.main{display:flex;flex:1;overflow:hidden;}
.viz-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;}
.viz-area{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:40px 40px 20px;position:relative;}
.bar-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;max-width:60px;}
.bar{width:100%;border-radius:4px 4px 0 0;transition:height 0.25s ease,background-color 0.2s ease;position:relative;}
.bar-label{font-size:0.75rem;font-family:monospace;color:var(--dim);}
.bar-val{font-size:0.7rem;font-family:monospace;color:var(--text);position:absolute;top:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;}
.desc-box{padding:12px 24px;background:rgba(255,255,255,0.03);border-top:1px solid var(--border);font-size:0.9rem;color:var(--dim);min-height:44px;display:flex;align-items:center;gap:12px;}
.step-counter{margin-left:auto;font-size:0.8rem;color:var(--dim);font-family:monospace;white-space:nowrap;}
.code-panel{width:45%;min-width:380px;display:flex;flex-direction:column;overflow:hidden;}
.code-panel-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:0.85rem;color:var(--dim);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.code-dot{width:10px;height:10px;border-radius:50%;}
.code-body{flex:1;overflow-y:auto;padding:16px 0;background:#0d1117;}
.code-body::-webkit-scrollbar{width:6px;}.code-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.code-line{display:flex;align-items:stretch;padding:1px 0;cursor:pointer;transition:background 0.15s;font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.6;}
.code-line:hover{background:rgba(255,255,255,0.04);}.code-line.active{background:rgba(251,191,36,0.12);}.code-line.active .ln{color:var(--yellow);}
.ln{min-width:48px;padding:0 12px 0 16px;color:#4b5563;text-align:right;user-select:none;flex-shrink:0;font-size:0.78rem;}
.lc{padding:0 16px 0 4px;flex:1;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.num{color:#79c0ff;}.pkg{color:#ffa657;}.op{color:#ff7b72;}.id{color:#e6edf3;}
.controls{display:flex;align-items:center;gap:10px;padding:12px 24px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.btn{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:7px;cursor:pointer;font-size:0.85rem;transition:all 0.15s;}
.btn:hover{background:rgba(255,255,255,0.12);}.btn.primary{background:rgba(56,189,248,0.15);border-color:rgba(56,189,248,0.3);color:var(--blue);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.speed-wrap{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:0.8rem;color:var(--dim);}
input[type=range]{-webkit-appearance:none;width:90px;height:4px;background:var(--border);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--blue);cursor:pointer;}
.stats{display:flex;gap:16px;padding:0 8px;}.stat{font-size:0.78rem;color:var(--dim);font-family:monospace;}.stat span{color:var(--text);font-weight:600;}
.legend{display:flex;gap:12px;padding:8px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:4px;font-size:0.72rem;color:var(--dim);}
.leg-dot{width:8px;height:8px;border-radius:2px;}

/* MOBILE_INJECTED */
@media(max-width:768px){
  body{height:auto!important;min-height:100vh;overflow-y:auto!important;overflow-x:hidden;}
  nav{flex-wrap:wrap;padding:10px 16px;gap:6px;height:auto!important;}
  nav h1{font-size:1rem;flex:1;}
  .complexity{margin-left:0!important;width:100%;order:3;margin-top:4px;}
  .badge{font-size:0.7rem;padding:2px 6px;}
  .main{flex-direction:column!important;overflow:visible!important;height:auto!important;flex:none!important;}
  .viz-panel{border-right:none!important;border-bottom:1px solid var(--border);height:280px!important;min-height:280px!important;flex:none!important;overflow:hidden;}
  .viz-area{padding:14px 10px 10px!important;}
  .bar-wrap{max-width:32px!important;}
  .bar-val{font-size:0.6rem!important;}
  .bar-label{font-size:0.65rem!important;}
  .code-panel{width:100%!important;min-width:unset!important;height:340px!important;flex:none!important;}
  .code-line{font-size:0.76rem!important;}
  .ln{min-width:36px!important;padding:0 8px 0 8px!important;}
  .controls{flex-wrap:wrap!important;padding:10px 14px!important;gap:6px!important;height:auto!important;}
  .btn{padding:6px 10px!important;font-size:0.8rem!important;}
  .speed-wrap{margin-left:0!important;width:100%;justify-content:flex-end;}
  .stats{flex-wrap:wrap;gap:6px;}
  .stat{font-size:0.74rem;}
  .desc-box{padding:8px 14px!important;font-size:0.8rem!important;}
  .legend{padding:6px 14px!important;gap:6px!important;}
  .leg{font-size:0.68rem!important;}
}
</style>
<script src="../nav.js"></script>
<script src="../lang.js"></script>
</head>
<body>
<nav>
  <a href="index.html" class="back-btn">← 返回</a>
  <h1>选择排序 Selection Sort</h1>
  <div class="complexity"><span class="badge time">时间 O(n²)</span><span class="badge space">空间 O(1)</span></div>
</nav>
<div class="main">
  <div class="viz-panel">
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:#38bdf8"></div>默认</div>
      <div class="leg"><div class="leg-dot" style="background:#fbbf24"></div>比较中</div>
      <div class="leg"><div class="leg-dot" style="background:#c084fc"></div>当前最小值</div>
      <div class="leg"><div class="leg-dot" style="background:#fb923c"></div>交换</div>
      <div class="leg"><div class="leg-dot" style="background:#4ade80"></div>已排序</div>
    </div>
    <div class="viz-area" id="vizArea"></div>
    <div class="desc-box">
      <span id="descText">点击播放开始演示</span>
      <div class="stats">
        <div class="stat">比较 <span id="cmpCount">0</span></div>
        <div class="stat">交换 <span id="swpCount">0</span></div>
      </div>
      <span class="step-counter" id="stepCounter">0 / 0</span>
    </div>
  </div>
  <div class="code-panel">
    <div class="code-panel-header">
      <div class="code-dot" style="background:#ff5f57"></div>
      <div class="code-dot" style="background:#febc2e"></div>
      <div class="code-dot" style="background:#28c840"></div>
      <span style="margin-left:4px" data-base="selection_sort">selection_sort.go</span>
    </div>
    <div class="code-body" id="codeBody"></div>
  </div>
</div>
<div class="controls">
  <button class="btn" id="btnReset">⏮ 重置</button>
  <button class="btn" id="btnPrev">◀ 上一步</button>
  <button class="btn primary" id="btnPlay">▶ 播放</button>
  <button class="btn" id="btnNext">下一步 ▶</button>
  <div class="speed-wrap"><span>🐢</span><input type="range" id="speedRange" min="1" max="5" value="3"><span>🐇</span></div>
</div>
<script>
const CODE_LINES = [
  {html:`<span class="kw">package</span> <span class="pkg">main</span>`},
  {html:``},
  {html:`<span class="kw">import</span> <span class="st">"fmt"</span>`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">selectionSort</span>(arr []<span class="kw">int</span>) {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;n := <span class="fn">len</span>(arr)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> i := <span class="num">0</span>; i &lt; n<span class="op">-</span><span class="num">1</span>; i<span class="op">++</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;minIdx := i`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> j := i<span class="op">+</span><span class="num">1</span>; j &lt; n; j<span class="op">++</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> arr[j] &lt; arr[minIdx] {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;minIdx = j`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;arr[i], arr[minIdx] = arr[minIdx], arr[i]`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">main</span>() {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;arr := []<span class="kw">int</span>{<span class="num">64</span>, <span class="num">34</span>, <span class="num">25</span>, <span class="num">12</span>, <span class="num">22</span>, <span class="num">11</span>, <span class="num">90</span>}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">selectionSort</span>(arr)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">fmt</span>.<span class="fn">Println</span>(arr)`},
  {html:`}`},
];

window.LANG_PLAIN = {
  js: `function selectionSort(arr) {
    const n = arr.length;
    for (let i = 0; i < n - 1; i++) {
        let minIdx = i;
        for (let j = i + 1; j < n; j++) {
            if (arr[j] < arr[minIdx]) {
                minIdx = j;
            }
        }
        if (minIdx !== i) {
            [arr[i], arr[minIdx]] = [arr[minIdx], arr[i]];
        }
    }
}

const arr = [64, 25, 12, 22, 11];
selectionSort(arr);
console.log(arr);`,
  py: `def selection_sort(arr):
    n = len(arr)
    for i in range(n - 1):
        min_idx = i
        for j in range(i + 1, n):
            if arr[j] < arr[min_idx]:
                min_idx = j
        if min_idx != i:
            arr[i], arr[min_idx] = arr[min_idx], arr[i]

arr = [64, 25, 12, 22, 11]
selection_sort(arr)
print(arr)`
};

function generateSteps(arr){
  const steps=[];const a=[...arr];const n=a.length;let cmps=0,swps=0;const sorted=[];
  steps.push({arr:[...a],comparing:[],swapping:[],minMark:[],sorted:[...sorted],highlightLines:[18],description:'初始数组，准备排序',cmps,swps});
  for(let i=0;i<n-1;i++){
    let minIdx=i;
    steps.push({arr:[...a],comparing:[],swapping:[],minMark:[minIdx],sorted:[...sorted],highlightLines:[6,7],description:`i=${i}，当前最小值候选 arr[${i}]=${a[i]}`,cmps,swps});
    for(let j=i+1;j<n;j++){
      cmps++;
      steps.push({arr:[...a],comparing:[j,minIdx],swapping:[],minMark:[minIdx],sorted:[...sorted],highlightLines:[8,9],description:`比较 arr[${j}]=${a[j]} 与最小值 arr[${minIdx}]=${a[minIdx]}`,cmps,swps});
      if(a[j]<a[minIdx]){minIdx=j;steps.push({arr:[...a],comparing:[],swapping:[],minMark:[minIdx],sorted:[...sorted],highlightLines:[10],description:`找到更小值 arr[${j}]=${a[j]}，minIdx=${j}`,cmps,swps});}
    }
    [a[i],a[minIdx]]=[a[minIdx],a[i]];swps++;sorted.push(i);
    steps.push({arr:[...a],comparing:[],swapping:[i,minIdx],minMark:[],sorted:[...sorted],highlightLines:[13],description:`交换 arr[${i}] 和 arr[${minIdx}]，位置 ${i} 确定`,cmps,swps});
  }
  sorted.push(n-1);
  steps.push({arr:[...a],comparing:[],swapping:[],minMark:[],sorted:[...sorted],highlightLines:[19,20,21],description:'排序完成！',cmps,swps});
  return steps;
}

const INITIAL=[64,34,25,12,22,11,90];const MAX_VAL=Math.max(...INITIAL);
let steps=generateSteps(INITIAL);let cur=0,playing=false,timer=null;const SPEED=[800,500,300,180,80];

const vizArea=document.getElementById('vizArea'),codeBody=document.getElementById('codeBody'),
  descText=document.getElementById('descText'),stepCounter=document.getElementById('stepCounter'),
  cmpCount=document.getElementById('cmpCount'),swpCount=document.getElementById('swpCount'),
  btnPlay=document.getElementById('btnPlay'),btnPrev=document.getElementById('btnPrev'),
  btnNext=document.getElementById('btnNext'),btnReset=document.getElementById('btnReset'),
  speedRange=document.getElementById('speedRange');

function buildCode(){codeBody.innerHTML=CODE_LINES.map((l,i)=>`<div class="code-line" data-line="${i}"><span class="ln">${i+1}</span><span class="lc">${l.html||'&nbsp;'}</span></div>`).join('');codeBody.querySelectorAll('.code-line').forEach(el=>el.addEventListener('click',()=>jumpToLine(parseInt(el.dataset.line))));}
function highlightLines(lines){codeBody.querySelectorAll('.code-line').forEach(el=>el.classList.remove('active'));lines.forEach(ln=>{const el=codeBody.querySelector(`[data-line="${ln}"]`);if(el)el.classList.add('active');});if(lines.length>0){const f=codeBody.querySelector(`[data-line="${lines[0]}"]`);if(f)f.scrollIntoView({block:'nearest'});}}
function jumpToLine(ln){let t=cur,b=Infinity;steps.forEach((s,i)=>{if(s.highlightLines.includes(ln)){const d=Math.abs(i-cur);if(d<b){b=d;t=i;}}});cur=t;render();}
function renderCode() {
  const lines = (LangSwitcher.current !== 'go' && LangSwitcher.getLines(LangSwitcher.current))
    || CODE_LINES;
  const hl = LangSwitcher.getHL(steps[cur]);
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i) ? ' active' : '';
    return `<div class="code-line${active}" onclick="jumpToLine(${i})">${line.html || '&nbsp;'}</div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}
function buildBars(n){vizArea.innerHTML='';for(let i=0;i<n;i++){const w=document.createElement('div');w.className='bar-wrap';const b=document.createElement('div');b.className='bar';const v=document.createElement('div');v.className='bar-val';b.appendChild(v);const l=document.createElement('div');l.className='bar-label';w.appendChild(b);w.appendChild(l);vizArea.appendChild(w);}}
function render(){
  const s=steps[cur];if(vizArea.children.length!==s.arr.length)buildBars(s.arr.length);
  vizArea.querySelectorAll('.bar-wrap').forEach((wrap,i)=>{
    const bar=wrap.querySelector('.bar'),lbl=wrap.querySelector('.bar-label');
    bar.style.height=`${Math.max(s.arr[i]/MAX_VAL*100,6).toFixed(1)}%`;
    bar.querySelector('.bar-val').textContent=s.arr[i];lbl.textContent=i;
    let color='#38bdf8';
    if(s.sorted.includes(i))color='#4ade80';
    if(s.swapping.includes(i))color='#fb923c';
    if(s.comparing.includes(i))color='#fbbf24';
    if(s.minMark&&s.minMark.includes(i)&&!s.comparing.includes(i))color='#c084fc';
    bar.style.background=color;
    bar.style.boxShadow=(s.comparing.includes(i)||s.swapping.includes(i)||s.minMark?.includes(i))?`0 0 12px ${color}88`:'none';
  });
  renderCode();descText.textContent=s.description;
  stepCounter.textContent=`${cur+1} / ${steps.length}`;cmpCount.textContent=s.cmps;swpCount.textContent=s.swps;
  btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;
}
function play(){if(cur>=steps.length-1)cur=0;playing=true;btnPlay.innerHTML='⏸ 暂停';tick();}
function pause(){playing=false;clearTimeout(timer);btnPlay.innerHTML='▶ 播放';}
function tick(){if(!playing)return;if(cur<steps.length-1){cur++;render();timer=setTimeout(tick,SPEED[parseInt(speedRange.value)-1]);}else pause();}
btnPlay.addEventListener('click',()=>playing?pause():play());
btnPrev.addEventListener('click',()=>{pause();if(cur>0){cur--;render();}});
btnNext.addEventListener('click',()=>{pause();if(cur<steps.length-1){cur++;render();}});
btnReset.addEventListener('click',()=>{pause();cur=0;render();});
buildCode();buildBars(INITIAL.length);LangSwitcher.init(renderCode);render();
</script>
</body>
</html>
