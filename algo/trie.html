// ---- Trie Data Structure ----
class TrieNode {
  constructor(char = '') {
    this.char = char;
    this.children = {};
    this.isEnd = false;
    this.id = TrieNode._id++;
  }
}
TrieNode._id = 0;

function newTrie() {
  return new TrieNode('');
}

function trieInsert(root, word) {
  let node = root;
  for (const ch of word) {
    if (!node.children[ch]) {
      node.children[ch] = new TrieNode(ch);
    }
    node = node.children[ch];
  }
  node.isEnd = true;
}

function buildInitialTrie() {
  TrieNode._id = 0;
  const root = newTrie();
  const words = ["app","apple","apply","apt","bat","ball","band","ban"];
  for (const w of words) trieInsert(root, w);
  return root;
}

// Deep clone trie
function cloneTrie(node) {
  if (!node) return null;
  const n = new TrieNode(node.char);
  n.id = node.id;
  n.isEnd = node.isEnd;
  for (const [ch, child] of Object.entries(node.children)) {
    n.children[ch] = cloneTrie(child);
  }
  return n;
}

// Find node by id
function findById(root, id) {
  if (!root) return null;
  if (root.id === id) return root;
  for (const child of Object.values(root.children)) {
    const r = findById(child, id);
    if (r) return r;
  }
  return null;
}

// ---- Layout ----
// Returns {id -> {x, y, char, isEnd}} using centroid-based n-ary layout
function computeLayout(root) {
  const pos = {};
  // First pass: count leaves per subtree to assign x positions
  function countLeaves(node) {
    const keys = Object.keys(node.children).sort();
    if (keys.length === 0) return 1;
    let total = 0;
    for (const k of keys) total += countLeaves(node.children[k]);
    return total;
  }
  // Second pass: assign positions
  let leafIdx = 0;
  function assign(node, depth) {
    const keys = Object.keys(node.children).sort();
    if (keys.length === 0) {
      pos[node.id] = { x: leafIdx++, y: depth, char: node.char, isEnd: node.isEnd };
      return;
    }
    const startLeaf = leafIdx;
    for (const k of keys) assign(node.children[k], depth + 1);
    const endLeaf = leafIdx - 1;
    pos[node.id] = { x: (startLeaf + endLeaf) / 2, y: depth, char: node.char, isEnd: node.isEnd };
  }
  assign(root, 0);
  return pos;
}

// ---- Step Generation ----
function generateInsertSteps(root, word) {
  const steps = [];
  // We work on a REAL copy so insertions are visible
  const workRoot = cloneTrie(root);

  function snap(highlightIds, currentId, newIds, desc, lines) {
    steps.push({
      root: cloneTrie(workRoot),
      highlightIds: [...highlightIds],
      currentId,
      newIds: [...newIds],
      failIds: [],
      desc,
      lines
    });
  }

  snap([], workRoot.id, [], `Insert("${word}"): 从根节点出发`, [10, 11]);

  let node = workRoot;
  const visited = [node.id];
  for (let i = 0; i < word.length; i++) {
    const ch = word[i];
    snap(visited, node.id, [], `检查字符 '${ch}'：子节点存在？`, [12, 13]);
    if (!node.children[ch]) {
      // Create new node
      node.children[ch] = new TrieNode(ch);
      const newId = node.children[ch].id;
      visited.push(newId);
      snap(visited, newId, [newId], `字符 '${ch}' 不存在，创建新节点`, [14, 15, 16]);
      node = node.children[ch];
    } else {
      node = node.children[ch];
      visited.push(node.id);
      snap(visited, node.id, [], `字符 '${ch}' 已存在，沿边前进`, [16, 17]);
    }
  }
  node.isEnd = true;
  snap(visited, node.id, [], `到达末尾，标记 isEnd=true（绿色节点）`, [18, 19]);
  return steps;
}

function generateSearchSteps(root, word) {
  const steps = [];
  function snap(highlightIds, currentId, failIds, desc, lines) {
    steps.push({
      root: cloneTrie(root),
      highlightIds: [...highlightIds],
      currentId,
      newIds: [],
      failIds: [...failIds],
      desc,
      lines
    });
  }

  snap([], root.id, [], `Search("${word}"): 从根节点出发`, [22, 23]);

  let node = root;
  const visited = [node.id];
  for (let i = 0; i < word.length; i++) {
    const ch = word[i];
    snap(visited, node.id, [], `检查字符 '${ch}'：子节点存在？`, [24, 25]);
    if (!node.children[ch]) {
      snap(visited, node.id, [node.id], `字符 '${ch}' 不存在 → 返回 false`, [26, 27]);
      return { steps, result: false };
    }
    node = node.children[ch];
    visited.push(node.id);
    snap(visited, node.id, [], `找到 '${ch}'，继续前进`, [28, 29]);
  }
  // Check isEnd
  if (node.isEnd) {
    snap(visited, node.id, [], `到达末尾，isEnd=true → 返回 true`, [30, 31]);
    return { steps, result: true };
  } else {
    snap(visited, node.id, [node.id], `到达末尾，isEnd=false → 返回 false`, [30, 31]);
    return { steps, result: false };
  }
}

function generateStartsWithSteps(root, prefix) {
  const steps = [];
  function snap(highlightIds, currentId, failIds, desc, lines) {
    steps.push({
      root: cloneTrie(root),
      highlightIds: [...highlightIds],
      currentId,
      newIds: [],
      failIds: [...failIds],
      desc,
      lines
    });
  }

  snap([], root.id, [], `StartsWith("${prefix}"): 从根节点出发`, [34, 35]);

  let node = root;
  const visited = [node.id];
  for (let i = 0; i < prefix.length; i++) {
    const ch = prefix[i];
    snap(visited, node.id, [], `检查前缀字符 '${ch}'：子节点存在？`, [36, 37]);
    if (!node.children[ch]) {
      snap(visited, node.id, [node.id], `字符 '${ch}' 不存在 → 返回 false`, [38, 39]);
      return { steps, result: false };
    }
    node = node.children[ch];
    visited.push(node.id);
    snap(visited, node.id, [], `找到 '${ch}'，继续前进`, [40, 41]);
  }
  snap(visited, node.id, [], `前缀完整匹配 → 返回 true`, [42, 43]);
  return { steps, result: true };
}

// ---- State ----
let trie = buildInitialTrie();
let steps = [];
let cur = 0, playing = false, timer = null;
const SPEED = [800, 500, 300, 180, 80];
let currentOp = 'insert';
let lastResult = null;

// ---- SVG Rendering ----
const NR = 20; // node radius
const PAD_X = 40;
const PAD_Y = 48;
const DY = 72;

function ns(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }

function renderTrie(trieRoot, highlightIds, currentId, newIds, failIds) {
  svg.innerHTML = '';
  if (!trieRoot) return;

  const pos = computeLayout(trieRoot);
  const rect = svg.getBoundingClientRect();
  const totalW = rect.width || 700;

  // Find x range
  const xs = Object.values(pos).map(p => p.x);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const spanX = Math.max(maxX - minX, 1);
  const availW = totalW - PAD_X * 2;
  const cellW = Math.min(availW / spanX, 60);

  const xScale = x => PAD_X + (x - minX) * cellW + cellW / 2;
  const yScale = d => PAD_Y + d * DY;

  // Defs (glow filter)
  const defs = ns('defs');
  defs.innerHTML = `<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  svg.appendChild(defs);

  const highlightSet = new Set(highlightIds);
  const newSet = new Set(newIds);
  const failSet = new Set(failIds);

  // Draw edges + edge labels
  function drawEdges(node) {
    const p = pos[node.id];
    if (!p) return;
    const px = xScale(p.x), py = yScale(p.y);
    const sortedKeys = Object.keys(node.children).sort();
    for (const k of sortedKeys) {
      const child = node.children[k];
      const cp = pos[child.id];
      if (!cp) continue;
      const cx = xScale(cp.x), cy = yScale(cp.y);

      // Edge line
      const isPathEdge = highlightSet.has(node.id) && highlightSet.has(child.id);
      const isNewEdge = newSet.has(child.id);
      const isFailEdge = failSet.has(child.id) || failSet.has(node.id);

      const line = ns('line');
      line.setAttribute('x1', px);
      line.setAttribute('y1', py + NR);
      line.setAttribute('x2', cx);
      line.setAttribute('y2', cy - NR);
      let edgeColor = '#334155';
      if (isNewEdge) edgeColor = '#fb923c';
      else if (isFailEdge) edgeColor = '#f87171';
      else if (isPathEdge) edgeColor = '#c084fc';
      line.setAttribute('stroke', edgeColor);
      line.setAttribute('stroke-width', isPathEdge || isNewEdge ? '2.5' : '1.5');
      svg.appendChild(line);

      // Edge label (midpoint)
      const mx = (px + cx) / 2;
      const my = (py + NR + cy - NR) / 2;
      const bg = ns('rect');
      const labelW = 16, labelH = 16;
      bg.setAttribute('x', mx - labelW / 2);
      bg.setAttribute('y', my - labelH / 2);
      bg.setAttribute('width', labelW);
      bg.setAttribute('height', labelH);
      bg.setAttribute('rx', '3');
      bg.setAttribute('fill', '#0f172a');
      svg.appendChild(bg);

      const label = ns('text');
      label.setAttribute('x', mx);
      label.setAttribute('y', my + 5);
      label.setAttribute('fill', edgeColor === '#334155' ? '#64748b' : edgeColor);
      label.setAttribute('font-size', '11');
      label.setAttribute('font-weight', '600');
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('font-family', 'monospace');
      label.textContent = k;
      svg.appendChild(label);

      drawEdges(child);
    }
  }
  drawEdges(trieRoot);

  // Draw nodes
  function drawNodes(node) {
    const p = pos[node.id];
    if (!p) return;
    const x = xScale(p.x), y = yScale(p.y);

    const isHighlight = highlightSet.has(node.id);
    const isCurrent = node.id === currentId;
    const isNew = newSet.has(node.id);
    const isFail = failSet.has(node.id);

    let fill = '#1e293b', stroke = '#334155', textCol = '#e2e8f0';

    // Priority: fail > current > new > isEnd > highlight > normal
    if (node.isEnd && !isCurrent && !isNew && !isFail) {
      fill = 'rgba(74,222,128,0.2)'; stroke = '#4ade80'; textCol = '#4ade80';
    }
    if (isHighlight && !isCurrent && !isNew && !isFail) {
      fill = 'rgba(192,132,252,0.15)'; stroke = '#c084fc'; textCol = '#c084fc';
    }
    if (isCurrent) {
      fill = 'rgba(251,191,36,0.2)'; stroke = '#fbbf24'; textCol = '#fbbf24';
    }
    if (isNew) {
      fill = 'rgba(251,146,60,0.2)'; stroke = '#fb923c'; textCol = '#fb923c';
    }
    if (isFail) {
      fill = 'rgba(248,113,113,0.2)'; stroke = '#f87171'; textCol = '#f87171';
    }
    // If it's a green end node AND also currently traversed, keep current color but add glow
    if (node.isEnd && isCurrent && !isNew && !isFail) {
      fill = 'rgba(74,222,128,0.3)'; stroke = '#4ade80'; textCol = '#fbbf24';
    }

    const circle = ns('circle');
    circle.setAttribute('cx', x);
    circle.setAttribute('cy', y);
    circle.setAttribute('r', NR);
    circle.setAttribute('fill', fill);
    circle.setAttribute('stroke', stroke);
    circle.setAttribute('stroke-width', '2');
    if (isCurrent || isNew || isFail) circle.setAttribute('filter', 'url(#glow)');
    svg.appendChild(circle);

    const t = ns('text');
    t.setAttribute('x', x);
    t.setAttribute('y', y + 5);
    t.setAttribute('fill', textCol);
    t.setAttribute('font-size', node.char === '' ? '16' : '13');
    t.setAttribute('font-weight', '700');
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-family', 'monospace');
    t.textContent = node.char === '' ? '*' : node.char;
    svg.appendChild(t);

    // isEnd indicator dot
    if (node.isEnd) {
      const dot = ns('circle');
      dot.setAttribute('cx', x + NR - 4);
      dot.setAttribute('cy', y - NR + 4);
      dot.setAttribute('r', '4');
      dot.setAttribute('fill', '#4ade80');
      dot.setAttribute('stroke', '#0f172a');
      dot.setAttribute('stroke-width', '1.5');
      svg.appendChild(dot);
    }

    const sortedKeys = Object.keys(node.children).sort();
    for (const k of sortedKeys) drawNodes(node.children[k]);
  }
  drawNodes(trieRoot);
}

function render() {
  if (steps.length === 0) {
    renderTrie(trie, [], null, [], []);
    descText.textContent = '初始 Trie：app, apple, apply, apt, bat, ball, band, ban';
    stepCounter.textContent = '';
    resultBadge.style.display = 'none';
    return;
  }
  const s = steps[cur];
  renderTrie(s.root, s.highlightIds || [], s.currentId, s.newIds || [], s.failIds || []);
  if (s.lines) highlightLines(s.lines);
  descText.textContent = s.desc;
  stepCounter.textContent = `${cur + 1} / ${steps.length}`;
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;

  // Show result at last step
  if (cur === steps.length - 1 && lastResult !== null) {
    resultBadge.textContent = lastResult ? 'true' : 'false';
    resultBadge.className = 'result-badge ' + (lastResult ? 'true' : 'false');
    resultBadge.style.display = 'inline-block';
  } else {
    resultBadge.style.display = 'none';
  }
}

// ---- Controls ----
goBtn.addEventListener('click', () => {
  pause();
  const word = opWord.value.trim();
  if (!word) return;
  resultBadge.style.display = 'none';
  lastResult = null;

  if (currentOp === 'insert') {
    const newSteps = generateInsertSteps(trie, word);
    // Actually insert into trie after generating steps
    trieInsert(trie, word);
    steps = newSteps;
    lastResult = null;
  } else if (currentOp === 'search') {
    const { steps: newSteps, result } = generateSearchSteps(trie, word);
    steps = newSteps;
    lastResult = result;
  } else if (currentOp === 'startsWith') {
    const { steps: newSteps, result } = generateStartsWithSteps(trie, word);
    steps = newSteps;
    lastResult = result;
  }
  cur = 0;
  render();
});

resetTreeBtn.addEventListener('click', () => {
  pause();
  trie = buildInitialTrie();
  steps = [];
  cur = 0;
  lastResult = null;
  resultBadge.style.display = 'none';
  render();
  descText.textContent = '树已重置：app, apple, apply, apt, bat, ball, band, ban';
});

// ---- Code Panel ----
function buildCode() {
  codeBody.innerHTML = CODE_LINES.map((l, i) =>
    `<div class="code-line" data-line="${i}"><span class="ln">${i + 1}</span><span class="lc">${l.html || '&nbsp;'}</span></div>`
  ).join('');
  codeBody.querySelectorAll('.code-line').forEach(el =>
    el.addEventListener('click', () => jumpToLine(parseInt(el.dataset.line)))
  );
}
function highlightLines(lines) {
  codeBody.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
  lines.forEach(ln => {
    const el = codeBody.querySelector(`[data-line="${ln}"]`);
    if (el) el.classList.add('active');
  });
  if (lines.length > 0) {
    const f = codeBody.querySelector(`[data-line="${lines[0]}"]`);
    if (f) f.scrollIntoView({ block: 'nearest' });
  }
}
function jumpToLine(ln) {
  let t = cur, best = Infinity;
  steps.forEach((s, i) => {
    if (s.lines && s.lines.includes(ln)) {
      const d = Math.abs(i - cur);
      if (d < best) { best = d; t = i; }
    }
  });
  cur = t;
  render();
}

// ---- Playback ----
function play() {
  if (cur >= steps.length - 1) cur = 0;
  playing = true;
  btnPlay.innerHTML = '⏸ 暂停';
  tick();
}
function pause() {
  playing = false;
  clearTimeout(timer);
  btnPlay.innerHTML = '▶ 播放';
}
function tick() {
  if (!playing) return;
  if (cur < steps.length - 1) {
    cur++;
    render();
    timer = setTimeout(tick, SPEED[parseInt(speedRange.value) - 1]);
  } else {
    pause();
  }
}
btnPlay.addEventListener('click', () => playing ? pause() : play());
btnPrev.addEventListener('click', () => { pause(); if (cur > 0) { cur--; render(); } });
btnNext.addEventListener('click', () => { pause(); if (cur < steps.length - 1) { cur++; render(); } });
btnReset.addEventListener('click', () => { pause(); cur = 0; render(); });

window.addEventListener('resize', () => render());

buildCode();
render();
</script>
</body>
</html>
