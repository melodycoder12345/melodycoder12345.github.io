const T = 2; // minimum degree
const MAX_KEYS = 2 * T - 1; // 3

class BNode {
  constructor(isLeaf = true) {
    this.keys = [];
    this.children = [];
    this.isLeaf = isLeaf;
    this.id = BNode._id++;
  }
}
BNode._id = 0;

function cloneNode(n) {
  if (!n) return null;
  const c = new BNode(n.isLeaf);
  c.keys = [...n.keys];
  c.id = n.id;
  c.children = n.children.map(cloneNode);
  return c;
}

  right.children = full.children.slice(T);
  full.keys = full.keys.slice(0, T - 1);
  full.children = full.children.slice(0, T);
  const pos = parent.keys.findIndex(k => k > mid);
  const insertPos = pos < 0 ? parent.keys.length : pos;
  parent.keys.splice(insertPos, 0, mid);
  parent.children.splice(insertPos + 1, 0, right);
  steps.push(mkStep(cloneNode(root), [parent.id], [], [mid], `分裂完成：${mid} 上升，左 [${full.keys.join(',')}]，右 [${right.keys.join(',')}]`, [32, 33, 34, 35]));
}

function mkStep(root, highlight, splitting, settled, description, lines) {
  return { root: cloneNode(root), highlight: highlight || [], splitting: splitting || [], settled: settled || [], description, highlightLines: lines };
}

function generateInsertSteps(val) {
  const stepsArr = [];
  const root = cloneNode(btRoot);
  stepsArr.push(mkStep(root, [], [], [], `准备插入 ${val}`, [10]));

  function insertNonFull(node, k) {
    stepsArr.push(mkStep(root, [node.id], [], [], `访问节点 [${node.keys.join(',')}]，${node.isLeaf ? '是叶节点' : '是内部节点'}`, [39]));
    if (node.isLeaf) {
      const pos = node.keys.findIndex(x => x > k);
      node.keys.splice(pos < 0 ? node.keys.length : pos, 0, k);
      stepsArr.push(mkStep(root, [node.id], [], [k], `叶节点直接插入 ${k}，现在为 [${node.keys.join(',')}]`, [40, 41, 42]));
      return;
    }
    let i = node.keys.findIndex(x => x > k);
    if (i < 0) i = node.keys.length;
    const child = node.children[i];
    stepsArr.push(mkStep(root, [child.id], [], [], `向第 ${i} 个子节点下探：[${child.keys.join(',')}]`, [39]));
    if (child.keys.length === MAX_KEYS) {
      stepsArr.push(mkStep(root, [child.id], [child.id], [], `子节点 [${child.keys.join(',')}] 已满，需要先分裂`, [44, 45, 46]));
      splitChild(node, i, stepsArr, root);
      if (k > node.keys[i]) i++;
    }
    insertNonFull(node.children[i], k);
  }

  if (root.keys.length === MAX_KEYS) {
    stepsArr.push(mkStep(root, [root.id], [root.id], [], `根节点 [${root.keys.join(',')}] 已满，需要分裂`, [12, 13, 14, 15, 16]));
    const s = new BNode(false);
    s.children = [root];
    splitChild(s, 0, stepsArr, s);
    insertNonFull(s, val);
    stepsArr.push(mkStep(s, [], [], [val], `插入 ${val} 完成！`, []));
    btRoot = s;
    return { steps: stepsArr, finalRoot: s };
  }

  insertNonFull(root, val);
  stepsArr.push(mkStep(root, [], [], [val], `插入 ${val} 完成！`, []));
  btRoot = root;
  return { steps: stepsArr, finalRoot: root };
}

function generateSearchSteps(val) {
  const stepsArr = [];
  const root = cloneNode(btRoot);

  function search(node) {
    stepsArr.push(mkStep(root, [node.id], [], [], `在节点 [${node.keys.join(',')}] 中查找 ${val}`, []));
    const pos = node.keys.indexOf(val);
    if (pos >= 0) {
      stepsArr.push(mkStep(root, [node.id], [], [val], `找到 ${val}！`, []));
      return;
    }
    if (node.isLeaf) {
      stepsArr.push(mkStep(root, [node.id], [], [], `叶节点中没有 ${val}，查找失败`, []));
      return;
    }
    let i = node.keys.findIndex(x => x > val);
    if (i < 0) i = node.keys.length;
    stepsArr.push(mkStep(root, [node.children[i].id], [], [], `${val} 在第 ${i} 个指针范围，进入子节点`, []));
    search(node.children[i]);
  }

  stepsArr.push(mkStep(root, [], [], [], `查找 ${val}`, []));
  search(root);
  return { steps: stepsArr, finalRoot: root };
}

function doInsert() {
  pause();
  const val = parseInt(document.getElementById('insertVal').value) || 25;
  const res = generateInsertSteps(val);
  steps = res.steps; cur = 0; render();
}
function doSearch() {
  pause();
  const val = parseInt(document.getElementById('insertVal').value) || 25;
  const res = generateSearchSteps(val);
  steps = res.steps; cur = 0; render();
}
function doPreset() {
  pause();
  btRoot = new BNode(true); BNode._id = 0;
  steps = []; cur = 0;
  for (const v of [10, 20, 5, 30, 15, 25, 35, 40, 45, 50]) {
    const res = generateInsertSteps(v);
    steps.push(...res.steps);
  }
  cur = 0; render();
}

const treeSvg = document.getElementById('treeSvg');
const descText = document.getElementById('descText');
const stepCounter = document.getElementById('stepCounter');
const keyCount = document.getElementById('keyCount');
const treeHeightEl = document.getElementById('treeHeight');
const codeBody = document.getElementById('codeBody');
const speedRange = document.getElementById('speedRange');
const speedVal = document.getElementById('speedVal');
function updateSpeedLabel(){speedVal.textContent=SPEED_LABELS[parseInt(speedRange.value)-1];}
speedRange.addEventListener('input',updateSpeedLabel);
updateSpeedLabel();
const btnPlay = document.getElementById('btnPlay');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnReset = document.getElementById('btnReset');

function layoutTree(root) {
  if (!root) return { positions: {}, width: 0, height: 0 };
  const positions = {};
  const nodeWidths = {};

  function computeWidth(node) {
    if (!node) return 0;
    const kw = node.keys.length * 36 + 20;
    nodeWidths[node.id] = kw;
    if (node.isLeaf) return kw;
    return Math.max(kw, node.children.reduce((s, c) => s + computeWidth(c) + 12, -12));
  }

  const levelHeight = 80;
  let xCounter = 0;

  function place(node, depth) {
    if (!node) return 0;
    if (node.isLeaf) {
      const cx = xCounter + nodeWidths[node.id] / 2;
      positions[node.id] = { x: cx, y: depth * levelHeight + 30 };
      xCounter += nodeWidths[node.id] + 16;
      return cx;
    }
    const startX = xCounter;
    const childCenters = node.children.map(c => place(c, depth + 1));
    const cx = (childCenters[0] + childCenters[childCenters.length - 1]) / 2;
    positions[node.id] = { x: cx, y: depth * levelHeight + 30 };
    return cx;
  }

  computeWidth(root);
  place(root, 0);
  return positions;
}

function getNodeColor(id, s) {
  if (!s) return '#38bdf8';
  if (s.splitting.includes(id)) return '#fb923c';
  if (s.highlight.includes(id)) return '#fbbf24';
  if (s.settled.length > 0) return '#4ade80';
  return '#38bdf8';
}

function renderBTree(s) {
  const root = s ? s.root : btRoot;
  const rect = treeSvg.parentElement.getBoundingClientRect();
  const W = rect.width || 600, H = rect.height || 300;
  treeSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  treeSvg.innerHTML = '';

  if (!root || root.keys.length === 0) {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', W / 2); t.setAttribute('y', H / 2);
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('fill', '#94a3b8'); t.setAttribute('font-size', '14');
    t.textContent = '树为空';
    treeSvg.appendChild(t); return;
  }

  const positions = layoutTree(root);
  // Scale to fit
  const allX = Object.values(positions).map(p => p.x);
  const allY = Object.values(positions).map(p => p.y);
  const minX = Math.min(...allX), maxX = Math.max(...allX);
  const minY = Math.min(...allY), maxY = Math.max(...allY);
  const scaleX = (W - 80) / Math.max(maxX - minX + 80, 1);
  const scaleY = Math.min((H - 60) / Math.max(maxY - minY + 40, 1), 1);

  function tx(x) { return 40 + (x - minX + 40) * scaleX; }
  function ty(y) { return 20 + (y - minY) * scaleY; }

  const NH = 36, KW = 32;

  function drawEdges(node) {
    if (!node || node.isLeaf) return;
    const { x, y } = positions[node.id];
    node.children.forEach(c => {
      const { x: cx, y: cy } = positions[c.id];
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', tx(x)); line.setAttribute('y1', ty(y) + NH / 2);
      line.setAttribute('x2', tx(cx)); line.setAttribute('y2', ty(cy) - NH / 2);
      line.setAttribute('stroke', '#334155'); line.setAttribute('stroke-width', '1.5');
      treeSvg.appendChild(line);
      drawEdges(c);
    });
  }
  drawEdges(root);

  function drawNode(node) {
    if (!node) return;
    const color = getNodeColor(node.id, s);
    const { x, y } = positions[node.id];
    const nkeys = node.keys.length;
    const totalW = nkeys * KW + 8;
    const rx = tx(x) - totalW / 2;
    const ry = ty(y) - NH / 2;
    const isOverflow = node.keys.length >= MAX_KEYS;

    const rect2 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect2.setAttribute('x', rx); rect2.setAttribute('y', ry);
    rect2.setAttribute('width', totalW); rect2.setAttribute('height', NH);
    rect2.setAttribute('rx', '6');
    rect2.setAttribute('fill', isOverflow ? 'rgba(248,113,113,0.15)' : color + '15');
    rect2.setAttribute('stroke', isOverflow ? '#f87171' : color);
    rect2.setAttribute('stroke-width', '1.5');
    treeSvg.appendChild(rect2);

    node.keys.forEach((k, i) => {
      if (i > 0) {
        const sep = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        sep.setAttribute('x1', rx + i * KW + 4); sep.setAttribute('y1', ry + 4);
        sep.setAttribute('x2', rx + i * KW + 4); sep.setAttribute('y2', ry + NH - 4);
        sep.setAttribute('stroke', isOverflow ? '#f87171' : color + '55');
        sep.setAttribute('stroke-width', '1');
        treeSvg.appendChild(sep);
      }
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', rx + i * KW + KW / 2 + 4);
      txt.setAttribute('y', ry + NH / 2 + 1);
      txt.setAttribute('text-anchor', 'middle'); txt.setAttribute('dominant-baseline', 'middle');
      txt.setAttribute('fill', s && s.settled.includes(k) ? '#4ade80' : color);
      txt.setAttribute('font-size', '13'); txt.setAttribute('font-weight', '600');
      txt.setAttribute('font-family', 'monospace');
      txt.textContent = k;
      treeSvg.appendChild(txt);
    });

    node.children.forEach(c => drawNode(c));
  }
  drawNode(root);
}

function render() {
  if (steps.length === 0) {
    renderBTree(null);
    renderCode();
    descText.textContent = 'B 树（t=2），每节点最多 3 个键';
    keyCount.textContent = treeKeyCount(btRoot);
    treeHeightEl.textContent = treeHeight(btRoot);
    stepCounter.textContent = '0 / 0';
    return;
  }
  const s = steps[cur];
  renderBTree(s);
  renderCode();
  descText.textContent = s.description;
  stepCounter.textContent = `${cur + 1} / ${steps.length}`;
  keyCount.textContent = s.root ? treeKeyCount(s.root) : 0;
  treeHeightEl.textContent = s.root ? treeHeight(s.root) : 0;
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;
}

function renderCode() {
  const lines = (LangSwitcher.current !== 'go' && LangSwitcher.getLines(LangSwitcher.current))
    || CODE_LINES;
  const hl = LangSwitcher.getHL(steps[cur] || {});
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i) ? ' active' : '';
    return `<div class="code-line${active}" onclick="jumpToLine(${i})">${line.html || '&nbsp;'}</div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}
function buildCode() { renderCode(); }
function highlightLines(lines) { renderCode(); }
function jumpToLine(ln) {
  if (LangSwitcher.current !== 'go') return;
  if (steps.length === 0) return;
  let t2 = cur, b = Infinity;
  steps.forEach((s, i) => { if (s.highlightLines && s.highlightLines.includes(ln)) { const d = Math.abs(i - cur); if (d < b) { b = d; t2 = i; } } });
  cur = t2; render();
}

function play() { if (cur >= steps.length - 1) cur = 0; playing = true; btnPlay.innerHTML = '⏸ 暂停'; tick(); }
function pause() { playing = false; clearTimeout(timer); btnPlay.innerHTML = '▶ 播放'; }
function tick() { if (!playing) return; if (cur < steps.length - 1) { cur++; render(); timer = setTimeout(tick, SPEED[parseInt(speedRange.value) - 1]); } else pause(); }

btnPlay.addEventListener('click', () => playing ? pause() : play());
btnPrev.addEventListener('click', () => { pause(); if (cur > 0) { cur--; render(); } });
btnNext.addEventListener('click', () => { pause(); if (cur < steps.length - 1) { cur++; render(); } });
btnReset.addEventListener('click', () => { pause(); cur = 0; render(); });

LangSwitcher.init(renderCode);
buildCode();
doPreset();
</script>
</body>
</html>
