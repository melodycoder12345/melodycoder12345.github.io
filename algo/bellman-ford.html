    result.push({
      dist: [...dist],
      nodeState: [...nodeState],
      relaxedEdges: new Set(relaxedEdges),
      activeEdgeIdx: -1,
      round: i+1,
      phase: 'round_start',
      desc: `第 ${i+1} 轮松弛（共 ${n-1} 轮），遍历所有 ${EDGES.length} 条边`,
      highlightLines: [14,15],
    });

    for (let j = 0; j < EDGES.length; j++) {
      const [u,v,w] = EDGES[j];
      if (dist[u] === INF) continue; // skip unreachable

      // Highlight this edge check
      result.push({
        dist: [...dist],
        nodeState: [...nodeState],
        relaxedEdges: new Set(relaxedEdges),
        activeEdgeIdx: j,
        round: i+1,
        phase: 'check',
        desc: `轮 ${i+1}：检查 ${NODE_NAMES[u]}→${NODE_NAMES[v]}（权重 ${w}），dist[${NODE_NAMES[u]}]=${dist[u]=== INF?'∞':dist[u]}`,
        highlightLines: [16,17],
      });

      const newDist = dist[u] + w;
      if (newDist < dist[v]) {
        const oldDist = dist[v];
        dist[v] = newDist;
        nodeState[v] = 'updated';
        relaxedEdges.add(j);
        result.push({
          dist: [...dist],
          nodeState: [...nodeState],
          relaxedEdges: new Set(relaxedEdges),
          activeEdgeIdx: j,
          round: i+1,
          phase: 'relax',
          desc: `松弛成功！dist[${NODE_NAMES[v]}]: ${oldDist===INF?'∞':oldDist} → ${newDist}`,
          highlightLines: [18],
        });
      }
    }

    // After round: mark all reachable updated nodes as settled (approximation for visualization)
    for (let k = 0; k < n; k++) {
      if (dist[k] !== INF && nodeState[k] !== 'settled') {
        nodeState[k] = 'settled';
      }
    }
  }

  // Negative cycle check
  result.push({
    dist: [...dist],
    nodeState: [...nodeState],
    relaxedEdges: new Set(relaxedEdges),
    activeEdgeIdx: -1,
    round: n,
    phase: 'neg_check',
    desc: `第 ${n} 轮（额外轮）：检测负环，若仍能松弛则存在负环`,
    highlightLines: [22,23,24,25,26,27,28],
  });

  let hasNegCycle = false;
  for (let j = 0; j < EDGES.length; j++) {
    const [u,v,w] = EDGES[j];
    if (dist[u] !== INF && dist[u]+w < dist[v]) {
      hasNegCycle = true;
      break;
    }
  }

  result.push({
    dist: [...dist],
    nodeState: [...nodeState],
    relaxedEdges: new Set(relaxedEdges),
    activeEdgeIdx: -1,
    round: n,
    phase: 'done',
    desc: hasNegCycle
      ? '检测到负环！结果不可靠。'
      : `算法完成！无负环。从 ${NODE_NAMES[src]} 到各节点最短路径已确定。`,
    highlightLines: [29,30],
  });

  return result;
}

function jumpToLine(ln) {
  if (!steps.length) return;
  let t = cur, b = Infinity;
  steps.forEach((s, i) => { if (s.highlightLines && s.highlightLines.includes(ln)) { const d = Math.abs(i - cur); if (d < b) { b = d; t = i; } } });
  cur = t; render();
}
function renderCode() {
  const lines = (LangSwitcher.current !== 'go' && LangSwitcher.getLines(LangSwitcher.current))
    || CODE_LINES;
  const hl = steps[cur] ? LangSwitcher.getHL(steps[cur]) : [];
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i) ? ' active' : '';
    return `<div class="code-line${active}" onclick="jumpToLine(${i})">${line.html || '&nbsp;'}</div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}

function renderDistList(s) {
  const dl = document.getElementById('distList');
  dl.innerHTML = NODE_NAMES.map((name,i)=>{
    const d = s.dist[i];
    const state = s.nodeState[i];
    let cls = 'dist-row';
    if(state==='updated') cls+=' updated';
    else if(state==='settled') cls+=' settled';
    const valColor = d===INF?'#64748b':(state==='updated'?'#fbbf24':(state==='settled'?'#4ade80':'#e2e8f0'));
    return `<div class="${cls}">
      <span class="dist-label">${name}:</span>
      <span class="dist-val" style="color:${valColor}">${d===INF?'∞':d}</span>
    </div>`;
  }).join('');

  const rb = document.getElementById('roundBadge');
  const maxRound = NODE_NAMES.length - 1;
  if(s.round === 0) rb.textContent = '未开始';
  else if(s.round > maxRound) rb.textContent = `第${s.round}轮（负环检测）`;
  else rb.textContent = `第 ${s.round} / ${maxRound} 轮`;
}

function renderGraph(s) {
  const svg = document.getElementById('graphSvg');
  const W = svg.clientWidth || svg.parentElement.clientWidth;
  const H = svg.clientHeight || svg.parentElement.clientHeight;
  const R = 20;

  let html = '';

  // Draw display edges
  for (let i = 0; i < DISPLAY_EDGES.length; i++) {
    const [u,v,w] = DISPLAY_EDGES[i];
    const x1 = NODE_POS[u].x * W, y1 = NODE_POS[u].y * H;
    const x2 = NODE_POS[v].x * W, y2 = NODE_POS[v].y * H;
    const mx = (x1+x2)/2, my = (y1+y2)/2;

    // Check if this is an active edge (either direction in EDGES)
    const isActive = s.activeEdgeIdx >= 0 && (
      (EDGES[s.activeEdgeIdx][0]===u && EDGES[s.activeEdgeIdx][1]===v) ||
      (EDGES[s.activeEdgeIdx][0]===v && EDGES[s.activeEdgeIdx][1]===u)
    );

    // Check if any direction of this edge was relaxed
    const isRelaxed = [...s.relaxedEdges].some(ri=>{
      return (EDGES[ri][0]===u&&EDGES[ri][1]===v)||(EDGES[ri][0]===v&&EDGES[ri][1]===u);
    });

    const isNeg = w < 0;
    let stroke = '#334155';
    let sw = 1.5;
    let opacity = 0.5;
    let dashArray = '';

    if (isActive) { stroke = '#fbbf24'; sw = 2.5; opacity = 1; }
    else if (isRelaxed) { stroke = '#fb923c'; sw = 2.5; opacity = 0.9; }
    else if (isNeg) { stroke = '#f87171'; sw = 1.5; opacity = 0.7; dashArray = '4,3'; }

    html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${sw}" stroke-dasharray="${dashArray}" opacity="${opacity}" stroke-linecap="round"/>`;

    // Weight label
    let wColor = '#64748b';
    if(isActive) wColor='#fbbf24';
    else if(isRelaxed) wColor='#fb923c';
    else if(isNeg) wColor='#f87171';
    // Offset label to avoid center collision
    const dx = -(y2-y1)*0.06, dy = (x2-x1)*0.06;
    html += `<text x="${mx+dx}" y="${my+dy}" text-anchor="middle" dominant-baseline="middle" font-size="11" font-family="monospace" fill="${wColor}" font-weight="${isNeg?'700':'400'}">${w}</text>`;
  }

  // Draw nodes
  for (let i = 0; i < NODE_NAMES.length; i++) {
    const x = NODE_POS[i].x * W, y = NODE_POS[i].y * H;
    const state = s.nodeState[i];
    let fill = '#1e293b', stroke = '#475569', textColor = '#e2e8f0';
    if(state==='updated'){ fill='#451a03'; stroke='#fbbf24'; textColor='#fbbf24'; }
    else if(state==='settled'){ fill='#052e16'; stroke='#4ade80'; textColor='#4ade80'; }

    // Show dist value below node
    const d = s.dist[i];
    const dLabel = d===INF?'∞':String(d);
    const dColor = state==='updated'?'#fbbf24':(state==='settled'?'#4ade80':'#64748b');

    html += `<circle cx="${x}" cy="${y}" r="${R}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
    html += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" font-family="system-ui" fill="${textColor}">${NODE_NAMES[i]}</text>`;
    html += `<text x="${x}" y="${y+R+11}" text-anchor="middle" dominant-baseline="middle" font-size="10" font-family="monospace" fill="${dColor}">${dLabel}</text>`;
  }

  svg.innerHTML = html;
}

function highlightLines(lines) {
  // highlighting is now handled by renderCode()
}

function render() {
  if(!steps.length) return;
  const s = steps[cur];
  renderGraph(s);
  renderDistList(s);
  renderCode();
  document.getElementById('descText').textContent = s.desc;
  document.getElementById('stepCounter').textContent = `${cur+1} / ${steps.length}`;
  document.getElementById('btnPrev').disabled = cur === 0;
  document.getElementById('btnNext').disabled = cur === steps.length-1;
}

function setStart(n) {
  stopPlay();
  startNode = n;
  document.querySelectorAll('.start-btn').forEach((b,i)=>b.classList.toggle('active',i===n));
  init();
}

function init() {
  steps = generateSteps(startNode);
  cur = 0;
  render();
}

function reset() {
  stopPlay();
  init();
}

function prev() {
  if(cur > 0){ cur--; render(); }
}

function next() {
  if(cur < steps.length-1){ cur++; render(); }
}

function stopPlay() {
  playing = false;
  clearInterval(timer);
  timer = null;
  document.getElementById('btnPlay').textContent = '▶ 播放';
}

function togglePlay() {
  if(!playing && cur >= steps.length-1){ cur = 0; render(); }
  if(playing){ stopPlay(); return; }
  playing = true;
  document.getElementById('btnPlay').textContent = '⏸ 暂停';
  const spd = SPEED[parseInt(document.getElementById('speedRange').value)-1];
  timer = setInterval(()=>{
    if(cur >= steps.length-1){ stopPlay(); return; }
    cur++; render();
  }, spd);
}

document.getElementById('btnReset').onclick = reset;
document.getElementById('btnPrev').onclick = prev;
document.getElementById('btnNext').onclick = next;
document.getElementById('btnPlay').onclick = togglePlay;
document.getElementById('speedRange').oninput = () => {
  if(playing){ stopPlay(); togglePlay(); }
};

LangSwitcher.init(renderCode);
renderCode();
window.addEventListener('resize', ()=>{ if(steps.length) renderGraph(steps[cur]); });
init();
</script>
</body>
</html>
