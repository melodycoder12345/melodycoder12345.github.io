<script>
const CODE = [
  {h:`<span class="kw">type</span> ACNode <span class="kw">struct</span> {`},                                  // 0
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;children [<span class="num">26</span>]<span class="kw">int</span>    <span class="cm">// -1 表示无子节点</span>`},     // 1
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;fail     <span class="kw">int</span>       <span class="cm">// fail 指针</span>`},            // 2
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;output   []<span class="kw">string</span> <span class="cm">// 匹配的模式</span>`},           // 3
  {h:`}`},                                                                          // 4
  {h:``},                                                                           // 5
  {h:`<span class="cm">// Build 构建 AC 自动机</span>`},                                         // 6
  {h:`<span class="kw">func</span> <span class="fn">Build</span>(patterns []<span class="kw">string</span>) []ACNode {`},      // 7
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// 第一步：建 Trie</span>`},                               // 8
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> _, p := <span class="kw">range</span> patterns {`},               // 9
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;cur := root`},                                   // 10
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> _, c := <span class="kw">range</span> p {`},           // 11
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// 沿字符建路径</span>`},               // 12
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> ac[cur].children[c] == -<span class="num">1</span> {`}, // 13
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ac[cur].children[c] = <span class="fn">newNode</span>(ac)`}, // 14
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},                               // 15
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;cur = ac[cur].children[c]`},    // 16
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},                               // 17
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ac[cur].output = <span class="fn">append</span>(ac[cur].output, p)`}, // 18
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;}`},                                   // 19
  {h:``},                                                                           // 20
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// 第二步：BFS 构建 fail 指针</span>`},              // 21
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;q := []<span class="kw">int</span>{root}`},                         // 22
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> <span class="fn">len</span>(q) > <span class="num">0</span> {`},                    // 23
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;cur := q[<span class="num">0</span>]; q = q[<span class="num">1</span>:]`},          // 24
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> c, next := <span class="kw">range</span> ac[cur].children {`},  // 25
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> next == -<span class="num">1</span> { <span class="kw">continue</span> }`}, // 26
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;f := ac[cur].fail`},              // 27
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> f != root && ac[f].children[c] == -<span class="num">1</span> {`}, // 28
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;f = ac[f].fail <span class="cm">// 沿 fail 链找</span>`}, // 29
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},                               // 30
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> ac[f].children[c] != -<span class="num">1</span> && ac[f].children[c] != next {`}, // 31
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ac[next].fail = ac[f].children[c]`}, // 32
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},                               // 33
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;q = <span class="fn">append</span>(q, next)`},              // 34
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},                               // 35
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;}`},                                   // 36
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> ac`},                            // 37
  {h:`}`},                                                                          // 38
  {h:``},                                                                           // 39
  {h:`<span class="cm">// Search 在文本中搜索所有模式</span>`},                                  // 40
  {h:`<span class="kw">func</span> <span class="fn">Search</span>(ac []ACNode, text <span class="kw">string</span>) {`},    // 41
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;cur := root`},                               // 42
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> i, c := <span class="kw">range</span> text {`},              // 43
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> cur != root && ac[cur].children[c] == -<span class="num">1</span> {`}, // 44
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;cur = ac[cur].fail <span class="cm">// fail 跳转</span>`}, // 45
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},                               // 46
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> ac[cur].children[c] != -<span class="num">1</span> {`},     // 47
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;cur = ac[cur].children[c]`},    // 48
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},                               // 49
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// 输出匹配（含 fail 链上的输出）</span>`},   // 50
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> t := cur; t != root; t = ac[t].fail {`}, // 51
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">emit</span>(ac[t].output, i)`},           // 52
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},                               // 53
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;}`},                                   // 54
  {h:`}`},                                                                          // 55
];

// ─── Trie structure definition ─────────────────────────────────────
// Node positions in SVG 570×360
// root(0): (285, 35)
// level1: h(1):(150,105), s(2):(420,105)
// level2: h.e(3):(80,175), h.i(4):(220,175), s.h(5):(420,175)
// level3: h.e.r(6):(80,245), h.i.s(7):(220,245), s.h.e(8):(420,245)
// level4: h.e.r.s(9):(80,315)

const NODES_DEF = [
  {id:'root', label:'root', x:285, y:35},
  {id:'h',    label:'h',    x:150, y:105},
  {id:'s',    label:'s',    x:420, y:105},
  {id:'he',   label:'he',   x:80,  y:175, out:['he']},
  {id:'hi',   label:'hi',   x:220, y:175},
  {id:'sh',   label:'sh',   x:420, y:175},
  {id:'her',  label:'her',  x:80,  y:245},
  {id:'his',  label:'his',  x:220, y:245, out:['his']},
  {id:'she',  label:'she',  x:420, y:245, out:['she']},
  {id:'hers', label:'hers', x:80,  y:315, out:['hers']},
];

// Trie edges (solid) and fail edges (dashed)
const TRIE_EDGES = [
  ['root','h','h'],['root','s','s'],
  ['h','he','e'],['h','hi','i'],
  ['s','sh','h'],
  ['he','her','r'],
  ['hi','his','s'],
  ['sh','she','e'],
  ['her','hers','s'],
];

// Fail edges (after BFS construction)
const FAIL_EDGES = [
  ['sh','h'],    // sh.fail = h
  ['she','he'],  // she.fail = he
  ['his','s'],   // his.fail = s  
  ['hers','s'],  // hers.fail = s
];

// ─── Scene data ────────────────────────────────────────────────────
const SCENES = [
  {
    label: '构建自动机',
    showText: false,
    steps: [
      { visNodes:['root'], visEdges:[], visFailEdges:[], hlNodes:['root'], hlEdges:[], outputs:{},
        desc:'初始化 root 节点。AC 自动机是带 fail 指针的 Trie 树', code:[0,1,2,3,7,8] },
      { visNodes:['root','h','he'], visEdges:[['root','h'],['h','he']], visFailEdges:[], hlNodes:['he'], hlEdges:[['root','h'],['h','he']], outputs:{he:['he']},
        desc:'插入模式 "he"：root→h→e。节点 he 标记为终止节点（输出 "he"）', code:[9,10,11,13,14,16,18] },
      { visNodes:['root','h','he','s','sh','she'], visEdges:[['root','h'],['h','he'],['root','s'],['s','sh'],['sh','she']], visFailEdges:[], hlNodes:['she'], hlEdges:[['root','s'],['s','sh'],['sh','she']], outputs:{he:['he'],she:['she']},
        desc:'插入模式 "she"：root→s→h→e。节点 she 标记为终止节点（输出 "she"）', code:[9,11,13,14,16,18] },
      { visNodes:['root','h','he','hi','his','s','sh','she'], visEdges:[['root','h'],['h','he'],['h','hi'],['hi','his'],['root','s'],['s','sh'],['sh','she']], visFailEdges:[], hlNodes:['his'], hlEdges:[['root','h'],['h','hi'],['hi','his']], outputs:{he:['he'],she:['she'],his:['his']},
        desc:'插入模式 "his"：root→h→i→s（共用 h 节点）。节点 his 标记输出 "his"', code:[9,10,11,13,14,16,18] },
      { visNodes:NODES_DEF.map(n=>n.id), visEdges:TRIE_EDGES.map(e=>[e[0],e[1]]), visFailEdges:[], hlNodes:['hers'], hlEdges:[['h','he'],['he','her'],['her','hers']], outputs:{he:['he'],she:['she'],his:['his'],hers:['hers']},
        desc:'插入模式 "hers"：root→h→e→r→s（复用 h, he 节点）。Trie 构建完成，4 个模式共享前缀节点', code:[9,18,19] },
      { visNodes:NODES_DEF.map(n=>n.id), visEdges:TRIE_EDGES.map(e=>[e[0],e[1]]), visFailEdges:[['sh','h']], hlNodes:['sh','h'], hlEdges:[['sh','h']], outputs:{he:['he'],she:['she'],his:['his'],hers:['hers']},
        desc:'BFS 构建 fail 指针。sh.fail = h（"sh" 最长真后缀是 "h"，h 是某模式前缀）', code:[21,22,23,24,25,27,28,29,31,32] },

      { visNodes:NODES_DEF.map(n=>n.id), visEdges:TRIE_EDGES.map(e=>[e[0],e[1]]), visFailEdges:FAIL_EDGES.map(e=>[e[0],e[1]]), hlNodes:['root'], hlEdges:[], curNode:'root', textIdx:0, matchedWords:[],

const TEXT = 'ushers';
const SPEED = [2000,1200,700,350,120];
const SPEED_LABELS = ['极慢','慢','中速','快','极快'];
const speedVal = document.getElementById('speedVal');
function updateSpeedLabel(){speedVal.textContent=SPEED_LABELS[parseInt(document.getElementById('speedRange').value)-1];}
document.getElementById('speedRange').addEventListener('input',function(){updateSpeedLabel();});
updateSpeedLabel();
let curScene = 0, curStep = 0, playing = false, timer = null;
const SVG_NS = 'http://www.w3.org/2000/svg';

// ─── SVG helpers ─────────────────────────────────────────────────
function svgEl(tag, attrs) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

function getNode(id) { return NODES_DEF.find(n => n.id === id); }

function drawTrieEdge(svg, fid, tid, label, isHL, isDashed) {
  const f = getNode(fid), t = getNode(tid);
  if (!f || !t) return;
  const dx = t.x-f.x, dy = t.y-f.y, len = Math.sqrt(dx*dx+dy*dy);
  const r = 16;
  const sx = f.x+dx/len*r, sy = f.y+dy/len*r;
  const ex = t.x-dx/len*(r+3), ey = t.y-dy/len*(r+3);

  if (isDashed) {
    // Fail edge: curved dashed line
    const mx = (sx+ex)/2 + (dy/len)*40, my = (sy+ey)/2 - (dx/len)*40;
    const path = svgEl('path', {
      d:`M ${sx},${sy} Q ${mx},${my} ${ex},${ey}`,
      stroke: isHL ? '#c084fc' : '#334155',
      'stroke-width': isHL ? '2' : '1',
      fill:'none', 'stroke-dasharray':'5,3',
      'marker-end':`url(#${isHL?'arr-fail-hl':'arr-fail'})`
    });
    svg.appendChild(path);
    // Label "fail"
    const lx = 0.25*sx+0.5*mx+0.25*ex, ly = 0.25*sy+0.5*my+0.25*ey;
    const lt = svgEl('text', {x:lx,y:ly-2,'text-anchor':'middle','font-size':'7','font-family':'monospace',fill:isHL?'#c084fc':'#475569'});
    lt.textContent = 'fail';
    svg.appendChild(lt);
  } else {
    const line = svgEl('line', {x1:sx,y1:sy,x2:ex,y2:ey,
      stroke:isHL?'#38bdf8':'#475569','stroke-width':isHL?'2':'1.5','stroke-linecap':'round',
      'marker-end':`url(#${isHL?'arr-hl':'arr'})`
    });
    svg.appendChild(line);
    // Edge label (char)
    if (label) {
      const lx = (sx+ex)/2-4, ly = (sy+ey)/2-3;
      const lt = svgEl('text', {x:lx,y:ly,'text-anchor':'middle','font-size':'10','font-family':'monospace',
        fill:isHL?'#38bdf8':'#94a3b8','font-weight':'700'});
      lt.textContent = label;
      svg.appendChild(lt);
    }
  }
}

function drawACNode(svg, node, isHL, isCurMatch, outputs) {
  const g = svgEl('g', {});
  const r = 16;
  const hasOut = outputs && node.out && node.out.length > 0;
  // Glow
  if (isHL) {
    const glow = svgEl('circle', {cx:node.x,cy:node.y,r:r+5,fill:isCurMatch?'rgba(74,222,128,.2)':'rgba(56,189,248,.15)'});
    g.appendChild(glow);
  }
  // Double ring for output nodes
  if (hasOut) {
    const outer = svgEl('circle', {cx:node.x,cy:node.y,r:r+3,fill:'none',stroke:isHL?'#4ade80':'#22c55e','stroke-width':'1.5'});
    g.appendChild(outer);
  }
  const fill = isCurMatch ? 'rgba(74,222,128,.25)' : isHL ? 'rgba(56,189,248,.2)' : 'var(--panel2, #1e293b)';
  const stroke = isCurMatch ? '#4ade80' : isHL ? '#38bdf8' : '#475569';
  const circle = svgEl('circle', {cx:node.x,cy:node.y,r,fill,stroke,'stroke-width':'2'});
  g.appendChild(circle);
  // Label
  const disp = node.id === 'root' ? '∅' : node.label.slice(-1);
  const txt = svgEl('text', {x:node.x,y:node.y+5,'text-anchor':'middle','font-size':'12','font-weight':'700','font-family':'monospace',fill:isHL?'#fff':'#e2e8f0'});
  txt.textContent = disp;
  g.appendChild(txt);
  // Output indicator
  if (hasOut && outputs) {
    const ot = svgEl('text', {x:node.x,y:node.y+r+12,'text-anchor':'middle','font-size':'8','font-family':'monospace',fill:'#4ade80'});
    ot.textContent = (node.out||[]).join(',');
    g.appendChild(ot);
  }
  svg.appendChild(g);
}

// ─── Render ───────────────────────────────────────────────────────
function render() {
  const scene = SCENES[curScene];
  const step = scene.steps[curStep];
  const svg = document.getElementById('acSvg');
  svg.innerHTML = `
    <defs>
      <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
        <polygon points="0 0, 7 2.5, 0 5" fill="#475569"/>
      </marker>
      <marker id="arr-hl" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
        <polygon points="0 0, 7 2.5, 0 5" fill="#38bdf8"/>
      </marker>
      <marker id="arr-fail" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
        <polygon points="0 0, 7 2.5, 0 5" fill="#334155"/>
      </marker>
      <marker id="arr-fail-hl" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
        <polygon points="0 0, 7 2.5, 0 5" fill="#c084fc"/>
      </marker>
    </defs>`;

  const visNodeSet = new Set(step.visNodes || []);
  const hlEdgeSet = new Set((step.hlEdges||[]).map(e=>`${e[0]}|${e[1]}`));
  const hlNodeSet = new Set(step.hlNodes||[]);

  // Draw trie edges
  (step.visEdges||[]).forEach(([fid, tid]) => {
    const edgeDef = TRIE_EDGES.find(e => e[0]===fid && e[1]===tid);
    const label = edgeDef ? edgeDef[2] : '';
    const isHL = hlEdgeSet.has(`${fid}|${tid}`);
    if (visNodeSet.has(fid) && visNodeSet.has(tid)) drawTrieEdge(svg, fid, tid, label, isHL, false);
  });

  // Draw fail edges
  (step.visFailEdges||[]).forEach(([fid, tid]) => {
    const isHL = hlEdgeSet.has(`${fid}|${tid}`);
    if (visNodeSet.has(fid) && visNodeSet.has(tid)) drawTrieEdge(svg, fid, tid, '', isHL, true);
  });

  // Draw nodes
  NODES_DEF.forEach(node => {
    if (!visNodeSet.has(node.id)) return;
    const isHL = hlNodeSet.has(node.id);
    const isCurMatch = step.curNode === node.id && scene.showText;
    drawACNode(svg, node, isHL, isCurMatch, step.outputs);
  });

  // Text display
  const textDiv = document.getElementById('textDisplay');
  if (scene.showText) {
    textDiv.style.display = 'flex';
    textDiv.innerHTML = TEXT.split('').map((ch, i) => {
      const matched = step.matchedWords && step.matchedWords.length > 0 && i <= step.textIdx && step.textIdx < i+4;
      const isCur = i === step.textIdx;
      const isPast = i < step.textIdx;
      let cls = '';
      if (isCur) cls = 'cur';
      else if (isPast) cls = 'past';
      return `<div class="text-ch ${cls}">${ch}</div>`;
    }).join('');
  } else {
    textDiv.style.display = 'none';
  }

  // Match badge
  const badge = document.getElementById('matchBadge');
  if (step.matchWord) {
    badge.style.display = '';
    badge.textContent = `匹配: ${step.matchWord}`;
  } else {
    badge.style.display = 'none';
  }

  // Code
  document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
  (step.code||[]).forEach(ln => {
    const el2 = document.querySelector(`.code-line[data-ln="${ln}"]`);
    if (el2) { el2.classList.add('active'); el2.scrollIntoView({block:'nearest'}); }
  });

  document.getElementById('stepDesc').textContent = step.desc;
  document.getElementById('stepCtr').textContent = `${curStep+1} / ${scene.steps.length}`;
  buildStepList();
}

function buildStepList() {
  const scene = SCENES[curScene];
  document.getElementById('stepList').innerHTML = scene.steps.map((s,i) =>
    `<div class="step-item${i===curStep?' active':''}" onclick="goStep(${i})">
      <div class="step-num">步骤 ${i+1}</div>
      <div class="step-text">${s.desc.slice(0,58)}${s.desc.length>58?'…':''}</div>
    </div>`
  ).join('');
}

function buildCode() {
  document.getElementById('codeBody').innerHTML = CODE.map((l,i) =>
    `<div class="code-line" data-ln="${i}"><span class="ln">${i+1}</span><span class="lc">${l.h||'&nbsp;'}</span></div>`
  ).join('');
}

// ─── Controls ─────────────────────────────────────────────────────
function switchScene(idx) {
  curScene=idx; curStep=0; pause();
  document.querySelectorAll('.scene-tab').forEach((t,i) => t.classList.toggle('active',i===idx));
  buildStepList(); render();
}
function goStep(i) { pause(); curStep=i; render(); }
function reset() { pause(); curStep=0; render(); }
function prev() { pause(); if (curStep>0) { curStep--; render(); } }
function next() { pause(); if (curStep<SCENES[curScene].steps.length-1) { curStep++; render(); } }
function togglePlay() { if (playing) pause(); else { if (curStep>=SCENES[curScene].steps.length-1) curStep=0; play(); } }
function play() { playing=true; document.getElementById('btnPlay').textContent='⏸ 暂停'; tick(); }
function pause() { playing=false; clearTimeout(timer); document.getElementById('btnPlay').textContent='▶ 播放'; }
function tick() {
  if (!playing) return;
  const spd = SPEED[parseInt(document.getElementById('speedRange').value)-1];
  if (curStep<SCENES[curScene].steps.length-1) { curStep++; render(); timer=setTimeout(tick,spd); }
  else pause();
}

buildCode(); buildStepList(); render();
</script>
</body>
