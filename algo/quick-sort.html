<script>
const CODE_LINES = [
  {html:`<span class="kw">package</span> <span class="pkg">main</span>`},
  {html:``},
  {html:`<span class="kw">import</span> <span class="st">"fmt"</span>`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">quickSort</span>(arr []<span class="kw">int</span>, lo, hi <span class="kw">int</span>) {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> lo &gt;= hi { <span class="kw">return</span> }`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;p := <span class="fn">partition</span>(arr, lo, hi)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">quickSort</span>(arr, lo, p<span class="op">-</span><span class="num">1</span>)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">quickSort</span>(arr, p<span class="op">+</span><span class="num">1</span>, hi)`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">partition</span>(arr []<span class="kw">int</span>, lo, hi <span class="kw">int</span>) <span class="kw">int</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;pivot := arr[hi]  <span class="cm">// 选最后一个元素为基准</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;i := lo <span class="op">-</span> <span class="num">1</span>       <span class="cm">// i 指向小于pivot的最后位置</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> j := lo; j &lt; hi; j<span class="op">++</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> arr[j] &lt;= pivot {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;i<span class="op">++</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;arr[i], arr[j] = arr[j], arr[i]`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;arr[i<span class="op">+</span><span class="num">1</span>], arr[hi] = arr[hi], arr[i<span class="op">+</span><span class="num">1</span>]`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> i <span class="op">+</span> <span class="num">1</span>`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">main</span>() {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;arr := []<span class="kw">int</span>{<span class="num">10</span>, <span class="num">7</span>, <span class="num">8</span>, <span class="num">9</span>, <span class="num">1</span>, <span class="num">5</span>, <span class="num">3</span>}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">quickSort</span>(arr, <span class="num">0</span>, <span class="fn">len</span>(arr)<span class="op">-</span><span class="num">1</span>)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">fmt</span>.<span class="fn">Println</span>(arr)`},
  {html:`}`},
];

window.LANG_PLAIN = {
  js: `function quickSort(arr, low = 0, high = arr.length - 1) {
    if (low < high) {
        const pi = partition(arr, low, high);
        quickSort(arr, low, pi - 1);
        quickSort(arr, pi + 1, high);
    }
}

function partition(arr, low, high) {
    const pivot = arr[high];
    let i = low - 1;
    for (let j = low; j < high; j++) {
        if (arr[j] <= pivot) {
            i++;
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }
    [arr[i + 1], arr[high]] = [arr[high], arr[i + 1]];
    return i + 1;
}

const arr = [10, 7, 8, 9, 1, 5];
quickSort(arr);
console.log(arr);`,
  py: `def quick_sort(arr, low=0, high=None):
    if high is None:
        high = len(arr) - 1
    if low < high:
        pi = partition(arr, low, high)
        quick_sort(arr, low, pi - 1)
        quick_sort(arr, pi + 1, high)

def partition(arr, low, high):
    pivot = arr[high]
    i = low - 1
    for j in range(low, high):
        if arr[j] <= pivot:
            i += 1
            arr[i], arr[j] = arr[j], arr[i]
    arr[i + 1], arr[high] = arr[high], arr[i + 1]
    return i + 1

arr = [10, 7, 8, 9, 1, 5]
quick_sort(arr)
print(arr)`
};

function generateSteps(arr) {
  const steps = [];
  const a = [...arr];
  let cmps = 0, swps = 0;
  const sorted = new Set();

  function snap(pivot, comparing, swapping, lines, desc) {
    steps.push({
      arr:[...a], pivot, comparing:[...comparing], swapping:[...swapping],
      sorted:[...sorted], highlightLines:lines, description:desc, cmps, swps
    });
  }

  function partition(lo, hi) {
    const pivotVal = a[hi];
    snap(hi, [], [], [11,12,13], `分区 [${lo}..${hi}]，pivot=${pivotVal}`);
    let i = lo - 1;
    for (let j = lo; j < hi; j++) {
      cmps++;
      snap(hi, [j], [], [14,15], `比较 arr[${j}]=${a[j]} 与 pivot=${pivotVal}`);
      if (a[j] <= pivotVal) {
        i++;
        if (i !== j) {
          [a[i], a[j]] = [a[j], a[i]];
          swps++;
          snap(hi, [], [i, j], [16,17], `arr[${j}]=${a[j]}<=pivot，与 arr[${i}]=${a[i]} 交换`);
        } else {
          snap(hi, [i], [], [16], `arr[${j}] 就在正确位置`);
        }
      }
    }
    [a[i+1], a[hi]] = [a[hi], a[i+1]];
    swps++;
    sorted.add(i+1);
    snap(i+1, [], [i+1, hi], [20], `pivot 放入最终位置 ${i+1}`);
    return i + 1;
  }

  function quickSort(lo, hi) {
    if (lo >= hi) {
      if (lo === hi) sorted.add(lo);
      snap(-1, [], [], [5], lo===hi?`arr[${lo}] 长度1，已有序`:`区间 [${lo}..${hi}] 空`);
      return;
    }
    snap(-1, [], [], [4,6], `quickSort([${lo}..${hi}])`);
    const p = partition(lo, hi);
    snap(p, [], [], [7], `递归排序左半 [${lo}..${p-1}]`);
    quickSort(lo, p-1);
    snap(p, [], [], [8], `递归排序右半 [${p+1}..${hi}]`);
    quickSort(p+1, hi);
  }

  snap(-1, [], [], [25], '初始数组，准备快速排序');
  quickSort(0, a.length-1);
  sorted.clear();
  for(let i=0;i<a.length;i++)sorted.add(i);
  snap(-1, [], [], [26,27,28], '排序完成！');
  return steps;
}

const INITIAL = [10, 7, 8, 9, 1, 5, 3];
const MAX_VAL = Math.max(...INITIAL);
let steps = generateSteps(INITIAL);
let cur = 0, playing = false, timer = null;
const SPEED = [2000,1200,700,350,120];

const mainBars=document.getElementById('mainBars'),codeBody=document.getElementById('codeBody'),
  descText=document.getElementById('descText'),stepCounter=document.getElementById('stepCounter'),
  cmpCount=document.getElementById('cmpCount'),swpCount=document.getElementById('swpCount'),
  btnPlay=document.getElementById('btnPlay'),btnPrev=document.getElementById('btnPrev'),
  btnNext=document.getElementById('btnNext'),btnReset=document.getElementById('btnReset'),
  speedRange=document.getElementById('speedRange'),speedVal=document.getElementById('speedVal');
const SPEED_LABELS=['慢','较慢','中','较快','快'];
function updateSpeedLabel(){speedVal.textContent=SPEED_LABELS[parseInt(speedRange.value)-1];}
speedRange.addEventListener('input',updateSpeedLabel);
updateSpeedLabel();

function buildCode(){
  codeBody.innerHTML=CODE_LINES.map((l,i)=>`<div class="code-line" data-line="${i}"><span class="ln">${i+1}</span><span class="lc">${l.html||'&nbsp;'}</span></div>`).join('');
  codeBody.querySelectorAll('.code-line').forEach(el=>el.addEventListener('click',()=>jumpToLine(parseInt(el.dataset.line))));
}
function highlightLines(lines){
  codeBody.querySelectorAll('.code-line').forEach(el=>el.classList.remove('active'));
  lines.forEach(ln=>{const el=codeBody.querySelector(`[data-line="${ln}"]`);if(el)el.classList.add('active');});
  if(lines.length>0){const f=codeBody.querySelector(`[data-line="${lines[0]}"]`);if(f)f.scrollIntoView({block:'nearest'});}
}
function jumpToLine(ln){let t=cur,b=Infinity;steps.forEach((s,i)=>{if(s.highlightLines.includes(ln)){const d=Math.abs(i-cur);if(d<b){b=d;t=i;}}});cur=t;render();}
function renderCode() {
  const lines = (LangSwitcher.current !== 'go' && LangSwitcher.getLines(LangSwitcher.current))
    || CODE_LINES;
  const hl = LangSwitcher.getHL(steps[cur]);
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i) ? ' active' : '';
    return `<div class="code-line${active}" onclick="jumpToLine(${i})">${line.html || '&nbsp;'}</div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}
function buildMainBars(n){
  mainBars.innerHTML='';
  for(let i=0;i<n;i++){
    const w=document.createElement('div');w.className='main-bar-wrap';
    const pm=document.createElement('div');pm.className='pivot-marker';pm.style.display='none';
    const b=document.createElement('div');b.className='main-bar';
    const v=document.createElement('div');v.className='main-bar-val';b.appendChild(v);
    const l=document.createElement('div');l.className='main-bar-label';
    w.appendChild(pm);w.appendChild(b);w.appendChild(l);mainBars.appendChild(w);
  }
}
function render(){
  const s=steps[cur];
  if(mainBars.children.length!==s.arr.length)buildMainBars(s.arr.length);
  mainBars.querySelectorAll('.main-bar-wrap').forEach((wrap,i)=>{
    const bar=wrap.querySelector('.main-bar'),lbl=wrap.querySelector('.main-bar-label');
    const pm=wrap.querySelector('.pivot-marker');
    bar.style.height=`${Math.max(s.arr[i]/MAX_VAL*100,6).toFixed(1)}%`;
    bar.querySelector('.main-bar-val').textContent=s.arr[i];
    lbl.textContent=i;
    pm.style.display=s.pivot===i?'block':'none';
    pm.textContent=s.pivot===i?'▲ pivot':'';
    let color='#334155';
    if(s.sorted.includes(i))color='#4ade80';
    if(s.swapping.includes(i))color='#fb923c';
    if(s.comparing.includes(i))color='#fbbf24';
    if(s.pivot===i)color='#f87171';
    bar.style.background=color;
    bar.style.boxShadow=(s.comparing.includes(i)||s.swapping.includes(i)||s.pivot===i)?`0 0 14px ${color}99`:'none';
    const valEl=bar.querySelector('.main-bar-val');
    const isActive=s.comparing.includes(i)||s.swapping.includes(i)||s.pivot===i;
    valEl.style.fontSize=isActive?'0.95rem':'0.82rem';
    valEl.style.fontWeight=isActive?'900':'700';
  });
  renderCode();
  descText.textContent=s.description;
  stepCounter.textContent=`${cur+1} / ${steps.length}`;
  cmpCount.textContent=s.cmps;
  swpCount.textContent=s.swps;
  btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;
}
function play(){if(cur>=steps.length-1)cur=0;playing=true;btnPlay.innerHTML='⏸ 暂停';tick();}
function pause(){playing=false;clearTimeout(timer);btnPlay.innerHTML='▶ 播放';}
function tick(){if(!playing)return;if(cur<steps.length-1){cur++;render();timer=setTimeout(tick,SPEED[parseInt(speedRange.value)-1]);}else pause();}
btnPlay.addEventListener('click',()=>playing?pause():play());
btnPrev.addEventListener('click',()=>{pause();if(cur>0){cur--;render();}});
btnNext.addEventListener('click',()=>{pause();if(cur<steps.length-1){cur++;render();}});
btnReset.addEventListener('click',()=>{pause();cur=0;render();});
buildCode();buildMainBars(INITIAL.length);LangSwitcher.init(renderCode);render();
setTimeout(function(){
  var p=document.getElementById('__autoConcept');if(!p)return;
  var d=document.createElement('div');
  d.innerHTML='<div class="cp-divider" style="margin:6px 0 0"></div>'+
    '<div class="cp-section"><div class="cp-title">算法原理</div>'+
    '<div class="cp-desc">选定一个基准值（pivot），将数组分区：小于基准放左、大于基准放右，基准就位后递归对左右子数组重复此过程。</div></div>'+
    '<div class="cp-divider"></div>'+
    '<div class="cp-section"><div class="cp-title">复杂度</div>'+
    '<table class="cp-table"><tr><td>最好时间</td><td>O(n log n)</td></tr><tr><td>平均时间</td><td>O(n log n)</td></tr><tr><td>最坏时间</td><td>O(n²)</td></tr><tr><td>空间</td><td>O(log n)</td></tr><tr><td>稳定性</td><td><span class="cp-tag unstable">不稳定</span></td></tr></table></div>'+
    '<div class="cp-divider"></div>'+
    '<div class="cp-section" style="padding-bottom:14px"><div class="cp-title">关键特性</div>'+
    '<ul class="cp-list"><li><strong>实践最快</strong>：平均常数因子最小，缓存访问模式友好</li><li><strong>原地排序</strong>：只需 O(log n) 递归栈空间</li><li><strong>最坏 O(n²)</strong>：已排序数组选固定端点为基准时退化</li><li>随机化选取基准可将最坏情况概率降到极低</li></ul></div>';
  p.querySelectorAll('.sn-auto-concept-h,.sn-auto-card').forEach(function(el){el.remove();});
  p.appendChild(d);
},250);
</script>
