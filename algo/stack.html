<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栈 - 算法可视化</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--border:#334155;--text:#e2e8f0;--dim:#94a3b8;--blue:#38bdf8;--yellow:#fbbf24;--orange:#fb923c;--green:#4ade80;--purple:#c084fc;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
nav{display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.back-btn{color:var(--dim);text-decoration:none;font-size:0.9rem;}.back-btn:hover{color:var(--text);}
nav h1{font-size:1.2rem;font-weight:600;}.complexity{margin-left:auto;display:flex;gap:8px;}
.badge{font-size:0.75rem;padding:3px 10px;border-radius:100px;font-family:monospace;}
.badge.time{background:rgba(74,222,128,0.15);color:var(--green);}.badge.space{background:rgba(196,132,252,0.15);color:var(--purple);}
.main{display:flex;flex:1;overflow:hidden;}
.viz-panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;}
.op-row{display:flex;gap:8px;padding:12px 24px;border-bottom:1px solid var(--border);align-items:center;}
.op-btn{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:0.82rem;transition:all 0.15s;}
.op-btn:hover{background:rgba(255,255,255,0.12);}.op-btn.active-op{background:rgba(56,189,248,0.15);border-color:rgba(56,189,248,0.4);color:var(--blue);}
.op-input{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;font-size:0.82rem;width:70px;outline:none;}
.op-input:focus{border-color:var(--blue);}
.go-btn{background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.3);color:var(--blue);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:0.82rem;}
.go-btn:hover{background:rgba(56,189,248,0.25);}
.viz-area{flex:1;display:flex;align-items:center;justify-content:center;gap:60px;padding:20px 40px;}
.stack-container{display:flex;flex-direction:column;align-items:center;gap:0;width:140px;}
.stack-top-label{font-size:0.75rem;font-family:monospace;color:var(--dim);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.stack-items{display:flex;flex-direction:column-reverse;width:100%;border:2px solid var(--border);border-top:none;border-radius:0 0 8px 8px;min-height:240px;overflow:hidden;position:relative;}
.stack-open-top{width:100%;height:12px;border:2px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;margin-bottom:0;}
.stack-item{height:48px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;font-family:monospace;border-top:1px solid var(--border);transition:all 0.3s ease;position:relative;}
.stack-item .item-idx{position:absolute;right:8px;bottom:4px;font-size:0.6rem;color:var(--dim);}
.stack-info{display:flex;flex-direction:column;gap:12px;min-width:160px;}
.info-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 16px;}
.info-label{font-size:0.72rem;color:var(--dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.05em;}
.info-val{font-size:1.3rem;font-weight:700;font-family:monospace;color:var(--text);}
.info-val.empty{color:var(--dim);font-size:0.9rem;}
.desc-box{padding:12px 24px;background:rgba(255,255,255,0.03);border-top:1px solid var(--border);font-size:0.9rem;color:var(--dim);min-height:44px;display:flex;align-items:center;gap:12px;}
.step-counter{margin-left:auto;font-size:0.8rem;color:var(--dim);font-family:monospace;white-space:nowrap;}
.code-panel{width:45%;min-width:380px;display:flex;flex-direction:column;overflow:hidden;}
.code-panel-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:0.85rem;color:var(--dim);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.code-dot{width:10px;height:10px;border-radius:50%;}
.code-body{flex:1;overflow-y:auto;padding:16px 0;background:#0d1117;}
.code-body::-webkit-scrollbar{width:6px;}.code-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.code-line{display:flex;align-items:stretch;padding:1px 0;cursor:pointer;transition:background 0.15s;font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.6;}
.code-line:hover{background:rgba(255,255,255,0.04);}.code-line.active{background:rgba(251,191,36,0.12);}.code-line.active .ln{color:var(--yellow);}
.ln{min-width:48px;padding:0 12px 0 16px;color:#4b5563;text-align:right;user-select:none;flex-shrink:0;font-size:0.78rem;}
.lc{padding:0 16px 0 4px;flex:1;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.num{color:#79c0ff;}.pkg{color:#ffa657;}.op{color:#ff7b72;}.id{color:#e6edf3;}.cm{color:#8b949e;font-style:italic;}
.controls{display:flex;align-items:center;gap:10px;padding:12px 24px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;}
.btn{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:7px;cursor:pointer;font-size:0.85rem;transition:all 0.15s;}
.btn:hover{background:rgba(255,255,255,0.12);}.btn.primary{background:rgba(56,189,248,0.15);border-color:rgba(56,189,248,0.3);color:var(--blue);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.speed-wrap{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:0.8rem;color:var(--dim);}
input[type=range]{-webkit-appearance:none;width:90px;height:4px;background:var(--border);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--blue);cursor:pointer;}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="back-btn">← 返回</a>
  <h1>栈 Stack（LIFO 后进先出）</h1>
  <div class="complexity"><span class="badge time">操作 O(1)</span><span class="badge space">空间 O(n)</span></div>
</nav>
<div class="main">
  <div class="viz-panel">
    <div class="op-row">
      <button class="op-btn active-op" id="opPush">Push 入栈</button>
      <button class="op-btn" id="opPop">Pop 出栈</button>
      <button class="op-btn" id="opPeek">Peek 查看栈顶</button>
      <input type="number" class="op-input" id="opVal" value="42" placeholder="值">
      <button class="go-btn" id="goBtn">执行 ▶</button>
    </div>
    <div class="viz-area">
      <div class="stack-container">
        <div class="stack-top-label"><span>↑ 顶部 (Top)</span></div>
        <div class="stack-open-top"></div>
        <div class="stack-items" id="stackItems"></div>
      </div>
      <div class="stack-info">
        <div class="info-card">
          <div class="info-label">栈顶 (Top)</div>
          <div class="info-val" id="infoTop"><span class="empty">空</span></div>
        </div>
        <div class="info-card">
          <div class="info-label">大小 (Size)</div>
          <div class="info-val" id="infoSize">0</div>
        </div>
        <div class="info-card">
          <div class="info-label">是否为空</div>
          <div class="info-val" id="infoEmpty" style="color:var(--green)">true</div>
        </div>
      </div>
    </div>
    <div class="desc-box">
      <span id="descText">选择操作并点击执行</span>
      <span class="step-counter" id="stepCounter"></span>
    </div>
  </div>
  <div class="code-panel">
    <div class="code-panel-header">
      <div class="code-dot" style="background:#ff5f57"></div>
      <div class="code-dot" style="background:#febc2e"></div>
      <div class="code-dot" style="background:#28c840"></div>
      <span style="margin-left:4px">stack.go</span>
    </div>
    <div class="code-body" id="codeBody"></div>
  </div>
</div>
<div class="controls">
  <button class="btn" id="btnReset">⏮ 重置</button>
  <button class="btn" id="btnPrev">◀ 上一步</button>
  <button class="btn primary" id="btnPlay">▶ 播放</button>
  <button class="btn" id="btnNext">下一步 ▶</button>
  <div class="speed-wrap"><span>🐢</span><input type="range" id="speedRange" min="1" max="5" value="3"><span>🐇</span></div>
</div>
<script>
const CODE_LINES = [
  {html:`<span class="kw">package</span> <span class="pkg">main</span>`},
  {html:``},
  {html:`<span class="kw">type</span> <span class="id">Stack</span> <span class="kw">struct</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;items []<span class="kw">int</span>`},
  {html:`}`},
  {html:``},
  {html:`<span class="cm">// Push: 压栈，O(1)</span>`},
  {html:`<span class="kw">func</span> (s *<span class="id">Stack</span>) <span class="fn">Push</span>(val <span class="kw">int</span>) {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;s.items = <span class="fn">append</span>(s.items, val)`},
  {html:`}`},
  {html:``},
  {html:`<span class="cm">// Pop: 弹栈，O(1)</span>`},
  {html:`<span class="kw">func</span> (s *<span class="id">Stack</span>) <span class="fn">Pop</span>() (<span class="kw">int</span>, <span class="kw">bool</span>) {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> <span class="fn">len</span>(s.items) == <span class="num">0</span> { <span class="kw">return</span> <span class="num">0</span>, <span class="kw">false</span> }`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;top := s.items[<span class="fn">len</span>(s.items)<span class="op">-</span><span class="num">1</span>]`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;s.items = s.items[:<span class="fn">len</span>(s.items)<span class="op">-</span><span class="num">1</span>]`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> top, <span class="kw">true</span>`},
  {html:`}`},
  {html:``},
  {html:`<span class="cm">// Peek: 查看栈顶，不弹出</span>`},
  {html:`<span class="kw">func</span> (s *<span class="id">Stack</span>) <span class="fn">Peek</span>() (<span class="kw">int</span>, <span class="kw">bool</span>) {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> <span class="fn">len</span>(s.items) == <span class="num">0</span> { <span class="kw">return</span> <span class="num">0</span>, <span class="kw">false</span> }`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> s.items[<span class="fn">len</span>(s.items)<span class="op">-</span><span class="num">1</span>], <span class="kw">true</span>`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">func</span> (s *<span class="id">Stack</span>) <span class="fn">IsEmpty</span>() <span class="kw">bool</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> <span class="fn">len</span>(s.items) == <span class="num">0</span>`},
  {html:`}`},
];

let stackData = [];
let steps = [];
let cur = 0, playing = false, timer = null;
const SPEED = [800,500,300,180,80];
let currentOp = 'push';

const stackItems=document.getElementById('stackItems'),codeBody=document.getElementById('codeBody'),
  descText=document.getElementById('descText'),stepCounter=document.getElementById('stepCounter'),
  infoTop=document.getElementById('infoTop'),infoSize=document.getElementById('infoSize'),
  infoEmpty=document.getElementById('infoEmpty'),btnPlay=document.getElementById('btnPlay'),
  btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),
  btnReset=document.getElementById('btnReset'),speedRange=document.getElementById('speedRange'),
  goBtn=document.getElementById('goBtn'),opVal=document.getElementById('opVal');

const opBtns = {push:document.getElementById('opPush'),pop:document.getElementById('opPop'),peek:document.getElementById('opPeek')};
Object.entries(opBtns).forEach(([op,btn])=>{
  btn.addEventListener('click',()=>{
    currentOp=op;
    Object.values(opBtns).forEach(b=>b.classList.remove('active-op'));
    btn.classList.add('active-op');
    opVal.style.display=op==='push'?'inline-block':'none';
  });
});

function generatePushSteps(stack, val) {
  const steps = [];
  steps.push({stack:[...stack],highlight:-1,adding:-1,lines:[7],desc:`Push(${val}): 准备入栈`});
  steps.push({stack:[...stack],highlight:-1,adding:-1,lines:[8],desc:`s.items = append(s.items, ${val})`});
  const newStack=[...stack,val];
  steps.push({stack:newStack,highlight:newStack.length-1,adding:newStack.length-1,lines:[8],desc:`${val} 已压入栈顶，size=${newStack.length}`});
  return steps;
}
function generatePopSteps(stack) {
  const steps = [];
  if(stack.length===0){steps.push({stack:[],highlight:-1,adding:-1,lines:[13],desc:'栈为空，Pop 失败，返回 false'});return steps;}
  const top=stack[stack.length-1];
  steps.push({stack:[...stack],highlight:-1,adding:-1,lines:[12],desc:`Pop(): 准备弹栈`});
  steps.push({stack:[...stack],highlight:stack.length-1,adding:-1,lines:[13,14],desc:`检查非空，top = items[${stack.length-1}] = ${top}`});
  steps.push({stack:[...stack],highlight:stack.length-1,adding:-1,lines:[15],desc:`移除最后元素 ${top}`});
  const newStack=stack.slice(0,-1);
  steps.push({stack:newStack,highlight:-1,adding:-1,lines:[16],desc:`返回 (${top}, true)，size=${newStack.length}`});
  return steps;
}
function generatePeekSteps(stack) {
  const steps = [];
  if(stack.length===0){steps.push({stack:[],highlight:-1,adding:-1,lines:[21],desc:'栈为空，Peek 失败'});return steps;}
  const top=stack[stack.length-1];
  steps.push({stack:[...stack],highlight:-1,adding:-1,lines:[20],desc:`Peek(): 查看栈顶，不移除`});
  steps.push({stack:[...stack],highlight:stack.length-1,adding:-1,lines:[21,22],desc:`检查非空，返回 items[${stack.length-1}] = ${top}`});
  steps.push({stack:[...stack],highlight:stack.length-1,adding:-1,lines:[22],desc:`栈顶是 ${top}，栈不变`});
  return steps;
}

goBtn.addEventListener('click', () => {
  pause();
  const val = parseInt(opVal.value);
  let newSteps = [];
  if (currentOp==='push') { if(isNaN(val))return; newSteps=generatePushSteps(stackData,val); stackData=[...stackData,val]; }
  else if (currentOp==='pop') { newSteps=generatePopSteps(stackData); if(stackData.length>0)stackData=stackData.slice(0,-1); }
  else if (currentOp==='peek') { newSteps=generatePeekSteps(stackData); }
  steps=newSteps; cur=0; render();
});

function buildCode(){
  codeBody.innerHTML=CODE_LINES.map((l,i)=>`<div class="code-line" data-line="${i}"><span class="ln">${i+1}</span><span class="lc">${l.html||'&nbsp;'}</span></div>`).join('');
  codeBody.querySelectorAll('.code-line').forEach(el=>el.addEventListener('click',()=>jumpToLine(parseInt(el.dataset.line))));
}
function highlightLines(lines){
  codeBody.querySelectorAll('.code-line').forEach(el=>el.classList.remove('active'));
  lines.forEach(ln=>{const el=codeBody.querySelector(`[data-line="${ln}"]`);if(el)el.classList.add('active');});
  if(lines.length>0){const f=codeBody.querySelector(`[data-line="${lines[0]}"]`);if(f)f.scrollIntoView({block:'nearest'});}
}
function jumpToLine(ln){let t=cur,b=Infinity;steps.forEach((s,i)=>{if(s.lines&&s.lines.includes(ln)){const d=Math.abs(i-cur);if(d<b){b=d;t=i;}}});cur=t;render();}

const COLORS=['#38bdf8','#818cf8','#fb923c','#4ade80','#c084fc','#fbbf24','#f87171'];
function renderStack(stack, highlight, adding){
  stackItems.innerHTML='';
  // Render bottom to top (array order = bottom to top visually because flex-direction:column-reverse)
  stack.forEach((val,i)=>{
    const item=document.createElement('div');
    item.className='stack-item';
    const isHL=highlight===i;
    const isAdd=adding===i;
    if(isAdd){item.style.background='rgba(74,222,128,0.2)';item.style.color='#4ade80';item.style.boxShadow='0 0 16px rgba(74,222,128,0.4)';}
    else if(isHL){item.style.background='rgba(196,132,252,0.2)';item.style.color='#c084fc';item.style.boxShadow='0 0 16px rgba(196,132,252,0.4)';}
    else{item.style.background=`${COLORS[i%COLORS.length]}18`;item.style.color=COLORS[i%COLORS.length];}
    item.textContent=val;
    const idx=document.createElement('span');idx.className='item-idx';idx.textContent=`[${i}]`;
    item.appendChild(idx);
    stackItems.appendChild(item);
  });
  // Info panel
  if(stack.length>0){infoTop.innerHTML=`<span style="color:var(--purple)">${stack[stack.length-1]}</span>`;}
  else{infoTop.innerHTML='<span class="empty">空</span>';}
  infoSize.textContent=stack.length;
  infoEmpty.textContent=stack.length===0?'true':'false';
  infoEmpty.style.color=stack.length===0?'var(--green)':'var(--orange)';
}
function render(){
  if(steps.length===0){renderStack(stackData,-1,-1);descText.textContent='选择操作并点击执行';stepCounter.textContent='';return;}
  const s=steps[cur];
  renderStack(s.stack,s.highlight,s.adding);
  if(s.lines)highlightLines(s.lines);
  descText.textContent=s.desc;
  stepCounter.textContent=`${cur+1} / ${steps.length}`;
  btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;
}
function play(){if(cur>=steps.length-1)cur=0;playing=true;btnPlay.innerHTML='⏸ 暂停';tick();}
function pause(){playing=false;clearTimeout(timer);btnPlay.innerHTML='▶ 播放';}
function tick(){if(!playing)return;if(cur<steps.length-1){cur++;render();timer=setTimeout(tick,SPEED[parseInt(speedRange.value)-1]);}else pause();}
btnPlay.addEventListener('click',()=>playing?pause():play());
btnPrev.addEventListener('click',()=>{pause();if(cur>0){cur--;render();}});
btnNext.addEventListener('click',()=>{pause();if(cur<steps.length-1){cur++;render();}});
btnReset.addEventListener('click',()=>{pause();cur=0;render();});
buildCode();renderStack(stackData,-1,-1);
</script>
</body>
</html>
