<script>
// ──────────────────────────────────────────
// Code Lines (Go)
// ──────────────────────────────────────────
const CODE_LINES = [
  {html:`<span class="kw">package</span> <span class="pkg">main</span>`},                                          // 0
  {html:``},                                                                                                  // 1
  {html:`<span class="kw">import</span> <span class="st">"container/heap"</span>`},                           // 2
  {html:``},                                                                                                  // 3
  {html:`<span class="kw">type</span> <span class="id">Edge</span> <span class="kw">struct</span> { from, to, w <span class="kw">int</span> }`},    // 4
  {html:``},                                                                                                  // 5
  {html:`<span class="kw">type</span> <span class="id">PQ</span> []<span class="id">Edge</span>`},              // 6
  {html:`<span class="kw">func</span> (h <span class="id">PQ</span>) <span class="fn">Len</span>() <span class="kw">int</span>           { <span class="kw">return</span> <span class="fn">len</span>(h) }`},               // 7
  {html:`<span class="kw">func</span> (h <span class="id">PQ</span>) <span class="fn">Less</span>(i, j <span class="kw">int</span>) <span class="kw">bool</span> { <span class="kw">return</span> h[i].w &lt; h[j].w }`},        // 8
  {html:`<span class="kw">func</span> (h <span class="id">PQ</span>) <span class="fn">Swap</span>(i, j <span class="kw">int</span>)      { h[i], h[j] = h[j], h[i] }`},           // 9
  {html:`<span class="kw">func</span> (h *<span class="id">PQ</span>) <span class="fn">Push</span>(x <span class="kw">any</span>) { *h = <span class="fn">append</span>(*h, x.(<span class="id">Edge</span>)) }`},           // 10
  {html:`<span class="kw">func</span> (h *<span class="id">PQ</span>) <span class="fn">Pop</span>() <span class="kw">any</span>  { old:=*h; n:=<span class="fn">len</span>(old); x:=old[n<span class="num">-1</span>]; *h=old[:n<span class="num">-1</span>]; <span class="kw">return</span> x }`}, // 11
  {html:``},                                                                                                  // 12
  {html:`<span class="kw">func</span> <span class="fn">prim</span>(graph [][]<span class="id">Edge</span>, n, src <span class="kw">int</span>) []<span class="id">Edge</span> {`},  // 13
  {html:`&nbsp;&nbsp;inMST := <span class="fn">make</span>([]<span class="kw">bool</span>, n)`},                                      // 14
  {html:`&nbsp;&nbsp;pq := &amp;<span class="id">PQ</span>{}`},                                                  // 15
  {html:`&nbsp;&nbsp;<span class="fn">heap</span>.<span class="fn">Init</span>(pq)`},                                                   // 16
  {html:``},                                                                                                  // 17
  {html:`&nbsp;&nbsp;inMST[src] = <span class="kw">true</span>                  <span class="cm">// 起点加入</span>`},          // 18
  {html:`&nbsp;&nbsp;<span class="kw">for</span> _, e := <span class="kw">range</span> graph[src] {   <span class="cm">// 推入邻边</span>`},          // 19
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">heap</span>.<span class="fn">Push</span>(pq, e)`},                                              // 20
  {html:`&nbsp;&nbsp;}`},                                                                                      // 21
  {html:``},                                                                                                  // 22
  {html:`&nbsp;&nbsp;<span class="kw">var</span> mst []<span class="id">Edge</span>`},                                          // 23
  {html:`&nbsp;&nbsp;<span class="kw">for</span> pq.<span class="fn">Len</span>() &gt; <span class="num">0</span> {`},                                  // 24
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;e := <span class="fn">heap</span>.<span class="fn">Pop</span>(pq).(<span class="id">Edge</span>)      <span class="cm">// 取最小边</span>`},         // 25
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> inMST[e.to] { <span class="kw">continue</span> }  <span class="cm">// 过期条目</span>`},          // 26
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;mst = <span class="fn">append</span>(mst, e)         <span class="cm">// 加入 MST</span>`},         // 27
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;inMST[e.to] = <span class="kw">true</span>`},                                              // 28
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> _, next := <span class="kw">range</span> graph[e.to] {`},                            // 29
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> !inMST[next.to] {`},                                          // 30
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">heap</span>.<span class="fn">Push</span>(pq, next)      <span class="cm">// 扩展邻边</span>`},         // 31
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},                                                                      // 32
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},                                                                          // 33
  {html:`&nbsp;&nbsp;}`},                                                                                      // 34
  {html:`&nbsp;&nbsp;<span class="kw">return</span> mst`},                                                         // 35
  {html:`}`},                                                                                                  // 36
];

// ──────────────────────────────────────────
// Scenario Data
// ──────────────────────────────────────────
// Scenario 1 & 2: A-B(4), A-C(2), B-C(1), B-D(5), C-D(8), C-E(10), D-E(2)
const S12_NODES = ['A','B','C','D','E'];
const S12_POS   = [{x:.13,y:.50},{x:.40,y:.18},{x:.60,y:.58},{x:.76,y:.83},{x:.88,y:.42}];
const S12_EDGES = [[0,1,4],[0,2,2],[1,2,1],[1,3,5],[2,3,8],[2,4,10],[3,4,2]];

// Prim from A (scenario 1): A-C(2), B-C(1), B-D(5), D-E(2)
// Kruskal:                   B-C(1), A-C(2), D-E(2), B-D(5)
const KRUSKAL_ORDER = ['B-C(1)','A-C(2)','D-E(2)','B-D(5)'];
const PRIM_ORDER    = ['A-C(2)','B-C(1)','B-D(5)','D-E(2)'];

// Scenario 3: disconnected — {A,B,C} and {D,E}
const S3_NODES = ['A','B','C','D','E'];
const S3_POS   = [{x:.15,y:.50},{x:.38,y:.28},{x:.38,y:.72},{x:.68,y:.28},{x:.68,y:.72}];
const S3_EDGES = [[0,1,3],[0,2,5],[3,4,4]];

// Active scenario state
let curScene = 0, curNodes, curPos, curEdges;
let steps = [], cur = 0, playing = false, timer = null;
const SPEED = [2000,1200,700,350,120];
const SPEED_LABELS = ['极慢','慢','中速','快','极快'];
const speedVal = document.getElementById('speedVal');
function updateSpeedLabel(){speedVal.textContent=SPEED_LABELS[parseInt(document.getElementById('speedRange').value)-1];}
document.getElementById('speedRange').addEventListener('input',function(){updateSpeedLabel();});
updateSpeedLabel();

// ──────────────────────────────────────────
// Step Generation
// ──────────────────────────────────────────
function ek(u,v){ return `${Math.min(u,v)}-${Math.max(u,v)}`; }

function generateSteps(nodeNames, edgesRaw, start) {
  const n = nodeNames.length;
  const adj = Array.from({length:n}, ()=>[]);
  for (const [u,v,w] of edgesRaw) {
    adj[u].push({from:u,to:v,w});
    adj[v].push({from:v,to:u,w});
  }
  const S = [];
  const inMST = Array(n).fill(false);
  const mstEdgeKeys = new Set();
  let pqEntries = [];
  let mstWeight = 0;

  function snap(extra={}){
    return {
      inMST:[...inMST], mstEdgeKeys:new Set(mstEdgeKeys),
      pqEntries:pqEntries.map(e=>({...e})),
      currentEdge:null, mstWeight, disconnected:false, ...extra
    };
  }
  function sortPQ(arr){ return [...arr].sort((a,b)=>a.w-b.w); }
  function pqStr(){ return pqEntries.map(e=>`${nodeNames[e.from]}→${nodeNames[e.to]}(${e.w})`).join(', ')||'空'; }

  S.push(snap({hl:[14,15,16], desc:`初始化：从节点 <strong style="color:var(--blue)">${nodeNames[start]}</strong> 出发，初始化 inMST 数组和优先队列（最小堆）。`}));

  inMST[start] = true;
  for (const e of adj[start]) pqEntries.push({...e});
  pqEntries = sortPQ(pqEntries);

  S.push(snap({hl:[18,19,20], desc:`将 <strong style="color:var(--green)">${nodeNames[start]}</strong> 标记为已在 MST，推入所有邻边。优先队列：[${pqStr()}]`}));

  while (pqEntries.length > 0) {
    const e = pqEntries.shift();

    S.push(snap({currentEdge:{...e}, hl:[24,25], desc:`弹出权重最小的边 <strong style="color:var(--yellow)">${nodeNames[e.from]}→${nodeNames[e.to]}(${e.w})</strong>，检查目标节点 ${nodeNames[e.to]} 是否已在 MST 中。`}));

    if (inMST[e.to]) {
      S.push(snap({currentEdge:{...e}, hl:[26], desc:`<strong style="color:var(--red)">跳过过期条目</strong>：节点 ${nodeNames[e.to]} 已在 MST 中，此边无需处理。PQ 剩余 ${pqEntries.length} 项。`}));
      continue;
    }

    mstEdgeKeys.add(ek(e.from,e.to));
    inMST[e.to] = true;
    mstWeight += e.w;

    S.push(snap({currentEdge:{...e}, hl:[27,28], desc:`<strong style="color:var(--green)">${nodeNames[e.to]}</strong> 加入 MST！边 ${nodeNames[e.from]}-${nodeNames[e.to]}(${e.w}) 纳入生成树。总权重 = <strong style="color:var(--green)">${mstWeight}</strong>`}));

    const newEdges = [];
    for (const nx of adj[e.to]) {
      if (!inMST[nx.to]) { pqEntries.push({...nx}); newEdges.push(nx); }
    }
    pqEntries = sortPQ(pqEntries);

    if (newEdges.length > 0) {
      S.push(snap({hl:[29,30,31], desc:`扩展节点 ${nodeNames[e.to]}，推入邻边：${newEdges.map(e=>`${nodeNames[e.from]}→${nodeNames[e.to]}(${e.w})`).join(', ')}。PQ 现有 ${pqEntries.length} 项：[${pqStr()}]`}));
    }

    if (inMST.every(v=>v)) {
      S.push(snap({hl:[35], desc:`🎉 <strong style="color:var(--green)">MST 构建完成！</strong>所有 ${n} 个节点已覆盖。MST 边集：{${[...mstEdgeKeys].map(k=>{const[a,b]=k.split('-').map(Number);return nodeNames[a]+'-'+nodeNames[b];}).join(', ')}}，总权重 = <strong style="color:var(--green)">${mstWeight}</strong>`}));
      break;
    }
  }

  if (!inMST.every(v=>v)) {
    const unreachable = nodeNames.filter((_,i)=>!inMST[i]).join(', ');
    S.push(snap({disconnected:true, hl:[34], desc:`<strong style="color:var(--red)">⚠ 图不连通！</strong>优先队列已空，但节点 [${unreachable}] 仍未被访问。Prim 只能覆盖起始节点的连通分量，整图 MST 不存在。`}));
  }
  return S;
}

// ──────────────────────────────────────────
// Rendering
// ──────────────────────────────────────────
function getEdgeState(u, v, step) {
  const key = ek(u,v);
  if (step.mstEdgeKeys.has(key)) return 'mst';
  if (step.currentEdge) {
    if (ek(step.currentEdge.from, step.currentEdge.to) === key) return 'current';
  }
  for (const e of step.pqEntries) {
    if ((e.from===u&&e.to===v)||(e.from===v&&e.to===u)) {
      return step.inMST[e.to] ? 'stale' : 'candidate';
    }
  }
  return 'normal';
}

function renderGraph(step) {
  const svg = document.getElementById('graphSvg');
  const W = svg.clientWidth || svg.parentElement.clientWidth || 400;
  const H = svg.clientHeight || svg.parentElement.clientHeight || 300;
  const R = Math.min(W, H) * 0.055;
  let html = '<defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';

  for (const [u,v,w] of curEdges) {
    const x1=curPos[u].x*W, y1=curPos[u].y*H;
    const x2=curPos[v].x*W, y2=curPos[v].y*H;
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    const state = getEdgeState(u,v,step);
    let stroke='#2d3f55', sw=1.5, dash='', opacity=0.5, wCol='#4b5563';

    if      (state==='mst')       { stroke='#4ade80'; sw=3; opacity=1; wCol='#4ade80'; }
    else if (state==='current')   { stroke='#fbbf24'; sw=3.5; opacity=1; wCol='#fbbf24'; }
    else if (state==='candidate') { stroke='#fb923c'; sw=2; dash='7,4'; opacity=0.85; wCol='#fb923c'; }
    else if (state==='stale')     { stroke='#475569'; sw=1; dash='4,4'; opacity=0.3; wCol='#475569'; }

    const filter = state==='current' ? ' filter="url(#glow)"' : '';
    html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${sw}" stroke-dasharray="${dash}" opacity="${opacity}" stroke-linecap="round"${filter}/>`;
    const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1;
    const ox=-dy/len*12, oy=dx/len*12;
    html += `<text x="${mx+ox}" y="${my+oy}" text-anchor="middle" dominant-baseline="middle" font-size="${R*0.48}" font-family="monospace" fill="${wCol}" opacity="${opacity*0.9}">${w}</text>`;
  }

  for (let i=0; i<curNodes.length; i++) {
    const x=curPos[i].x*W, y=curPos[i].y*H;
    const inMST = step.inMST[i];
    const isCur = step.currentEdge && step.currentEdge.to===i && !step.inMST[i];
    let fill='#1e293b', stroke='#475569', tc='#94a3b8', sw=2;
    if (inMST)  { fill='#14532d'; stroke='#4ade80'; tc='#4ade80'; }
    if (isCur)  { fill='#0c2a4a'; stroke='#38bdf8'; tc='#38bdf8'; sw=2.5; }
    const filter = (inMST||isCur) ? ' filter="url(#glow)"' : '';
    html += `<circle cx="${x}" cy="${y}" r="${R}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${filter}/>`;
    html += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="${R*0.58}" font-weight="700" font-family="system-ui" fill="${tc}">${curNodes[i]}</text>`;
  }
  svg.innerHTML = html;
}

function renderPQ(step) {
  const list = document.getElementById('pqList');
  let html = '';

  if (step.currentEdge) {
    const e = step.currentEdge;
    html += `<div class="pq-entry pq-cur"><span>${curNodes[e.from]}→${curNodes[e.to]}(${e.w})</span><span class="pq-badge b-cur">检查中</span></div>`;
  }
  if (step.pqEntries.length === 0 && !step.currentEdge) {
    html = '<div style="color:var(--dim);font-size:0.78rem;padding:4px 0;font-style:italic;">队列为空</div>';
  } else {
    for (const e of step.pqEntries) {
      const stale = step.inMST[e.to];
      const cls = stale ? 'pq-stale' : 'pq-fresh';
      const badge = stale ? '<span class="pq-badge b-stale">过期</span>' : '<span class="pq-badge b-fresh">候选</span>';
      html += `<div class="pq-entry ${cls}"><span>${curNodes[e.from]}→${curNodes[e.to]}(${e.w})</span>${badge}</div>`;
    }
  }
  list.innerHTML = html;
  document.getElementById('warnBox').style.display = step.disconnected ? '' : 'none';
}

function renderCompare(step) {
  const mstKeys = step.mstEdgeKeys;
  function isSelected(edgeStr, mstK, nodeNames) {
    // edge str like "A-C(2)" or "B-C(1)"
    const m = edgeStr.match(/^(\w+)-(\w+)\((\d+)\)$/);
    if (!m) return false;
    const u = nodeNames.indexOf(m[1]), v = nodeNames.indexOf(m[2]);
    if (u<0||v<0) return false;
    return mstK.has(ek(u,v));
  }
  let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:0.76rem;">';
  html += '<div><div style="color:var(--blue);margin-bottom:5px;font-size:0.7rem;">Prim 顺序（从A）</div>';
  for (const e of PRIM_ORDER) {
    const sel = isSelected(e, mstKeys, S12_NODES);
    html += `<div style="font-family:monospace;padding:2px 0;color:${sel?'var(--green)':'var(--dim)'}">${sel?'✓ ':''} ${e}</div>`;
  }
  html += '</div>';
  html += '<div><div style="color:var(--yellow);margin-bottom:5px;font-size:0.7rem;">Kruskal 顺序</div>';
  for (const e of KRUSKAL_ORDER) {
    const sel = isSelected(e, mstKeys, S12_NODES);
    html += `<div style="font-family:monospace;padding:2px 0;color:${sel?'var(--green)':'var(--dim)'}">${sel?'✓ ':''} ${e}</div>`;
  }
  html += '</div></div>';
  html += '<div style="font-size:0.7rem;color:var(--dim);margin-top:8px;padding-top:6px;border-top:1px solid var(--border)">结果相同（MST权重=10），选边<em style="color:var(--text)">顺序不同</em>：Prim 从节点出发扩展，Kruskal 全局贪心选边。</div>';
  document.getElementById('compareContent').innerHTML = html;
}

function renderCode() {
  const step = steps[cur];
  const hl = step ? (step.hl||[]) : [];
  const body = document.getElementById('codeBody');
  body.innerHTML = CODE_LINES.map((line,i) => {
    const active = hl.includes(i) ? ' active' : '';
    return `<div class="code-line${active}"><span class="ln">${i+1}</span><span class="lc">${line.html||'&nbsp;'}</span></div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}

function render() {
  if (!steps.length) return;
  const s = steps[cur];
  renderGraph(s);
  renderPQ(s);
  renderCode();
  document.getElementById('stepDesc').innerHTML = s.desc;
  document.getElementById('stepCtr').textContent = `步骤 ${cur+1} / ${steps.length}`;
  document.getElementById('mstWeightVal').textContent = s.mstWeight;
  document.getElementById('btnPrev').disabled = cur === 0;
  document.getElementById('btnNext').disabled = cur === steps.length-1;
  const cmpBox = document.getElementById('compareBox');
  cmpBox.style.display = curScene===1 ? '' : 'none';
  if (curScene===1) renderCompare(s);
}

// ──────────────────────────────────────────
// Controls
// ──────────────────────────────────────────
function switchScene(idx) {
  stopPlay();
  curScene = idx;
  for (let i=0;i<3;i++) document.getElementById(`tab${i}`).classList.toggle('active', i===idx);
  if (idx===0||idx===1) { curNodes=S12_NODES; curPos=S12_POS; curEdges=S12_EDGES; }
  else                  { curNodes=S3_NODES;  curPos=S3_POS;  curEdges=S3_EDGES; }
  steps = generateSteps(curNodes, curEdges, 0);
  cur = 0;
  render();
}

function prev() { if(cur>0){ cur--; render(); } }
function next() { if(cur<steps.length-1){ cur++; render(); } }
function reset() { stopPlay(); cur=0; render(); }

function stopPlay() {
  playing = false;
  clearInterval(timer); timer = null;
  document.getElementById('btnPlay').textContent = '▶ 播放';
}

function togglePlay() {
  if (!playing && cur >= steps.length-1) { cur=0; render(); }
  if (playing) { stopPlay(); return; }
  playing = true;
  document.getElementById('btnPlay').textContent = '⏸ 暂停';
  const spd = SPEED[parseInt(document.getElementById('speedRange').value)-1];
  timer = setInterval(()=>{ if(cur>=steps.length-1){stopPlay();return;} cur++; render(); }, spd);
}

document.getElementById('speedRange').oninput = () => { if(playing){ stopPlay(); togglePlay(); }};
window.addEventListener('resize', ()=>{ if(steps.length) renderGraph(steps[cur]); });

// Init
switchScene(0);
</script>
</body>
</html>
