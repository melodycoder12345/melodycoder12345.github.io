<script>
const CODE_LINES = [
  {html:`<span class="kw">package</span> <span class="pkg">main</span>`},
  {html:``},
  {html:`<span class="kw">import</span> <span class="st">"fmt"</span>`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">countingSort</span>(arr []<span class="kw">int</span>, k <span class="kw">int</span>) []<span class="kw">int</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;count := <span class="fn">make</span>([]<span class="kw">int</span>, k<span class="op">+</span><span class="num">1</span>)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> _, v := <span class="kw">range</span> arr {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;count[v]<span class="op">++</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span class="id">// 统计频次</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> i := <span class="num">1</span>; i &lt;<span class="op">=</span> k; i<span class="op">++</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;count[i] <span class="op">+=</span> count[i<span class="op">-</span><span class="num">1</span>] <span class="id">// 前缀和</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;output := <span class="fn">make</span>([]<span class="kw">int</span>, <span class="fn">len</span>(arr))`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> i := <span class="fn">len</span>(arr)<span class="op">-</span><span class="num">1</span>; i &gt;<span class="op">=</span> <span class="num">0</span>; i<span class="op">--</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;output[count[arr[i]]<span class="op">-</span><span class="num">1</span>] = arr[i]`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;count[arr[i]]<span class="op">--</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> output`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">main</span>() {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;arr := []<span class="kw">int</span>{<span class="num">4</span>, <span class="num">2</span>, <span class="num">2</span>, <span class="num">8</span>, <span class="num">3</span>, <span class="num">3</span>, <span class="num">1</span>, <span class="num">6</span>, <span class="num">4</span>, <span class="num">9</span>}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;result := <span class="fn">countingSort</span>(arr, <span class="num">9</span>)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">fmt</span>.<span class="fn">Println</span>(result)`},
  {html:`}`},
];

window.LANG_PLAIN = {
  js: `function countingSort(arr, maxVal) {
    const count = new Array(maxVal + 1).fill(0);
    for (const val of arr) count[val]++;
    for (let i = 1; i <= maxVal; i++) count[i] += count[i - 1];
    const output = new Array(arr.length);
    for (let i = arr.length - 1; i >= 0; i--) {
        output[count[arr[i]] - 1] = arr[i];
        count[arr[i]]--;
    }
    for (let i = 0; i < arr.length; i++) arr[i] = output[i];
}

const arr = [4, 2, 2, 8, 3, 3, 1];
countingSort(arr, 8);
console.log(arr);`,
  py: `def counting_sort(arr, max_val):
    count = [0] * (max_val + 1)
    for val in arr:
        count[val] += 1
    for i in range(1, max_val + 1):
        count[i] += count[i - 1]
    output = [0] * len(arr)
    for i in range(len(arr) - 1, -1, -1):
        output[count[arr[i]] - 1] = arr[i]
        count[arr[i]] -= 1
    for i in range(len(arr)):
        arr[i] = output[i]

arr = [4, 2, 2, 8, 3, 3, 1]
counting_sort(arr, 8)
print(arr)`
};

const INITIAL = [4,2,2,8,3,3,1,6,4,9];
const K = 9;

function generateSteps() {
  const steps = [];
  const arr = [...INITIAL];
  const n = arr.length;
  let count = new Array(K+1).fill(0);
  let output = new Array(n).fill(null);

  // Phase 0: show initial
  steps.push({
    arr:[...arr], count:[...count], output:[...output],
    activeInput:-1, activeCount:-1, activeOutput:-1,
    description:'初始数组，准备开始计数排序',
    highlightLines:[20,21]
  });

  // Phase 1: init count array
  steps.push({
    arr:[...arr], count:[...count], output:[...output],
    activeInput:-1, activeCount:-1, activeOutput:-1,
    description:'初始化 count 数组，全部置 0',
    highlightLines:[5]
  });

  // Phase 2: count frequencies
  steps.push({
    arr:[...arr], count:[...count], output:[...output],
    activeInput:-1, activeCount:-1, activeOutput:-1,
    description:'遍历输入数组，统计每个元素的频次',
    highlightLines:[6]
  });
  for (let i = 0; i < n; i++) {
    const v = arr[i];
    steps.push({
      arr:[...arr], count:[...count], output:[...output],
      activeInput:i, activeCount:v, activeOutput:-1,
      description:`arr[${i}] = ${v}，count[${v}]++ → count[${v}] 变为 ${count[v]+1}`,
      highlightLines:[7]
    });
    count[v]++;
  }
  steps.push({
    arr:[...arr], count:[...count], output:[...output],
    activeInput:-1, activeCount:-1, activeOutput:-1,
    description:'频次统计完成',
    highlightLines:[8]
  });

  // Phase 3: prefix sum
  steps.push({
    arr:[...arr], count:[...count], output:[...output],
    activeInput:-1, activeCount:-1, activeOutput:-1,
    description:'计算前缀和，count[i] 表示 ≤i 的元素个数（即位置上界）',
    highlightLines:[9]
  });
  for (let i = 1; i <= K; i++) {
    const prev = count[i-1];
    const cur = count[i];
    steps.push({
      arr:[...arr], count:[...count], output:[...output],
      activeInput:-1, activeCount:i, activeOutput:-1,
      description:`count[${i}] += count[${i-1}]：${cur} + ${prev} = ${cur+prev}`,
      highlightLines:[10]
    });
    count[i] += count[i-1];
  }
  steps.push({
    arr:[...arr], count:[...count], output:[...output],
    activeInput:-1, activeCount:-1, activeOutput:-1,
    description:'前缀和计算完成，准备从右往左构建输出数组',
    highlightLines:[11,12]
  });

  // Phase 4: build output right-to-left
  steps.push({
    arr:[...arr], count:[...count], output:[...output],
    activeInput:-1, activeCount:-1, activeOutput:-1,
    description:'从右往左遍历输入数组，稳定地填入输出数组',
    highlightLines:[13]
  });
  for (let i = n-1; i >= 0; i--) {
    const v = arr[i];
    const pos = count[v] - 1;
    steps.push({
      arr:[...arr], count:[...count], output:[...output],
      activeInput:i, activeCount:v, activeOutput:pos,
      description:`arr[${i}]=${v}，count[${v}]-1=${pos}，output[${pos}] = ${v}`,
      highlightLines:[14]
    });
    output[pos] = v;
    count[v]--;
    steps.push({
      arr:[...arr], count:[...count], output:[...output],
      activeInput:i, activeCount:v, activeOutput:pos,
      description:`output[${pos}] = ${v} 已放置，count[${v}]-- → ${count[v]}`,
      highlightLines:[15]
    });
  }

  // Phase 5: done
  steps.push({
    arr:[...arr], count:[...count], output:[...output],
    activeInput:-1, activeCount:-1, activeOutput:-1,
    description:'排序完成！输出数组为升序排列',
    highlightLines:[17,18,22,23]
  });
  return steps;
}

let steps = generateSteps();
let cur = 0, playing = false, timer = null;
const SPEED = [900,550,320,180,70];

const vizArea = document.getElementById('vizArea');
const codeBody = document.getElementById('codeBody');
const descText = document.getElementById('descText');
const stepCounter = document.getElementById('stepCounter');
const btnPlay = document.getElementById('btnPlay');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnReset = document.getElementById('btnReset');
const speedRange = document.getElementById('speedRange');

function buildCode() {
  codeBody.innerHTML = CODE_LINES.map((l,i) =>
    `<div class="code-line" data-line="${i}"><span class="ln">${i+1}</span><span class="lc">${l.html||'&nbsp;'}</span></div>`
  ).join('');
  codeBody.querySelectorAll('.code-line').forEach(el =>
    el.addEventListener('click', () => jumpToLine(parseInt(el.dataset.line)))
  );
}

function highlightLines(lines) {
  codeBody.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
  lines.forEach(ln => {
    const el = codeBody.querySelector(`[data-line="${ln}"]`);
    if (el) el.classList.add('active');
  });
  if (lines.length > 0) {
    const f = codeBody.querySelector(`[data-line="${lines[0]}"]`);
    if (f) f.scrollIntoView({block:'nearest'});
  }
}

function jumpToLine(ln) {
  let t = cur, b = Infinity;
  steps.forEach((s,i) => {
    if (s.highlightLines.includes(ln)) {
      const d = Math.abs(i-cur);
      if (d < b) { b = d; t = i; }
    }
  });
  cur = t;
  render();
}

function renderCode() {
  const lines = (LangSwitcher.current !== 'go' && LangSwitcher.getLines(LangSwitcher.current))
    || CODE_LINES;
  const hl = LangSwitcher.getHL(steps[cur]);
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i) ? ' active' : '';
    return `<div class="code-line${active}" onclick="jumpToLine(${i})">${line.html || '&nbsp;'}</div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}

function cellColor(base, active) {
  if (active) return base;
  return 'rgba(255,255,255,0.06)';
}

function render() {
  const s = steps[cur];
  vizArea.innerHTML = '';

  // Row 1: input array
  const inputRow = document.createElement('div');
  inputRow.className = 'arr-row';
  const inputLabel = document.createElement('div');
  inputLabel.className = 'arr-row-label';
  inputLabel.textContent = '输入数组 arr[]';
  const inputCells = document.createElement('div');
  inputCells.className = 'arr-cells';
  s.arr.forEach((v, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const box = document.createElement('div');
    box.className = 'cell-box';
    const isActive = i === s.activeInput;
    box.style.background = isActive ? 'rgba(251,191,36,0.22)' : 'rgba(56,189,248,0.10)';
    box.style.border = `2px solid ${isActive ? 'var(--yellow)' : 'var(--border)'}`;
    box.style.color = isActive ? 'var(--yellow)' : 'var(--text)';
    if (isActive) box.style.boxShadow = '0 0 12px rgba(251,191,36,0.4)';
    box.textContent = v;
    const idx = document.createElement('div');
    idx.className = 'cell-idx';
    idx.textContent = i;
    cell.appendChild(box);
    cell.appendChild(idx);
    inputCells.appendChild(cell);
  });
  inputRow.appendChild(inputLabel);
  inputRow.appendChild(inputCells);
  vizArea.appendChild(inputRow);

  // Row 2: count array
  const maxCount = Math.max(...s.count, 1);
  const countRow = document.createElement('div');
  countRow.className = 'arr-row';
  const countLabel = document.createElement('div');
  countLabel.className = 'arr-row-label';
  countLabel.textContent = 'count[0..9]（颜色深浅随值变化）';
  const countCells = document.createElement('div');
  countCells.className = 'arr-cells';
  s.count.forEach((v, i) => {
    const cell = document.createElement('div');
    cell.className = 'count-cell';
    const isActive = i === s.activeCount;
    const fillRatio = v / (maxCount || 1);
    const h = Math.max(24, Math.round(24 + fillRatio * 52));
    const box = document.createElement('div');
    box.className = 'count-box';
    box.style.height = h + 'px';
    box.style.width = '46px';
    if (isActive) {
      box.style.background = 'rgba(251,191,36,0.28)';
      box.style.border = '2px solid var(--yellow)';
      box.style.color = 'var(--yellow)';
      box.style.boxShadow = '0 0 10px rgba(251,191,36,0.4)';
    } else if (v > 0) {
      const alpha = 0.1 + fillRatio * 0.35;
      box.style.background = `rgba(56,189,248,${alpha.toFixed(2)})`;
      box.style.border = '2px solid rgba(56,189,248,0.3)';
      box.style.color = 'var(--blue)';
    } else {
      box.style.background = 'rgba(255,255,255,0.04)';
      box.style.border = '2px solid var(--border)';
      box.style.color = 'var(--dim)';
    }
    box.style.display = 'flex';
    box.style.alignItems = 'center';
    box.style.justifyContent = 'center';
    box.style.borderRadius = '7px 7px 0 0';
    box.style.fontFamily = 'monospace';
    box.style.fontWeight = '600';
    box.style.fontSize = '0.85rem';
    box.style.transition = 'all 0.25s';
    box.textContent = v;
    const valLbl = document.createElement('div');
    valLbl.className = 'count-val-label';
    valLbl.style.fontSize = '0.65rem';
    valLbl.style.color = 'var(--dim)';
    valLbl.style.fontFamily = 'monospace';
    valLbl.textContent = i;
    cell.appendChild(box);
    cell.appendChild(valLbl);
    countCells.appendChild(cell);
  });
  countRow.appendChild(countLabel);
  countRow.appendChild(countCells);
  vizArea.appendChild(countRow);

  // Row 3: output array
  const outputRow = document.createElement('div');
  outputRow.className = 'arr-row';
  const outputLabel = document.createElement('div');
  outputLabel.className = 'arr-row-label';
  outputLabel.textContent = '输出数组 output[]（绿色 = 已填入）';
  const outputCells = document.createElement('div');
  outputCells.className = 'arr-cells';
  s.output.forEach((v, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const box = document.createElement('div');
    box.className = 'cell-box';
    const isActive = i === s.activeOutput;
    const isFilled = v !== null;
    if (isActive) {
      box.style.background = 'rgba(74,222,128,0.22)';
      box.style.border = '2px solid var(--green)';
      box.style.color = 'var(--green)';
      box.style.boxShadow = '0 0 12px rgba(74,222,128,0.4)';
    } else if (isFilled) {
      box.style.background = 'rgba(74,222,128,0.10)';
      box.style.border = '2px solid rgba(74,222,128,0.4)';
      box.style.color = 'var(--green)';
    } else {
      box.style.background = 'rgba(255,255,255,0.03)';
      box.style.border = '2px dashed var(--border)';
      box.style.color = 'var(--dim)';
    }
    box.textContent = isFilled ? v : '';
    const idx = document.createElement('div');
    idx.className = 'cell-idx';
    idx.textContent = i;
    cell.appendChild(box);
    cell.appendChild(idx);
    outputCells.appendChild(cell);
  });
  outputRow.appendChild(outputLabel);
  outputRow.appendChild(outputCells);
  vizArea.appendChild(outputRow);

  renderCode();
  descText.textContent = s.description;
  stepCounter.textContent = `${cur+1} / ${steps.length}`;
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;
}

function play() {
  if (cur >= steps.length - 1) cur = 0;
  playing = true;
  btnPlay.innerHTML = '&#9646;&#9646; 暂停';
  tick();
}
function pause() {
  playing = false;
  clearTimeout(timer);
  btnPlay.innerHTML = '&#9654; 播放';
}
function tick() {
  if (!playing) return;
  if (cur < steps.length - 1) {
    cur++;
    render();
    timer = setTimeout(tick, SPEED[parseInt(speedRange.value)-1]);
  } else {
    pause();
  }
}

btnPlay.addEventListener('click', () => playing ? pause() : play());
btnPrev.addEventListener('click', () => { pause(); if (cur > 0) { cur--; render(); } });
btnNext.addEventListener('click', () => { pause(); if (cur < steps.length-1) { cur++; render(); } });
btnReset.addEventListener('click', () => { pause(); cur = 0; render(); });

buildCode();
LangSwitcher.init(renderCode);
render();
</script>
</body>
</html>
