<style>
:root{--bg:#0f172a;--panel:#111827;--panel2:#1e293b;--border:#334155;--text:#e2e8f0;--dim:#94a3b8;--dim2:#64748b;--accent:#38bdf8;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--purple:#c084fc;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.layout{flex:1;display:grid;grid-template-columns:260px 1fr 300px;min-height:0;overflow:hidden}

/* Left panel */
.left-panel{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.lp-head{padding:16px 14px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.lp-title{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:4px}
.lp-sub{font-size:.72rem;color:var(--dim2)}
.badges{display:flex;gap:6px;margin-top:8px}
.badge{font-size:.68rem;padding:3px 8px;border-radius:999px;font-family:monospace}
.badge.time{background:rgba(251,191,36,.12);color:var(--warn)}
.badge.space{background:rgba(192,132,252,.12);color:var(--purple)}
.scene-tabs{display:flex;gap:4px;padding:10px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.scene-tab{flex:1;padding:7px 4px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:.76rem;cursor:pointer;text-align:center;transition:all .15s}
.scene-tab:hover{color:var(--text);border-color:var(--dim)}
.scene-tab.active{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.4);color:var(--accent)}
.step-list{flex:1;overflow-y:auto;padding:6px}
.step-item{padding:8px 10px;border-radius:8px;margin-bottom:3px;cursor:pointer;border-left:2px solid transparent;transition:all .15s}
.step-item:hover{background:rgba(255,255,255,.04)}
.step-item.active{background:rgba(56,189,248,.07);border-left-color:var(--accent)}
.step-num{font-size:.65rem;font-family:monospace;color:var(--accent);margin-bottom:2px}
.step-text{font-size:.75rem;color:var(--dim);line-height:1.4}
.lp-controls{padding:10px 8px;border-top:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.ctrl-row{display:flex;gap:6px}
.ctrl-btn{flex:1;padding:7px 4px;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);font-size:.78rem;cursor:pointer;text-align:center;transition:all .15s}
.ctrl-btn:hover{background:rgba(255,255,255,.1)}
.ctrl-btn.primary{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.35);color:var(--accent)}
.ctrl-btn:disabled{opacity:.35;cursor:not-allowed}
.speed-row{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:6px 14px;display:flex;align-items:center;gap:10px;margin-top:6px;}
.speed-row .speed-label{color:var(--text);font-weight:600;white-space:nowrap;font-size:0.8rem;}
.speed-val{font-family:monospace;font-size:0.78rem;color:var(--blue);min-width:26px;text-align:center;}
input[type=range]{flex:1;-webkit-appearance:none;height:3px;background:var(--border);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer}

/* Center viz */
.viz-panel{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.viz-canvas{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:14px;overflow:hidden}
.bit-section{display:flex;align-items:center;gap:10px;width:100%}
.bit-row-label{font-size:.72rem;color:var(--dim);width:80px;text-align:right;flex-shrink:0;font-family:monospace}
.bit-boxes{display:flex;gap:4px}
.bit-box{width:46px;height:46px;border:2px solid var(--border);border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:700;position:relative;transition:all .25s;color:var(--text);cursor:default;user-select:none}
.bit-box .bx-idx{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:.6rem;color:var(--dim2);font-family:monospace}
.bit-box.hl-blue{background:rgba(56,189,248,.18);border-color:var(--accent);color:var(--accent);box-shadow:0 0 12px rgba(56,189,248,.3)}
.bit-box.hl-yellow{background:rgba(251,191,36,.18);border-color:var(--warn);color:var(--warn);box-shadow:0 0 12px rgba(251,191,36,.25)}
.bit-box.hl-green{background:rgba(74,222,128,.18);border-color:var(--ok);color:var(--ok);box-shadow:0 0 10px rgba(74,222,128,.25)}
.bit-box.hl-dim{background:rgba(56,189,248,.05);border-color:rgba(56,189,248,.2)}
.cover-wrap{width:100%;max-width:500px;overflow:hidden}
.compute-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-family:monospace;font-size:.8rem;color:var(--accent);text-align:center;min-width:300px;max-width:500px;line-height:1.5}
.step-desc-bar{padding:12px 20px;border-top:1px solid var(--border);flex-shrink:0;font-size:.85rem;color:var(--dim);display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.02)}
.step-ctr{margin-left:auto;font-size:.75rem;font-family:monospace;color:var(--dim2);white-space:nowrap}

/* Right code */
.code-panel{border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:#0d1117}
.code-header{padding:10px 14px;border-bottom:1px solid var(--border);font-size:.8rem;color:var(--dim);display:flex;gap:6px;align-items:center;flex-shrink:0;background:var(--panel)}
.code-dot{width:10px;height:10px;border-radius:50%}
.code-body{flex:1;overflow-y:auto;padding:10px 0}
.code-body::-webkit-scrollbar{width:5px}
.code-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.code-line{display:flex;align-items:stretch;padding:0;font-family:'JetBrains Mono',monospace;font-size:.78rem;line-height:1.65;transition:background .15s}
.code-line.active{background:rgba(251,191,36,.1)}
.ln{min-width:42px;padding:0 10px 0 14px;color:#4b5563;text-align:right;user-select:none;flex-shrink:0;font-size:.72rem}
.code-line.active .ln{color:var(--warn)}
.lc{padding:0 14px 0 4px;flex:1}
.kw{color:#ff7b72}.fn{color:#d2a8ff}.st{color:#a5d6ff}.num{color:#79c0ff}.cm{color:#8b949e}.op{color:#ff7b72}
</style>
</head>
<body>
<div class="layout">
  <!-- Left panel -->
  <div class="left-panel">
    <div class="lp-head">
      <div class="lp-title">树状数组 BIT</div>
      <div class="lp-sub">Binary Indexed Tree / Fenwick Tree</div>
      <div class="badges">
        <span class="badge time">查询 O(log n)</span>
        <span class="badge space">更新 O(log n)</span>
      </div>
    </div>
    <div class="scene-tabs">
      <button class="scene-tab active" onclick="switchScene(0)">前缀和查询</button>
      <button class="scene-tab" onclick="switchScene(1)">单点更新</button>
    </div>
    <div class="step-list" id="stepList"></div>
    <div class="lp-controls">
      <div class="ctrl-row">
        <button class="ctrl-btn" id="btnReset" onclick="reset()">⏮</button>
        <button class="ctrl-btn" id="btnPrev" onclick="prev()">◀</button>
        <button class="ctrl-btn primary" id="btnPlay" onclick="togglePlay()">▶ 播放</button>
        <button class="ctrl-btn" id="btnNext" onclick="next()">▶</button>
      </div>
      <div class="speed-row">
        <span class="speed-label">速度</span>
        <span class="speed-label" style="font-weight:400;color:var(--dim)">慢</span>
        <input type="range" id="speedRange" min="1" max="5" value="3">
        <span class="speed-label" style="font-weight:400;color:var(--dim)">快</span>
        <span class="speed-val" id="speedVal">中速</span>
      </div>
    </div>
  </div>

  <!-- Center viz -->
  <div class="viz-panel">
    <div class="viz-canvas">
      <div class="bit-section">
        <div class="bit-row-label">arr[ ]</div>
        <div class="bit-boxes" id="arrBoxes"></div>
      </div>
      <div class="cover-wrap">
        <svg id="coverSvg" viewBox="0 0 430 72" width="430" preserveAspectRatio="xMidYMid meet" style="display:block;margin:0 auto"></svg>
      </div>
      <div class="bit-section">
        <div class="bit-row-label">tree[ ]</div>
        <div class="bit-boxes" id="treeBoxes"></div>
      </div>
      <div class="compute-box" id="computeBox">选择场景并点击播放</div>
    </div>
    <div class="step-desc-bar">
      <span id="stepDesc">点击播放或选择步骤开始演示</span>
      <span class="step-ctr" id="stepCtr">0 / 0</span>
    </div>
  </div>

  <!-- Right code -->
  <div class="code-panel">
    <div class="code-header">
      <div class="code-dot" style="background:#ff5f57"></div>
      <div class="code-dot" style="background:#febc2e"></div>
      <div class="code-dot" style="background:#28c840"></div>
      <span style="margin-left:4px">bit.go</span>
    </div>
    <div class="code-body" id="codeBody"></div>
  </div>
</div>

<script src="../footer.js"></script>
<script>
// ─── Constants ───────────────────────────────────────────────────
const ARR = [0, 3, 2, -1, 6, 5, 4, -3, 3]; // 1-indexed
const TREE_INIT = [0, 3, 5, -1, 10, 5, 9, -3, 19]; // 1-indexed
const N = 8;
const SPEED = [2000,1200,700,350,120];
const SPEED_LABELS = ['极慢','慢','中速','快','极快'];
const speedVal = document.getElementById('speedVal');
function updateSpeedLabel(){speedVal.textContent=SPEED_LABELS[parseInt(document.getElementById('speedRange').value)-1];}
document.getElementById('speedRange').addEventListener('input',function(){updateSpeedLabel();});
updateSpeedLabel();

function lowbit(x) { return x & (-x); }

// ─── Code lines ───────────────────────────────────────────────────
const CODE = [
  {h:`<span class="kw">type</span> BIT <span class="kw">struct</span> { n <span class="kw">int</span>; tree []<span class="kw">int</span> }`},        // 0
  {h:``},                                                                                              // 1
  {h:`<span class="kw">func</span> <span class="fn">NewBIT</span>(n <span class="kw">int</span>) *BIT {`},                       // 2
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> &BIT{n: n, tree: <span class="fn">make</span>([]<span class="kw">int</span>, n+<span class="num">1</span>)}`}, // 3
  {h:`}`},                                                                                             // 4
  {h:``},                                                                                              // 5
  {h:`<span class="cm">// 查询前缀和 [1, i]</span>`},                                               // 6
  {h:`<span class="kw">func</span> (b *BIT) <span class="fn">Query</span>(i <span class="kw">int</span>) (sum <span class="kw">int</span>) {`},       // 7
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> ; i > <span class="num">0</span>; i -= i & (-i) {`},              // 8
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sum += b.tree[i]`},                                  // 9
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;}`},                                                                      // 10
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span>`},                                           // 11
  {h:`}`},                                                                                             // 12
  {h:``},                                                                                              // 13
  {h:`<span class="cm">// 单点更新：位置 i 增加 delta</span>`},                                      // 14
  {h:`<span class="kw">func</span> (b *BIT) <span class="fn">Update</span>(i, delta <span class="kw">int</span>) {`},     // 15
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> ; i <= b.n; i += i & (-i) {`},              // 16
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;b.tree[i] += delta`},                              // 17
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;}`},                                                                      // 18
  {h:`}`},                                                                                             // 19
  {h:``},                                                                                              // 20
  {h:`<span class="cm">// 区间查询 [l, r]</span>`},                                                   // 21
  {h:`<span class="kw">func</span> (b *BIT) <span class="fn">RangeQuery</span>(l, r <span class="kw">int</span>) <span class="kw">int</span> {`}, // 22
  {h:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> b.<span class="fn">Query</span>(r) - b.<span class="fn">Query</span>(l-<span class="num">1</span>)`},  // 23
  {h:`}`},                                                                                             // 24
];

// ─── Scenes ───────────────────────────────────────────────────────
const SCENES = [
  {
    label: '前缀和查询', id: 'query',
    steps: [
      { desc: '初始状态：原数组和对应的树状数组 tree[]', arrHL:[], treeHL:[], arrDim:[], treeDim:[], code:[6,7], compute:'查询 prefix_sum(6) → arr[1..6] 的累积和', sum:null, treeVals:null },
      { desc: 'i=6：读取 tree[6]=9（覆盖 arr[5..6]），sum += 9。lowbit(6)=2，i = 6−2 = 4', arrHL:[5,6], treeHL:[6], arrDim:[], treeDim:[1,2,3,4,5,7,8], code:[8,9], compute:'i=6  →  sum += tree[6] = 9  |  lowbit(6) = 6&(−6) = 2  →  i = 4', sum:9, treeVals:null },
      { desc: 'i=4：读取 tree[4]=10（覆盖 arr[1..4]），sum += 10。lowbit(4)=4，i = 4−4 = 0', arrHL:[1,2,3,4], treeHL:[4], arrDim:[], treeDim:[1,2,3,5,6,7,8], code:[8,9], compute:'i=4  →  sum += tree[4] = 10  |  lowbit(4) = 4&(−4) = 4  →  i = 0', sum:19, treeVals:null },
      { desc: 'i=0，循环结束。返回 sum = 9 + 10 = 19', arrHL:[1,2,3,4,5,6], treeHL:[], arrDim:[], treeDim:[], code:[10,11], compute:'prefix_sum(6) = 19 ✓   (3+2−1+6+5+4 = 19)', sum:19, treeVals:null },
    ]
  },
  {
    label: '单点更新', id: 'update',
    steps: [
      { desc: '初始状态：将 arr[3] 增加 +5（delta=+5），需要更新所有覆盖 arr[3] 的 tree 节点', arrHL:[], treeHL:[], arrDim:[], treeDim:[], code:[14,15], compute:'update(3, +5) → 更新所有满足 [i−lowbit(i)+1, i] 包含 3 的 tree[i]', sum:null, treeVals:[...TREE_INIT] },
      { desc: 'i=3：tree[3] += 5 → tree[3] = −1+5 = 4。lowbit(3)=1，i = 3+1 = 4', arrHL:[3], treeHL:[3], arrDim:[], treeDim:[1,2,4,5,6,7,8], code:[16,17], compute:'i=3  →  tree[3] += 5 = 4  |  lowbit(3) = 3&(−3) = 1  →  i = 4', sum:null, treeVals:[0,3,5,4,10,5,9,-3,19] },
      { desc: 'i=4：tree[4] += 5 → tree[4] = 10+5 = 15。lowbit(4)=4，i = 4+4 = 8', arrHL:[3], treeHL:[4], arrDim:[], treeDim:[1,2,3,5,6,7,8], code:[16,17], compute:'i=4  →  tree[4] += 5 = 15  |  lowbit(4) = 4&(−4) = 4  →  i = 8', sum:null, treeVals:[0,3,5,4,15,5,9,-3,19] },
      { desc: 'i=8：tree[8] += 5 → tree[8] = 19+5 = 24。lowbit(8)=8，i = 8+8 = 16 > 8，结束', arrHL:[3], treeHL:[8], arrDim:[], treeDim:[1,2,3,4,5,6,7], code:[16,17], compute:'i=8  →  tree[8] += 5 = 24  |  lowbit(8) = 8  →  i = 16 > n，停止', sum:null, treeVals:[0,3,5,4,15,5,9,-3,24] },
      { desc: '更新完成！tree[3], tree[4], tree[8] 均已加 +5，其他不变', arrHL:[3], treeHL:[3,4,8], arrDim:[], treeDim:[], code:[18,19], compute:'update(3, +5) 完成 ✓   已更新 tree[3]=4, tree[4]=15, tree[8]=24', sum:null, treeVals:[0,3,5,4,15,5,9,-3,24] },
    ]
  }
];

// ─── State ────────────────────────────────────────────────────────
let curScene = 0, curStep = 0, playing = false, timer = null;

// ─── Build DOM ────────────────────────────────────────────────────
function buildBoxes() {
  const arrDiv = document.getElementById('arrBoxes');
  const treeDiv = document.getElementById('treeBoxes');
  arrDiv.innerHTML = '';
  treeDiv.innerHTML = '';
  for (let i = 1; i <= N; i++) {
    arrDiv.innerHTML += `<div class="bit-box" id="arr-${i}">${ARR[i]}<span class="bx-idx">${i}</span></div>`;
    treeDiv.innerHTML += `<div class="bit-box" id="tree-${i}">${TREE_INIT[i]}<span class="bx-idx">${i}</span></div>`;
  }
}

function buildCode() {
  const body = document.getElementById('codeBody');
  body.innerHTML = CODE.map((l, i) =>
    `<div class="code-line" data-ln="${i}"><span class="ln">${i+1}</span><span class="lc">${l.h||'&nbsp;'}</span></div>`
  ).join('');
}

function buildCoverage(activeTree=[]) {
  const svg = document.getElementById('coverSvg');
  const BW = 46, GAP = 4, H = 72;
  const TOTAL_W = N * BW + (N-1) * GAP; // 430
  svg.innerHTML = '';

  // Draw arcs for each tree[i]
  for (let i = 1; i <= N; i++) {
    const lb = lowbit(i);
    const start = i - lb + 1;
    const end = i;
    // center x positions
    const x1 = (start - 1) * (BW + GAP) + BW / 2;
    const x2 = (end - 1) * (BW + GAP) + BW / 2;
    const arcH = lb === 1 ? 12 : lb === 2 ? 24 : lb === 4 ? 40 : 60;
    const isActive = activeTree.includes(i);
    const col = isActive ? '#38bdf8' : '#334155';
    const strokeW = isActive ? 2 : 1;

    if (lb === 1) {
      // Just a tick
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', x1); line.setAttribute('y1', H);
      line.setAttribute('x2', x1); line.setAttribute('y2', H - arcH);
      line.setAttribute('stroke', col); line.setAttribute('stroke-width', strokeW);
      svg.appendChild(line);
    } else {
      // U-shaped bracket
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      const d = `M ${x1},${H} L ${x1},${H-arcH} L ${x2},${H-arcH} L ${x2},${H}`;
      path.setAttribute('d', d);
      path.setAttribute('stroke', col); path.setAttribute('stroke-width', strokeW);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke-linecap', 'round'); path.setAttribute('stroke-linejoin', 'round');
      svg.appendChild(path);
    }
    // Label
    const tx = document.createElementNS('http://www.w3.org/2000/svg','text');
    tx.textContent = `t${i}`;
    tx.setAttribute('x', (x1+x2)/2);
    tx.setAttribute('y', H - arcH - 3);
    tx.setAttribute('text-anchor', 'middle');
    tx.setAttribute('font-size', '8');
    tx.setAttribute('fill', col);
    tx.setAttribute('font-family', 'monospace');
    svg.appendChild(tx);
  }
}

function buildStepList() {
  const list = document.getElementById('stepList');
  const steps = SCENES[curScene].steps;
  list.innerHTML = steps.map((s, i) =>
    `<div class="step-item${i===curStep?' active':''}" onclick="goStep(${i})">
      <div class="step-num">步骤 ${i+1}</div>
      <div class="step-text">${s.desc}</div>
    </div>`
  ).join('');
}

// ─── Render ───────────────────────────────────────────────────────
function render() {
  const scene = SCENES[curScene];
  const step = scene.steps[curStep];

  // Reset boxes
  for (let i = 1; i <= N; i++) {
    const a = document.getElementById(`arr-${i}`);
    const t = document.getElementById(`tree-${i}`);
    if (a) { a.className = 'bit-box'; a.firstChild.nodeValue = ARR[i]; }
    if (t) {
      t.className = 'bit-box';
      const tv = step.treeVals ? step.treeVals[i] : TREE_INIT[i];
      t.firstChild.nodeValue = tv;
    }
  }

  // Dim non-active
  step.treeDim.forEach(i => {
    const t = document.getElementById(`tree-${i}`);
    if (t) t.classList.add('hl-dim');
  });

  // Highlight arr
  step.arrHL.forEach(i => {
    const a = document.getElementById(`arr-${i}`);
    if (a) a.classList.add(scene.id === 'query' ? 'hl-blue' : 'hl-yellow');
  });

  // Highlight tree
  step.treeHL.forEach(i => {
    const t = document.getElementById(`tree-${i}`);
    if (t) t.classList.add(scene.id === 'query' ? 'hl-blue' : 'hl-yellow');
    // Also update value for update scene
    if (step.treeVals && t) t.firstChild.nodeValue = step.treeVals[i];
  });

  // If done, mark as green
  if (step.code.includes(11) || step.code.includes(18) || step.code.includes(19)) {
    step.treeHL.forEach(i => {
      const t = document.getElementById(`tree-${i}`);
      if (t) { t.className = 'bit-box hl-green'; }
    });
    step.arrHL.forEach(i => {
      const a = document.getElementById(`arr-${i}`);
      if (a) { a.className = 'bit-box hl-green'; }
    });
  }

  // Coverage SVG
  buildCoverage(step.treeHL);

  // Compute box
  document.getElementById('computeBox').textContent = step.compute;

  // Code highlighting
  document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
  step.code.forEach(ln => {
    const el = document.querySelector(`.code-line[data-ln="${ln}"]`);
    if (el) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
  });

  // Step desc
  document.getElementById('stepDesc').textContent = step.desc;
  document.getElementById('stepCtr').textContent = `${curStep+1} / ${scene.steps.length}`;

  // Step list highlight
  buildStepList();

  // Buttons
  document.getElementById('btnPrev').disabled = curStep === 0;
  document.getElementById('btnNext').disabled = curStep === scene.steps.length - 1;
}

// ─── Controls ─────────────────────────────────────────────────────
function switchScene(idx) {
  curScene = idx; curStep = 0; pause();
  document.querySelectorAll('.scene-tab').forEach((t,i) =>
    t.classList.toggle('active', i === idx)
  );
  buildStepList(); render();
}

function goStep(i) { pause(); curStep = i; render(); }
function reset() { pause(); curStep = 0; render(); }
function prev() { pause(); if (curStep > 0) { curStep--; render(); } }
function next() { pause(); if (curStep < SCENES[curScene].steps.length - 1) { curStep++; render(); } }

function togglePlay() {
  if (playing) pause();
  else { if (curStep >= SCENES[curScene].steps.length - 1) curStep = 0; play(); }
}

function play() {
  playing = true;
  document.getElementById('btnPlay').textContent = '⏸ 暂停';
  tick();
}
function pause() {
  playing = false; clearTimeout(timer);
  document.getElementById('btnPlay').textContent = '▶ 播放';
}
function tick() {
  if (!playing) return;
  const s = SPEEDS();
  if (curStep < SCENES[curScene].steps.length - 1) {
    curStep++; render();
    timer = setTimeout(tick, s);
  } else { pause(); }
}
function SPEEDS() { return SPEED[parseInt(document.getElementById('speedRange').value) - 1]; }

// ─── Init ─────────────────────────────────────────────────────────
buildBoxes();
buildCode();
buildCoverage([]);
buildStepList();
render();
</script>
</body>
</html>
