<script>
const CODE_LINES = [
  {html:`<span class="kw">package</span> <span class="pkg">main</span>`},
  {html:``},
  {html:`<span class="kw">const</span> <span class="id">CAPACITY</span> = <span class="num">8</span>`},
  {html:``},
  {html:`<span class="kw">type</span> <span class="id">Entry</span> <span class="kw">struct</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">Key</span>, <span class="id">Value</span> <span class="kw">string</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">Next</span>        *<span class="id">Entry</span>`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">type</span> <span class="id">HashMap</span> <span class="kw">struct</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">buckets</span> [<span class="id">CAPACITY</span>]*<span class="id">Entry</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">size</span>    <span class="kw">int</span>`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">func</span> (<span class="id">m</span> *<span class="id">HashMap</span>) <span class="fn">hash</span>(key <span class="kw">string</span>) <span class="kw">int</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;h := <span class="num">0</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> _, c := <span class="kw">range</span> key {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;h = (h*<span class="num">31</span> + <span class="kw">int</span>(c)) % <span class="id">CAPACITY</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> h`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">func</span> (<span class="id">m</span> *<span class="id">HashMap</span>) <span class="fn">Put</span>(key, value <span class="kw">string</span>) {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;idx := <span class="id">m</span>.<span class="fn">hash</span>(key)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;cur := <span class="id">m</span>.<span class="id">buckets</span>[idx]`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> cur != <span class="kw">nil</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> cur.<span class="id">Key</span> == key {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;cur.<span class="id">Value</span> = value  <span class="cm">// 更新已有 key</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;cur = cur.<span class="id">Next</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="cm">// 链头插入新节点</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;entry := &amp;<span class="id">Entry</span>{key, value, <span class="id">m</span>.<span class="id">buckets</span>[idx]}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">m</span>.<span class="id">buckets</span>[idx] = entry`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">m</span>.<span class="id">size</span><span class="op">++</span>`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">func</span> (<span class="id">m</span> *<span class="id">HashMap</span>) <span class="fn">Get</span>(key <span class="kw">string</span>) (<span class="kw">string</span>, <span class="kw">bool</span>) {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;idx := <span class="id">m</span>.<span class="fn">hash</span>(key)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;cur := <span class="id">m</span>.<span class="id">buckets</span>[idx]`},

  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> cur.<span class="id">Key</span> == key {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> cur.<span class="id">Value</span>, <span class="kw">true</span>`},

window.LANG_PLAIN = {
  js: `class HashMap {
    constructor(size = 16) {
        this.buckets = new Array(size).fill(null).map(() => []);
        this.size = size;
        this.count = 0;
    }

    _hash(key) {
        let hash = 0;
        for (const ch of String(key)) {
            hash = (hash * 31 + ch.charCodeAt(0)) % this.size;
        }
        return hash;
    }

    set(key, val) {
        const idx = this._hash(key);
        const bucket = this.buckets[idx];
        for (const pair of bucket) {
            if (pair[0] === key) { pair[1] = val; return; }
        }
        bucket.push([key, val]);
        this.count++;
    }

    get(key) {
        const idx = this._hash(key);
        for (const [k, v] of this.buckets[idx]) {
            if (k === key) return v;
        }
        return undefined;
    }

    delete(key) {
        const idx = this._hash(key);
        const bucket = this.buckets[idx];
        const i = bucket.findIndex(p => p[0] === key);
        if (i !== -1) { bucket.splice(i, 1); this.count--; }
    }
}`,
  py: `class HashMap:
    def __init__(self, size=16):
        self.buckets = [[] for _ in range(size)]
        self.size = size
        self.count = 0

    def _hash(self, key):
        h = 0
        for ch in str(key):
            h = (h * 31 + ord(ch)) % self.size
        return h

    def set(self, key, val):
        idx = self._hash(key)
        for pair in self.buckets[idx]:
            if pair[0] == key:
                pair[1] = val
                return
        self.buckets[idx].append([key, val])
        self.count += 1

    def get(self, key):
        idx = self._hash(key)
        for k, v in self.buckets[idx]:
            if k == key:
                return v
        return None

    def delete(self, key):
        idx = self._hash(key)
        self.buckets[idx] = [(k, v) for k, v in self.buckets[idx] if k != key]
        self.count -= 1`
};

const CAPACITY = 8;
// buckets: array of [{key,val}]  (simulating chaining)
let buckets = Array.from({length: CAPACITY}, () => []);
let totalSize = 0;
let steps = [], cur = 0, playing = false, timer = null;
const SPEED = [2000,1200,700,350,120];
const SPEED_LABELS = ['极慢','慢','中速','快','极快'];

function hashFn(key) {
  let h = 0;
  for (const c of key) h = (h * 31 + c.charCodeAt(0)) % CAPACITY;
  return h;
}

function cloneBuckets(b) { return b.map(chain => chain.map(e => ({...e}))); }

function mkStep(b, activeIdx, highlightChain, foundIdx, description, lines, hashCalc) {
  return { buckets: cloneBuckets(b), activeIdx: activeIdx ?? -1, highlightChain: highlightChain ?? -1, foundIdx: foundIdx ?? -1, description, highlightLines: lines, hashCalc: hashCalc || '' };
}

function generatePutSteps(key, value) {
  const steps = [];
  const b = cloneBuckets(buckets);
  steps.push(mkStep(b, -1, -1, -1, `Put("${key}", "${value}")：开始计算哈希`, [22], ''));
  const idx = hashFn(key);
  steps.push(mkStep(b, idx, -1, -1, `hash("${key}") = ${idx}，定位到桶 ${idx}`, [14, 15, 16, 17, 18, 19], `hash("${key}") = ${idx}`));

  // Check for existing key
  let existingPos = b[idx].findIndex(e => e.key === key);
  if (existingPos >= 0) {
    steps.push(mkStep(b, idx, idx, existingPos, `在桶 ${idx} 找到已有 key="${key}"，更新值`, [25, 26, 27], `hash("${key}") = ${idx}`));
    b[idx][existingPos].val = value;
    steps.push(mkStep(b, idx, idx, existingPos, `更新成功: "${key}" → "${value}"`, [25, 26, 27], `hash("${key}") = ${idx}`));
  } else {
    if (b[idx].length > 0) {
      steps.push(mkStep(b, idx, idx, -1, `桶 ${idx} 已有 ${b[idx].length} 个元素（哈希冲突），头插新节点`, [24, 25, 30, 31, 32, 33], `hash("${key}") = ${idx}`));
    } else {
      steps.push(mkStep(b, idx, idx, -1, `桶 ${idx} 为空，直接插入`, [24, 31, 32, 33], `hash("${key}") = ${idx}`));
    }
    b[idx].unshift({ key, val: value });
    totalSize++;
    steps.push(mkStep(b, idx, idx, 0, `插入成功: "${key}" → "${value}"，桶 ${idx} 现有 ${b[idx].length} 个`, [32, 33, 34], `hash("${key}") = ${idx}`));
  }
  return { steps, finalBuckets: b };
}

function generateGetSteps(key) {
  const steps = [];
  const b = cloneBuckets(buckets);
  steps.push(mkStep(b, -1, -1, -1, `Get("${key}")：开始计算哈希`, [37], ''));
  const idx = hashFn(key);
  steps.push(mkStep(b, idx, -1, -1, `hash("${key}") = ${idx}，定位到桶 ${idx}`, [14, 15, 16, 17, 18, 19], `hash("${key}") = ${idx}`));
  const chain = b[idx];
  if (chain.length === 0) {
    steps.push(mkStep(b, idx, idx, -1, `桶 ${idx} 为空，key 不存在，返回 false`, [40, 47], `hash("${key}") = ${idx}`));
  } else {
    steps.push(mkStep(b, idx, idx, -1, `在桶 ${idx} 中遍历链表查找 "${key}"`, [38, 39, 40], `hash("${key}") = ${idx}`));
    let found = false;
    for (let i = 0; i < chain.length; i++) {
      steps.push(mkStep(b, idx, idx, i, `检查节点 "${chain[i].key}": ${chain[i].key === key ? '匹配!' : '不匹配，继续'}`, [41, 42], `hash("${key}") = ${idx}`));
      if (chain[i].key === key) {
        steps.push(mkStep(b, idx, idx, i, `找到！"${key}" → "${chain[i].val}"，返回 true`, [43], `hash("${key}") = ${idx}`));
        found = true; break;
      }
    }
    if (!found) steps.push(mkStep(b, idx, idx, -1, `遍历完毕，未找到 "${key}"，返回 false`, [45, 47], `hash("${key}") = ${idx}`));
  }
  return { steps, finalBuckets: b };
}

function generateDeleteSteps(key) {
  const steps = [];
  const b = cloneBuckets(buckets);
  steps.push(mkStep(b, -1, -1, -1, `Delete("${key}")：计算哈希`, [], ''));
  const idx = hashFn(key);
  steps.push(mkStep(b, idx, -1, -1, `hash("${key}") = ${idx}，定位桶 ${idx}`, [14, 15, 16, 17, 18, 19], `hash("${key}") = ${idx}`));
  const pos = b[idx].findIndex(e => e.key === key);
  if (pos < 0) {
    steps.push(mkStep(b, idx, idx, -1, `未找到 "${key}"，无需删除`, [], `hash("${key}") = ${idx}`));
  } else {
    steps.push(mkStep(b, idx, idx, pos, `找到 "${key}" 在桶 ${idx} 位置 ${pos}，删除`, [], `hash("${key}") = ${idx}`));
    b[idx].splice(pos, 1);
    totalSize--;
    steps.push(mkStep(b, idx, idx, -1, `删除成功，桶 ${idx} 现有 ${b[idx].length} 个元素`, [], `hash("${key}") = ${idx}`));
  }
  return { steps, finalBuckets: b };
}

function doPut() {
  pause();
  const key = document.getElementById('keyInput').value.trim() || 'key';
  const val = document.getElementById('valInput').value.trim() || 'val';
  const res = generatePutSteps(key, val);
  steps = res.steps; buckets = res.finalBuckets; cur = 0; render();
}
function doGet() {
  pause();
  const key = document.getElementById('keyInput').value.trim() || 'key';
  const res = generateGetSteps(key);
  steps = res.steps; cur = 0; render();
}
function doDelete() {
  pause();
  const key = document.getElementById('keyInput').value.trim() || 'key';
  const res = generateDeleteSteps(key);
  steps = res.steps; buckets = res.finalBuckets; cur = 0; render();
}
function doReset() {
  pause(); buckets = Array.from({length: CAPACITY}, () => []); totalSize = 0; steps = []; cur = 0; render();
}

const hashGrid = document.getElementById('hashGrid');
const descText = document.getElementById('descText');
const stepCounter = document.getElementById('stepCounter');
const sizeCount = document.getElementById('sizeCount');
const loadFactor = document.getElementById('loadFactor');
const hashInfo = document.getElementById('hashInfo');
const codeBody = document.getElementById('codeBody');
const speedRange = document.getElementById('speedRange');
const speedVal = document.getElementById('speedVal');
function updateSpeedLabel(){speedVal.textContent=SPEED_LABELS[parseInt(speedRange.value)-1];}
speedRange.addEventListener('input',updateSpeedLabel);
updateSpeedLabel();
const btnPlay = document.getElementById('btnPlay');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnReset = document.getElementById('btnReset');

function renderGrid(s) {
  const b = s ? s.buckets : buckets;
  const activeIdx = s ? s.activeIdx : -1;
  const highlightChain = s ? s.highlightChain : -1;
  const foundIdx = s ? s.foundIdx : -1;
  hashGrid.innerHTML = '';
  b.forEach((chain, i) => {
    const row = document.createElement('div');
    row.className = 'hash-slot';
    const idxEl = document.createElement('div');
    idxEl.className = 'slot-idx';
    idxEl.textContent = i;
    row.appendChild(idxEl);
    const isActive = i === activeIdx;
    const isHighlight = i === highlightChain;
    let boxColor = 'var(--border)';
    if (isActive && !isHighlight) boxColor = 'var(--yellow)';
    if (isHighlight) boxColor = chain.length > 0 && activeIdx === i ? 'var(--blue)' : 'var(--border)';
    const slotBox = document.createElement('div');
    slotBox.className = 'slot-box';
    slotBox.style.borderColor = isActive ? '#fbbf24' : 'var(--border)';
    if (isActive) slotBox.style.boxShadow = '0 0 8px #fbbf2488';
    if (chain.length === 0) {
      slotBox.innerHTML = `<span class="slot-empty">nil</span>`;
    } else {
      slotBox.innerHTML = `<span style="color:#94a3b8;font-size:0.75rem">[${chain.length}]</span>`;
    }
    row.appendChild(slotBox);
    chain.forEach((entry, j) => {
      const arrow = document.createElement('span');
      arrow.className = 'chain-arrow';
      arrow.textContent = '→';
      row.appendChild(arrow);
      const node = document.createElement('div');
      node.className = 'chain-node';
      const isFound = isHighlight && j === foundIdx;
      const isConflict = isHighlight && j > 0 && foundIdx === -1 && isActive;
      node.style.borderColor = isFound ? '#4ade80' : (isConflict ? '#f87171' : (isHighlight ? '#38bdf8' : 'var(--border)'));
      if (isFound) node.style.boxShadow = '0 0 8px #4ade8088';
      else if (isHighlight) node.style.boxShadow = '0 0 6px #38bdf844';
      node.innerHTML = `<span class="kv-key">"${entry.key}"</span><span class="kv-sep">:</span><span class="kv-val">"${entry.val}"</span>`;
      row.appendChild(node);
    });
    hashGrid.appendChild(row);
  });
}

function render() {
  if (steps.length === 0) {
    renderGrid(null);
    descText.textContent = '选择操作开始演示（链地址法处理冲突，容量=8）';
    sizeCount.textContent = totalSize;
    loadFactor.textContent = (totalSize / CAPACITY).toFixed(2);
    stepCounter.textContent = '0 / 0';
    hashInfo.style.display = 'none';
    return;
  }
  const s = steps[cur];
  renderGrid(s);
  renderCode();
  descText.textContent = s.description;
  stepCounter.textContent = `${cur + 1} / ${steps.length}`;
  const sz = s.buckets.reduce((acc, c) => acc + c.length, 0);
  sizeCount.textContent = sz;
  loadFactor.textContent = (sz / CAPACITY).toFixed(2);
  if (s.hashCalc) { hashInfo.style.display = 'block'; hashInfo.textContent = s.hashCalc; }
  else hashInfo.style.display = 'none';
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;
}

function buildCode() {
  codeBody.innerHTML = CODE_LINES.map((l, i) => `<div class="code-line" data-line="${i}"><span class="ln">${i + 1}</span><span class="lc">${l.html || '&nbsp;'}</span></div>`).join('');
  codeBody.querySelectorAll('.code-line').forEach(el => el.addEventListener('click', () => jumpToLine(parseInt(el.dataset.line))));
}
function highlightLines(lines) {
  codeBody.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
  (lines || []).forEach(ln => { const el = codeBody.querySelector(`[data-line="${ln}"]`); if (el) el.classList.add('active'); });
  if (lines && lines.length > 0) { const f = codeBody.querySelector(`[data-line="${lines[0]}"]`); if (f) f.scrollIntoView({ block: 'nearest' }); }
}
function jumpToLine(ln) {
  if (steps.length === 0) return;
  let t = cur, b = Infinity;
  steps.forEach((s, i) => { if (s.highlightLines.includes(ln)) { const d = Math.abs(i - cur); if (d < b) { b = d; t = i; } } });
  cur = t; render();
}

function renderCode() {
  const lines = (LangSwitcher.current !== 'go' && LangSwitcher.getLines(LangSwitcher.current))
    || CODE_LINES;
  const step = steps[cur];
  const hl = LangSwitcher.getHL(step) || (step && (step.highlightLines || step.lines)) || [];
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i) ? ' active' : '';
    return `<div class="code-line${active}" onclick="jumpToLine(${i})">${line.html || '&nbsp;'}</div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}

function play() { if (cur >= steps.length - 1) cur = 0; playing = true; btnPlay.innerHTML = '⏸ 暂停'; tick(); }
function pause() { playing = false; clearTimeout(timer); btnPlay.innerHTML = '▶ 播放'; }
function tick() { if (!playing) return; if (cur < steps.length - 1) { cur++; render(); timer = setTimeout(tick, SPEED[parseInt(speedRange.value) - 1]); } else pause(); }

btnPlay.addEventListener('click', () => playing ? pause() : play());
btnPrev.addEventListener('click', () => { pause(); if (cur > 0) { cur--; render(); } });
btnNext.addEventListener('click', () => { pause(); if (cur < steps.length - 1) { cur++; render(); } });
btnReset.addEventListener('click', () => { pause(); cur = 0; render(); });

buildCode();
LangSwitcher.init(renderCode);
// Initialize with some data
const initPairs = [['name','Alice'],['age','25'],['city','Beijing'],['lang','Go'],['score','95']];
for (const [k,v] of initPairs) {
  const res = generatePutSteps(k, v);
  buckets = res.finalBuckets;
}
totalSize = initPairs.length;
render();
</script>
</body>
</html>
