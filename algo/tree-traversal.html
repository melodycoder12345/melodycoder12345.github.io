const CODE_LINES_MAP = {

    {html:`<span class="kw">func</span> <span class="fn">preorder</span>(root *<span class="id">TreeNode</span>, result *[]<span class="kw">int</span>) {`},
    {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> root == <span class="kw">nil</span> { <span class="kw">return</span> }`},
    {html:`&nbsp;&nbsp;&nbsp;&nbsp;*result = <span class="fn">append</span>(*result, root.Val) <span class="cm">// 先访问根</span>`},
    {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">preorder</span>(root.Left, result)  <span class="cm">// 递归左子树</span>`},
    {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">preorder</span>(root.Right, result) <span class="cm">// 递归右子树</span>`},
    {html:`}`},
  ],
  postorder: [
    {html:`<span class="cm">// 后序遍历：左 → 右 → 根</span>`},
    {html:`<span class="cm">// 常用于删除树、计算目录大小</span>`},
    {html:`<span class="kw">func</span> <span class="fn">postorder</span>(root *<span class="id">TreeNode</span>, result *[]<span class="kw">int</span>) {`},
    {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> root == <span class="kw">nil</span> { <span class="kw">return</span> }`},
    {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">postorder</span>(root.Left, result)  <span class="cm">// 先递归左子树</span>`},

window.LANG_PLAIN = {
  js: `class TreeNode {
    constructor(val) { this.val = val; this.left = this.right = null; }
}

function preorder(root) {

// Build tree: 1->(2,3), 2->(4,5)
const root = new TreeNode(1);

  py: `from collections import deque

class TreeNode:
    def __init__(self, val):
        self.val = val
        self.left = self.right = None

def preorder(root):
    if not root:
        return []
    return [root.val] + preorder(root.left) + preorder(root.right)

def inorder(root):
    if not root:
        return []
    return inorder(root.left) + [root.val] + inorder(root.right)

def postorder(root):
    if not root:
        return []
    return postorder(root.left) + postorder(root.right) + [root.val]

def level_order(root):
    if not root:
        return []
    result, queue = [], deque([root])
    while queue:
        node = queue.popleft()
        result.append(node.val)
        if node.left: queue.append(node.left)
        if node.right: queue.append(node.right)
    return result

root = TreeNode(1)
root.left = TreeNode(2); root.right = TreeNode(3)
root.left.left = TreeNode(4); root.left.right = TreeNode(5)

print("Pre:",   preorder(root))   # [1,2,4,5,3]
print("In:",    inorder(root))    # [4,2,5,1,3]
print("Post:",  postorder(root))  # [4,5,2,3,1]
print("Level:", level_order(root)) # [1,2,3,4,5]`
};

// Line index for "visit root" in each traversal
const VISIT_LINE = {inorder:5, preorder:4, postorder:6};
const RECURSE_LEFT = {inorder:4, preorder:5, postorder:4};
const RECURSE_RIGHT = {inorder:6, preorder:6, postorder:5};

function buildTree(){
  function n(v,l,r){return{val:v,left:l,right:r};}
  return n(1, n(2,n(4,null,null),n(5,null,null)), n(3,n(6,null,null),n(7,null,null)));
}
const TREE = buildTree();

function getOrder(mode) {
  const result = [];
  function inorder(node){if(!node)return;inorder(node.left);result.push(node.val);inorder(node.right);}
  function preorder(node){if(!node)return;result.push(node.val);preorder(node.left);preorder(node.right);}
  function postorder(node){if(!node)return;postorder(node.left);postorder(node.right);result.push(node.val);}
  if(mode==='inorder')inorder(TREE);
  else if(mode==='preorder')preorder(TREE);
  else postorder(TREE);
  return result;
}

function generateTraversalSteps(mode) {
  const steps = [];
  const visited = [];
  const vl = VISIT_LINE[mode], rl = RECURSE_LEFT[mode], rr = RECURSE_RIGHT[mode];
  function snap(current, visited, lines, desc) {
    steps.push({current, visited:[...visited], highlightLines:lines, description:desc});
  }
  function traverse(node) {
    if (!node) { snap(null, visited, [3], `到达空节点，返回`); return; }
    snap(node.val, visited, [2,3], `进入节点 ${node.val}`);
    if (mode === 'inorder') {
      snap(node.val, visited, [rl], `先遍历 ${node.val} 的左子树`); traverse(node.left);
      snap(node.val, visited, [vl], `访问节点 ${node.val}`); visited.push(node.val);
      snap(node.val, visited, [rr], `再遍历 ${node.val} 的右子树`); traverse(node.right);
    } else if (mode === 'preorder') {
      snap(node.val, visited, [vl], `访问节点 ${node.val}`); visited.push(node.val);
      snap(node.val, visited, [rl], `遍历 ${node.val} 的左子树`); traverse(node.left);
      snap(node.val, visited, [rr], `遍历 ${node.val} 的右子树`); traverse(node.right);
    } else {
      snap(node.val, visited, [rl], `先遍历 ${node.val} 的左子树`); traverse(node.left);
      snap(node.val, visited, [rr], `再遍历 ${node.val} 的右子树`); traverse(node.right);
      snap(node.val, visited, [vl], `访问节点 ${node.val}`); visited.push(node.val);
    }
  }
  traverse(TREE);
  snap(null, visited, [2], `遍历完成，结果: [${visited.join(', ')}]`);
  return steps;
}

let steps = [];
let cur = 0, playing = false, timer = null;
const SPEED = [800,500,300,180,80];
let currentMode = 'inorder';

const svg=document.getElementById('treeSvg'),codeBody=document.getElementById('codeBody'),
  descText=document.getElementById('descText'),stepCounter=document.getElementById('stepCounter'),
  resultItems=document.getElementById('resultItems'),btnPlay=document.getElementById('btnPlay'),
  btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),
  btnReset=document.getElementById('btnReset'),speedRange=document.getElementById('speedRange'),
  goBtn=document.getElementById('goBtn');

const opBtns={inorder:document.getElementById('opInorder'),preorder:document.getElementById('opPreorder'),postorder:document.getElementById('opPostorder')};
Object.entries(opBtns).forEach(([m,btn])=>btn.addEventListener('click',()=>{currentMode=m;Object.values(opBtns).forEach(b=>b.classList.remove('active-op'));btn.classList.add('active-op');buildCode();}));
goBtn.addEventListener('click',()=>{pause();steps=generateTraversalSteps(currentMode);cur=0;render();});

function renderCode(){
  const lines = (LangSwitcher.current !== 'go' && LangSwitcher.getLines(LangSwitcher.current))
    || CODE_LINES_MAP[currentMode];
  const hl = LangSwitcher.getHL(steps[cur] || {});
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i) ? ' active' : '';
    return `<div class="code-line${active}" onclick="jumpToLine(${i})">${line.html || '&nbsp;'}</div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}
function buildCode(){ renderCode(); }
function highlightLines(lines){ renderCode(); }
function jumpToLine(ln){if(LangSwitcher.current!=='go')return;let t=cur,b=Infinity;steps.forEach((s,i)=>{if(s.highlightLines&&s.highlightLines.includes(ln)){const d=Math.abs(i-cur);if(d<b){b=d;t=i;}}});cur=t;render();}

// Tree layout: fixed for this tree
const POSITIONS = {1:{x:3,y:0},2:{x:1,y:1},3:{x:5,y:1},4:{x:0,y:2},5:{x:2,y:2},6:{x:4,y:2},7:{x:6,y:2}};
const NR=24,PAD=60,DY=70;
function drawTree(current, visited) {
  svg.innerHTML='';
  const rect=svg.getBoundingClientRect();
  const totalW=rect.width||600;
  const cellW=(totalW-PAD*2)/6;
  const xScale=i=>PAD+i*cellW;const yScale=d=>PAD+d*DY+NR;
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML=`<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  svg.appendChild(defs);
  const edges=[[1,2],[1,3],[2,4],[2,5],[3,6],[3,7]];
  edges.forEach(([p,c])=>{
    const pp=POSITIONS[p],cp=POSITIONS[c];
    const px=xScale(pp.x),py=yScale(pp.y),cx=xScale(cp.x),cy=yScale(cp.y);
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',px);l.setAttribute('y1',py+NR);l.setAttribute('x2',cx);l.setAttribute('y2',cy-NR);
    l.setAttribute('stroke','#334155');l.setAttribute('stroke-width','1.5');svg.appendChild(l);
  });
  [1,2,3,4,5,6,7].forEach(v=>{
    const p=POSITIONS[v];const x=xScale(p.x),y=yScale(p.y);
    const isDone=visited.includes(v);const isCur=current===v;
    let fill='#1e293b',stroke='#334155',textCol='#e2e8f0';
    if(isDone){fill='rgba(74,222,128,0.2)';stroke='#4ade80';}
    if(isCur){fill='rgba(251,191,36,0.25)';stroke='#fbbf24';textCol='#fbbf24';}
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',NR);
    c.setAttribute('fill',fill);c.setAttribute('stroke',stroke);c.setAttribute('stroke-width','2');
    if(isCur)c.setAttribute('filter','url(#glow)');
    svg.appendChild(c);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',x);t.setAttribute('y',y+5);
    t.setAttribute('fill',textCol);t.setAttribute('font-size','15');t.setAttribute('font-weight','700');
    t.setAttribute('text-anchor','middle');t.setAttribute('font-family','monospace');
    t.textContent=v;svg.appendChild(t);
  });
}
function renderResultItems(visited){
  const order = getOrder(currentMode);
  resultItems.innerHTML = order.map(v => {
    const idx = visited.indexOf(v);
    const cls = idx >= 0 ? (idx === visited.length-1 ? 'current' : 'done') : 'pending';
    return `<span class="result-item ${cls}">${v}</span>`;
  }).join('');
}
function render(){
  if(steps.length===0){drawTree(null,[]);renderResultItems([]);renderCode();descText.textContent='选择遍历方式并点击开始';stepCounter.textContent='';return;}
  const s=steps[cur];
  drawTree(s.current,s.visited);
  renderResultItems(s.visited);
  renderCode();
  descText.textContent=s.description;
  stepCounter.textContent=`${cur+1} / ${steps.length}`;
  btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;
}
function play(){if(cur>=steps.length-1)cur=0;playing=true;btnPlay.innerHTML='⏸ 暂停';tick();}
function pause(){playing=false;clearTimeout(timer);btnPlay.innerHTML='▶ 播放';}
function tick(){if(!playing)return;if(cur<steps.length-1){cur++;render();timer=setTimeout(tick,SPEED[parseInt(speedRange.value)-1]);}else pause();}
btnPlay.addEventListener('click',()=>playing?pause():play());
btnPrev.addEventListener('click',()=>{pause();if(cur>0){cur--;render();}});
btnNext.addEventListener('click',()=>{pause();if(cur<steps.length-1){cur++;render();}});
btnReset.addEventListener('click',()=>{pause();cur=0;render();});
LangSwitcher.init(renderCode);
buildCode();drawTree(null,[]);renderResultItems([]);descText.textContent='二叉树：1为根，2,3为子节点，4,5,6,7为叶节点';
window.addEventListener('resize',()=>render());
</script>
</body>
</html>
