<script>
const CODE_LINES = [
  {html:`<span class="kw">package</span> <span class="pkg">main</span>`},
  {html:``},
  {html:`<span class="kw">import</span> <span class="st">"fmt"</span>`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">mergeSort</span>(arr []<span class="kw">int</span>) []<span class="kw">int</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> <span class="fn">len</span>(arr) &lt;= <span class="num">1</span> { <span class="kw">return</span> arr }`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;mid := <span class="fn">len</span>(arr) / <span class="num">2</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;left := <span class="fn">mergeSort</span>(arr[:mid])`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;right := <span class="fn">mergeSort</span>(arr[mid:])`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> <span class="fn">merge</span>(left, right)`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">merge</span>(left, right []<span class="kw">int</span>) []<span class="kw">int</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;result := <span class="fn">make</span>([]<span class="kw">int</span>, <span class="num">0</span>)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;i, j := <span class="num">0</span>, <span class="num">0</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">for</span> i &lt; <span class="fn">len</span>(left) &amp;&amp; j &lt; <span class="fn">len</span>(right) {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> left[i] &lt;= right[j] {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;result = <span class="fn">append</span>(result, left[i]); i<span class="op">++</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;} <span class="kw">else</span> {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;result = <span class="fn">append</span>(result, right[j]); j<span class="op">++</span>`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;result = <span class="fn">append</span>(result, left[i:]...)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;result = <span class="fn">append</span>(result, right[j:]...)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">return</span> result`},
  {html:`}`},
  {html:``},
  {html:`<span class="kw">func</span> <span class="fn">main</span>() {`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;arr := []<span class="kw">int</span>{<span class="num">38</span>, <span class="num">27</span>, <span class="num">43</span>, <span class="num">3</span>, <span class="num">9</span>, <span class="num">82</span>, <span class="num">10</span>}`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;arr = <span class="fn">mergeSort</span>(arr)`},
  {html:`&nbsp;&nbsp;&nbsp;&nbsp;<span class="id">fmt</span>.<span class="fn">Println</span>(arr)`},
  {html:`}`},
];

window.LANG_PLAIN = {
  js: `function mergeSort(arr) {
    if (arr.length <= 1) return arr;
    const mid = Math.floor(arr.length / 2);
    const left = mergeSort(arr.slice(0, mid));
    const right = mergeSort(arr.slice(mid));
    return merge(left, right);
}

function merge(left, right) {
    const result = [];
    let i = 0, j = 0;
    while (i < left.length && j < right.length) {
        if (left[i] <= right[j]) {
            result.push(left[i++]);
        } else {
            result.push(right[j++]);
        }
    }
    return result.concat(left.slice(i)).concat(right.slice(j));
}

const arr = [38, 27, 43, 3, 9, 82, 10];
console.log(mergeSort(arr));`,
  py: `def merge_sort(arr):
    if len(arr) <= 1:
        return arr
    mid = len(arr) // 2
    left = merge_sort(arr[:mid])
    right = merge_sort(arr[mid:])
    return merge(left, right)

def merge(left, right):
    result = []
    i = j = 0
    while i < len(left) and j < len(right):
        if left[i] <= right[j]:
            result.append(left[i])
            i += 1
        else:
            result.append(right[j])
            j += 1
    return result + left[i:] + right[j:]

arr = [38, 27, 43, 3, 9, 82, 10]
print(merge_sort(arr))`
};

function generateSteps(arr) {
  const steps = [];
  let cmps = 0, merges = 0;

  function snap(a, highlighted, active, lines, desc) {
    steps.push({ arr:[...a], highlighted:[...highlighted], active:[...active], highlightLines:lines, description:desc, cmps, merges });
  }

  function doMerge(a, lo, mid, hi) {
    const left = a.slice(lo, mid+1);
    const right = a.slice(mid+1, hi+1);
    snap(a, range(lo,hi), [], [12,13,14], `合并 [${lo}..${mid}] 和 [${mid+1}..${hi}]`);
    let i = 0, j = 0, k = lo;
    while (i < left.length && j < right.length) {
      cmps++;
      snap(a, range(lo,hi), [lo+i, mid+1+j], [15,16], `比较 ${left[i]} 和 ${right[j]}`);
      if (left[i] <= right[j]) {
        a[k++] = left[i++];
        snap(a, range(lo,hi), [], [17], `放入 ${a[k-1]}`);
      } else {
        a[k++] = right[j++];
        snap(a, range(lo,hi), [], [19], `放入 ${a[k-1]}`);
      }
    }
    while (i < left.length) { a[k++] = left[i++]; }
    while (j < right.length) { a[k++] = right[j++]; }
    merges++;
    snap(a, [], range(lo,hi), [22,23], `区间 [${lo}..${hi}] 合并完成`);
  }

  function doMergeSort(a, lo, hi) {
    if (lo >= hi) {
      snap(a, [lo], [], [5], `arr[${lo}]=${a[lo]} 长度为1，无需排序`);
      return;
    }
    const mid = Math.floor((lo + hi) / 2);
    snap(a, range(lo,hi), [mid], [6], `分割 [${lo}..${hi}]，mid=${mid}`);
    snap(a, range(lo,mid), [], [7], `递归排序左半 [${lo}..${mid}]`);
    doMergeSort(a, lo, mid);
    snap(a, range(mid+1,hi), [], [8], `递归排序右半 [${mid+1}..${hi}]`);
    doMergeSort(a, mid+1, hi);
    doMerge(a, lo, mid, hi);
  }

  function range(lo, hi) { const r=[]; for(let i=lo;i<=hi;i++)r.push(i); return r; }

  const a = [...arr];
  snap(a, [], [], [28], '初始数组，准备归并排序');
  doMergeSort(a, 0, a.length-1);
  snap(a, [], Array.from({length:a.length},(_,i)=>i), [29,30,31], '排序完成！');
  return steps;
}

const INITIAL = [38, 27, 43, 3, 9, 82, 10];
const MAX_VAL = Math.max(...INITIAL);
let steps = generateSteps(INITIAL);
let cur = 0, playing = false, timer = null;
const SPEED = [2000,1200,700,350,120];

const mainBars=document.getElementById('mainBars'),codeBody=document.getElementById('codeBody'),
  descText=document.getElementById('descText'),stepCounter=document.getElementById('stepCounter'),
  cmpCount=document.getElementById('cmpCount'),swpCount=document.getElementById('swpCount'),
  btnPlay=document.getElementById('btnPlay'),btnPrev=document.getElementById('btnPrev'),
  btnNext=document.getElementById('btnNext'),btnReset=document.getElementById('btnReset'),
  speedRange=document.getElementById('speedRange'),speedVal=document.getElementById('speedVal');
const SPEED_LABELS=['慢','较慢','中','较快','快'];
function updateSpeedLabel(){speedVal.textContent=SPEED_LABELS[parseInt(speedRange.value)-1];}
speedRange.addEventListener('input',updateSpeedLabel);
updateSpeedLabel();

function buildCode(){
  codeBody.innerHTML=CODE_LINES.map((l,i)=>`<div class="code-line" data-line="${i}"><span class="ln">${i+1}</span><span class="lc">${l.html||'&nbsp;'}</span></div>`).join('');
  codeBody.querySelectorAll('.code-line').forEach(el=>el.addEventListener('click',()=>jumpToLine(parseInt(el.dataset.line))));
}
function highlightLines(lines){
  codeBody.querySelectorAll('.code-line').forEach(el=>el.classList.remove('active'));
  lines.forEach(ln=>{const el=codeBody.querySelector(`[data-line="${ln}"]`);if(el)el.classList.add('active');});
  if(lines.length>0){const f=codeBody.querySelector(`[data-line="${lines[0]}"]`);if(f)f.scrollIntoView({block:'nearest'});}
}
function jumpToLine(ln){let t=cur,b=Infinity;steps.forEach((s,i)=>{if(s.highlightLines.includes(ln)){const d=Math.abs(i-cur);if(d<b){b=d;t=i;}}});cur=t;render();}
function renderCode() {
  const lines = (LangSwitcher.current !== 'go' && LangSwitcher.getLines(LangSwitcher.current))
    || CODE_LINES;
  const hl = LangSwitcher.getHL(steps[cur]);
  const body = document.getElementById('codeBody');
  body.innerHTML = lines.map((line, i) => {
    const active = hl.includes(i) ? ' active' : '';
    return `<div class="code-line${active}" onclick="jumpToLine(${i})">${line.html || '&nbsp;'}</div>`;
  }).join('');
  const el = body.querySelector('.code-line.active');
  if (el) el.scrollIntoView({block:'nearest'});
}
function buildMainBars(n){
  mainBars.innerHTML='';
  for(let i=0;i<n;i++){
    const w=document.createElement('div');w.className='main-bar-wrap';
    const b=document.createElement('div');b.className='main-bar';
    const v=document.createElement('div');v.className='main-bar-val';b.appendChild(v);
    const l=document.createElement('div');l.className='main-bar-label';
    w.appendChild(b);w.appendChild(l);mainBars.appendChild(w);
  }
}
function render(){
  const s=steps[cur];
  if(mainBars.children.length!==s.arr.length)buildMainBars(s.arr.length);
  mainBars.querySelectorAll('.main-bar-wrap').forEach((wrap,i)=>{
    const bar=wrap.querySelector('.main-bar'),lbl=wrap.querySelector('.main-bar-label');
    bar.style.height=`${Math.max(s.arr[i]/MAX_VAL*100,6).toFixed(1)}%`;
    bar.querySelector('.main-bar-val').textContent=s.arr[i];
    lbl.textContent=i;
    let color='#334155';
    if(s.highlighted.includes(i))color='#38bdf8';
    if(s.active.includes(i))color='#4ade80';
    bar.style.background=color;
    bar.style.boxShadow=s.highlighted.includes(i)?`0 0 12px ${color}66`:'none';
    const valEl=bar.querySelector('.main-bar-val');
    const isActive=s.highlighted.includes(i);
    valEl.style.fontSize=isActive?'0.95rem':'0.82rem';
    valEl.style.fontWeight=isActive?'900':'700';
  });
  renderCode();
  descText.textContent=s.description;
  stepCounter.textContent=`${cur+1} / ${steps.length}`;
  cmpCount.textContent=s.cmps;
  swpCount.textContent=s.merges;
  btnPrev.disabled=cur===0;btnNext.disabled=cur===steps.length-1;
}
function play(){if(cur>=steps.length-1)cur=0;playing=true;btnPlay.innerHTML='⏸ 暂停';tick();}
function pause(){playing=false;clearTimeout(timer);btnPlay.innerHTML='▶ 播放';}
function tick(){if(!playing)return;if(cur<steps.length-1){cur++;render();timer=setTimeout(tick,SPEED[parseInt(speedRange.value)-1]);}else pause();}
btnPlay.addEventListener('click',()=>playing?pause():play());
btnPrev.addEventListener('click',()=>{pause();if(cur>0){cur--;render();}});
btnNext.addEventListener('click',()=>{pause();if(cur<steps.length-1){cur++;render();}});
btnReset.addEventListener('click',()=>{pause();cur=0;render();});
buildCode();buildMainBars(INITIAL.length);LangSwitcher.init(renderCode);render();
setTimeout(function(){
  var p=document.getElementById('__autoConcept');if(!p)return;
  var d=document.createElement('div');
  d.innerHTML='<div class="cp-divider" style="margin:6px 0 0"></div>'+
    '<div class="cp-section"><div class="cp-title">算法原理</div>'+
    '<div class="cp-desc">分治策略：递归将数组对半拆分，直到每个子数组长度为 1（天然有序），再逐层将两个有序子数组归并为一个有序数组。</div></div>'+
    '<div class="cp-divider"></div>'+
    '<div class="cp-section"><div class="cp-title">复杂度</div>'+
    '<table class="cp-table"><tr><td>最好时间</td><td>O(n log n)</td></tr><tr><td>平均时间</td><td>O(n log n)</td></tr><tr><td>最坏时间</td><td>O(n log n)</td></tr><tr><td>空间</td><td>O(n)</td></tr><tr><td>稳定性</td><td><span class="cp-tag stable">稳定</span></td></tr></table></div>'+
    '<div class="cp-divider"></div>'+
    '<div class="cp-section" style="padding-bottom:14px"><div class="cp-title">关键特性</div>'+
    '<ul class="cp-list"><li><strong>性能稳定</strong>：任何情况下都是 O(n log n)，不受数据分布影响</li><li><strong>外部排序首选</strong>：适合数据量超出内存、需分块处理的场景</li><li><strong>需 O(n) 额外空间</strong>：归并时需要临时数组存放中间结果</li><li>稳定排序，适合对链表排序（无需随机访问）</li></ul></div>';
  p.querySelectorAll('.sn-auto-concept-h,.sn-auto-card').forEach(function(el){el.remove();});
  p.appendChild(d);
